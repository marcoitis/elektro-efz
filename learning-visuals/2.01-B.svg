<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650"><desc>Didaktisches Modell, keine Installationsplanung.</desc><title>2.01-B – Didaktische Fachtafel</title><rect width="1100" height="650" fill="#f7fafc"/><g font-family="Arial,sans-serif" fill="#17334b"><text x="35" y="45" font-size="29" font-weight="bold">2.01-B · Komplexe Impedanz RLC-Reihe</text><text x="36" y="78" font-size="17">Modellwerte: R = 20 Ω, XL = 30 Ω, XC = 10 Ω bei der gewählten Frequenz</text></g><g font-family="Arial" fill="#17334b" font-size="21"><text x="58" y="137">Z = 20 + j20 Ω</text><text x="58" y="180">|Z| = √(20² + 20²) ≈ 28,3 Ω</text><text x="58" y="222">φ = arctan(20 / 20) = +45°</text><text x="58" y="264">I = 10 V / 28,3 Ω ≈ 0,354 A</text><text x="58" y="323">Gesamtblindanteil: XL − XC = +20 Ω</text><text x="58" y="376">Induktives Verhalten im Modell</text></g><g stroke="#819ba9" stroke-width="2"><path d="M675 511V120 M595 448H1047"/></g><path d="M675 448 L931 448 L931 192 Z" fill="#ceeaf0" stroke="#176987" stroke-width="3"/><path d="M675 448 L931 192" stroke="#d67b2d" stroke-width="6"/><g font-family="Arial" font-size="20" fill="#17334b"><text x="760" y="473">R = 20 Ω</text><text x="948" y="325">X = 20 Ω</text><text x="772" y="244">Z = 28,3 Ω</text><text x="720" y="427">45°</text><text x="965" y="465">Re</text><text x="652" y="113">Im</text></g><text x="35" y="626" font-size="15" fill="#526b7a" font-family="Arial">Didaktisches Rechen- und Funktionsmodell – keine Installationsfreigabe</text></svg>