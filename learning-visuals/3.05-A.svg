<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="3.05-A Selbsthaltung und Verriegelung mit Relais"><title>3.05-A – Selbsthaltung und Verriegelung mit Relais</title><desc>Individuelle didaktische Fachgrafik – keine Installationsplanung. Schema und Rechenwerte sind Modelle, kein freigegebener Installationsplan.</desc><rect x="0" y="0" width="1200" height="700" rx="0" fill="#F4F8FB" stroke="none" stroke-width="0" /><rect x="0" y="0" width="1200" height="92" rx="0" fill="#18364C" stroke="none" stroke-width="0" /><text x="35" y="56" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start">3.05-A · Selbsthaltung und Verriegelung mit Relais</text><text x="47" y="140" fill="#18364C" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start">Selbsthaltung als Funktionslogik (kein Sicherheitsstromlaufplan)</text><rect x="55" y="195" width="280" height="130" rx="12" fill="#FFFFFF" stroke="#C8D7E2" stroke-width="2" /><rect x="55" y="195" width="7" height="130" rx="0" fill="#D59433" stroke="#D59433" stroke-width="0" /><text x="74" y="230" fill="#18364C" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start">STOP_OK</text><text x="74" y="265" fill="#6B8190" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Freigabe erforderlich</text><rect x="420" y="195" width="310" height="130" rx="12" fill="#FFFFFF" stroke="#C8D7E2" stroke-width="2" /><rect x="420" y="195" width="7" height="130" rx="0" fill="#177FA5" stroke="#177FA5" stroke-width="0" /><text x="439" y="230" fill="#18364C" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start">START oder K_alt</text><text x="439" y="265" fill="#6B8190" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Rückführung speichert</text><rect x="829" y="195" width="307" height="130" rx="12" fill="#FFFFFF" stroke="#C8D7E2