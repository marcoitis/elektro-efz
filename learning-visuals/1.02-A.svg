<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520"><desc>Didaktisches Modell, keine Installationsplanung.</desc><title>1.02-A – Didaktische Fachtafel</title><rect width="920" height="520" fill="#f9fbfc"/><text x="38" y="48" font-family="Arial" font-size="26" fill="#13324a">1.02-A · SI-Präfixe und Umrechnung</text><text x="40" y="95" font-family="Arial" font-size="18" fill="#13324a">Gleiche Stromstärke – drei äquivalente Schreibweisen</text><g font-family="Arial" font-size="32" text-anchor="middle"><rect x="50" y="135" width="230" height="120" rx="12" fill="#d9e9f2"/><text x="165" y="208" fill="#123">25 mA</text><rect x="345" y="135" width="230" height="120" rx="12" fill="#d5eee4"/><text x="460" y="208" fill="#123">0,025 A</text><rect x="640" y="135" width="230" height="120" rx="12" fill="#fff0d6"/><text x="755" y="208" fill="#123">25 000 µA</text></g><g stroke="#245f79" stroke-width="4" fill="none"><path d="M280 195H340m-12 -9 12 9 -12 9"/><path d="M575 195H635m-12 -9 12 9 -12 9"/></g><g fill="#24485d" font-family="Arial" font-size="18"><text x="63" y="314">1 mA = 10⁻³ A</text><text x="350" y="314">1 A = 10³ mA</text><text x="650" y="314">1 A = 10⁶ µA</text><text x="55" y="380">Querschnitt: 1 mm² = 10⁻⁶ m² (Faktor zweimal anwenden)</text><text x="55" y="418">Energie: 1 kWh = 3,6 MJ = 3 600 000 J</text><text x="55" y="478" font-size="14">Didaktisches Grössenmodell; keine Installationszeichnung.</text></g></svg>