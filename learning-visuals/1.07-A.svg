<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 550" role="img" aria-label="1.07-A · Befestigung und Lastpfad"><title>1.07-A · Befestigung und Lastpfad</title><desc>2,4 Meter Kanal mit fünf modellhaften Befestigungspunkten im maximalen Raster 0,6 Meter. Ein auskragender Halter mit 20 Newton Last und Hebelarm 0,10 Meter erzeugt ein Moment von 2 Newtonmeter.</desc><style>text{font-family:Arial,DejaVu Sans,sans-serif;fill:#173247}.t{font-size:24px;font-weight:700}.s{font-size:13px;fill:#547084}.h{font-size:17px;font-weight:600}.n{font-size:15px}.f{font-size:20px;font-weight:700;fill:#a15f1e}.wire{fill:none;stroke:#117394;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.soft{fill:#fff;stroke:#c5d9e4;stroke-width:1.5}.warn{fill:#fff7ea;stroke:#ddb77a;stroke-width:1.5}</style><rect width="1100" height="550" rx="18" fill="#f4f8fa"/><text class="t" text-anchor="start" x="29" y="41">1.07-A · Befestigung und Lastpfad</text><text class="s" text-anchor="start" x="29" y="63">Didaktisches Modell · keine Installationsplanung und keine normative Freigabe</text><rect class="soft" x="25" y="87" width="660" height="414" rx="10"/><rect class="soft" x="711" y="87" width="365" height="414" rx="10"/><text class="h" text-anchor="middle" x="350" y="119">Übung: Kanal 2,4 m · fiktiver Herstellerabstand 0,6 m</text><rect x="85" y="177" width="520" height="72" rx="8" fill="#d7e5ee" stroke="#608496" stroke-width="2"/><circle cx="90" cy="212" r="8" fill="#ad7e49" stroke="#83613c" stroke-width="2"/><path d="M90 251 L90 292" fill="none" stroke="#7c9aab" stroke-width="1.6" /><text class="n" text-anchor="middle" x="90" y="316">1</text><circle cx="218" cy="212" r="8" fill="#ad7e49" stroke="#83613c" stroke-width="2"/><path d="M218 251 L218 292" fill="none" stroke="#7c9aab" stroke-width="1.6" /><text class="n" text-anchor="middle" x="218" y="316">2</text><circle cx="346" cy="212" r="8" fill="#ad7e49" stroke="#83613c" stroke-width="2"/><path d="M346 251 L346 292" fill="none" stroke="#7c9aab" stroke-width="1.6" /><text class="n" text-anchor="middle" x="346" y="316">3</text><circle cx="474" cy="212" r="8" fill="#ad7e49" stroke="#83613c" stroke-width="2"/><path d="M474 251 L474 292" fill="none" stroke="#7c9aab" stroke-width="1.6" /><text class="n" text-anchor="middle" x="474" y="316">4</text><circle cx="602" cy="212" r="8" fill="#ad7e49" stroke="#83613c" stroke-width="2"/><path d="M602 251 L602 292" fill="none" stroke="#7c9aab" stroke-width="1.6" /><text class="n" text-anchor="middle" x="602" y="316">5</text><text class="f" text-anchor="middle" x="350" y="356">Vier Intervalle à 0,6 m → 5 Befestigungspunkte</text><text class="s" text-anchor="middle" x="350" y="394">Nur Geometrie: Befestigungsabstand muss produktbezogen geprüft werden</text><text class="n" text-anchor="middle" x="350" y="431">Untergrund · Lastpfad · Randabstand · Verbinder · Kanten</text><text class="h" text-anchor="middle" x="890" y="129">Auskragender Modellhalter</text><path d="M776 160 L776 396" fill="none" stroke="#657f93" stroke-width="7" /><path d="M776 206 L962 206" fill="none" stroke="#657f93" stroke-width="6" /><path d="M942 206 L942 316" fill="none" stroke="#bb7431" stroke-width="3" /><text class="h" text-anchor="start" x="967" y="287">20 N</text><text class="s" text-anchor="middle" x="878" y="188">Hebelarm 0,10 m</text><text class="f" text-anchor="middle" x="892" y="359">M = F · l</text><text class="f" text-anchor="middle" x="892" y="395">= 2,0 N·m</text><text class="s" text-anchor="middle" x="890" y="443">Keine Dübelbemessung!</text><text class="s" text-anchor="start" x="29" y="531">Nur Kleinspannungs- und Planungssimulation; für reale Anlagen gelten zusätzliche Nachweise und Fachzuständigkeiten.</text></svg>