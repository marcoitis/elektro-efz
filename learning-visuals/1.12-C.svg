<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650"><desc>Didaktisches Modell, keine Installationsplanung.</desc><title>1.12-C – Didaktische Fachtafel</title><rect width="1100" height="650" fill="#f7fafc"/><g font-family="Arial,sans-serif" fill="#17334b"><text x="35" y="45" font-size="29" font-weight="bold">1.12-C · Fehlerdiagnose und Modellnachweis</text><text x="36" y="78" font-size="17">S1 ≠ S2 ergibt Licht EIN, wenn Q1 verfügbar</text></g><rect x="40" y="112" width="1020" height="450" fill="white" stroke="#88a8ba" rx="12"/><g font-family="Arial" font-size="20" fill="#17334b"><text x="82" y="161" font-weight="bold">S1</text><text x="235" y="161" font-weight="bold">S2</text><text x="376" y="161" font-weight="bold">Quelle Q1</text><text x="610" y="161" font-weight="bold">Soll L1</text><text x="812" y="161" font-weight="bold">Ist / Fehlerfall</text><rect x="59" y="165" width="976" height="54" fill="#edf5fa"/><text x="93" y="197" fill="#17334b">0</text><text x="250" y="197" fill="#17334b">0</text><text x="403" y="197" fill="#17334b">an</text><text x="639" y="197" fill="#17334b">AUS</text><text x="812" y="197" fill="#17334b">AUS</text><text x="93" y="252" fill="#17334b">0</text><text x="250" y="252" fill="#17334b">1</text><text x="403" y="252" fill="#17334b">an</text><text x="639" y="252" fill="#17334b">EIN</text><text x="812" y="252" fill="#17334b">EIN</text><rect x="59" y="275" width="976" height="54" fill="#edf5fa"/><text x="93" y="307" fill="#17334b">1</text><text x="250" y="307" fill="#17334b">0</text><text x="403" y="307" fill="#17334b">an</text><text x="639" y="307" fill="#17334b">EIN</text><text x="812" y="307" fill="#17334b">EIN</text><text x="93" y="362" fill="#17334b">1</text><text x="250" y="362" fill="#17334b">1</text><text x="403" y="362" fill="#17334b">an</text><text x="639" y="362" fill="#17334b">AUS</text><text x="812" y="362" fill="#17334b">AUS</text><rect x="59" y="385" width="976" height="54" fill="#edf5fa"/><text x="93" y="417" fill="#17334b">0</text><text x="250" y="417" fill="#17334b">1</text><text x="403" y="417" fill="#17334b">aus</text><text x="639" y="417" fill="#17334b">AUS</text><text x="812" y="417" fill="#17334b">AUS</text><text x="93" y="472" fill="#17334b">1</text><text x="250" y="472" fill="#17334b">0</text><text x="403" y="472" fill="#17334b">an</text><text x="639" y="472" fill="#17334b">EIN</text><text x="812" y="472" fill="#b33232">AUS · Unterbruch</text></g><text x="55" y="593" font-family="Arial" font-size="18" fill="#17334b">Abweichung: zuerst Symptom dokumentieren, dann Hypothese und Gegenbeleg prüfen.</text><text x="35" y="626" font-size="15" fill="#526b7a" font-family="Arial">Didaktisches Rechen- und Funktionsmodell – keine Installationsfreigabe</text></svg>