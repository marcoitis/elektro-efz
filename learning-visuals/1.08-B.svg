<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 550" role="img" aria-label="1.08-B · Messgerät belastet den Spannungsteiler"><title>1.08-B · Messgerät belastet den Spannungsteiler</title><desc>Zwei 10-Kiloohm-Widerstände an 12 Volt. Ausgangsspannung ideal 6 Volt; mit Voltmeter-Eingangswiderstand 1 Megaohm etwa 5,970 Volt, mit 100 Kiloohm etwa 5,714 Volt.</desc><style>text{font-family:Arial,DejaVu Sans,sans-serif;fill:#173247}.t{font-size:24px;font-weight:700}.s{font-size:13px;fill:#547084}.h{font-size:17px;font-weight:600}.n{font-size:15px}.f{font-size:20px;font-weight:700;fill:#a15f1e}.wire{fill:none;stroke:#117394;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.soft{fill:#fff;stroke:#c5d9e4;stroke-width:1.5}.warn{fill:#fff7ea;stroke:#ddb77a;stroke-width:1.5}</style><rect width="1100" height="550" rx="18" fill="#f4f8fa"/><text class="t" text-anchor="start" x="29" y="41">1.08-B · Messgerät belastet den Spannungsteiler</text><text class="s" text-anchor="start" x="29" y="63">Didaktisches Modell · keine Installationsplanung und keine normative Freigabe</text><rect class="soft" x="25" y="88" width="597" height="416" rx="10"/><rect class="soft" x="642" y="88" width="432" height="416" rx="10"/><text class="h" text-anchor="middle" x="320" y="124">12 V und zwei Widerstände à 10 kΩ</text><path d="M225 160 L225 213" fill="none" stroke="#117394" stroke-width="3" /><path d="M225 259 L225 327" fill="none" stroke="#117394" stroke-width="3" /><path d="M225 373 L225 433" fill="none" stroke="#117394" stroke-width="3" /><rect x="210" y="212" width="30" height="47" fill="#dcecf4" stroke="#117394" stroke-width="3"/><rect x="210" y="327" width="30" height="47" fill="#dcecf4" stroke="#117394" stroke-width="3"/><text class="n" text-anchor="start" x="305" y="240">R1 = 10 kΩ</text><text class="n" text-anchor="start" x="305" y="358">R2 = 10 kΩ</text><circle cx="225" cy="292" r="6" fill="#bf8036" stroke="#bf8036" stroke-width="2"/><path d="M231 292 L435 292" fill="none" stroke="#117394" stroke-width="3" /><text class="n" text-anchor="middle" x="365" y="281">Messpunkt M1</text><path d="M225 433 L435 433" fill="none" stroke="#117394" stroke-width="3" /><text class="n" text-anchor="middle" x="358" y="451">M0 (Bezug)</text><circle cx="435" cy="362" r="23" fill="#fff9ea" stroke="#c07a2a" stroke-width="2"/><text class="h" text-anchor="middle" x="435" y="369">V</text><path d="M435 292 L435 338" fill="none" stroke="#117394" stroke-width="3" /><path d="M435 385 L435 433" fill="none" stroke="#117394" stroke-width="3" /><text class="n" text-anchor="middle" x="165" y="174">+12 V</text><text class="n" text-anchor="middle" x="165" y="452">0 V</text><text class="h" text-anchor="middle" x="855" y="125">Einfluss der Messeingangsimpedanz</text><text class="n" text-anchor="start" x="671" y="190">Ideal, unbelastet: 6,000 V</text><text class="n" text-anchor="start" x="671" y="246">1 MΩ Voltmeter: ≈ 5,970 V</text><text class="n" text-anchor="start" x="671" y="303">100 kΩ Voltmeter: ≈ 5,714 V</text><text class="n" text-anchor="start" x="671" y="373">U = 12 · (R2||Rm) / (R1+(R2||Rm))</text><text class="s" text-anchor="middle" x="855" y="430">Eingangsimpedanz belastet den Teiler</text><text class="s" text-anchor="start" x="29" y="531">Nur Kleinspannungs- und Planungssimulation; für reale Anlagen gelten zusätzliche Nachweise und Fachzuständigkeiten.</text></svg>