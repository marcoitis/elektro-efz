<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 550" role="img" aria-label="1.07-C · Baustellen-Stoppentscheidungen"><title>1.07-C · Baustellen-Stoppentscheidungen</title><desc>Drei beispielhafte Stopppunkte: Asbestverdacht an einer Altbauwand, ungeklärte Brandabschnittsdurchdringung und unklarer Energiezustand nahe einer PV-Anlage.</desc><style>text{font-family:Arial,DejaVu Sans,sans-serif;fill:#173247}.t{font-size:24px;font-weight:700}.s{font-size:13px;fill:#547084}.h{font-size:17px;font-weight:600}.n{font-size:15px}.f{font-size:20px;font-weight:700;fill:#a15f1e}.wire{fill:none;stroke:#117394;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.soft{fill:#fff;stroke:#c5d9e4;stroke-width:1.5}.warn{fill:#fff7ea;stroke:#ddb77a;stroke-width:1.5}</style><rect width="1100" height="550" rx="18" fill="#f4f8fa"/><text class="t" text-anchor="start" x="29" y="41">1.07-C · Baustellen-Stoppentscheidungen</text><text class="s" text-anchor="start" x="29" y="63">Didaktisches Modell · keine Installationsplanung und keine normative Freigabe</text><rect class="soft" x="25" y="88" width="1050" height="414" rx="10"/><rect class="warn" x="62" y="124" width="969" height="92" rx="10"/><circle cx="105" cy="166" r="22" fill="#f1ca7a" stroke="#bd7a28" stroke-width="2"/><text class="h" text-anchor="middle" x="105" y="173">1</text><text class="h" text-anchor="start" x="160" y="151">Altbauwand</text><text class="n" text-anchor="start" x="160" y="176">Asbestverdacht: Stoppen</text><text class="n" text-anchor="start" x="602" y="178">Suva / Schadstoffabklärung</text><rect class="warn" x="62" y="241" width="969" height="92" rx="10"/><circle cx="105" cy="283" r="22" fill="#f1ca7a" stroke="#bd7a28" stroke-width="2"/><text class="h" text-anchor="middle" x="105" y="290">2</text><text class="h" text-anchor="start" x="160" y="268">Brandabschnitt</text><text class="n" text-anchor="start" x="160" y="293">Systemnachweis fehlt</text><text class="n" text-anchor="start" x="602" y="295">Brandschutzplanung einbeziehen</text><rect class="warn" x="62" y="358" width="969" height="92" rx="10"/><circle cx="105" cy="400" r="22" fill="#f1ca7a" stroke="#bd7a28" stroke-width="2"/><text class="h" text-anchor="middle" x="105" y="407">3</text><text class="h" text-anchor="start" x="160" y="385">Nähe PV-Anlage</text><text class="n" text-anchor="start" x="160" y="410">Energiezustand ungeklärt</text><text class="n" text-anchor="start" x="602" y="412">Elektrofachperson zuständig</text><text class="f" text-anchor="middle" x="544" y="478">Arbeitsfreigabe erst nach dokumentierter Klärung der relevanten Gefahren</text><text class="s" text-anchor="start" x="29" y="531">Nur Kleinspannungs- und Planungssimulation; für reale Anlagen gelten zusätzliche Nachweise und Fachzuständigkeiten.</text></svg>