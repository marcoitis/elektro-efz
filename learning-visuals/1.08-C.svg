<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 550" role="img" aria-label="1.08-C · Fehlerbaum am Kleinspannungsmodell"><title>1.08-C · Fehlerbaum am Kleinspannungsmodell</title><desc>Eine dunkle 12-Volt-Modellleuchte kann von Quelle, Strompfad oder Verbraucher herrühren. Modellrechnung mit zwei 120-Ohm-Widerständen in Reihe: 50 Milliampere und jeweils 6 Volt Spannungsabfall.</desc><style>text{font-family:Arial,DejaVu Sans,sans-serif;fill:#173247}.t{font-size:24px;font-weight:700}.s{font-size:13px;fill:#547084}.h{font-size:17px;font-weight:600}.n{font-size:15px}.f{font-size:20px;font-weight:700;fill:#a15f1e}.wire{fill:none;stroke:#117394;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.soft{fill:#fff;stroke:#c5d9e4;stroke-width:1.5}.warn{fill:#fff7ea;stroke:#ddb77a;stroke-width:1.5}</style><rect width="1100" height="550" rx="18" fill="#f4f8fa"/><text class="t" text-anchor="start" x="29" y="41">1.08-C · Fehlerbaum am Kleinspannungsmodell</text><text class="s" text-anchor="start" x="29" y="63">Didaktisches Modell · keine Installationsplanung und keine normative Freigabe</text><rect class="soft" x="25" y="88" width="658" height="415" rx="10"/><rect class="soft" x="708" y="88" width="366" height="415" rx="10"/><text class="h" text-anchor="middle" x="354" y="127">Ausgangssymptom: 12-V-Modellleuchte dunkel</text><rect class="soft" x="205" y="151" width="297" height="54" rx="10"/><text class="h" text-anchor="middle" x="354" y="185">Unklare Fehlerursache</text><path d="M354 205 L354 242" fill="none" stroke="#117394" stroke-width="3" /><path d="M115 242 L595 242" fill="none" stroke="#117394" stroke-width="3" /><path d="M115 242 L115 266" fill="none" stroke="#117394" stroke-width="3" /><rect class="soft" x="25" y="270" width="180" height="86" rx="10"/><text class="h" text-anchor="middle" x="115" y="298">Quelle</text><text class="s" text-anchor="middle" x="115" y="326">Sollspannung?</text><path d="M352 242 L352 266" fill="none" stroke="#117394" stroke-width="3" /><rect class="soft" x="262" y="270" width="180" height="86" rx="10"/><text class="h" text-anchor="middle" x="352" y="298">Pfad</text><text class="s" text-anchor="middle" x="352" y="326">Kontakt offen?</text><path d="M590 242 L590 266" fill="none" stroke="#117394" stroke-width="3" /><rect class="soft" x="500" y="270" width="180" height="86" rx="10"/><text class="h" text-anchor="middle" x="590" y="298">Last</text><text class="s" text-anchor="middle" x="590" y="326">Verbraucher?</text><text class="f" text-anchor="middle" x="354" y="403">Beobachtung → Hypothese → sichere Prüfung</text><text class="s" text-anchor="middle" x="354" y="447">Änderung nur im sicheren Modellzustand</text><text class="h" text-anchor="middle" x="885" y="130">Berechenbarer Ersatzkreis</text><text class="n" text-anchor="middle" x="885" y="183">12 V · 120 Ω + 120 Ω</text><text class="n" text-anchor="middle" x="885" y="238">Rges = 240 Ω</text><text class="f" text-anchor="middle" x="885" y="290">I = 0,050 A</text><text class="f" text-anchor="middle" x="885" y="346">U1 = U2 = 6 V</text><text class="s" text-anchor="middle" x="885" y="419">Ohne absichtlichen Kurzschluss</text><text class="s" text-anchor="start" x="29" y="531">Nur Kleinspannungs- und Planungssimulation; für reale Anlagen gelten zusätzliche Nachweise und Fachzuständigkeiten.</text></svg>