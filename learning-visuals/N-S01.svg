<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img"><title>N-S01: Rollen bei elektrischen Arbeiten</title><desc>Individuelles didaktisches Fachschema zur Unterrichtslektion; keine freigegebene Installationszeichnung.</desc><rect width="1280" height="720" fill="#f3f7fa"/><rect width="1280" height="95" fill="#183b52"/><text x="36" y="37" font-family="Arial,sans-serif" font-size="19" fill="#cceaf5">Elektro EFZ · Fachtafel N-S01</text><text x="36" y="77" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="white">Rollen bei elektrischen Arbeiten</text><rect x="28" y="117" width="792" height="504" rx="18" fill="white" stroke="#c9dce8" stroke-width="2"/><rect x="843" y="117" width="409" height="504" rx="18" fill="white" stroke="#c9dce8" stroke-width="2"/><text x="867" y="159" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#183b52">Lernpunkte</text><rect x="28" y="647" width="1224" height="50" rx="12" fill="#e3eef5"/><text x="47" y="678" font-family="Arial,sans-serif" font-size="20" fill="#183b52">Didaktisches Modell – keine normative oder praktische Freigabe elektrischer Installationsarbeiten.</text><circle cx="880" cy="207" r="7" fill="#167e9d"/><text x="899" y="214" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#183b52">Anlagenzustand kennen</text><circle cx="880" cy="293" r="7" fill="#167e9d"/><text x="899" y="300" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#183b52">Arbeitsgrenzen festlegen</text><circle cx="880" cy="379" r="7" fill="#167e9d"/><text x="899" y="386" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#183b52">Bewilligung pro Tätigkeit prüfen</text><circle cx="880" cy="465" r="7" fill="#167e9d"/><text x="899" y="472" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#183b52">Rückgabe eindeutig dokumentieren</text><rect x="56" y="245" width="171" height="98" rx="12" fill="#edf4f8" stroke="#167e9d" stroke-width="3"/><text x="141.5" y="301.6666666666667" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#183b52" text-anchor="middle">Anlage</text><text x="142" y="389" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#5f7687" text-anchor="middle">Betriebszustand</text><line x1="231" y1="294" x2="249" y2="294" stroke="#167e9d" stroke-width="4"/><polygon points="249,294 235.0,301.0 235.0,287.0" fill="#167e9d"/><rect x="246" y="245" width="171" height="98" rx="12" fill="#edf4f8" stroke="#167e9d" stroke-width="3"/><text x="331.5" y="301.6666666666667" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#183b52" text-anchor="middle">Arbeit</text><text x="332" y="389" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#5f7687" text-anchor="middle">Auftrag &amp; Grenze</text><line x1="421" y1="294" x2="439" y2="294" stroke="#167e9d" stroke-width="4"/><polygon points="439,294 425.0,301.0 425.0,287.0" fill="#167e9d"/><rect x="436" y="245" width="171" height="98" rx="12" fill="#edf4f8" stroke="#167e9d" stroke-width="3"/><text x="521.5" y="301.6666666666667" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#183b52" text-anchor="middle">Fachperson</text><text x="522" y="389" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#5f7687" text-anchor="middle">Ausführung</text><line x1="611" y1="294" x2="629" y2="294" stroke="#167e9d" stroke-width="4"/><polygon points="629,294 615.0,301.0 615.0,287.0" fill="#167e9d"/><rect x="626" y="245" width="171" height="98" rx="12" fill="#edf4f8" stroke="#167e9d" stroke-width="3"/><text x="711.5" y="301.6666666666667" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#183b52" text-anchor="middle">Prüfung</text><text x="712" y="389" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#5f7687" text-anchor="middle">Rückgabe</text><text x="110" y="482" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#183b52">Freigaben, Rollen und Dokumentation</text><text x="111" y="523" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#5f7687">Nicht alle Rollen werden automatisch geteilt.</text></svg>