<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img"><title>Normenfall und Plandokumentation</title><desc>Didaktische Modellskizze; keine Installationsanleitung und keine normative Freigabe.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#193950"/></marker></defs><rect x="0" y="0" width="1200" height="680" rx="0" fill="#f5f8fa" stroke="#f5f8fa" stroke-width="0"/><rect x="0" y="0" width="1200" height="98" rx="0" fill="#193950" stroke="#193950" stroke-width="0"/><text x="34" y="63" font-size="31" fill="#fff" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="start" font-weight="700">4.11-B · Normenfall und Plandokumentation</text><rect x="46" y="220" width="259" height="136" rx="10" fill="#fff" stroke="#1885ae" stroke-width="2"/><text x="175.5" y="256" font-size="22" fill="#193950" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" font-weight="700">Fall</text><text x="175.5" y="289" font-size="18" fill="#4f6a7a" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" font-weight="400">Aussensteckdose</text><rect x="337" y="220" width="259" height="136" rx="10" fill="#fff" stroke="#1885ae" stroke-width="2"/><text x="466.5" y="256" font-size="22" fill="#193950" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" font-weight="700">Fehlt</text><text x="466.5" y="289" font-size="18" fill="#4f6a7a" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" font-weight="400">Ort / Schutzart</text><rect x="628" y="220" width="259" height="136" rx="10" fill="#fff" stroke="#1885ae" stroke-width="2"/><text x="757.5" y="256" font-size="22" fill="#193950" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" font-weight="700">Quelle</text><text x="757.5" y="289" font-size="18" fill="#4f6a7a" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" font-weight="400">NIN 2025 / Datenblatt</text><rect x="919" y="220" width="259" height="136" rx="10" fill="#e5f3ee" stroke="#1885ae" stroke-width="2"/><text x="1048.5" y="256" font-size="22" fill="#193950" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" font-weight="700">Nachweis</text><text x="1048.5" y="289" font-size="18" fill="#4f6a7a" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" font-weight="400">Prüfung / Revision</text><text x="595" y="424" font-size="26" fill="#c0555d" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" font-weight="700">Zeichnung belegt Planung – nicht automatisch die Ausführung.</text><rect x="300" y="470" width="600" height="93" rx="10" fill="#eff5f9" stroke="#1885ae" stroke-width="2"/><text x="600.0" y="506" font-size="22" fill="#193950" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" font-weight="700">Antwort</text><text x="600.0" y="539" font-size="18" fill="#4f6a7a" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" font-weight="400">Befund / offene Information / Prüfschritt</text><rect x="30" y="613" width="1140" height="42" rx="10" fill="#e1edf3" stroke="#e1edf3" stroke-width="2"/><text x="600" y="642" font-size="19" fill="#193950" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" font-weight="400">Lernmodell – Originalnorm, Herstellerdaten und fachliche Freigabe für reale Anlagen erforderlich.</text></svg>