<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650"><title>1.01-B – Didaktische Fachtafel</title><rect width="1100" height="650" fill="#f6fafc"/><g font-family="Arial,sans-serif" fill="#17334b"><text x="35" y="50" font-size="30" font-weight="bold">1.01-B · Elektrische Gefahren systematisch beurteilen</text><text x="35" y="82" font-size="17">Didaktisches Funktionsmodell · keine Installations- oder Freigabeanweisung</text></g><defs><marker id="tip" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3 z" fill="#2b788d"/></marker></defs><rect x="45" y="170" width="310" height="128" rx="16" fill="#ffebe6" stroke="#52748a" stroke-width="2"/><text x="200.0" y="212" font-size="23" text-anchor="middle" fill="#17334b" font-family="Arial" font-weight="bold">Stromschlag</text><text x="200.0" y="250" font-size="16" text-anchor="middle" fill="#17334b" font-family="Arial">Körperstrom und Einwirkzeit</text><rect x="395" y="170" width="310" height="128" rx="16" fill="#ffebe6" stroke="#52748a" stroke-width="2"/><text x="550.0" y="212" font-size="23" text-anchor="middle" fill="#17334b" font-family="Arial" font-weight="bold">Lichtbogen</text><text x="550.0" y="250" font-size="16" text-anchor="middle" fill="#17334b" font-family="Arial">Hitze und Druckwirkung</text><rect x="745" y="170" width="310" height="128" rx="16" fill="#ffebe6" stroke="#52748a" stroke-width="2"/><text x="900.0" y="212" font-size="23" text-anchor="middle" fill="#17334b" font-family="Arial" font-weight="bold">Überhitzung</text><text x="900.0" y="250" font-size="16" text-anchor="middle" fill="#17334b" font-family="Arial">Thermische Energie</text><rect x="85" y="390" width="930" height="122" rx="16" fill="#e4f0f5" stroke="#52748a" stroke-width="2"/><text x="550.0" y="432" font-size="23" text-anchor="middle" fill="#17334b" font-family="Arial" font-weight="bold">Mehrere Barrieren</text><text x="550.0" y="470" font-size="16" text-anchor="middle" fill="#17334b" font-family="Arial">Technik · Organisation · Qualifikation · Stopentscheidung</text><path d="M200 300 L200 383" stroke="#2b788d" stroke-width="5" fill="none" marker-end="url(#tip)"/><path d="M550 300 L550 383" stroke="#2b788d" stroke-width="5" fill="none" marker-end="url(#tip)"/><path d="M900 300 L900 383" stroke="#2b788d" stroke-width="5" fill="none" marker-end="url(#tip)"/><text x="40" y="605" font-family="Arial" font-size="17" fill="#496578">Theoretische Schulung: Arbeiten an realen elektrischen Installationen nur mit geeigneter Befähigung/Berechtigung.</text></svg>