<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520"><desc>Didaktisches Modell, keine Installationsplanung.</desc><title>1.02-B – Didaktische Fachtafel</title><rect width="920" height="520" fill="#f9fbfc"/><text x="40" y="48" font-family="Arial" font-size="26" fill="#13324a">1.02-B · Gleichungen umstellen</text><g font-family="Arial" text-anchor="middle" fill="#123"><rect x="60" y="105" width="240" height="90" rx="12" fill="#d9e9f2"/><text x="180" y="160" font-size="30">U = R × I</text><rect x="360" y="105" width="240" height="90" rx="12" fill="#d5eee4"/><text x="480" y="160" font-size="30">I = U / R</text><rect x="660" y="105" width="200" height="90" rx="12" fill="#fff0d6"/><text x="760" y="160" font-size="30">R = U / I</text></g><g font-family="Arial" font-size="19" fill="#23485d"><text x="80" y="260">Beispiel: U = 12 V, R = 4 Ω, I = ?</text><text x="80" y="310">1. Auf beiden Seiten durch R teilen</text><text x="80" y="348">2. I = 12 V / 4 Ω = 3 A</text><text x="80" y="386">3. Rückprobe: 4 Ω × 3 A = 12 V</text><text x="80" y="432">4. Gültigkeitsbereich: idealisiertes ohmsches Modell, R ≠ 0</text><text x="80" y="483" font-size="14">Algebraisches Lehrschema; kein realer Schaltplan.</text></g></svg>