<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Leitungstrassen, Schacht und Brandabschnitt"><title>3.01-B · Leitungstrassen, Schacht und Brandabschnitt</title><desc>Eigene thematische Lernzeichnung – schematisch, nicht vermasst, keine Installationsplanung; nicht für reale Installation freigegeben.</desc><rect x="0" y="0" width="1200" height="700" rx="0" fill="#F5F8FB" /><rect x="0" y="0" width="1200" height="86" rx="0" fill="#17324A" /><text x="36" y="55" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="start">3.01-B   Leitungstrassen, Schacht und Brandabschnitt</text><text x="40" y="126" fill="#17324A" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="start">Gebäudeschnitt · Schacht und brandabschnittsbildende Decke</text><rect x="62" y="166" width="720" height="397" rx="12" fill="#FFFFFF" stroke="#D3DFE9" stroke-width="2" /><rect x="75" y="296" width="695" height="16" rx="0" fill="#B2C0CC" /><rect x="75" y="425" width="695" height="16" rx="0" fill="#B2C0CC" /><text x="93" y="225" fill="#17324A" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="start">Geschoss 3</text><text x="93" y="364" fill="#17324A" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="start">Geschoss 2</text><text x="93" y="493" fill="#17324A" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="start">Geschoss 1</text><rect x="501" y="184" width="135" height="360" rx="3" fill="#EAF2F7" stroke="#18789B" stroke-width="3" /><text x="513" y="216" fill="#17324A" font-family="Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="start">Schacht</text><line x1="562" y1="222" x2="562" y2="518" stroke="#18789B" stroke-width="8" stroke-linecap="round" /><rect x="531" y="293" width="62" height="30" rx="4" fill="#F9D99E" stroke="#C85145" stroke-width="2" /><rect x="531" y="422" width="62" height="30" rx="4" fill="#F9D99E" stroke="#C85145" stroke-width="2" /><line x1="655" y1="313" x2="813" y2="313" stroke="#C85145" stroke-width="2" stroke-linecap="round" stroke-dasharray="6,7" /><line x1="655" y1="442" x2="813" y2="442" stroke="#C85145" stroke-width="2" stroke-linecap="round" stroke-dasharray="6,7" /><rect x="825" y="180" width="335" height="320" rx="11" fill="#FFFFFF" stroke="#D3DFE9" stroke-width="2" /><text x="845" y="219" fill="#17324A" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="start">Durchführungen</text><text x="845" y="264" fill="#18789B" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start">Geprüftes System</text><text x="845" y="305" fill="#203B4F" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start">Projektbezogene</text><text x="845" y="337" fill="#203B4F" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start">Nachweise nötig</text><text x="845" y="392" fill="#C85145" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start">Belegung und Änderungen</text><text x="845" y="430" fill="#C85145" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start">fachkundig bewerten</text><text x="95" y="602" fill="#203B4F" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start">Brandschutz ist eine System- und Koordinationsaufgabe, kein beliebiger Verschluss.</text><rect x="24" y="628" width="1152" height="53" rx="8" fill="#EAF2F7" /><text x="42" y="650" fill="#203B4F" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start">Fachliches Lernmodell · keine Ausführungszeichnung · Normenfreigabe offen</text><text x="42" y="672" fill="#657B8C" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start">Zahlen und Zuordnungen sind ausschliesslich didaktische Annahmen.</text></svg>