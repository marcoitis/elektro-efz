<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img"><title>N-S02: Fünf Sicherheitsregeln verstehen</title><desc>Individuelles didaktisches Fachschema zur Unterrichtslektion; keine freigegebene Installationszeichnung.</desc><rect width="1280" height="720" fill="#f3f7fa"/><rect width="1280" height="95" fill="#183b52"/><text x="36" y="37" font-family="Arial,sans-serif" font-size="19" fill="#cceaf5">Elektro EFZ · Fachtafel N-S02</text><text x="36" y="77" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="white">Fünf Sicherheitsregeln verstehen</text><rect x="28" y="117" width="792" height="504" rx="18" fill="white" stroke="#c9dce8" stroke-width="2"/><rect x="843" y="117" width="409" height="504" rx="18" fill="white" stroke="#c9dce8" stroke-width="2"/><text x="867" y="159" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#183b52">Lernpunkte</text><rect x="28" y="647" width="1224" height="50" rx="12" fill="#e3eef5"/><text x="47" y="678" font-family="Arial,sans-serif" font-size="20" fill="#183b52">Didaktisches Modell – keine normative oder praktische Freigabe elektrischer Installationsarbeiten.</text><circle cx="880" cy="207" r="7" fill="#167e9d"/><text x="899" y="214" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#183b52">Barrieren wirken als Kette</text><circle cx="880" cy="293" r="7" fill="#167e9d"/><text x="899" y="300" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#183b52">Alle Energiequellen erfassen</text><circle cx="880" cy="379" r="7" fill="#167e9d"/><text x="899" y="386" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#183b52">Spannungsfreiheit nachweisen</text><text x="899" y="412" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#183b52">lassen</text><circle cx="880" cy="465" r="7" fill="#167e9d"/><text x="899" y="472" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#183b52">Nur fachkundige Umsetzung</text><rect x="110" y="177" width="628" height="62" rx="12" fill="#edf4f8" stroke="#167e9d" stroke-width="3"/><text x="424.0" y="215.33333333333334" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#183b52" text-anchor="middle">1  Freischalten</text><line x1="423" y1="239" x2="423" y2="256" stroke="#167e9d" stroke-width="4"/><polygon points="423,256 416.0,242.0 430.0,242.0" fill="#167e9d"/><rect x="110" y="257" width="628" height="62" rx="12" fill="#edf4f8" stroke="#edb44d" stroke-width="3"/><text x="424.0" y="295.3333333333333" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#183b52" text-anchor="middle">2  Wiedereinschalten verhindern</text><line x1="423" y1="319" x2="423" y2="336" stroke="#167e9d" stroke-width="4"/><polygon points="423,336 416.0,322.0 430.0,322.0" fill="#167e9d"/><rect x="110" y="337" width="628" height="62" rx="12" fill="#edf4f8" stroke="#167e9d" stroke-width="3"/><text x="424.0" y="375.3333333333333" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#183b52" text-anchor="middle">3  Spannungsfreiheit feststellen</text><line x1="423" y1="399" x2="423" y2="416" stroke="#167e9d" stroke-width="4"/><polygon points="423,416 416.0,402.0 430.0,402.0" fill="#167e9d"/><rect x="110" y="417" width="628" height="62" rx="12" fill="#edf4f8" stroke="#edb44d" stroke-width="3"/><text x="424.0" y="455.3333333333333" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#183b52" text-anchor="middle">4  Erden / Kurzschliessen*</text><line x1="423" y1="479" x2="423" y2="496" stroke="#167e9d" stroke-width="4"/><polygon points="423,496 416.0,482.0 430.0,482.0" fill="#167e9d"/><rect x="110" y="497" width="628" height="62" rx="12" fill="#edf4f8" stroke="#167e9d" stroke-width="3"/><text x="424.0" y="535.3333333333334" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#183b52" text-anchor="middle">5  Benachbarte Teile schützen</text><text x="75" y="598" font-famil