<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img"><desc>Didaktisches Modell, keine Installationsplanung.</desc><title>Dioden, Gleichrichter und Glättung</title><desc>Didaktische Modellskizze, keine Installationsanleitung.</desc><rect width="1200" height="680" fill="#f4f7fb"/><rect width="1200" height="92" fill="#18374b"/><text x="36" y="58" font-family="Arial" font-size="34" fill="white">2.04-A · Dioden, Gleichrichter und Glättung</text><rect x="48" y="130" width="500" height="380" rx="16" fill="#ffffff" stroke="#237ca0" stroke-width="4"/><rect x="622" y="130" width="530" height="380" rx="16" fill="#ffffff" stroke="#237ca0" stroke-width="4"/><text x="70" y="170" font-family="Arial" font-size="28" fill="#18374b">Funktionsbild</text><text x="646" y="170" font-family="Arial" font-size="28" fill="#18374b">Merkpunkte</text><circle cx="150" cy="320" r="8" fill="#18374b"/><line x1="150" y1="320" x2="250" y2="320" stroke="#18374b" stroke-width="4"/><polygon points="250,280 250,360 320,320" fill="#237ca0"/><line x1="330" y1="280" x2="330" y2="360" stroke="#18374b" stroke-width="6"/><line x1="330" y1="320" x2="430" y2="320" stroke="#18374b" stroke-width="4"/><rect x="430" y="270" width="50" height="100" fill="#dcebf2" stroke="#18374b" stroke-width="3"/><text x="122" y="380" font-family="Arial" font-size="24" fill="#18374b">AC</text><text x="438" y="390" font-family="Arial" font-size="24" fill="#18374b">Last</text><line x1="220" y1="220" x2="220" y2="250" stroke="#18374b" stroke-width="4"/><line x1="220" y1="250" x2="390" y2="250" stroke="#18374b" stroke-width="4"/><line x1="390" y1="250" x2="390" y2="220" stroke="#18374b" stroke-width="4"/><line x1="220" y1="220" x2="390" y2="220" stroke="#18374b" stroke-width="2"/><text x="245" y="210" font-family="Arial" font-size="24" fill="#18374b">Glättkondensator</text><text x="646" y="210" font-family="Arial" font-size="24" fill="#18374b">• Halbleitergrundidee</text><text x="646" y="252" font-family="Arial" font-size="24" fill="#18374b">• Vorwärtsspannung und Leistung</text><text x="646" y="294" font-family="Arial" font-size="24" fill="#18374b">• Einweggleichrichtung</text><text x="646" y="336" font-family="Arial" font-size="24" fill="#18374b">• Brückengleichrichter</text><text x="646" y="378" font-family="Arial" font-size="24" fill="#18374b">• Glättkondensator</text><rect x="36" y="566" width="1128" height="92" rx="12" fill="#dcebf2"/><text x="55" y="601" font-family="Arial" font-size="24" fill="#18374b">Didaktisches Modell. Keine normative Freigabe und keine Arbeitsanleitung für reale Installation.</text><text x="55" y="636" font-family="Arial" font-size="24" fill="#18374b">Wichtig sind Ursache, Wirkung, Grenzfall und Nachweis der Schutz- oder Funktionsidee.</text></svg>