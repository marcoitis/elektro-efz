<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 550" role="img" aria-label="1.07-B · Leitungswege vergleichen"><title>1.07-B · Leitungswege vergleichen</title><desc>Fiktiver zweidimensionaler Grundriss mit zwei Trassenvarianten. Route A 10 Meter mit offener Brandabschnittsdurchdringung; Route B 13 Meter als alternative Aussenumfahrung mit noch ungeklärten Gebäudehüllendurchdringungen. Keine Bewertung der tatsächlichen brandschutztechnischen Zulässigkeit.</desc><style>text{font-family:Arial,DejaVu Sans,sans-serif;fill:#173247}.t{font-size:24px;font-weight:700}.s{font-size:13px;fill:#547084}.h{font-size:17px;font-weight:600}.n{font-size:15px}.f{font-size:20px;font-weight:700;fill:#a15f1e}.wire{fill:none;stroke:#117394;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.soft{fill:#fff;stroke:#c5d9e4;stroke-width:1.5}.warn{fill:#fff7ea;stroke:#ddb77a;stroke-width:1.5}</style><rect width="1100" height="550" rx="18" fill="#f4f8fa"/><text class="t" text-anchor="start" x="29" y="41">1.07-B · Leitungswege vergleichen</text><text class="s" text-anchor="start" x="29" y="63">Didaktisches Modell · keine Installationsplanung und keine normative Freigabe</text><rect class="soft" x="25" y="87" width="670" height="416" rx="10"/><rect class="soft" x="714" y="87" width="361" height="416" rx="10"/><text class="h" text-anchor="middle" x="360" y="118">Fiktiver Grundriss: zwei mögliche Leitungswege</text><rect x="82" y="148" width="540" height="284" fill="#fff" stroke="#456d83" stroke-width="2"/><path d="M352 149 L352 433" fill="none" stroke="#bd6d43" stroke-width="7" /><text class="s" text-anchor="middle" x="351" y="457">Brandabschnitt?</text><rect class="soft" x="99" y="355" width="108" height="60" rx="10"/><text class="s" text-anchor="middle" x="152" y="391">Technikraum</text><rect class="soft" x="512" y="180" width="98" height="60" rx="10"/><text class="s" text-anchor="middle" x="561" y="214">Ziel</text><path d="M207 390 H293 V206 H513" fill="none" stroke="#bb682e" stroke-width="6" stroke-dasharray="10 8"/><path d="M207 390 V465 H664 V265 H561 V240" fill="none" stroke="#167b80" stroke-width="6"/><text class="s" text-anchor="middle" x="299" y="191">Route A: 10 m (Modell)</text><text class="s" text-anchor="middle" x="478" y="483">Route B: 13 m (Modell)</text><text class="h" text-anchor="middle" x="892" y="131">Variantenentscheidung</text><text class="n" text-anchor="start" x="738" y="190">A: kürzer, Durchdringung offen</text><text class="n" text-anchor="start" x="738" y="233">B: länger, Fassadendurchtritte offen</text><text class="n" text-anchor="start" x="738" y="279">Höhenlage gesondert prüfen</text><text class="n" text-anchor="start" x="738" y="322">Biegeradien nach Hersteller</text><text class="n" text-anchor="start" x="738" y="365">Häufung / Wärme nach NIN</text><text class="n" text-anchor="start" x="738" y="412">Koordination vor Ausführung</text><text class="s" text-anchor="start" x="29" y="531">Nur Kleinspannungs- und Planungssimulation; für reale Anlagen gelten zusätzliche Nachweise und Fachzuständigkeiten.</text></svg>