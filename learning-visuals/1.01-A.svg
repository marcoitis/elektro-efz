<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650"><title>1.01-A – Didaktische Fachtafel</title><rect width="1100" height="650" fill="#f6fafc"/><g font-family="Arial,sans-serif" fill="#17334b"><text x="35" y="50" font-size="30" font-weight="bold">1.01-A · Berufsabschluss, Rollen und Bewilligungsgrenzen</text><text x="35" y="82" font-size="17">Didaktisches Funktionsmodell · keine Installations- oder Freigabeanweisung</text></g><defs><marker id="tip" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3 z" fill="#2b788d"/></marker></defs><rect x="45" y="170" width="310" height="128" rx="16" fill="#e4f0f5" stroke="#52748a" stroke-width="2"/><text x="200.0" y="212" font-size="23" text-anchor="middle" fill="#17334b" font-family="Arial" font-weight="bold">Kompetenz</text><text x="200.0" y="250" font-size="16" text-anchor="middle" fill="#17334b" font-family="Arial">Wissen und Ausbildung</text><rect x="395" y="170" width="310" height="128" rx="16" fill="#e4f0f5" stroke="#52748a" stroke-width="2"/><text x="550.0" y="212" font-size="23" text-anchor="middle" fill="#17334b" font-family="Arial" font-weight="bold">Berechtigung</text><text x="550.0" y="250" font-size="16" text-anchor="middle" fill="#17334b" font-family="Arial">Konkrete Tätigkeit prüfen</text><rect x="745" y="170" width="310" height="128" rx="16" fill="#e4f0f5" stroke="#52748a" stroke-width="2"/><text x="900.0" y="212" font-size="23" text-anchor="middle" fill="#17334b" font-family="Arial" font-weight="bold">Nachweis</text><text x="900.0" y="250" font-size="16" text-anchor="middle" fill="#17334b" font-family="Arial">Verantwortung dokumentieren</text><path d="M355 235 L390 235" stroke="#2b788d" stroke-width="5" fill="none" marker-end="url(#tip)"/><path d="M705 235 L740 235" stroke="#2b788d" stroke-width="5" fill="none" marker-end="url(#tip)"/><rect x="90" y="375" width="920" height="130" rx="16" fill="#fff1db" stroke="#52748a" stroke-width="2"/><text x="550.0" y="417" font-size="23" text-anchor="middle" fill="#17334b" font-family="Arial" font-weight="bold">Eigentum ≠ Installationsbewilligung</text><text x="550.0" y="455" font-size="16" text-anchor="middle" fill="#17334b" font-family="Arial">Abschluss, Auftragsumfang und Zuständigkeit getrennt beurteilen</text><text x="40" y="605" font-family="Arial" font-size="17" fill="#496578">Theoretische Schulung: Arbeiten an realen elektrischen Installationen nur mit geeigneter Befähigung/Berechtigung.</text></svg>