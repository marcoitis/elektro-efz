<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img"><title>Erdung und Schutzpotenzialausgleich</title><desc>Didaktische Modellskizze; keine Installationsanleitung und keine normative Freigabe.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#193950"/></marker></defs><rect x="0" y="0" width="1200" height="680" rx="0" fill="#f5f8fa" stroke="#f5f8fa" stroke-width="0"/><rect x="0" y="0" width="1200" height="98" rx="0" fill="#193950" stroke="#193950" stroke-width="0"/><text x="34" y="63" font-size="31" fill="#fff" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="start" font-weight="700">N-E01 · Erdung und Schutzpotenzialausgleich</text><rect x="80" y="170" width="292" height="106" rx="10" fill="#fff" stroke="#1885ae" stroke-width="2"/><text x="226.0" y="206" font-size="22" fill="#193950" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" font-weight="700">Fehlerstrom</text><text x="226.0" y="239" font-size="18" fill="#4f6a7a" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" font-weight="400">Rückweg zur Quelle</text><rect x="450" y="170" width="305" height="106" rx="10" fill="#e5f3ee" stroke="#1885ae" stroke-width="2"/><text x="602.5" y="206" font-size="22" fill="#193950" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" font-weight="700">Schutz-Potenzial</text><text x="602.5" y="239" font-size="18" fill="#4f6a7a" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" font-weight="400">Differenzen begrenzen</text><rect x="834" y="170" width="294" height="106" rx="10" fill="#fff4e4" stroke="#1885ae" stroke-width="2"/><text x="981.0" y="206" font-size="22" fill="#193950" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" font-weight="700">Blitzstrom</text><text x="981.0" y="239" font-size="18" fill="#4f6a7a" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" font-weight="400">Impulsweg + Schutz</text><rect x="150" y="357" width="880" height="139" rx="10" fill="#fff" stroke="#b9cdd6" stroke-width="2"/><text x="597" y="397" font-size="28" fill="#193950" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" font-weight="700">Gebäude – drei verschiedene Aufgaben</text><path d="M264,276 L264,357" fill="none" stroke="#1885ae" stroke-width="5" marker-end="url(#arrow)" /><path d="M602,276 L602,357" fill="none" stroke="#188673" stroke-width="5" marker-end="url(#arrow)" /><path d="M985,276 L985,357" fill="none" stroke="#df9b3f" stroke-width="5" marker-end="url(#arrow)" /><path d="M150,527 L1030,527" fill="none" stroke="#638f63" stroke-width="7" /><text x="590" y="568" font-size="20" fill="#c0555d" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" font-weight="700">Erder / PE / PA sind keine beliebig austauschbaren Leiter.</text><rect x="30" y="613" width="1140" height="42" rx="10" fill="#e1edf3" stroke="#e1edf3" stroke-width="2"/><text x="600" y="642" font-size="19" fill="#193950" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" font-weight="400">Lernmodell – Originalnorm, Herstellerdaten und fachliche Freigabe für reale Anlagen erforderlich.</text></svg>