<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="3.10-B Glasfaser und optische Übertragung"><title>3.10-B: Glasfaser und optische Übertragung</title><desc>Individuelle didaktische Fachgrafik: kein freigegebener Installationsplan. Sicherheits- und Normenvorgaben gesondert prüfen.</desc><rect x="0" y="0" width="1200" height="700" rx="0" fill="#F3F7FA" stroke="none" stroke-width="0" /><rect x="0" y="0" width="1200" height="94" rx="0" fill="#18364C" stroke="none" stroke-width="0" /><text x="35" y="59" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="start">3.10-B · Glasfaser und optische Übertragung</text><text x="44" y="140" fill="#18364C" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start">Optisches Budget: dB-Verluste zu Empfangspegel addieren</text><rect x="45" y="220" width="290" height="150" rx="12" fill="#FFFFFF" stroke="#CBDCE4" stroke-width="2" /><rect x="45" y="220" width="7" height="150" rx="0" fill="#197CA1" stroke="#197CA1" stroke-width="0" /><text x="64" y="254" fill="#18364C" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">Sender</text><text x="64" y="288" fill="#667B8A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">−3 dBm</text><rect x="453" y="220" width="290" height="150" rx="12" fill="#FFFFFF" stroke="#CBDCE4" stroke-width="2" /><rect x="453" y="220" width="7" height="150" rx="0" fill="#CC8A2B" stroke="#CC8A2B" stroke-width="0" /><text x="472" y="254" fill="#18364C" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">Faser + Stecker</text><text x="472" y="288" fill="#667B8A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">4 dB Verlust</text><rect x="855" y="220" width="295" height="150" rx="12" fill="#FFFFFF" stroke="#CBDCE4" stroke-width="2" /><rect x="855" y="220" width="7" height="150" rx="0" fill="#178773" stroke="#178773" stroke-width="0" /><text x="874" y="254" fill="#18364C" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">Empfänger</text><text x="874" y="288" fill="#667B8A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">−7 dBm (Modell)</text><line x1="339" y1="293" x2="450" y2="293" stroke="#197CA1" stroke-width="4" stroke-linecap="round" /><line x1="450" y1="293" x2="437.58207108109" y2="299.46490845758075" stroke="#197CA1" stroke-width="3" stroke-linecap="round" /><line x1="450" y1="293" x2="437.58207108109" y2="286.53509154241925" stroke="#197CA1" stroke-width="3" stroke-linecap="round" /><line x1="747" y1="293" x2="852" y2="293" stroke="#197CA1" stroke-width="4" stroke-linecap="round" /><line x1="852" y1="293" x2="839.58207108109" y2="299.46490845758075" stroke="#197CA1" stroke-width="3" stroke-linecap="round" /><line x1="852" y1="293" x2="839.58207108109" y2="286.53509154241925" stroke="#197CA1" stroke-width="3" stroke-linecap="round" /><rect x="55" y="442" width="1094" height="148" rx="12" fill="#FFFFFF" stroke="#CBDCE4" stroke-width="2" /><text x="76" y="486" fill="#197CA1" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="start">−3 dBm − 4 dB = −7 dBm</text><text x="76" y="530" fill="#29485A" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">OTDR: Ereignisposition  ·  Ende-zu-Ende: Gesamtverlust</text><text x="76" y="562" fill="#C54B4B" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">Empfängergrenzen / Messwellenlänge / Steckerqualität prüfen.</text><rect x="30" y="626" width="1140" height="51" rx="8" fill="#E8F3F7" stroke="none" stroke-width="0" /><text x="50" y="659" fill="#29485A" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight