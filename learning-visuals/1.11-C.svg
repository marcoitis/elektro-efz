<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img"><title>Kontrollen, SiNa und Nachweisfolge</title><desc>Individuelles didaktisches Fachmodell für 1.11-C; keine freigegebene Installationszeichnung.</desc><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f4f8fb" stroke="#f4f8fb" stroke-width="0"/><rect x="0" y="0" width="1280" height="96" rx="0" fill="#18384D" stroke="#18384D" stroke-width="0"/><text x="39" y="61" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="36" fill="#ffffff" text-anchor="start">1.11-C  |  Kontrollen, SiNa und Nachweisfolge</text><rect x="40" y="116" width="1200" height="515" rx="17" fill="#ffffff" stroke="#d2e1e9" stroke-width="2"/><rect x="60" y="226" width="215" height="116" rx="12" fill="#e8f3f7" stroke="#247DA0" stroke-width="2"/><text x="167.5" y="267" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="25" fill="#18384D" text-anchor="middle">Erstprüfung</text><text x="167.5" y="303" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="20" fill="#557181" text-anchor="middle">baubegleitend</text><line x1="275" y1="285" x2="294" y2="285" stroke="#258365" stroke-width="5" stroke-linecap="round"/><polygon points="294,285 281,277 281,293" fill="#258365"/><rect x="298" y="226" width="215" height="116" rx="12" fill="#fff3e4" stroke="#247DA0" stroke-width="2"/><text x="405.5" y="267" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="25" fill="#18384D" text-anchor="middle">Schlusskontrolle</text><text x="405.5" y="303" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="20" fill="#557181" text-anchor="middle">Installation</text><line x1="513" y1="285" x2="532" y2="285" stroke="#258365" stroke-width="5" stroke-linecap="round"/><polygon points="532,285 519,277 519,293" fill="#258365"/><rect x="536" y="226" width="215" height="116" rx="12" fill="#e8f3f7" stroke="#247DA0" stroke-width="2"/><text x="643.5" y="267" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="25" fill="#18384D" text-anchor="middle">SiNa + Protokoll</text><text x="643.5" y="303" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="20" fill="#557181" text-anchor="middle">belegte Ergebnisse</text><line x1="751" y1="285" x2="770" y2="285" stroke="#258365" stroke-width="5" stroke-linecap="round"/><polygon points="770,285 757,277 757,293" fill="#258365"/><rect x="774" y="226" width="215" height="116" rx="12" fill="#fff3e4" stroke="#247DA0" stroke-width="2"/><text x="881.5" y="267" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="25" fill="#18384D" text-anchor="middle">Abnahme*</text><text x="881.5" y="303" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="20" fill="#557181" text-anchor="middle">wenn erforderlich</text><line x1="989" y1="285" x2="1008" y2="285" stroke="#258365" stroke-width="5" stroke-linecap="round"/><polygon points="1008,285 995,277 995,293" fill="#258365"/><rect x="1012" y="226" width="215" height="116" rx="12" fill="#e8f3f7" stroke="#247DA0" stroke-width="2"/><text x="1119.5" y="267" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="25" fill="#18384D" text-anchor="middle">Periodisch</text><text x="1119.5" y="303" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="20" fill="#557181" text-anchor="middle">Folgekontrolle</text><rect x="112" y="405" width="1044" height="123" rx="12" fill="#f7fbfd" stroke="#247DA0" stroke-width="2"/><text x="634" y="443" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="28" fill="#18384D" text-anchor="middle">Jeder Schritt: Rolle + Gegenstand + Zeitpunkt + Nachweis</text><text x="634" y="479" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="24" fill="#A95154" text-anchor="middle">* Zusätzliche Kontrollen und Fristen gemäss aktueller NIV prüfen</text><rect x="52" y="654" width="1176" height="43" rx="8" fill="#e0eef4" stroke="#d2e3ed" stroke-width="1"/><text x="70" y="681" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="20" fill="#18384D" text-anchor="start">Didaktisches Schaubild – keine freigegebene Installations- oder Messanleitung</text></svg>