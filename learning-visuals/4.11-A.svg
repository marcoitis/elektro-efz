<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img"><title>Mathematik und Elektrotechnik</title><desc>Didaktische Modellskizze; keine Installationsanleitung und keine normative Freigabe.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#193950"/></marker></defs><rect x="0" y="0" width="1200" height="680" rx="0" fill="#f5f8fa" stroke="#f5f8fa" stroke-width="0"/><rect x="0" y="0" width="1200" height="98" rx="0" fill="#193950" stroke="#193950" stroke-width="0"/><text x="34" y="63" font-size="31" fill="#fff" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="start" font-weight="700">4.11-A · Mathematik und Elektrotechnik</text><rect x="54" y="174" width="255" height="118" rx="10" fill="#fff" stroke="#1885ae" stroke-width="2"/><text x="181.5" y="210" font-size="22" fill="#193950" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" font-weight="700">Daten</text><text x="181.5" y="243" font-size="18" fill="#4f6a7a" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" font-weight="400">U = 60 V, R = 12 Ω</text><path d="M309,234 L410,234" fill="none" stroke="#193950" stroke-width="3" marker-end="url(#arrow)" /><rect x="410" y="174" width="332" height="118" rx="10" fill="#e9f4f8" stroke="#1885ae" stroke-width="2"/><text x="576.0" y="210" font-size="22" fill="#193950" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" font-weight="700">Impedanz</text><text x="576.0" y="243" font-size="18" fill="#4f6a7a" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" font-weight="400">R = 12 Ω; XL = 16 Ω</text><path d="M742,234 L845,234" fill="none" stroke="#193950" stroke-width="3" marker-end="url(#arrow)" /><rect x="845" y="174" width="298" height="118" rx="10" fill="#e5f3ee" stroke="#1885ae" stroke-width="2"/><text x="994.0" y="210" font-size="22" fill="#193950" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" font-weight="700">Ergebnis</text><text x="994.0" y="243" font-size="18" fill="#4f6a7a" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" font-weight="400">|Z| = 20 Ω; I = 3 A</text><path d="M180,515 L480,515" fill="none" stroke="#1885ae" stroke-width="4" /><path d="M480,515 L480,361" fill="none" stroke="#188673" stroke-width="4" /><path d="M180,515 L480,361" fill="none" stroke="#df9b3f" stroke-width="4" /><text x="334" y="546" font-size="21" fill="#1885ae" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" font-weight="700">R = 12 Ω</text><text x="501" y="439" font-size="19" fill="#188673" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="start" font-weight="400">XL = 16 Ω</text><text x="325" y="417" font-size="21" fill="#df9b3f" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" font-weight="700">|Z| = 20 Ω</text><rect x="645" y="393" width="455" height="114" rx="10" fill="#fff4e4" stroke="#1885ae" stroke-width="2"/><text x="872.5" y="429" font-size="22" fill="#193950" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" font-weight="700">Rückprobe</text><text x="872.5" y="462" font-size="18" fill="#4f6a7a" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" font-weight="400">60 V / 20 Ω = 3 A</text><rect x="30" y="613" width="1140" height="42" rx="10" fill="#e1edf3" stroke="#e1edf3" stroke-width="2"/><text x="600" y="642" font-size="19" fill="#193950" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" font-weight="400">Lernmodell – Originalnorm, Herstellerdaten und fachliche Freigabe für reale Anlagen erforderlich.</text></svg>