<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img"><title>Technik erklären – Modell und Rückprobe</title><desc>Didaktisches Fachmodell, nicht als Installationsplan oder freigegebene Anleitung verwenden.</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#18364b"/></marker></defs><rect x="0" y="0" width="1200" height="680" rx="0" fill="#f3f7fa" stroke="#f3f7fa" stroke-width="0"/><rect x="0" y="0" width="1200" height="96" rx="0" fill="#18364b" stroke="#18364b" stroke-width="0"/><text x="34" y="62" font-family="Arial,DejaVu Sans,sans-serif" font-size="32" text-anchor="start" font-weight="bold" fill="#fff">4.10-B · Technik erklären – Modell und Rückprobe</text><rect x="75" y="200" width="275" height="112" rx="12" fill="#fff" stroke="#1684ad" stroke-width="2"/><text x="212.5" y="239" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" text-anchor="middle" font-weight="bold" fill="#18364b">Modell</text><text x="212.5" y="275" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" text-anchor="middle" font-weight="normal" fill="#536c7d">U = 12 V · P = 24 W</text><rect x="470" y="200" width="270" height="112" rx="12" fill="#e6f4f0" stroke="#1684ad" stroke-width="2"/><text x="605.0" y="239" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" text-anchor="middle" font-weight="bold" fill="#18364b">Berechnung</text><text x="605.0" y="275" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" text-anchor="middle" font-weight="normal" fill="#536c7d">I = 24 / 12 = 2 A</text><rect x="860" y="200" width="270" height="112" rx="12" fill="#fff" stroke="#1684ad" stroke-width="2"/><text x="995.0" y="239" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" text-anchor="middle" font-weight="bold" fill="#18364b">Rückprobe</text><text x="995.0" y="275" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" text-anchor="middle" font-weight="normal" fill="#536c7d">12 V × 2 A = 24 W</text><path d="M350 255 L470 255" fill="none" stroke="#18364b" stroke-width="4" marker-end="url(#arr)" /><path d="M740 255 L860 255" fill="none" stroke="#18364b" stroke-width="4" marker-end="url(#arr)" /><rect x="290" y="420" width="625" height="110" rx="12" fill="#fff4df" stroke="#1684ad" stroke-width="2"/><text x="602.5" y="459" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" text-anchor="middle" font-weight="bold" fill="#18364b">Systemgrenze</text><text x="602.5" y="495" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" text-anchor="middle" font-weight="normal" fill="#536c7d">η = 90 % → P Eingang ≈ 26,7 W</text><text x="600" y="571" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" text-anchor="middle" font-weight="bold" fill="#b54c55">Jede Formel braucht Annahmen, Einheiten und Grenzen.</text><rect x="28" y="617" width="1144" height="45" rx="12" fill="#e0edf4" stroke="#e0edf4" stroke-width="2"/><text x="600" y="646" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" text-anchor="middle" font-weight="normal" fill="#18364b">Lernmodell · Grenzwerte und Freigaben anhand verbindlicher Quellen prüfen.</text></svg>