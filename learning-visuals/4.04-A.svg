<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img"><title>Zustandsautomat – sicherer Ablauf</title><desc>Didaktisches Fachmodell, nicht als Installationsplan oder freigegebene Anleitung verwenden.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#18364b"/></marker></defs><rect x="0" y="0" width="1200" height="680" rx="0" fill="#f3f7fa" stroke="#f3f7fa" stroke-width="0"/><rect x="0" y="0" width="1200" height="92" rx="0" fill="#18364b" stroke="#18364b" stroke-width="0"/><text x="40" y="58" font-family="Arial, sans-serif" font-size="31" font-weight="bold" text-anchor="start" fill="#fff">4.04-A · Zustandsautomat – sicherer Ablauf</text><rect x="55" y="200" width="210" height="90" rx="12" fill="#eef6fa" stroke="#1684ad" stroke-width="3"/><text x="160" y="252" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#18364b">Bereit</text><rect x="385" y="200" width="210" height="90" rx="12" fill="#eef6fa" stroke="#1684ad" stroke-width="3"/><text x="490" y="252" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#18364b">Fördern</text><rect x="715" y="200" width="210" height="90" rx="12" fill="#eef6fa" stroke="#1684ad" stroke-width="3"/><text x="820" y="252" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#18364b">Prüfen</text><rect x="385" y="400" width="210" height="90" rx="12" fill="#eef6fa" stroke="#1684ad" stroke-width="3"/><text x="490" y="452" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#18364b">Störung</text><path d="M265,245 L385,245" stroke="#18364b" stroke-width="4" fill="none" marker-end="url(#arrow)" /><text x="326" y="226" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#18364b">Start + Freigabe</text><path d="M595,245 L715,245" stroke="#18364b