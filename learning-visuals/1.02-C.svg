<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620"><desc>Didaktisches Modell, keine Installationsplanung.</desc><title>1.02-C – Didaktische Fachtafel</title><rect width="1000" height="620" fill="#f7fafd"/><text x="35" y="50" font-family="Arial" font-size="27" fill="#17364a">1.02-C · Energiefluss, Wirkungsgrad und Lastprofil</text><g font-family="Arial" text-anchor="middle"><rect x="55" y="90" width="250" height="106" rx="16" fill="#cfe5f2"/><text x="180" y="130" font-size="23">Eingang</text><text x="180" y="165" font-size="24">100 W</text><rect x="375" y="90" width="240" height="106" rx="16" fill="#e3eaf1"/><text x="495" y="130" font-size="23">Wandler</text><text x="495" y="165" font-size="22">η = 88 %</text><rect x="685" y="90" width="240" height="106" rx="16" fill="#ccebdc"/><text x="805" y="130" font-size="23">Nutzleistung</text><text x="805" y="165" font-size="24">88 W</text></g><g stroke="#32748e" stroke-width="5" fill="none"><path d="M305 142H366l-12 -9m12 9 -12 9"/><path d="M615 142H675l-12 -9m12 9 -12 9"/><path d="M495 196V260"/></g><rect x="371" y="260" width="248" height="65" rx="12" fill="#f9ddce"/><text x="495" y="287" text-anchor="middle" font-size="20" font-family="Arial">Verluste: 12 W</text><text x="495" y="311" text-anchor="middle" font-size="15" font-family="Arial">Eingang − Ausgang</text><text x="40" y="376" font-family="Arial" font-size="23" fill="#17364a">Tagesprofil – Energie ist die Fläche unter der Leistungskurve</text><g stroke="#5f7382" stroke-width="2"><path d="M80 545V408M80 545H940"/></g><path d="M80 517H295V473H365V497H720V436H862V517H935" stroke="#146f9b" stroke-width="4" fill="none"/><g font-family="Arial" font-size="18" fill="#25485b"><text x="48" y="420">P</text><text x="940" y="570">t</text><text x="90" y="598">E = Σ (Pᵢ × Δtᵢ) · Leistung [W], Energie [Wh]</text><text x="740" y="598" font-size="13">Didaktisches Modell</text></g></svg>