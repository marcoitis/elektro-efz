<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="3.07-C DC-Sicherheit, Stecksysteme und PV-Dokumentation"><title>3.07-C: DC-Sicherheit, Stecksysteme und PV-Dokumentation</title><desc>Individuelle didaktische Fachgrafik: kein freigegebener Installationsplan. Sicherheits- und Normenvorgaben gesondert prüfen.</desc><rect x="0" y="0" width="1200" height="700" rx="0" fill="#F3F7FA" stroke="none" stroke-width="0" /><rect x="0" y="0" width="1200" height="94" rx="0" fill="#18364C" stroke="none" stroke-width="0" /><text x="35" y="59" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="start">3.07-C · DC-Sicherheit, Stecksysteme und PV-Dokumentation</text><text x="45" y="138" fill="#18364C" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start">PV-DC-Sicherheit – AC-Abschaltung macht die Module nicht stromlos</text><rect x="49" y="224" width="287" height="153" rx="12" fill="#FFFFFF" stroke="#CBDCE4" stroke-width="2" /><rect x="49" y="224" width="7" height="153" rx="0" fill="#197CA1" stroke="#197CA1" stroke-width="0" /><text x="68" y="258" fill="#18364C" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">PV-Module</text><text x="68" y="292" fill="#667B8A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">Licht → DC-Quelle</text><rect x="453" y="224" width="278" height="153" rx="12" fill="#FFFFFF" stroke="#CBDCE4" stroke-width="2" /><rect x="453" y="224" width="7" height="153" rx="0" fill="#CC8A2B" stroke="#CC8A2B" stroke-width="0" /><text x="472" y="258" fill="#18364C" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">DC-Leitung</text><text x="472" y="292" fill="#667B8A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">Stecker / Trasse</text><rect x="850" y="224" width="302" height="153" rx="12" fill="#FFFFFF" stroke="#CBDCE4" stroke-width="2" /><rect x="850" y="224" width="7" height="153" rx="0" fill="#178773" stroke="#178773" stroke-width="0" /><text x="869" y="258" fill="#18364C" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">Wechselrichter</text><text x="869" y="292" fill="#667B8A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">DC → AC</text><line x1="339" y1="296" x2="450" y2="296" stroke="#197CA1" stroke-width="4" stroke-linecap="round" /><line x1="450" y1="296" x2="437.58207108109" y2="302.46490845758075" stroke="#197CA1" stroke-width="3" stroke-linecap="round" /><line x1="450" y1="296" x2="437.58207108109" y2="289.53509154241925" stroke="#197CA1" stroke-width="3" stroke-linecap="round" /><line x1="734" y1="296" x2="847" y2="296" stroke="#197CA1" stroke-width="4" stroke-linecap="round" /><line x1="847" y1="296" x2="834.58207108109" y2="302.46490845758075" stroke="#197CA1" stroke-width="3" stroke-linecap="round" /><line x1="847" y1="296" x2="834.58207108109" y2="289.53509154241925" stroke="#197CA1" stroke-width="3" stroke-linecap="round" /><rect x="52" y="444" width="1095" height="136" rx="12" fill="#FFFFFF" stroke="#CBDCE4" stroke-width="2" /><text x="77" y="489" fill="#C54B4B" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start">DC-Risiken: Lichtbogen · Kontaktwärme · beschädigte Isolation</text><text x="77" y="533" fill="#197CA1" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Beispiel Kontaktwärme: 10² A² × 0,02 Ω = 2 W</text><text x="77" y="563" fill="#667B8A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">Reales Trennen und Messen nur nach geeignetem fachkundigem Verfahren.</text><rect x="30" y="626" width="1140" height="51" rx="8" fill="#E8F3F7" stroke="none" stroke-width="0" /><text