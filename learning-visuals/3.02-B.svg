roke-linecap="round" /><line x1="755" y1="356" x2="755" y2="445" stroke="#6B8190" stroke-width="3" stroke-linecap="round" /><line x1="155" y1="445" x2="785" y2="445" stroke="#23826D" stroke-width="5" stroke-linecap="round" /><text x="415" y="474" fill="#23826D" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Schutzpotenzialausgleich (Modell)</text><rect x="40" y="510" width="1115" height="84" rx="12" fill="#FFFFFF" stroke="#C8D7E2" stroke-width="2" /><text x="59" y="546" fill="#254254" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Up / Ableitvermögen / Vorsicherung / Anschlussführung sind zu koordinieren.</text><text x="59" y="579" fill="#C65342" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Ein SPD an nur einer Schnittstelle beweist keinen Gesamtschutz.</text><rect x="28" y="625" width="1144" height="52" rx="8" fill="#E7F1F7" stroke="none" stroke-width="2" /><text x="47" y="657" fill="#254254" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Lernschema • Modellannahmen beachten • keine normativ freigegebene Installationszeichnung</text></svg>