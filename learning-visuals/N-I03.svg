<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img"><title>N-I03: Quellenkritik und Freigabestatus</title><desc>Individuelles didaktisches Fachschema zur Unterrichtslektion; keine freigegebene Installationszeichnung.</desc><rect width="1280" height="720" fill="#f3f7fa"/><rect width="1280" height="95" fill="#183b52"/><text x="36" y="37" font-family="Arial,sans-serif" font-size="19" fill="#cceaf5">Elektro EFZ · Fachtafel N-I03</text><text x="36" y="77" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="white">Quellenkritik und Freigabestatus</text><rect x="28" y="117" width="792" height="504" rx="18" fill="white" stroke="#c9dce8" stroke-width="2"/><rect x="843" y="117" width="409" height="504" rx="18" fill="white" stroke="#c9dce8" stroke-width="2"/><text x="867" y="159" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#183b52">Lernpunkte</text><rect x="28" y="647" width="1224" height="50" rx="12" fill="#e3eef5"/><text x="47" y="678" font-family="Arial,sans-serif" font-size="20" fill="#183b52">Didaktisches Modell – keine normative oder praktische Freigabe elektrischer Installationsarbeiten.</text><circle cx="880" cy="207" r="7" fill="#167e9d"/><text x="899" y="214" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#183b52">Originalausgabe statt Kurzvorwort</text><circle cx="880" cy="293" r="7" fill="#167e9d"/><text x="899" y="300" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#183b52">Herstellerdaten sind nicht</text><text x="899" y="326" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#183b52">Normtext</text><circle cx="880" cy="379" r="7" fill="#167e9d"/><text x="899" y="386" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#183b52">Projektmessung ist gesondert</text><circle cx="880" cy="465" r="7" fill="#167e9d"/><text x="899" y="472" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#183b52">Fehlende Belege bleiben offen</text><text x="68" y="187" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#183b52">Jede Aussage braucht ihre eigene Evidenz</text><rect x="75" y="251" width="210" height="115" rx="12" fill="#edf4f8" stroke="#167e9d" stroke-width="3"/><text x="180.0" y="315.8333333333333" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#183b52" text-anchor="middle">Rechtsgrundlage</text><text x="180" y="402" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183b52" text-anchor="middle">Bewilligung</text><rect x="325" y="251" width="210" height="115" rx="12" fill="#edf4f8" stroke="#edb44d" stroke-width="3"/><text x="430.0" y="315.8333333333333" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#183b52" text-anchor="middle">Originalnorm</text><text x="430" y="402" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183b52" text-anchor="middle">Fachregel</text><rect x="575" y="251" width="210" height="115" rx="12" fill="#edf4f8" stroke="#398773" stroke-width="3"/><text x="680.0" y="315.8333333333333" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#183b52" text-anchor="middle">Prüfbericht</text><text x="680" y="402" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183b52" text-anchor="middle">Ist-Zustand</text><line x1="172" y1="438" x2="668" y2="438" stroke="#167e9d" stroke-width="4"/><polygon points="668,438 654.0,445.0 654.0,431.0" fill="#167e9d"/><text x="110" y="489" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#183b52">Versionsstand + Fundstelle + Anwendung</text><text x="105" y="537" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#5f7687">Status: belegt / ungeprüft / offen</text></svg>