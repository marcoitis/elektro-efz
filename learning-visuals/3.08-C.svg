<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="3.08-C PV-Prüfprotokoll, Dachschutz und Übergabe"><title>3.08-C: PV-Prüfprotokoll, Dachschutz und Übergabe</title><desc>Individuelle didaktische Fachgrafik: kein freigegebener Installationsplan. Sicherheits- und Normenvorgaben gesondert prüfen.</desc><rect x="0" y="0" width="1200" height="700" rx="0" fill="#F3F7FA" stroke="none" stroke-width="0" /><rect x="0" y="0" width="1200" height="94" rx="0" fill="#18364C" stroke="none" stroke-width="0" /><text x="35" y="59" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="start">3.08-C · PV-Prüfprotokoll, Dachschutz und Übergabe</text><text x="48" y="139" fill="#18364C" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">PV-Prüfprotokoll: Modellwert ist nicht der Messwert</text><rect x="55" y="210" width="230" height="163" rx="12" fill="#FFFFFF" stroke="#CBDCE4" stroke-width="2" /><rect x="55" y="210" width="7" height="163" rx="0" fill="#178773" stroke="#178773" stroke-width="0" /><text x="74" y="244" fill="#18364C" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">String-ID</text><text x="74" y="278" fill="#667B8A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">Ost 1</text><rect x="303" y="210" width="320" height="163" rx="12" fill="#FFFFFF" stroke="#CBDCE4" stroke-width="2" /><rect x="303" y="210" width="7" height="163" rx="0" fill="#197CA1" stroke="#197CA1" stroke-width="0" /><text x="322" y="244" fill="#18364C" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">Sollmodell</text><text x="322" y="278" fill="#667B8A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">10 × 42 V = 420 V</text><rect x="645" y="210" width="230" height="163" rx="12" fill="#FFFFFF" stroke="#CBDCE4" stroke-width="2" /><rect x="645" y="210" width="7" height="163" rx="0" fill="#197CA1" stroke="#197CA1" stroke-width="0" /><text x="664" y="244" fill="#18364C" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">Messwert</text><text x="664" y="278" fill="#667B8A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">[vor Ort erfassen]</text><rect x="941" y="210" width="230" height="163" rx="12" fill="#FFFFFF" stroke="#CBDCE4" stroke-width="2" /><rect x="941" y="210" width="7" height="163" rx="0" fill="#197CA1" stroke="#197CA1" stroke-width="0" /><text x="960" y="244" fill="#18364C" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">Bewertung</text><text x="960" y="278" fill="#667B8A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">[Fachperson]</text><rect x="55" y="435" width="1092" height="142" rx="12" fill="#FFFFFF" stroke="#CBDCE4" stroke-width="2" /><text x="77" y="476" fill="#18364C" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start">Nachweise: Messgerät · Bedingungen · Prüfer · Datum · Planstand</text><text x="77" y="517" fill="#29485A" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Zusätzlich: Dachzugang / Wartung / Mängel / Übergabe dokumentieren.</text><text x="77" y="548" fill="#C54B4B" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">NIN / ESTI / SN EN 62446-1: Originalanforderungen separat prüfen.</text><rect x="30" y="626" width="1140" height="51" rx="8" fill="#E8F3F7" stroke="none" stroke-width="0" /><text x="50" y="659" fill="#29485A" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">Didaktisches Lernschema – keine normativ oder fachlich freigegebene Installation</text></svg>