<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img"><title>N-W01: Netzanschluss und Zuständigkeit</title><desc>Individuelles didaktisches Fachschema zur Unterrichtslektion; keine freigegebene Installationszeichnung.</desc><rect width="1280" height="720" fill="#f3f7fa"/><rect width="1280" height="95" fill="#183b52"/><text x="36" y="37" font-family="Arial,sans-serif" font-size="19" fill="#cceaf5">Elektro EFZ · Fachtafel N-W01</text><text x="36" y="77" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="white">Netzanschluss und Zuständigkeit</text><rect x="28" y="117" width="792" height="504" rx="18" fill="white" stroke="#c9dce8" stroke-width="2"/><rect x="843" y="117" width="409" height="504" rx="18" fill="white" stroke="#c9dce8" stroke-width="2"/><text x="867" y="159" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#183b52">Lernpunkte</text><rect x="28" y="647" width="1224" height="50" rx="12" fill="#e3eef5"/><text x="47" y="678" font-family="Arial,sans-serif" font-size="20" fill="#183b52">Didaktisches Modell – keine normative oder praktische Freigabe elektrischer Installationsarbeiten.</text><circle cx="880" cy="207" r="7" fill="#167e9d"/><text x="899" y="214" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#183b52">VNB und Installation</text><text x="899" y="240" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#183b52">unterscheiden</text><circle cx="880" cy="293" r="7" fill="#167e9d"/><text x="899" y="300" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#183b52">Netzpunkt ≠ Verbrauchszähler</text><circle cx="880" cy="379" r="7" fill="#167e9d"/><text x="899" y="386" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#183b52">PV und Laden verändern Netzprofil</text><circle cx="880" cy="465" r="7" fill="#167e9d"/><text x="899" y="472" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#183b52">Übergabestellen schriftlich</text><text x="899" y="498" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#183b52">klären</text><rect x="74" y="207" width="182" height="101" rx="12" fill="#edf4f8" stroke="#167e9d" stroke-width="3"/><text x="165.0" y="265.8333333333333" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#183b52" text-anchor="middle">VNB-Netz</text><rect x="346" y="207" width="178" height="101" rx="12" fill="#edf4f8" stroke="#edb44d" stroke-width="3"/><text x="435.0" y="265.1666666666667" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#183b52" text-anchor="middle">Anschluss</text><rect x="614" y="207" width="155" height="101" rx="12" fill="#edf4f8" stroke="#398773" stroke-width="3"/><text x="691.5" y="265.8333333333333" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#183b52" text-anchor="middle">Haus</text><line x1="256" y1="255" x2="346" y2="255" stroke="#167e9d" stroke-width="4"/><polygon points="346,255 332.0,262.0 332.0,248.0" fill="#167e9d"/><line x1="524" y1="255" x2="614" y2="255" stroke="#167e9d" stroke-width="4"/><polygon points="614,255 600.0,262.0 600.0,248.0" fill="#167e9d"/><rect x="380" y="426" width="173" height="96" rx="12" fill="#edf4f8" stroke="#167e9d" stroke-width="3"/><text x="466.5" y="482.0" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#183b52" text-anchor="middle">Zähler</text><line x1="438" y1="308" x2="438" y2="426" stroke="#167e9d" stroke-width="4"/><polygon points="438,426 431.0,412.0 445.0,412.0" fill="#167e9d"/><rect x="83" y="426" width="180" height="96" rx="12" fill="#edf4f8" stroke="#edb44d" stroke-width="3"/><text x="173.0" y="482.3333333333333" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#183b52" text-anchor="middle">PV</text><line x1="263" y1="467" x2="380" y2="467" stroke="#167e9d" stroke-width="4"/><polygon points="380,467 366.0,474.0 366.0,460.0" fill="#167e9d"/><text x="68" y="382" font-f