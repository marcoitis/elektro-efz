><rect x="967" y="220" width="210" height="125" rx="12" fill="#FFFFFF" stroke="#C8D7E2" stroke-width="2" /><rect x="967" y="220" width="7" height="125" rx="0" fill="#23826D" stroke="#23826D" stroke-width="0" /><text x="986" y="255" fill="#18364C" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start">Motor</text><text x="986" y="290" fill="#6B8190" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">variabel</text><line x1="854" y1="362" x2="854" y2="443" stroke="#C65342" stroke-width="4" stroke-linecap="round" stroke-dasharray="9,7" /><line x1="854" y1="443" x2="164" y2="443" stroke="#C65342" stroke-width="4" stroke-linecap="round" stroke-dasharray="9,7" /><text x="82" y="478" fill="#C65342" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start">Schnelle Schaltflanken → Kopplung über Motorleitung / Potenzialbezug</text><rect x="66" y="514" width="1057" height="89" rx="12" fill="#FFFFFF" stroke="#C8D7E2" stroke-width="2" /><text x="88" y="555" fill="#18364C" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">ns (4 Pole, 35 Hz) = 120 · 35 / 4 = 1050 min⁻¹</text><text x="88" y="586" fill="#6B8190" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Rotor läuft lastabhängig mit Schlupf.</text><rect x="28" y="625" width="1144" height="52" rx="8" fill="#E7F1F7" stroke="none" stroke-width="2" /><text x="47" y="657" fill="#254254" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Lernschema • Modellannahmen beachten • keine normativ freigegebene Installationszeichnung</text></svg>