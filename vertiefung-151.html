options":["Rückspeisung und Schutzkonzept","Moduleinfassung","App-Farbe"],"c":0,"why":"Sichere Netztrennung und Schutzfunktionen sind zentral.\n\nBezug zum Unterrichtsteil «Ersatzstrom ist nicht identisch mit Eigenverbrauch»: Bei Ersatzstrombetrieb sind Netztrennung, Rückspeiseschutz, Neutralleiter-/Erdungskonzept und zulässige Betriebsart besonders kritisch."}],"refs":["WV-CH 2025","11.1","11.2","11.3","Anhang A 10.3/4–10.3/5"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Ein Batteriespeicher ist keine gewöhnliche Last. Er kann Energie beziehen, ins Haus liefern, ins Netz einspeisen oder im Ersatzstrombetrieb Versorgung bereitstellen. Jede Betriebsart hat andere Konsequenzen."},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «AC- und DC-gekoppelte Systeme unterscheiden» und «Ersatzstrom ist nicht identisch mit Eigenverbrauch». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «AC- und DC-gekoppelte Systeme unterscheiden» und «USV und Speicher nicht verwechseln». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Bei Stromausfall schaltet ein Heimakku einen Steckdosenkreis weiter. Eine Person möchte die Netztrennung mit einem gewöhnlichen Schalter improvisieren."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Ist jeder Heimspeicher automatisch ersatzstromfähig?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/N-W05.svg"},{"id":"N-P01","year":3,"title":"Eine PV-Anlage vollständig dokumentieren","goals":["Eine PV-Anlage ist nur dann fachlich sauber übergeben, wenn eine andere Fachperson sie auch Jahre später verstehen, prüfen und sicher betreiben kann. Dazu braucht sie weit mehr als die Rechnung der Solarmodule.","Ein bestehendes PV-System hat 24 Module, aber keine Stringkennzeichnung. Du sollst zehn Jahre später einen Fehler suchen."],"parts":[{"heading":"Von Moduldaten zum Stringschema","text":"Zunächst sind Hersteller, Modultyp, Stückzahl, Ausrichtung, Verschaltung, Wechselrichter und gegebenenfalls Optimierer zu erfassen. Das Stringschema zeigt, welche Module in Reihe beziehungsweise welche Strings parallel geschaltet sind. Daraus ergeben sich erwartete Spannungen und Ströme.","formula":""},{"heading":"Elektrische und mechanische Informationen gehören zusammen","text":"Neben DC- und AC-Schema werden Erdung/Potentialausgleich, Schutzeinrichtungen, Trennstellen, Kabelwege und Überspannungsschutz beschrieben. Bei Aufdachanlagen sind auch mechanische Angaben, Befestigung und relevante Tragwerksnachweise für spätere Inspektionen wichtig.","formula":""},{"heading":"Betrieb und Prüfung dokumentieren","text":"Die Übergabe umfasst Betriebs- und Wartungsinformationen, Abschalt-/Notfallhinweise sowie Prüfprotokolle und Inbetriebnahmedaten. Ein Sollschema ohne Istzustand verliert an Aussagekraft, wenn vor Ort Änderungen vorgenommen wurden.","formula":""}],"bridgeTitle":"Spezifische Fallstudie auf Grundlage der genannten Normausgabe; normativer Einzelabgleich ausstehend.","bridge":"Eine PV-Anlage ist nur dann fachlich sauber übergeben, wenn eine andere Fachperson sie auch Jahre später verstehen, prüfen und sicher betreiben kann. Dazu braucht sie weit mehr als die Rechnung der Solarmodule.","exercise":"Ein bestehendes PV-System hat 24 Module, aber keine Stringkennzeichnung. Du sollst zehn Jahre später einen Fehler suchen.","solution":"Zuerst einen sicheren Dokumentations- und Identifizierungsauftrag mit berechtigtem Betrieb organisieren. Ein hypothetisches neues Stringschema muss gegen den Istzustand geprüft werden; aus blossen Fotos kann die elektrische Verschaltung nicht sicher rekonstruiert werden.","quiz":[{"q":"Was zeigt ein Stringschema?","options":["Nur den Modulpreis","Elektrische Verschaltung der PV-Module","Nur Dachneigung"],"c":1,"why":"Es beschreibt die Zuordnung und Verschaltung der PV-Strings.\n\nBezug zum Unterrichtsteil «Von Moduldaten zum Stringschema»: Das Stringschema zeigt, welche Module in Reihe beziehungsweise welche Strings parallel geschaltet sind."},{"q":"Gehören Prüfergebnisse zur Übergabedokumentation?","options":["Ja","Nein","Nur auf Wunsch"],"c":0,"why":"Die Norm behandelt Dokumentation und Prüfung als zusammenhängende Bestandteile."},{"q":"Warum ist die mechanische Dokumentation relevant?","options":["Für spätere Änderungen und Instandhaltung","Für die Stromfrequenz","Sie ist nie relevant"],"c":0,"why":"Die Unterkonstruktion muss später überprüfbar sein.\n\nBezug zum Unterrichtsteil «Elektrische und mechanische Informationen gehören zusammen»: Bei Aufdachanlagen sind auch mechanische Angaben, Befestigung und relevante Tragwerksnachweise für spätere Inspektionen wichtig."}],"refs":["SN EN 62446-1:2016+A1:2018","4.1–4.9"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Eine PV-Anlage ist nur dann fachlich sauber übergeben, wenn eine andere Fachperson sie auch Jahre später verstehen, prüfen und sicher betreiben kann. Dazu braucht sie weit mehr als die Rechnung der Solarmodule."},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Von Moduldaten zum Stringschema» und «Elektrische und mechanische Informationen gehören zusammen». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Von Moduldaten zum Stringschema» und «Betrieb und Prüfung dokumentieren». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Ein bestehendes PV-System hat 24 Module, aber keine Stringkennzeichnung. Du sollst zehn Jahre später einen Fehler suchen."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Was zeigt ein Stringschema?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/N-P01.svg"},{"id":"N-P02","year":3,"title":"PV-Strings rechnen: Temperatur, Leerlaufspannung und Strom","goals":["Die maximale PV-Spannung liegt häufig nicht am heissesten, sondern an einem kalten, hellen Tag. Für die Auslegung von Wechselrichter und DC-Komponenten musst Du die temperaturabhängige Leerlaufspannung verstehen.","Ein Wechselrichter erlaubt laut Datenblatt maximal 550 V DC. Reicht die eben berechnete 542,9-V-Schätzung als alleiniger Zulassungsnachweis?"],"parts":[{"heading":"Serie erhöht Spannung, Parallel erhöht Strom","text":"Bei baugleichen Modulen addieren sich in Serie die Spannungen; der Strom bleibt näherungsweise der Modulstrom. Bei parallel geschalteten Strings addieren sich die Ströme. In der Praxis sind Modultoleranzen, Temperatur- und Einstrahlungsunterschiede sowie Wechselrichtergrenzen zu berücksichtigen.","formula":""},{"heading":"Temperaturkoeffizient korrekt verwenden","text":"Das Datenblatt gibt häufig eine relative Veränderung der Leerlaufspannung pro Kelvin an. Ein negativer Koeffizient bedeutet: Wenn die Zellentemperatur sinkt, steigt die Leerlaufspannung. Wichtig ist der tatsächliche Bezugspunkt des Datenblatts, meist 25 °C Zelltemperatur.","formula":""},{"heading":"Sollwert und Messwert unterscheiden","text":"Die berechnete Erwartung ist nicht automatisch das Messergebnis. Messungen sind von Bestrahlungsstärke, Modultemperatur, Geräten und Sicherheit abhängig. Abweichungen werden untersucht, statt Grenzwerte aus einer Beispielrechnung als allgemeine Norm zu missverstehen.","formula":""}],"bridgeTitle":"Spezifische Fallstudie auf Grundlage der genannten Normausgabe; normativer Einzelabgleich ausstehend.","bridge":"Die maximale PV-Spannung liegt häufig nicht am heissesten, sondern an einem kalten, hellen Tag. Für die Auslegung von Wechselrichter und DC-Komponenten musst Du die temperaturabhängige Leerlaufspannung verstehen.","exercise":"Ein Wechselrichter erlaubt laut Datenblatt maximal 550 V DC. Reicht die eben berechnete 542,9-V-Schätzung als alleiniger Zulassungsnachweis?","solution":"Nein. Sicherheitsreserven, anzusetzende örtliche Extremtemperaturen, Modultoleranzen, Normvorgaben, maximal zulässige Systemspannungen sowie Herstelleranweisungen sind vollständig zu prüfen. Das knappe Ergebnis ist ein Warnsignal für eine fachkundige detaillierte Auslegung.","quiz":[{"q":"Was passiert bei Reihenschaltung gleicher Module mit Uoc?","options":["Sie addiert sich","Sie bleibt immer gleich","Sie wird null"],"c":0,"why":"Die Leerlaufspannungen in Serie addieren sich.\n\nBezug zum Unterrichtsteil «Serie erhöht Spannung, Parallel erhöht Strom»: Bei baugleichen Modulen addieren sich in Serie die Spannungen; der Strom bleibt näherungsweise der Modulstrom."},{"q":"Was bewirkt bei negativem Koeffizienten eine niedrigere Zelltemperatur?","options":["Uoc sinkt","Uoc steigt","Uoc bleibt gleich"],"c":1,"why":"Bei negativem Temperaturkoeffizienten erhöht Kälte die Leerlaufspannung.\n\nBezug zum Unterrichtsteil «Temperaturkoeffizient korrekt verwenden»: Ein negativer Koeffizient bedeutet: Wenn die Zellentemperatur sinkt, steigt die Leerlaufspannung."},{"q":"Welche Zahl ergibt das Beispiel ungefähr?","options":["343 V","543 V","743 V"],"c":1,"why":"12 × 41,2 × 1,098 = ca. 543 V."}],"refs":["SN EN 62446-1:2016+A1:2018","4.3","5.2.8","6.4","6.5"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Die maximale PV-Spannung liegt häufig nicht am heissesten, sondern an einem kalten, hellen Tag. Für die Auslegung von Wechselrichter und DC-Komponenten musst Du die temperaturabhängige Leerlaufspannung verstehen."},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Serie erhöht Spannung, Parallel erhöht Strom» und «Temperaturkoeffizient korrekt verwenden». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Serie erhöht Spannung, Parallel erhöht Strom» und «Sollwert und Messwert unterscheiden». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Ein Wechselrichter erlaubt laut Datenblatt maximal 550 V DC. Reicht die eben berechnete 542,9-V-Schätzung als alleiniger Zulassungsnachweis?"},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Was passiert bei Reihenschaltung gleicher Module mit Uoc?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/N-P02.svg"},{"id":"N-P03","year":3,"title":"PV-Sichtprüfung: Was muss vor jeder Messung stimmen?","goals":["Die Sichtprüfung ist bei der Inbetriebnahme kein Spaziergang über das Dach. Sie ist eine strukturierte Kontrolle der elektrischen, mechanischen und dokumentarischen Voraussetzungen – insbesondere der DC-Risiken.","In einer Fotodokumentation findest Du unleserliche Stringetiketten und ungeschützte DC-Steckverbinder."],"parts":[{"heading":"DC-Leitungen und Verbindungen","text":"DC-Leitungen sind gegen mechanische Beschädigung, UV und Witterung zu schützen. Steckverbinder müssen zusammenpassen und passend verarbeitet sein. Leiterschleifen sollen so geführt sein, dass induzierte Überspannungen durch nahe Blitzeinwirkungen nicht unnötig verstärkt werden.","formula":""},{"heading":"Schutzeinrichtungen und Kennzeichnungen","text":"Zu betrachten sind Trennstellen, Abschaltinformationen, Kennzeichnungen, Potentialausgleich, Überspannungsschutz und weitere nach Anlage erforderliche Schutzmassnahmen. Ein PV-System kann trotz getrennter AC-Seite DC-seitig Spannung führen; entsprechend deutlich müssen Warnungen und Pläne sein.","formula":""},{"heading":"Sichtprüfung dokumentiert konkrete Beobachtungen","text":"Eine gute Prüfliste enthält nicht nur Ja/Nein, sondern Anlagenbezug, Datum, Prüfumfang, festgestellten Mangel, Massnahme und verantwortlich zeichnende Person. Nicht einsehbare Stellen sind als solche zu dokumentieren – nicht als geprüft zu markieren.","formula":""}],"bridgeTitle":"Spezifische Fallstudie auf Grundlage der genannten Normausgabe; normativer Einzelabgleich ausstehend.","bridge":"Die Sichtprüfung ist bei der Inbetriebnahme kein Spaziergang über das Dach. Sie ist eine strukturierte Kontrolle der elektrischen, mechanischen und dokumentarischen Voraussetzungen – insbesondere der DC-Risiken.","exercise":"In einer Fotodokumentation findest Du unleserliche Stringetiketten und ungeschützte DC-Steckverbinder.","solution":"Mängel im Sichtprüfprotokoll erfassen, Anlage nicht unkritisch abnehmen und durch berechtigte Fachpersonen beurteilen und beheben lassen. Fotos sind kein Ersatz für Inspektion vor Ort.","quiz":[{"q":"Ist laufende Einspeisung ein Beweis für fehlerfreie Montage?","options":["Ja","Nein","Nur bei Sommerwetter"],"c":1,"why":"Ein funktionierender Wechselrichter sagt wenig über Leitungsführung und Schutz aus."},{"q":"Wie werden nicht zugängliche Stellen dokumentiert?","options":["Als ungeprüft","Als bestanden","Gar nicht"],"c":0,"why":"Nicht geprüfte Bereiche dürfen nicht als geprüft ausgewiesen werden.\n\nBezug zum Unterrichtsteil «Sichtprüfung dokumentiert konkrete Beobachtungen»: Nicht einsehbare Stellen sind als solche zu dokumentieren – nicht als geprüft zu markieren."},{"q":"Was kann eine grosse DC-Leitungsschleife ungünstig beeinflussen?","options":["Induzierte Überspannungen","Die Modulleistung immer verdoppeln","Das Datum des SiNa"],"c":0,"why":"Schleifenfläche ist bei Einkopplung von Stör- und Blitzimpulsen relevant.\n\nBezug zum Unterrichtsteil «DC-Leitungen und Verbindungen»: Leiterschleifen sollen so geführt sein, dass induzierte Überspannungen durch nahe Blitzeinwirkungen nicht unnötig verstärkt werden."}],"refs":["SN EN 62446-1:2016+A1:2018","5.2.1–5.2.10"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Die Sichtprüfung ist bei der Inbetriebnahme kein Spaziergang über das Dach. Sie ist eine strukturierte Kontrolle der elektrischen, mechanischen und dokumentarischen Voraussetzungen – insbesondere der DC-Risiken."},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «DC-Leitungen und Verbindungen» und «Schutzeinrichtungen und Kennzeichnungen». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «DC-Leitungen und Verbindungen» und «Sichtprüfung dokumentiert konkrete Beobachtungen». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"In einer Fotodokumentation findest Du unleserliche Stringetiketten und ungeschützte DC-Steckverbinder."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Ist laufende Einspeisung ein Beweis für fehlerfreie Montage?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/N-P03.svg"},{"id":"N-P04","year":3,"title":"PV-Erstprüfung: Kategorie 1 systematisch lesen","goals":["Die Prüfungen der Kategorie 1 bilden die grundlegende Inbetriebnahmeprüfung. Entscheidend ist nicht das Auswendiglernen einer Reihenfolge, sondern das Verständnis, welche Fehler jede Prüfung sichtbar machen soll.","String A misst erwartungsgemäss etwa 450 V Leerlaufspannung, String B nur etwa 370 V. Beide sollen identisch aufgebaut sein."],"parts":[{"heading":"Schutz- und Verbindungsprüfung","text":"Wo Schutzleiter und Potentialausgleichsleiter vorgesehen sind, ist ihre Durchgängigkeit relevant. Die Polarität und die Generatoranschlusskästen werden vor dem Zusammenschalten kritisch betrachtet, weil ein Polaritätsfehler schwerwiegende Schäden auslösen kann.","formula":""},{"heading":"Elektrisches Verhalten prüfen","text":"Die Leerlaufspannungen und Strangströme werden auf Plausibilität überprüft. Sind zwei gleiche Strings unter ähnlichen Bedingungen deutlich verschieden, kann das auf Verschaltung, Verschattung, Defekte oder Messfehler hindeuten. Ein Vergleich hat nur Sinn, wenn Einstrahlung und Temperatur berücksichtigt sind.","formula":""},{"heading":"Isolations- und Funktionsprüfungen","text":"Zur Kategorie 1 gehören auch geeignete Isolationsprüfungen und Funktionsprüfungen. Weil PV-Strings bereits bei Tageslicht hohe DC-Spannungen führen können, sind Messmethoden, Prüfgeräte und Sicherungsmassnahmen ausschliesslich Sache entsprechend qualifizierter Personen.","formula":""}],"bridgeTitle":"Spezifische Fallstudie auf Grundlage der genannten Normausgabe; normativer Einzelabgleich ausstehend.","bridge":"Die Prüfungen der Kategorie 1 bilden die grundlegende Inbetriebnahmeprüfung. Entscheidend ist nicht das Auswendiglernen einer Reihenfolge, sondern das Verständnis, welche Fehler jede Prüfung sichtbar machen soll.","exercise":"String A misst erwartungsgemäss etwa 450 V Leerlaufspannung, String B nur etwa 370 V. Beide sollen identisch aufgebaut sein.","solution":"Zuerst Mess- und Umgebungsbedingungen sowie dokumentierte Stringkonfiguration vergleichen. Danach die Abweichung durch die verantwortliche Fachperson untersuchen. Nicht eigenmächtig unter Spannung umstecken.","quiz":[{"q":"Welche Prüfung ist Teil der Kategorie 1?","options":["Polaritätsprüfung","Nur Langzeitmonitoring","Nur Ertragsprognose"],"c":0,"why":"Die Polaritätsprüfung ist ein grundlegender Bestandteil."},{"q":"Ist ein Stringvergleich ohne Einstrahlungsdaten immer eindeutig?","options":["Ja","Nein","Nur nachts"],"c":1,"why":"Die Bedingungen beeinflussen Strom und Spannung."},{"q":"Wer soll reale DC-Prüfungen durchführen?","options":["Beliebige Nutzer","Dafür qualifizierte und berechtigte Fachpersonen","Nur der Hersteller der Module"],"c":1,"why":"DC-Prüfungen an PV können lebensgefährlich sein."}],"refs":["SN EN 62446-1:2016+A1:2018","5.3.4","6.1–6.7"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Die Prüfungen der Kategorie 1 bilden die grundlegende Inbetriebnahmeprüfung. Entscheidend ist nicht das Auswendiglernen einer Reihenfolge, sondern das Verständnis, welche Fehler jede Prüfung sichtbar machen soll."},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Schutz- und Verbindungsprüfung» und «Elektrisches Verhalten prüfen». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Schutz- und Verbindungsprüfung» und «Isolations- und Funktionsprüfungen». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"String A misst erwartungsgemäss etwa 450 V Leerlaufspannung, String B nur etwa 370 V. Beide sollen identisch aufgebaut sein."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Welche Prüfung ist Teil der Kategorie 1?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/N-P04.svg"},{"id":"N-P05","year":4,"title":"PV-Isolationsprüfung verstehen, ohne gefährlich zu messen","goals":["Fehlerhafte Isolation kann gefährliche Berührungsspannungen, Brände und Funktionsstörungen verursachen. Die Isolationsprüfung ist deshalb eine zentrale elektrische Sicherheitsprüfung, jedoch kein Experiment für zu Hause.","Ein Messprotokoll enthält nur „Isolation i. O.“ ohne Prüfspannung, geprüften Schaltungsteil und Ergebnis."],"parts":[{"heading":"Was ein Isolationsmessgerät untersucht","text":"Das Gerät prüft unter kontrollierten Bedingungen den Widerstand zwischen aktiven Leitern und Bezugspotenzialen. Ein sehr hoher Widerstand ist grundsätzlich ein erwünschtes Ergebnis. Die Prüfung setzt jedoch voraus, dass der Prüfling und angeschlossene Elektronik die Methode und Spannung vertragen.","formula":""},{"heading":"Warum PV anders ist als eine harmlose 12-V-Schaltung","text":"Der PV-Generator kann selbst Spannung erzeugen. Ein falsches Prüfverfahren oder unpassendes Gerät kann Menschen gefährden und Wechselrichter oder Modul-Elektronik beschädigen. Systeme mit Leistungsoptimierern oder Modulwechselrichtern können abweichende Prüfverfahren erfordern.","formula":""},{"heading":"Ergebnisse sind kontextabhängig","text":"Die Norm enthält abgestufte Verfahren und Anforderungen. Feuchtigkeit, Länge der DC-Leitungen, angeschlossene Schutzbauteile und Messkonfiguration beeinflussen das Ergebnis. Grenzwerte dürfen nicht aus einer pauschalen Internetliste übernommen werden.","formula":""}],"bridgeTitle":"Spezifische Fallstudie auf Grundlage der genannten Normausgabe; normativer Einzelabgleich ausstehend.","bridge":"Fehlerhafte Isolation kann gefährliche Berührungsspannungen, Brände und Funktionsstörungen verursachen. Die Isolationsprüfung ist deshalb eine zentrale elektrische Sicherheitsprüfung, jedoch kein Experiment für zu Hause.","exercise":"Ein Messprotokoll enthält nur „Isolation i. O.“ ohne Prüfspannung, geprüften Schaltungsteil und Ergebnis.","solution":"Das Protokoll ist für eine nachvollziehbare Beurteilung unzureichend. Prüfkonfiguration, angewandte Methode, relevante Messwerte und Rahmenbedingungen müssen gemäss passender Norm und Anlagenausführung dokumentiert sein.","quiz":[{"q":"Kann die PV-DC-Seite von selbst Spannung erzeugen?","options":["Ja, bei Licht","Nein","Nur mit Batterie"],"c":0,"why":"Beleuchtete Module können auch ohne AC-Netz spannungsführend sein.\n\nBezug zum Unterrichtsteil «Warum PV anders ist als eine harmlose 12-V-Schaltung»: Der PV-Generator kann selbst Spannung erzeugen."},{"q":"Warum ist die Prüfmethodik bei Optimierern kritisch?","options":["Elektronik kann die Messung beeinflussen oder beschädigt werden","Es gibt keine Elektronik","Optimierer sind immer abgeschaltet"],"c":0,"why":"Herstellerhinweise und passende Prüfverfahren sind erforderlich.\n\nBezug zum Unterrichtsteil «Warum PV anders ist als eine harmlose 12-V-Schaltung»: Ein falsches Prüfverfahren oder unpassendes Gerät kann Menschen gefährden und Wechselrichter oder Modul-Elektronik beschädigen."},{"q":"Ist „i. O.“ als einziger Prüfprotokolleintrag ausreichend?","options":["Ja","Nein","Immer bei Privatkunden"],"c":1,"why":"Die Bewertung muss nachvollziehbar und reproduzierbar dokumentiert sein."}],"refs":["SN EN 62446-1:2016+A1:2018","6.7","8.3"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Fehlerhafte Isolation kann gefährliche Berührungsspannungen, Brände und Funktionsstörungen verursachen. Die Isolationsprüfung ist deshalb eine zentrale elektrische Sicherheitsprüfung, jedoch kein Experiment für zu Hause."},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Was ein Isolationsmessgerät untersucht» und «Warum PV anders ist als eine harmlose 12-V-Schaltung». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Was ein Isolationsmessgerät untersucht» und «Ergebnisse sind kontextabhängig». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Ein Messprotokoll enthält nur „Isolation i. O.“ ohne Prüfspannung, geprüften Schaltungsteil und Ergebnis."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Kann die PV-DC-Seite von selbst Spannung erzeugen?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/N-P05.svg"},{"id":"N-P06","year":4,"title":"PV-Fehlerdiagnose mit I-U-Kennlinie und Thermografie","goals":["Eine PV-Anlage kann im Jahresertrag hinter der Erwartung zurückbleiben, ohne dass eine Sicherung ausgelöst hat. Erweiterte Prüfungen helfen, elektrische und thermische Auffälligkeiten systematisch zu lokalisieren.","Zwei Strings liefern 3,4 kW und 2,6 kW. Die Module sind identisch, aber einer ist teilweise verschattet."],"parts":[{"heading":"Kennlinie statt einzelner Spannung","text":"Die Strom-Spannungs-Kennlinie beschreibt, wie sich ein PV-String über verschiedene Betriebspunkte verhält. Daraus lassen sich Leerlaufspannung, Kurzschlussstrom, maximale Leistung und typische Abweichungsmuster beurteilen. Veränderte Einstrahlung oder Temperatur können ähnliche Effekte verursachen wie ein Defekt.","formula":""},{"heading":"Thermografie ist eine Momentaufnahme","text":"Infrarotbilder zeigen Temperaturunterschiede an Modulen, Verbindungen oder Teilflächen. Ein heisser Bereich kann mehrere Ursachen haben, etwa Verschattung, Zellfehler oder schlechte Kontakte. Ein einzelnes Wärmebild ohne Betriebs- und Umgebungsbedingungen ist noch keine eindeutige Diagnose.","formula":""},{"heading":"Prüfkategorie 2 setzt Kategorie 1 voraus","text":"Erweiterte Diagnostik ergänzt die grundlegende Prüfung, ersetzt sie aber nicht. Sicherheit, Messgerätetauglichkeit und die Dokumentation der Bedingungen sind wesentlich.","formula":""}],"bridgeTitle":"Spezifische Fallstudie auf Grundlage der genannten Normausgabe; normativer Einzelabgleich ausstehend.","bridge":"Eine PV-Anlage kann im Jahresertrag hinter der Erwartung zurückbleiben, ohne dass eine Sicherung ausgelöst hat. Erweiterte Prüfungen helfen, elektrische und thermische Auffälligkeiten systematisch zu lokalisieren.","exercise":"Zwei Strings liefern 3,4 kW und 2,6 kW. Die Module sind identisch, aber einer ist teilweise verschattet.","solution":"Die Leistungsdifferenz ist zunächst plausibel durch die unterschiedlichen Bedingungen erklärbar. Erst Messungen unter vergleichbaren Bedingungen und die Kennlinienform erlauben weiterführende Schlussfolgerungen.","quiz":[{"q":"Wofür steht MPP?","options":["Maximum Power Point","Main Protection Panel","Metering Power Phase"],"c":0,"why":"MPP bezeichnet den Betriebspunkt mit maximaler elektrischer Leistung."},{"q":"Welche Leistung ergibt 380 V × 9 A?","options":["42 W","3420 W","34 200 W"],"c":1,"why":"P = U × I = 3420 W."},{"q":"Ist Thermografie allein ein sicherer Defektnachweis?","options":["Immer","Nein, Umgebungsbedingungen und weitere Prüfungen zählen","Nur bei Regen"],"c":1,"why":"Thermische Auffälligkeiten müssen fachlich eingeordnet werden.\n\nBezug zum Unterrichtsteil «Thermografie ist eine Momentaufnahme»: Ein einzelnes Wärmebild ohne Betriebs- und Umgebungsbedingungen ist noch keine eindeutige Diagnose."}],"refs":["SN EN 62446-1:2016+A1:2018","5.3.5","7.1–7.3"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Eine PV-Anlage kann im Jahresertrag hinter der Erwartung zurückbleiben, ohne dass eine Sicherung ausgelöst hat. Erweiterte Prüfungen helfen, elektrische und thermische Auffälligkeiten systematisch zu lokalisieren."},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Kennlinie statt einzelner Spannung» und «Thermografie ist eine Momentaufnahme». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Kennlinie statt einzelner Spannung» und «Prüfkategorie 2 setzt Kategorie 1 voraus». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Zwei Strings liefern 3,4 kW und 2,6 kW. Die Module sind identisch, aber einer ist teilweise verschattet."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Wofür steht MPP?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/N-P06.svg"},{"id":"N-P07","year":4,"title":"Der PV-Prüfbericht als belastbarer Qualitätsnachweis","goals":["Der Kunde braucht keinen Ordner voller unverständlicher Zahlen. Er braucht einen prüfbaren Nachweis, welche Anlage in welchem Zustand übergeben wurde. Ein guter Bericht macht das Ergebnis nachvollziehbar.","Du ergänzt eine Bestands-PV um weitere Module. Der ältere Prüfbericht enthält nur den Zustand vor der Erweiterung."],"parts":[{"heading":"Identität und Randbedingungen","text":"Anlage, Standort, verantwortliche Fachpersonen, Prüfdatum, Module, Wechselrichter und die dokumentierte Verschaltung müssen eindeutig sein. Bei PV-Werten sind relevante Umweltbedingungen und Messgerätedaten wichtig.","formula":""},{"heading":"Messung, Bewertung und Mangel trennen","text":"Prüfwerte werden nicht durch Aussagen wie „sieht gut aus“ ersetzt. Soll und Ist, Messunsicherheit, nicht geprüfte Bereiche, Abweichungen und Korrekturmassnahmen sind sauber voneinander zu unterscheiden.","formula":""},{"heading":"Dokumente müssen später verwendbar bleiben","text":"Stromlaufplan, Datenblätter, Schutz-/Trennkonzept, Bedienungsanleitung und Prüfbericht sollten übereinstimmen. Nach einer Erweiterung ist die Dokumentation nachzuführen, statt die alte Anlagenkonfiguration unverändert weiterzureichen.","formula":""}],"bridgeTitle":"Spezifische Fallstudie auf Grundlage der genannten Normausgabe; normativer Einzelabgleich ausstehend.","bridge":"Der Kunde braucht keinen Ordner voller unverständlicher Zahlen. Er braucht einen prüfbaren Nachweis, welche Anlage in welchem Zustand übergeben wurde. Ein guter Bericht macht das Ergebnis nachvollziehbar.","exercise":"Du ergänzt eine Bestands-PV um weitere Module. Der ältere Prüfbericht enthält nur den Zustand vor der Erweiterung.","solution":"Für die Änderung ist eine nachvollziehbare aktuelle Dokumentation der betroffenen Anlagenteile und ihrer Prüfungen erforderlich. Vorher-/Nachher-Zustand muss erkennbar bleiben.","quiz":[{"q":"Welcher Bericht ist besser prüfbar?","options":["Nur „alles ok“","Anlagenbezogene Messdaten mit Bedingungen","Nur ein Foto vom Dach"],"c":1,"why":"Nachvollziehbare Bewertung braucht identifizierbare Daten."},{"q":"Was geschieht nach einer PV-Erweiterung mit der Dokumentation?","options":["Sie bleibt ungeprüft","Betroffene Unterlagen werden aktualisiert","Die alte Mappe wird entsorgt"],"c":1,"why":"Änderungen erfordern eine korrekte Ist-Dokumentation.\n\nBezug zum Unterrichtsteil «Dokumente müssen später verwendbar bleiben»: Nach einer Erweiterung ist die Dokumentation nachzuführen, statt die alte Anlagenkonfiguration unverändert weiterzureichen."},{"q":"Warum werden Umgebungsbedingungen erfasst?","options":["PV-Messwerte hängen davon ab","Sie beeinflussen nur Briefpapier","Nur für Versicherungswerbung"],"c":0,"why":"Spannung und Strom sind abhängig von Einstrahlung und Temperatur."}],"refs":["SN EN 62446-1:2016+A1:2018","9","Anhang A–C"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Der Kunde braucht keinen Ordner voller unverständlicher Zahlen. Er braucht einen prüfbaren Nachweis, welche Anlage in welchem Zustand übergeben wurde. Ein guter Bericht macht das Ergebnis nachvollziehbar."},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Identität und Randbedingungen» und «Messung, Bewertung und Mangel trennen». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Identität und Randbedingungen» und «Dokumente müssen später verwendbar bleiben». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Du ergänzt eine Bestands-PV um weitere Module. Der ältere Prüfbericht enthält nur den Zustand vor der Erweiterung."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Welcher Bericht ist besser prüfbar?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/N-P07.svg"},{"id":"N-V01","year":3,"title":"Was ist eine Schaltgerätekombination – und welche Norm gilt?","goals":["Eine Verteilung besteht nicht einfach aus einem Gehäuse, ein paar Sicherungen und Drähten. Als Schaltgerätekombination ist sie ein technisches Gesamtsystem mit definierten Bemessungen, Schutzmassnahmen und Nachweisen.","Ein Lieferant schickt für einen Wohnungsverteiler lediglich das Datenblatt eines LS-Schalters."],"parts":[{"heading":"System und Einzelkomponenten trennen","text":"Ein Leitungsschutzschalter kann für sich konform sein, ohne dass die gesamte Kombination dadurch normgerecht wird. Einbautemperatur, Verdrahtung, Luftstrecken, mechanische Anordnung und Kurzschlussbeanspruchung entstehen erst im Zusammenspiel. Darum beurteilt die 61439 die Kombination.","formula":""},{"heading":"Teil 1 wird mit passendem Anwendungsteil verwendet","text":"SN EN IEC 61439-1 enthält allgemeine Regeln. SN EN IEC 61439-2 ergänzt sie für Energie-Schaltgerätekombinationen. Andere Anwendungsteile betreffen z. B. Verteilungen für Laien, Baustellen oder Schienenverteilersysteme. Für die exakte Zuordnung muss die konkrete Bauart und Nutzung bekannt sein.","formula":""},{"heading":"Die Nutzungsart verändert die Anforderungen","text":"Ein Verteilfeld in einem Industriebetrieb hat andere Bediener, Umgebung und mechanische Beanspruchungen als ein Wohnungsverteiler. Aus der Ähnlichkeit der Gehäuse darf nicht automatisch dieselbe Norm angewendet werden. Bei Teil 3 liegt aus Deinem Upload nur die Schweizer Einführung vor, nicht der technische Volltext.","formula":""}],"bridgeTitle":"Spezifische Fallstudie auf Grundlage der genannten Normausgabe; normativer Einzelabgleich ausstehend.","bridge":"Eine Verteilung besteht nicht einfach aus einem Gehäuse, ein paar Sicherungen und Drähten. Als Schaltgerätekombination ist sie ein technisches Gesamtsystem mit definierten Bemessungen, Schutzmassnahmen und Nachweisen.","exercise":"Ein Lieferant schickt für einen Wohnungsverteiler lediglich das Datenblatt eines LS-Schalters.","solution":"Das Datenblatt eines Einzelgeräts ist kein Nachweis für die gesamte Schaltgerätekombination. Verlange die zur konkreten Verteilerbauart passenden Produkt- und Nachweisinformationen.","quiz":[{"q":"Deckt die Gerätekonformität automatisch die komplette Kombination ab?","options":["Ja","Nein","Nur bei 230 V"],"c":1,"why":"Die zusammengebaute Einheit besitzt eigene Anforderungen.\n\nBezug zum Unterrichtsteil «Die Nutzungsart verändert die Anforderungen»: Aus der Ähnlichkeit der Gehäuse darf nicht automatisch dieselbe Norm angewendet werden."},{"q":"Wofür ist Teil 2 besonders relevant?","options":["Energie-Schaltgerätekombinationen","Nur Solarmodule","Nur Hausanschlussgesuche"],"c":0,"why":"Teil 2 behandelt Energie-Schaltgerätekombinationen.\n\nBezug zum Unterrichtsteil «Teil 1 wird mit passendem Anwendungsteil verwendet»: SN EN IEC 61439-2 ergänzt sie für Energie-Schaltgerätekombinationen."},{"q":"Hat die hochgeladene 61439-3 den vollständigen technischen Inhalt?","options":["Ja","Nein, nur Einführung","Das ist ein Datenblatt"],"c":1,"why":"Die bereitgestellte Kurzdatei enthält nicht den technischen Volltext.\n\nBezug zum Unterrichtsteil «Teil 1 wird mit passendem Anwendungsteil verwendet»: SN EN IEC 61439-1 enthält allgemeine Regeln."}],"refs":["SN EN IEC 61439-1:2021 / SN EN IEC 61439-2:2021","61439-1: 1, 3, 4","61439-2: 1, 3"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Eine Verteilung besteht nicht einfach aus einem Gehäuse, ein paar Sicherungen und Drähten. Als Schaltgerätekombination ist sie ein technisches Gesamtsystem mit definierten Bemessungen, Schutzmassnahmen und Nachweisen."},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «System und Einzelkomponenten trennen» und «Teil 1 wird mit passendem Anwendungsteil verwendet». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «System und Einzelkomponenten trennen» und «Die Nutzungsart verändert die Anforderungen». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Ein Lieferant schickt für einen Wohnungsverteiler lediglich das Datenblatt eines LS-Schalters."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Deckt die Gerätekonformität automatisch die komplette Kombination ab?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/N-V01.svg"},{"id":"N-V02","year":3,"title":"Bemessungsdaten einer Verteilung richtig lesen","goals":["Bei einer Verteilung ist die Aufschrift „400 V, 125 A“ noch keine vollständige technische Beschreibung. Sie benötigen mehrere zusammenpassende Bemessungsgrössen und Einsatzbedingungen.","Ein Verteiler soll von 20 °C Innenraum in eine kleine, schlecht belüftete Techniknische verlegt werden."],"parts":[{"heading":"Spannungsgrössen unterscheiden","text":"Bemessungsbetriebsspannung, Bemessungsisolationsspannung und Bemessungs-Stossspannungsfestigkeit beantworten verschiedene Fragen. Betriebsspannung beschreibt den vorgesehenen normalen Einsatz; Isolations- und Stossspannungsfestigkeit betreffen das elektrische Isolationssystem und transiente Beanspruchungen.","formula":""},{"heading":"Stromgrössen gehören zum System","text":"Bemessungsstrom eines Einspeisestromkreises, einzelner Abgänge und die zulässige gleichzeitige Belastung sind zu beachten. Ein 125-A-Sammelschienensystem kann bei ungeeigneter Anordnung, Umgebung oder Gehäusebelüftung thermisch nicht automatisch jede denkbare Bestückung tragen.","formula":""},{"heading":"Umgebung und Aufstellungsort gehören auf das Datenblatt","text":"Schutzart, Innen-/Aussenaufstellung, Temperatur, Verschmutzung, mechanische Beanspruchung und Zugänglichkeit wirken auf die Auswahl. Die Kombination muss unter den vorgesehenen Betriebsbedingungen funktionieren; eine Zahl ohne Randbedingungen ist nur begrenzt aussagekräftig.","formula":""}],"bridgeTitle":"Spezifische Fallstudie auf Grundlage der genannten Normausgabe; normativer Einzelabgleich ausstehend.","bridge":"Bei einer Verteilung ist die Aufschrift „400 V, 125 A“ noch keine vollständige technische Beschreibung. Sie benötigen mehrere zusammenpassende Bemessungsgrössen und Einsatzbedingungen.","exercise":"Ein Verteiler soll von 20 °C Innenraum in eine kleine, schlecht belüftete Techniknische verlegt werden.","solution":"Die bisherigen Betriebs- und Erwärmungsannahmen müssen überprüft werden. Aus dem gleichen Nennstrom folgt nicht zwangsläufig die gleiche thermische Eignung.","quiz":[{"q":"Sind Betriebs- und Isolationsspannung identische Begriffe?","options":["Nein","Ja","Nur bei Gleichstrom"],"c":0,"why":"Sie beschreiben verschiedene Eigenschaften."},{"q":"Warum ist die Umgebung wichtig?","options":["Sie beeinflusst Wärme und Schutz","Nur wegen der Farbe","Sie verändert das physikalische Ohmsche Gesetz"],"c":0,"why":"Die Bemessung muss zu den Einsatzbedingungen passen.\n\nBezug zum Unterrichtsteil «Umgebung und Aufstellungsort gehören auf das Datenblatt»: Die Kombination muss unter den vorgesehenen Betriebsbedingungen funktionieren; eine Zahl ohne Randbedingungen ist nur begrenzt aussagekräftig."},{"q":"Folgt aus 3 × 32 A zwingend eine 96-A-Einspeisung?","options":["Ja","Nein, Gleichzeitigkeit und Nachweise prüfen","Nur bei 50 Hz"],"c":1,"why":"Nennwerte allein ersetzen den Gesamtnachweis nicht."}],"refs":["SN EN IEC 61439-1:2021","5","6","7"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Bei einer Verteilung ist die Aufschrift „400 V, 125 A“ noch keine vollständige technische Beschreibung. Sie benötigen mehrere zusammenpassende Bemessungsgrössen und Einsatzbedingungen."},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Spannungsgrössen unterscheiden» und «Stromgrössen gehören zum System». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Spannungsgrössen unterscheiden» und «Umgebung und Aufstellungsort gehören auf das Datenblatt». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Ein Verteiler soll von 20 °C Innenraum in eine kleine, schlecht belüftete Techniknische verlegt werden."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Sind Betriebs- und Isolationsspannung identische Begriffe?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/N-V02.svg"},{"id":"N-V03","year":3,"title":"Erwärmung verstehen: Strom, Übergangswiderstand und Gehäuse","goals":["Ein Verteiler kann elektrisch funktionieren und trotzdem gefährlich warm werden. Das gilt besonders bei schlechten Verbindungen, hoher Packungsdichte oder ungeeigneter Belüftung.","Bei einer Verteilung wird eine Klemmstelle wärmer als baugleiche Nachbarstellen. Ein Kollege möchte die Schraube im laufenden Betrieb nachziehen."],"parts":[{"heading":"Verlustleistung wächst quadratisch mit Strom","text":"Für einen ohmschen Widerstand lautet die Verlustleistung P = I² × R. Wird der Strom verdoppelt, vervierfacht sich die Verlustleistung im gleichen Widerstand. Kleine Übergangswiderstände an Schraub- oder Klemmstellen können deshalb thermisch erheblich sein.","formula":""},{"heading":"Von Verlustleistung zu Temperatur","text":"Wärme muss über Leiter, Geräte, Luft und Gehäuse abgeführt werden. Umgebungstemperatur, Gehäusebauart, Einbauhöhe, Anzahl gleichzeitig belasteter Stromkreise und Einbauabstände beeinflussen die resultierenden Temperaturen. Das lässt sich nicht allein mit einem P=I²R-Wert erschöpfend beurteilen.","formula":""},{"heading":"Normnachweis statt Handauflegen","text":"Die Norm behandelt Erwärmungsgrenzen und Möglichkeiten des Bauartnachweises. Welche Methode zulässig ist, hängt von der Kombination und den Nachweisbedingungen ab. Ein kurzer Funktionstest oder eine einfache Thermografie-Aufnahme genügt nicht als genereller Ersatz für einen Bauartnachweis.","formula":""}],"bridgeTitle":"Spezifische Fallstudie auf Grundlage der genannten Normausgabe; normativer Einzelabgleich ausstehend.","bridge":"Ein Verteiler kann elektrisch funktionieren und trotzdem gefährlich warm werden. Das gilt besonders bei schlechten Verbindungen, hoher Packungsdichte oder ungeeigneter Belüftung.","exercise":"Bei einer Verteilung wird eine Klemmstelle wärmer als baugleiche Nachbarstellen. Ein Kollege möchte die Schraube im laufenden Betrieb nachziehen.","solution":"Das wäre keine zulässige improvisierte Sofortmassnahme. Unter fachlicher Leitung sind zuerst Gefährdung, Abschaltung, Ursache und ein sicherer Prüf-/Instandhaltungsablauf zu klären. Thermografie ist ein Diagnosehinweis, kein Reparaturfreibrief.","quiz":[{"q":"Wie verhält sich P bei doppeltem I und konstantem R?","options":["Doppelt","Vierfach","Halb"],"c":1,"why":"P = I²R, daher Faktor vier."},{"q":"Wie gross ist P bei 125 A und 1,5 mΩ?","options":["0,188 W","23,44 W","2344 W"],"c":1,"why":"125² × 0,0015 = 23,4375 W."},{"q":"Ersetzt eine Temperaturaufnahme den Bauartnachweis?","options":["Generell ja","Nein","Bei jeder 400-V-Anlage"],"c":1,"why":"Die normative Bewertung benötigt eine passende Nachweismethode."}],"refs":["SN EN IEC 61439-1:2021","9.2","10.10"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Ein Verteiler kann elektrisch funktionieren und trotzdem gefährlich warm werden. Das gilt besonders bei schlechten Verbindungen, hoher Packungsdichte oder ungeeigneter Belüftung."},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Verlustleistung wächst quadratisch mit Strom» und «Von Verlustleistung zu Temperatur». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Verlustleistung wächst quadratisch mit Strom» und «Normnachweis statt Handauflegen». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Bei einer Verteilung wird eine Klemmstelle wärmer als baugleiche Nachbarstellen. Ein Kollege möchte die Schraube im laufenden Betrieb nachziehen."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Wie verhält sich P bei doppeltem I und konstantem R?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/N-V03.svg"},{"id":"N-V04","year":3,"title":"Schutz gegen elektrischen Schlag: Gehäuse ist nicht alles","goals":["Eine gute Schaltgerätekombination trennt gefährliche Teile zuverlässig von Menschen und verbindet berührbare leitfähige Teile mit dem vorgesehenen Schutzsystem.","Eine Nachrüstkomponente verändert die mechanische Schutzabdeckung des Verteilers."],"parts":[{"heading":"Direkter und indirekter Schutz","text":"Abdeckungen, Barrieren und geeignete Isolierung dienen dazu, gefährliche aktive Teile unzugänglich zu machen. Der Schutz im Fehlerfall hängt zusätzlich von Schutzleiterverbindungen, Schutzmassnahmen und dem Zusammenwirken mit der Anlage ab.","formula":""},{"heading":"Schutzleiterkontinuität ist eine Systemaufgabe","text":"Türen, abnehmbare Teile und Verbindungselemente können leitfähige Oberflächen besitzen. Ob und wie eine Schutzleiterverbindung erforderlich ist, muss für die Bauart beurteilt und nachgewiesen werden. Ein grün-gelbes Kabel am Gehäuse allein beweist nicht, dass die Schutzfunktion überall erfüllt ist.","formula":""},{"heading":"Nachweise haben unterschiedliche Ebenen","text":"Die Bauartprüfung beurteilt das Konzept der Kombination. Der Stücknachweis prüft die tatsächlich gefertigte Einheit. Bei Installation und Betrieb kommen weitere Anforderungen der NIN und Anlagenprüfung hinzu.","formula":""}],"bridgeTitle":"Spezifische Fallstudie auf Grundlage der genannten Normausgabe; normativer Einzelabgleich ausstehend.","bridge":"Eine gute Schaltgerätekombination trennt gefährliche Teile zuverlässig von Menschen und verbindet berührbare leitfähige Teile mit dem vorgesehenen Schutzsystem.","exercise":"Eine Nachrüstkomponente verändert die mechanische Schutzabdeckung des Verteilers.","solution":"Änderung durch qualifizierten Planer/Hersteller beurteilen lassen: Die ursprünglichen Nachweise und Schutzarten könnten betroffen sein. Nicht auf die Geräte-Einzelzertifikate verlassen.","quiz":[{"q":"Ist ein Schutzleiteranschluss allein ein vollständiger Schutz-Nachweis?","options":["Ja","Nein","Nur bei DC"],"c":1,"why":"Schutz umfasst auch Abdeckungen, Bauart und Prüfungen.\n\nBezug zum Unterrichtsteil «Direkter und indirekter Schutz»: Abdeckungen, Barrieren und geeignete Isolierung dienen dazu, gefährliche aktive Teile unzugänglich zu machen."},{"q":"Was kann eine Nachrüstung beeinflussen?","options":["Schutzkonzept der Kombination","Nur Briefkopf","Nie eine Normanforderung"],"c":0,"why":"Mechanische und elektrische Änderungen können Nachweise betreffen.\n\nBezug zum Unterrichtsteil «Nachweise haben unterschiedliche Ebenen»: Die Bauartprüfung beurteilt das Konzept der Kombination."},{"q":"Was prüft ein Stücknachweis?","options":["Die gefertigte konkrete Einheit","Nur das Entwicklungsmodell","Nur die Rechnung"],"c":0,"why":"Der Stücknachweis bezieht sich auf die hergestellte Kombination.\n\nBezug zum Unterrichtsteil «Nachweise haben unterschiedliche Ebenen»: Der Stücknachweis prüft die tatsächlich gefertigte Einheit."}],"refs":["SN EN IEC 61439-1:2021","8.4","8.5","10.5","11.4"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Eine gute Schaltgerätekombination trennt gefährliche Teile zuverlässig von Menschen und verbindet berührbare leitfähige Teile mit dem vorgesehenen Schutzsystem."},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Direkter und indirekter Schutz» und «Schutzleiterkontinuität ist eine Systemaufgabe». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Direkter und indirekter Schutz» und «Nachweise haben unterschiedliche Ebenen». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Eine Nachrüstkomponente verändert die mechanische Schutzabdeckung des Verteilers."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Ist ein Schutzleiteranschluss allein ein vollständiger Schutz-Nachweis?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/N-V04.svg"},{"id":"N-V05","year":4,"title":"Kurzschlussbeanspruchung: Warum 16 A nicht die ganze Wahrheit ist","goals":["Im Normalbetrieb führt ein Abgang vielleicht 16 A. Bei einem Fehler können kurzfristig wesentlich höhere Ströme auftreten. Das betrifft Schutzorgane, Sammelschienen, Halterungen und Anschlüsse.","Eine Verteilung wird an einen stärkeren Transformator angeschlossen, ohne die Verteilung zu verändern."],"parts":[{"heading":"Thermische und dynamische Wirkung unterscheiden","text":"Ein hoher Fehlerstrom erhitzt Leiter in kurzer Zeit und erzeugt starke elektrodynamische Kräfte. Diese können Bauteile verformen oder Verbindungen lösen. Ein Schutzschalter mit geeignetem Ausschaltvermögen macht nicht automatisch jedes dahinterliegende Sammelschienensystem kurzschlussfest.","formula":""},{"heading":"Netzseitige Fehlerstromdaten benötigt man vor der Auslegung","text":"Die zu erwartenden Kurzschlussströme sind abhängig von Trafo, Netzimpedanz, Leitungswegen und weiteren Quellen. Ob eine Strombegrenzung oder ein bedingter Kurzschlussbemessungswert genutzt werden darf, ist im jeweiligen Konzept nachzuweisen.","formula":""},{"heading":"Bauartnachweise richtig lesen","text":"Die 61439-1 behandelt den Nachweis der Kurzschlussfestigkeit. Für konkrete Schaltgerätekombinationen können Nachweiswege und Bedingungen differieren; entscheidend ist der dokumentierte zulässige Aufbau. Komponenten dürfen nicht beliebig durch andere Fabrikate ersetzt werden.","formula":""}],"bridgeTitle":"Spezifische Fallstudie auf Grundlage der genannten Normausgabe; normativer Einzelabgleich ausstehend.","bridge":"Im Normalbetrieb führt ein Abgang vielleicht 16 A. Bei einem Fehler können kurzfristig wesentlich höhere Ströme auftreten. Das betrifft Schutzorgane, Sammelschienen, Halterungen und Anschlüsse.","exercise":"Eine Verteilung wird an einen stärkeren Transformator angeschlossen, ohne die Verteilung zu verändern.","solution":"Die Kurzschlussdaten am Anschlusspunkt können steigen. Die Kombination und ihre Schutzgeräte müssen gegen die neue Beanspruchung erneut beurteilt werden, auch wenn der normale Betriebsstrom gleich bleibt.","quiz":[{"q":"Ist Betriebsstrom gleich Kurzschlussstrom?","options":["Nein","Ja","Nur bei 50 Hz"],"c":0,"why":"Kurzschlussströme können deutlich höher sein."},{"q":"Was beeinflusst den Kurzschlussstrom am Verteiler?","options":["Netzimpedanz","Gehäusefarbe","Bürotemperatur allein"],"c":0,"why":"Netz- und Leitungsimpedanzen sind massgebend."},{"q":"Was ist bei stärkerem Trafo zu prüfen?","options":["Kurzschlussfestigkeit erneut","Nur Etikett tauschen","Nur Stromrechnung"],"c":0,"why":"Geänderte Netzbedingungen können die Kurzschlussbeanspruchung verändern.\n\nBezug zum Unterrichtsteil «Bauartnachweise richtig lesen»: Die 61439-1 behandelt den Nachweis der Kurzschlussfestigkeit."}],"refs":["SN EN IEC 61439-1:2021","9.3","10.11"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Im Normalbetrieb führt ein Abgang vielleicht 16 A. Bei einem Fehler können kurzfristig wesentlich höhere Ströme auftreten. Das betrifft Schutzorgane, Sammelschienen, Halterungen und Anschlüsse."},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Thermische und dynamische Wirkung unterscheiden» und «Netzseitige Fehlerstromdaten benötigt man vor der Auslegung». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Thermische und dynamische Wirkung unterscheiden» und «Bauartnachweise richtig lesen». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Eine Verteilung wird an einen stärkeren Transformator angeschlossen, ohne die Verteilung zu verändern."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Ist Betriebsstrom gleich Kurzschlussstrom?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/N-V05.svg"},{"id":"N-V06","year":4,"title":"Bauartnachweis und Stücknachweis sauber trennen","goals":["Dies ist eine der zentralsten Unterscheidungen in der Ausbildung. Der Bauartnachweis beantwortet: „Ist diese Konstruktion bei den vorgesehenen Bedingungen grundsätzlich geeignet?“ Der Stücknachweis beantwortet: „Wurde dieses konkrete Exemplar korrekt hergestellt?“","Ein Verteilerbauer besitzt einen Bauartnachweis für eine bestimmte Komponentenfamilie, setzt aber ungeprüft andere Hauptschalter ein."],"parts":[{"heading":"Bauartnachweis am System","text":"Er umfasst unter anderem Schutz gegen elektrischen Schlag, mechanische Anforderungen, Isolation, Erwärmung und Kurzschlussfestigkeit. Der ursprüngliche Hersteller ist für die entsprechenden Bauarteigenschaften verantwortlich. Je nach Anforderung sind definierte Prüf-, Berechnungs- oder Vergleichsverfahren möglich.","formula":""},{"heading":"Stücknachweis an jedem gefertigten Exemplar","text":"Er kontrolliert beispielsweise Kennzeichnung, Schutz, Verdrahtung, elektrische Isolationsverhältnisse und Funktion entsprechend den zutreffenden Vorgaben. Ein einmaliger Bauartnachweis ersetzt den erforderlichen Nachweis für eine abweichende oder neu gebaute Einheit nicht.","formula":""},{"heading":"Änderungen können Rollen und Nachweise verschieben","text":"Wenn der Zusammenbauer wesentliche konstruktive Abweichungen vom nachgewiesenen System vornimmt, muss die Verantwortlichkeit und der erforderliche Nachweisumfang neu beurteilt werden. Das ist insbesondere bei Herstellerwechseln von Komponenten, Sammelschienen-Umbauten und anderen thermisch relevanten Änderungen wichtig.","formula":""}],"bridgeTitle":"Spezifische Fallstudie auf Grundlage der genannten Normausgabe; normativer Einzelabgleich ausstehend.","bridge":"Dies ist eine der zentralsten Unterscheidungen in der Ausbildung. Der Bauartnachweis beantwortet: „Ist diese Konstruktion bei den vorgesehenen Bedingungen grundsätzlich geeignet?“ Der Stücknachweis beantwortet: „Wurde dieses konkrete Exemplar korrekt hergestellt?“","exercise":"Ein Verteilerbauer besitzt einen Bauartnachweis für eine bestimmte Komponentenfamilie, setzt aber ungeprüft andere Hauptschalter ein.","solution":"Die neue Konfiguration ist nicht automatisch vom alten Bauartnachweis gedeckt. Änderungen sind gegen die Bedingungen des Ursprungssystems zu prüfen und erforderliche neue Nachweise zu dokumentieren.","quiz":[{"q":"Worauf bezieht sich der Bauartnachweis?","options":["Konstruktionssystem","Einzelner Lieferschein","Nur Abrechnung"],"c":0,"why":"Er prüft die definierte Bauart.\n\nBezug zum Unterrichtsteil «Bauartnachweis am System»: Je nach Anforderung sind definierte Prüf-, Berechnungs- oder Vergleichsverfahren möglich."},{"q":"Was prüft der Stücknachweis?","options":["Das tatsächlich gefertigte Exemplar","Nur die Theorie","Nur die elektrische Netzqualität"],"c":0,"why":"Jede gebaute Kombination ist zu prüfen.\n\nBezug zum Unterrichtsteil «Stücknachweis an jedem gefertigten Exemplar»: Ein einmaliger Bauartnachweis ersetzt den erforderlichen Nachweis für eine abweichende oder neu gebaute Einheit nicht."},{"q":"Kann der Austausch eines zentralen Geräts Nachweise beeinflussen?","options":["Ja","Nie","Nur die Verpackung"],"c":0,"why":"Bauartnachweise gelten nicht automatisch für beliebige Abweichungen.\n\nBezug zum Unterrichtsteil «Änderungen können Rollen und Nachweise verschieben»: Wenn der Zusammenbauer wesentliche konstruktive Abweichungen vom nachgewiesenen System vornimmt, muss die Verantwortlichkeit und der erforderliche Nachweisumfang neu beurteilt werden."}],"refs":["SN EN IEC 61439-1:2021","10","11"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Dies ist eine der zentralsten Unterscheidungen in der Ausbildung. Der Bauartnachweis beantwortet: „Ist diese Konstruktion bei den vorgesehenen Bedingungen grundsätzlich geeignet?“ Der Stücknachweis beantwortet: „Wurde dieses konkrete Exemplar korrekt hergestellt?“"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Bauartnachweis am System» und «Stücknachweis an jedem gefertigten Exemplar». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Bauartnachweis am System» und «Änderungen können Rollen und Nachweise verschieben». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Ein Verteilerbauer besitzt einen Bauartnachweis für eine bestimmte Komponentenfamilie, setzt aber ungeprüft andere Hauptschalter ein."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Worauf bezieht sich der Bauartnachweis?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/N-V06.svg"},{"id":"N-V07","year":4,"title":"Energieverteiler: Bedienung, Unterteilung und Wartbarkeit","goals":["In industriellen Energieverteilern ist nicht nur der elektrische Betrieb wichtig. Es muss auch geklärt sein, wie einzelne Stromkreise identifiziert, abgeschaltet, geprüft und gewartet werden können.","Ein Abgang muss gewartet werden; die übrigen sollen weiterlaufen. Der Verteiler besitzt jedoch keine dokumentierte Unterteilung."],"parts":[{"heading":"Innere Unterteilung ist eine funktionale Entscheidung","text":"Trennwände und funktionale Unterteilungen können Schutzziele unterstützen und Wartung erleichtern. Das bedeutet nicht, dass jede scheinbar abgetrennte Kammer ohne Spannung betreten werden darf. Die vorgesehene Betriebs- und Schutzart bleibt entscheidend.","formula":""},{"heading":"Anschlussräume und Leitungswege planen","text":"Dichte Kabelführung, enge Biegeradien und schwer erreichbare Anschlussstellen verschlechtern Montage und spätere Wartung. Die Schaltgerätekombination ist für den tatsächlichen Anwendungsfall mit den Ein- und Ausführungen zu projektieren.","formula":""},{"heading":"Nachweis und Bedienkonzept zusammen betrachten","text":"Eine technisch normierte Kombination benötigt weiterhin ein verständliches Einlinienschema, Kennzeichnungen, Wartungsinformationen und klare Schalt-/Trennstellen. Besonders wichtig ist die sichere Übernahme in die betriebliche Organisation nach EN 50110.","formula":""}],"bridgeTitle":"Spezifische Fallstudie auf Grundlage der genannten Normausgabe; normativer Einzelabgleich ausstehend.","bridge":"In industriellen Energieverteilern ist nicht nur der elektrische Betrieb wichtig. Es muss auch geklärt sein, wie einzelne Stromkreise identifiziert, abgeschaltet, geprüft und gewartet werden können.","exercise":"Ein Abgang muss gewartet werden; die übrigen sollen weiterlaufen. Der Verteiler besitzt jedoch keine dokumentierte Unterteilung.","solution":"Keine Annahme „die anderen Fächer sind sicher“. Es ist die nachgewiesene Bauart und der elektrische Zustand massgebend; die Freigabe erfolgt über sichere Arbeitsverfahren und berechtigte Personen.","quiz":[{"q":"Bedeutet ein getrenntes Fach automatisch Spannungsfreiheit?","options":["Ja","Nein","Nur im Winter"],"c":1,"why":"Die Unterteilung ersetzt keine Freischaltung oder Spannungsprüfung.\n\nBezug zum Unterrichtsteil «Innere Unterteilung ist eine funktionale Entscheidung»: Das bedeutet nicht, dass jede scheinbar abgetrennte Kammer ohne Spannung betreten werden darf."},{"q":"Warum sind klare Stromlauf- und Einlinienschemata wichtig?","options":["Für sichere Betriebsführung","Nur für das Logo","Sie ändern die Frequenz"],"c":0,"why":"Schemata unterstützen Betrieb, Wartung und Fehlerdiagnose.\n\nBezug zum Unterrichtsteil «Nachweis und Bedienkonzept zusammen betrachten»: Besonders wichtig ist die sichere Übernahme in die betriebliche Organisation nach EN 50110."},{"q":"Welche Norm ergänzt Teil 1 für Energieverteiler?","options":["Teil 2","Teil 6 ausschliesslich","PV-Norm 62446-1"],"c":0,"why":"Teil 2 gilt für Energie-Schaltgerätekombinationen."}],"refs":["SN EN IEC 61439-2:2021","8.101","10","11"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: In industriellen Energieverteilern ist nicht nur der elektrische Betrieb wichtig. Es muss auch geklärt sein, wie einzelne Stromkreise identifiziert, abgeschaltet, geprüft und gewartet werden können."},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Innere Unterteilung ist eine funktionale Entscheidung» und «Anschlussräume und Leitungswege planen». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Innere Unterteilung ist eine funktionale Entscheidung» und «Nachweis und Bedienkonzept zusammen betrachten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Ein Abgang muss gewartet werden; die übrigen sollen weiterlaufen. Der Verteiler besitzt jedoch keine dokumentierte Unterteilung."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Bedeutet ein getrenntes Fach automatisch Spannungsfreiheit?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/N-V07.svg"},{"id":"N-V08","year":3,"title":"Baustromverteiler: temporär bedeutet nicht ungefährlich","goals":["Ein Baustromverteiler wird oft mehrfach umgesetzt, Regen, Stossbelastung und Staub ausgesetzt und von wechselnden Personen bedient. Deshalb erfordert er ein passendes Gesamtkonzept.","Ein Baustromverteiler wurde mit einer beschädigten Steckdose aus der letzten Baustelle übernommen."],"parts":[{"heading":"Anwendungsteil erkennen","text":"Für speziell für Baustellen konzipierte Kombinationen enthält Teil 4 zusätzliche Anforderungen. Der Teil 1 bleibt als gemeinsame Grundlage relevant. Ob eine Einheit ein Bauverteiler ist, hängt vom Zweck und der Konstruktion ab, nicht nur von einem mobilen Gehäuse.","formula":""},{"heading":"Umwelt und Nutzung realistisch bewerten","text":"Transport, wiederholtes Verbinden, Bodenfeuchte, Stösse, Temperatur und unkontrollierte Benutzer können eine Einheit wesentlich stärker beanspruchen als ein ortsfester Innenverteiler. Schutzart, Verbindungstechnik, Kennzeichnung und Schutzkonzept müssen dafür vorgesehen sein.","formula":""},{"heading":"Prüfung im Lebenszyklus","text":"Auch eine ursprünglich korrekte Einheit kann durch mechanische Beschädigung, defekte Steckvorrichtungen oder fehlerhafte Reparaturen unsicher werden. Wiederkehrende Sicht- und Funktionskontrollen sowie die örtlichen Regeln sind ein fester Bestandteil des sicheren Betriebs.","formula":""}],"bridgeTitle":"Spezifische Fallstudie auf Grundlage der genannten Normausgabe; normativer Einzelabgleich ausstehend.","bridge":"Ein Baustromverteiler wird oft mehrfach umgesetzt, Regen, Stossbelastung und Staub ausgesetzt und von wechselnden Personen bedient. Deshalb erfordert er ein passendes Gesamtkonzept.","exercise":"Ein Baustromverteiler wurde mit einer beschädigten Steckdose aus der letzten Baustelle übernommen.","solution":"Nicht betreiben; fachkundige Prüfung und Instandsetzung veranlassen. Die Norm- und Betriebsvorgaben gelten unabhängig von der geplanten kurzen Einsatzdauer.","quiz":[{"q":"Was ist an Baustrom besonders?","options":["Wechselnde und raue Einsatzbedingungen","Keine elektrischen Gefahren","Nur Gleichstrom"],"c":0,"why":"Temporäre Baustellen setzen Geräte hoher Beanspruchung aus."},{"q":"Ist ein beschädigter Steckdoseneinsatz akzeptabel, wenn er nur kurz genutzt wird?","options":["Ja","Nein","Bei trockenem Wetter"],"c":1,"why":"Beschädigte elektrische Ausrüstung darf nicht unkritisch betrieben werden."},{"q":"Welcher Anwendungsteil behandelt Baustromverteiler?","options":["61439-4","61439-2 ausschliesslich","62446-1"],"c":0,"why":"Teil 4 enthält besondere Anforderungen für Baustromverteiler.\n\nBezug zum Unterrichtsteil «Anwendungsteil erkennen»: Für speziell für Baustellen konzipierte Kombinationen enthält Teil 4 zusätzliche Anforderungen."}],"refs":["SN EN 61439-4:2013","1","5","8","9","10"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Ein Baustromverteiler wird oft mehrfach umgesetzt, Regen, Stossbelastung und Staub ausgesetzt und von wechselnden Personen bedient. Deshalb erfordert er ein passendes Gesamtkonzept."},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Anwendungsteil erkennen» und «Umwelt und Nutzung realistisch bewerten». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Anwendungsteil erkennen» und «Prüfung im Lebenszyklus». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Ein Baustromverteiler wurde mit einer beschädigten Steckdose aus der letzten Baustelle übernommen."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Was ist an Baustrom besonders?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/N-V08.svg"},{"id":"N-E01","year":2,"title":"Erdung, Schutzpotentialausgleich und Blitzschutz unterscheiden","goals":["Die Wörter Erdung und Potentialausgleich werden oft synonym verwendet. Technisch haben sie unterschiedliche Aufgaben. Ein guter Elektroinstallateur muss verstehen, welche Verbindungen welchem Schutzkonzept dienen.","Im Neubau ist eine Fundamenterder-Verbindung geplant, aber die Abdichtung des Gebäudes wird später geändert."],"parts":[{"heading":"Erdungsanlage","text":"Der Erder stellt die elektrische Verbindung zum Erdreich her. Seine Wirkung hängt von Ausführung, Boden und System ab. Bei einem Fundamenterder können leitende Bauteile der Fundamentkonstruktion genutzt werden, sofern die Bauweise geeignet und die normativen Bedingungen erfüllt sind.","formula":""},{"heading":"Schutzpotentialausgleich","text":"Der Potentialausgleich verbindet relevante leitfähige Teile, um gefährliche Potentialdifferenzen zu vermindern. Das ist nicht dasselbe wie die Vorstellung, Strom verschwinde einfach „in der Erde“. Die konkrete Schutzwirkung ergibt sich aus dem gesamten Netz- und Fehlerschutzsystem.","formula":""},{"heading":"Blitzschutz als eigenes System","text":"Ein Blitzschutzsystem führt hohe Impulsströme und muss damit zurechtkommen. Seine äusseren Teile, innerer Potentialausgleich und Überspannungsschutz werden als System geplant. Das einfache Vorhandensein eines Erders beweist noch keinen vollständigen Blitzschutz.","formula":""}],"bridgeTitle":"Spezifische Fallstudie auf Grundlage der genannten Normausgabe; normativer Einzelabgleich ausstehend.","bridge":"Die Wörter Erdung und Potentialausgleich werden oft synonym verwendet. Technisch haben sie unterschiedliche Aufgaben. Ein guter Elektroinstallateur muss verstehen, welche Verbindungen welchem Schutzkonzept dienen.","exercise":"Im Neubau ist eine Fundamenterder-Verbindung geplant, aber die Abdichtung des Gebäudes wird später geändert.","solution":"Die Erderplanung muss mit dem Bau- und Abdichtungskonzept neu abgeglichen werden. Fundamentisolierung kann den Kontakt zum Erdreich verändern; die Lösung darf nicht unkoordiniert auf der Baustelle improvisiert werden.","quiz":[{"q":"Ist Schutzpotentialausgleich exakt dasselbe wie Erdung?","options":["Nein","Ja","Nur bei PV"],"c":0,"why":"Erdung und Potentialausgleich erfüllen unterschiedliche, kombinierte Funktionen.\n\nBezug zum Unterrichtsteil «Schutzpotentialausgleich»: Der Potentialausgleich verbindet relevante leitfähige Teile, um gefährliche Potentialdifferenzen zu vermindern."},{"q":"Gibt es vollständigen Blitzschutz allein durch irgendeinen Erder?","options":["Ja","Nein","Nur bei Fundamentbeton"],"c":1,"why":"Blitzschutz besteht aus mehreren abgestimmten Teilen.\n\nBezug zum Unterrichtsteil «Blitzschutz als eigenes System»: Das einfache Vorhandensein eines Erders beweist noch keinen vollständigen Blitzschutz."},{"q":"Warum spielt Gebäudeabdichtung bei Erdern eine Rolle?","options":["Sie kann den Erdkontakt verändern","Sie macht Stromfrequenz kleiner","Sie ist immer irrelevant"],"c":0,"why":"Isolierende Bauweisen beeinflussen die Wirkung des Fundamenterders."}],"refs":["SN 414113:2024-12 / SN 414022:2024","414113: 3–4","414022: 4, 8"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Die Wörter Erdung und Potentialausgleich werden oft synonym verwendet. Technisch haben sie unterschiedliche Aufgaben. Ein guter Elektroinstallateur muss verstehen, welche Verbindungen welchem Schutzkonzept dienen."},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Erdungsanlage» und «Schutzpotentialausgleich». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Erdungsanlage» und «Blitzschutz als eigenes System». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Im Neubau ist eine Fundamenterder-Verbindung geplant, aber die Abdichtung des Gebäudes wird später geändert."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Ist Schutzpotentialausgleich exakt dasselbe wie Erdung?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/N-E01.svg"},{"id":"N-E02","year":3,"title":"Fundamenterder planen: Neubau, weisse Wanne, isolierte Fundamente","goals":["Bei einem Fundamenterder entscheidet sich die Qualität häufig schon lange, bevor der Elektroinstallateur seinen letzten Anschluss setzt: beim Fundamentaufbau und beim Zusammenspiel mit Armierung und Abdichtung.","Der Architekt plant nachträglich eine durchgehende Perimeterdämmung und Abdichtung. Das ursprüngliche Erdungskonzept sah nur die Fundamentarmierung vor."],"parts":[{"heading":"Der Baukörper ist Teil des Systems","text":"Fundamentform, vorhandene Armierung, Kontakt zum Erdreich, Betonqualität, Korrosionsbedingungen und Verbindungen werden früh betrachtet. Bei geeignetem Fundamentaufbau kann eine leitfähige, dauerhaft verbundene Erdungsstruktur entstehen.","formula":""},{"heading":"Isolierte Fundamente und weisse Wanne","text":"Eine dichte oder elektrisch isolierende Bauweise kann die erdende Funktion der eingebauten Armierung einschränken. Die Norm behandelt hierfür besondere Ausführungen beziehungsweise alternative Erderelektroden. Das ist ein Planungsentscheid, kein Grund, die Armierung wahllos überbrücken zu dürfen.","formula":""},{"heading":"Anschlussstellen und Dokumentation","text":"Die künftige Hauptanschlussstelle muss zugänglich und nachvollziehbar sein. Verbindungen über Gebäudefugen sowie Übergänge zu anderen metallischen Systemen müssen fachgerecht projektiert werden. Fotos vor dem Betonieren, Zeichnungen und Prüf-/Abnahmeunterlagen erleichtern später die Kontrolle.","formula":""}],"bridgeTitle":"Spezifische Fallstudie auf Grundlage der genannten Normausgabe; normativer Einzelabgleich ausstehend.","bridge":"Bei einem Fundamenterder entscheidet sich die Qualität häufig schon lange, bevor der Elektroinstallateur seinen letzten Anschluss setzt: beim Fundamentaufbau und beim Zusammenspiel mit Armierung und Abdichtung.","exercise":"Der Architekt plant nachträglich eine durchgehende Perimeterdämmung und Abdichtung. Das ursprüngliche Erdungskonzept sah nur die Fundamentarmierung vor.","solution":"Eine gemeinsame Planungsprüfung von Elektrofachperson und Bauplanung ist notwendig. Nach der Norm sind bei isolierten Fundamenten entsprechende Erderlösungen und deren Dokumentation zu berücksichtigen.","quiz":[{"q":"Kann eine vollständig isolierte Fundamentkonstruktion die Erdung beeinflussen?","options":["Ja","Nein","Nur im Sommer"],"c":0,"why":"Der elektrische Kontakt zum Erdreich kann verändert sein.\n\nBezug zum Unterrichtsteil «Der Baukörper ist Teil des Systems»: Fundamentform, vorhandene Armierung, Kontakt zum Erdreich, Betonqualität, Korrosionsbedingungen und Verbindungen werden früh betrachtet."},{"q":"Wann sind Erderdetails besonders kostengünstig zu klären?","options":["Vor Betonage","Nach dem Innenausbau","Erst beim Stromausfall"],"c":0,"why":"Späte Korrekturen sind schwierig."},{"q":"Wofür sind Fotos vor Betonage wichtig?","options":["Nachvollziehbare Dokumentation","Nur Marketing","Für Dachneigung"],"c":0,"why":"Verdeckte Verbindungen sind später nicht mehr sichtbar.\n\nBezug zum Unterrichtsteil «Anschlussstellen und Dokumentation»: Fotos vor dem Betonieren, Zeichnungen und Prüf-/Abnahmeunterlagen erleichtern später die Kontrolle."}],"refs":["SN 414113:2024-12","4","5","6.1–6.7","7","8"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Bei einem Fundamenterder entscheidet sich die Qualität häufig schon lange, bevor der Elektroinstallateur seinen letzten Anschluss setzt: beim Fundamentaufbau und beim Zusammenspiel mit Armierung und Abdichtung."},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Der Baukörper ist Teil des Systems» und «Isolierte Fundamente und weisse Wanne». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Der Baukörper ist Teil des Systems» und «Anschlussstellen und Dokumentation». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Der Architekt plant nachträglich eine durchgehende Perimeterdämmung und Abdichtung. Das ursprüngliche Erdungskonzept sah nur die Fundamentarmierung vor."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Kann eine vollständig isolierte Fundamentkonstruktion die Erdung beeinflussen?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/N-E02.svg"},{"id":"N-E03","year":3,"title":"Korrosion, Verbindungsqualität und Erder-Abnahme","goals":["Erdungsanlagen müssen über Jahrzehnte funktionieren, obwohl Teile später nicht mehr zugänglich sind. Dauerhaftigkeit und Qualität der Verbindungen sind deshalb genauso wichtig wie die reine Leitfähigkeit zum Zeitpunkt der Montage.","Nach einem Neubau fehlen Fotos, Armierungspläne und die Dokumentation der Erdanschlüsse."],"parts":[{"heading":"Korrosion als schleichender Ausfall","text":"Ungeeignete Materialpaarungen und Feuchtigkeit können Verbindungen langfristig verschlechtern. Die Auswahl muss zum Erdreich, Beton, zur Verbindungstechnik und zu benachbarten Metallen passen. Ein blankes Metallstück ist noch kein Nachweis der Eignung.","formula":""},{"heading":"Kontrollpunkte bewusst planen","text":"Verdeckte Bauleistungen sind früh abnahmefähig zu machen. Pläne, Fotos, verwendete Werkstoffe, Verbindungsmethoden und Anschlusspunkte gehören in eine nachvollziehbare Dokumentation. Wenn erst nach dem Betonieren ein Fehler erkannt wird, ist seine Behebung oftmals aufwendig.","formula":""},{"headi
