","ZEV, Eigenverbrauch, Zähler-/Messkonzepte"],"parts":[{"heading":"Dein Dozent erklärt: Netzanmeldung, Bauverfahren und Messkonzept","text":"Heute geht es um netzanmeldung, bauverfahren und messkonzept. PV-Projekte können baurechtliche, elektrische und netztechnische Verfahren auslösen. Baugesuch oder Meldung, technische Anschlussanfrage, Installationsanzeige, Zählerkonzept und Inbetriebsetzungsunterlagen sind nicht dasselbe. Welche Schritte erforderlich sind, hängt von Anlagengrösse, Netzbetreiber, Gebäude und geltender Regulierung ab. Ein sauberer Prozess legt die Zuständigkeiten früh fest. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Verwende Deine eigenen PV-Projekte von 2025 und 2026 als anonymisierte Fallstudien. Trenne in einer Zeitleiste das baurechtliche Verfahren, die elektrische Installationsanzeige, die technische Abnahme und die Netzintegration. Ergänze zu jedem Schritt die verantwortliche Partei und den Nachweis. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Eine Baubewilligung ersetzt keine elektrotechnische Installationsbewilligung. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Melde-/Bewilligungsverfahren, Netzbetreiber TAB/Werkvorschriften; ZEV, Eigenverbrauch, Zähler-/Messkonzepte. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIV Art. 14, 23/24; NIN 7.12; ESTI 220; Swissolar. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"PV-Projekt umfasst Technik und Verfahren","bridge":"Planung, baurechtliche Abklärung, Anschlussgesuch, Messkonzept, Installation, Prüfung und Übergabe sind voneinander zu unterscheidende Schritte. Die Bewilligungslage hängt von der Tätigkeit ab. Auch die Dokumentation zu Kennzeichnung und Erstprüfung erfordert eine fachlich richtige und aktuelle Grundlage.","exercise":"Vorhandene private PV-Projekte als Planungs-Fallstudien anonymisieren; keine nachträglichen Eingriffe. Halte zusätzlich die Antwort auf die Frage «Welche Dokumente haben unterschiedliche Zwecke?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Entwirf eine Prozessgrafik einer PV-Anlage von der Idee bis zur Übergabe und kennzeichne die Punkte, die eine berechtigte Fachperson bestätigen muss.","solution":"Eine Baubewilligung ersetzt keine elektrotechnische Installationsbewilligung. Der Merksatz lautet: Eine Baubewilligung ersetzt keine elektrotechnische Installationsbewilligung. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Welche Dokumente haben unterschiedliche Zwecke?","options":["Beide sind immer dasselbe","Baurechtliche Zustimmung und elektrische Installationsanzeige","Nur der Kaufvertrag des Wechselrichters"],"c":1,"why":"Eine Baubewilligung ersetzt keine elektrotechnische Installationsbewilligung.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Eine Baubewilligung ersetzt keine elektrotechnische Installationsbewilligung."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Nur der Kaufvertrag des Wechselrichters","Eine Baubewilligung ersetzt keine elektrotechnische Installationsbewilligung.","Beide sind immer dasselbe"],"c":1,"why":"Der Merksatz lautet: Eine Baubewilligung ersetzt keine elektrotechnische Installationsbewilligung.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Eine Baubewilligung ersetzt keine elektrotechnische Installationsbewilligung."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["5.2.8a–c; 4.3.1b–4.3.7b","Norm-/Regelwerk: NIV Art. 14, 23/24; NIN 7.12; ESTI 220; Swissolar","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Melde-/Bewilligungsverfahren, Netzbetreiber TAB/Werkvorschriften"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Netzanmeldung, Bauverfahren und Messkonzept» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Netzanmeldung, Bauverfahren und Messkonzept» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Vorhandene private PV-Projekte als Planungs-Fallstudien anonymisieren; keine nachträglichen Eingriffe. Halte zusätzlich die Antwort auf die Frage «Welche Dokumente haben unterschiedliche Zwecke?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Entwirf eine Prozessgrafik einer PV-Anlage von der Idee bis zur Übergabe und kennzeichne die Punkte, die eine berechtigte Fachperson bestätigen muss."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Welche Dokumente haben unterschiedliche Zwecke?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/3.08-B.svg"},{"id":"3.08-C","year":3,"title":"PV-Prüfprotokoll, Dachschutz und Übergabe","goals":["PV-Mess- und Prüfprotokoll, unabhängige Abnahme","Dach- und Absturzsicherung, Brandschutz, Blitz-/Überspannungsschutz"],"parts":[{"heading":"Dein Dozent erklärt: PV-Prüfprotokoll, Dachschutz und Übergabe","text":"Heute geht es um pv-prüfprotokoll, dachschutz und übergabe. Eine PV-Anlage muss nicht nur elektrisch, sondern auch mechanisch und organisatorisch sicher geplant sein. Arbeiten auf Dächern erfordern Absturzschutz, geeignete Zugänge und Witterungsbeurteilung. Für die elektrische Anlage sind die vorgesehenen Prüfungen, Kennzeichnungen und Unterlagen wichtig; eine unabhängige Abnahme kann rechtlich erforderlich sein. Die konkrete Pflicht ergibt sich aus ESTI-Vorgaben und NIV. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Erstelle einen Übergabeordner für eine hypothetische PV-Anlage: Lageplan, Stringplan, Geräteblätter, Netzbetreiberunterlagen, Prüf- und Abnahmeberichte, Wartungshinweise und Dach-Sicherheitskonzept. Prüfe nur Vollständigkeit, ohne selbst eine Anlage zu kontrollieren. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: PV-Projektabschluss umfasst mehr als die Anzeige «Wechselrichter läuft». Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: PV-Mess- und Prüfprotokoll, unabhängige Abnahme; Dach- und Absturzsicherung, Brandschutz, Blitz-/Überspannungsschutz. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIV Art. 14, 23/24; NIN 7.12; ESTI 220; Swissolar. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"PV-Projekt umfasst Technik und Verfahren","bridge":"Planung, baurechtliche Abklärung, Anschlussgesuch, Messkonzept, Installation, Prüfung und Übergabe sind voneinander zu unterscheidende Schritte. Die Bewilligungslage hängt von der Tätigkeit ab. Auch die Dokumentation zu Kennzeichnung und Erstprüfung erfordert eine fachlich richtige und aktuelle Grundlage.","exercise":"Vorhandene private PV-Projekte als Planungs-Fallstudien anonymisieren; keine nachträglichen Eingriffe. Halte zusätzlich die Antwort auf die Frage «Was gehört zu einer fachgerechten PV-Übergabe?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Entwirf eine Prozessgrafik einer PV-Anlage von der Idee bis zur Übergabe und kennzeichne die Punkte, die eine berechtigte Fachperson bestätigen muss.","solution":"PV-Projektabschluss umfasst mehr als die Anzeige «Wechselrichter läuft». Der Merksatz lautet: PV-Projektabschluss umfasst mehr als die Anzeige «Wechselrichter läuft». Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was gehört zu einer fachgerechten PV-Übergabe?","options":["Nur die Stromrechnung","Nur ein Foto der Module","Pläne, technische Nachweise, Prüfunterlagen und Instruktionen"],"c":2,"why":"PV-Projektabschluss umfasst mehr als die Anzeige «Wechselrichter läuft».\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: PV-Projektabschluss umfasst mehr als die Anzeige «Wechselrichter läuft»."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Nur die Stromrechnung","PV-Projektabschluss umfasst mehr als die Anzeige «Wechselrichter läuft».","Nur ein Foto der Module"],"c":1,"why":"Der Merksatz lautet: PV-Projektabschluss umfasst mehr als die Anzeige «Wechselrichter läuft».\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: PV-Projektabschluss umfasst mehr als die Anzeige «Wechselrichter läuft»."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["5.2.8a–c; 4.3.1b–4.3.7b","Norm-/Regelwerk: NIV Art. 14, 23/24; NIN 7.12; ESTI 220; Swissolar","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: PV-Mess- und Prüfprotokoll, unabhängige Abnahme"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: PV-Prüfprotokoll, Dachschutz und Übergabe» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: PV-Prüfprotokoll, Dachschutz und Übergabe» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Vorhandene private PV-Projekte als Planungs-Fallstudien anonymisieren; keine nachträglichen Eingriffe. Halte zusätzlich die Antwort auf die Frage «Was gehört zu einer fachgerechten PV-Übergabe?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Entwirf eine Prozessgrafik einer PV-Anlage von der Idee bis zur Übergabe und kennzeichne die Punkte, die eine berechtigte Fachperson bestätigen muss."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Was gehört zu einer fachgerechten PV-Übergabe?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/3.08-C.svg"},{"id":"3.09-A","year":3,"title":"Bäder, Schutzbereiche und besondere Räume","goals":["Bade-/Duschräume und Schutzbereiche","Ausseninstallation, Feuchte, Landwirtschaft, Baustellen"],"parts":[{"heading":"Dein Dozent erklärt: Bäder, Schutzbereiche und besondere Räume","text":"Heute geht es um bäder, schutzbereiche und besondere räume. In Bereichen mit erhöhtem Berührungs- oder Feuchterisiko gelten zusätzliche Anforderungen an Auswahl und Anordnung elektrischer Betriebsmittel. Für Bade- und Duschräume definiert die NIN besondere Bereiche und Schutzbedingungen. Deren genaue Abmessungen, zulässige Betriebsmittel und Ausnahmen müssen aus der gültigen Originalnorm entnommen werden, nicht aus einer vereinfachten Erinnerung. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Zeichne ein fiktives Badezimmer mit Dusche, Wanne und Waschbecken. Kennzeichne die Stellen, zu denen Du die NIN-Bereichsdefinition nachschlagen musst. Bewerte keine realen Steckdosenpositionen nur anhand grober Skizzen ohne aktuelle Normenprüfung. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Bei besonderen Räumen sind die genauen Definitionen entscheidend. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Bade-/Duschräume und Schutzbereiche; Ausseninstallation, Feuchte, Landwirtschaft, Baustellen. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIN Teil 7 (besondere Anlagen/Räume); Teil 4/5. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Besondere Umgebungen verändern Randbedingungen","bridge":"Feuchte, leitfähige Umgebung, temporäre Installationen, Brandgefährdung und äussere Einflüsse verändern Schutzbedarf und Materialauswahl. Eine gewohnte Lösung aus einem Wohnraum kann deshalb nicht einfach auf ein Bad, eine Baustelle oder einen landwirtschaftlichen Betrieb übertragen werden. Konkrete Zonen und Zahlenwerte müssen in der gültigen NIN überprüft werden.","exercise":"Normstellen anhand fiktiver Räume identifizieren; Planprüfung ohne Montage. Halte zusätzlich die Antwort auf die Frage «Wo findest Du die besonderen Anforderungen an Badezimmer?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Vergleiche zwei fiktive Betriebsstätten und erstelle eine Liste von Umgebungsbedingungen, die für die Fachbeurteilung wichtig sind.","solution":"Bei besonderen Räumen sind die genauen Definitionen entscheidend. Der Merksatz lautet: Bei besonderen Räumen sind die genauen Definitionen entscheidend. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Wo findest Du die besonderen Anforderungen an Badezimmer?","options":["Nur im Raumprospekt","In den einschlägigen Teilen der NIN für besondere Räume","Ausschliesslich im Mietvertrag"],"c":1,"why":"Bei besonderen Räumen sind die genauen Definitionen entscheidend.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Bei besonderen Räumen sind die genauen Definitionen entscheidend."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Ausschliesslich im Mietvertrag","Bei besonderen Räumen sind die genauen Definitionen entscheidend.","Nur im Raumprospekt"],"c":1,"why":"Der Merksatz lautet: Bei besonderen Räumen sind die genauen Definitionen entscheidend.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Bei besonderen Räumen sind die genauen Definitionen entscheidend."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["4.3.4b–4.3.7b; 5.1.8b","Norm-/Regelwerk: NIN Teil 7 (besondere Anlagen/Räume); Teil 4/5","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Bade-/Duschräume und Schutzbereiche"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Bäder, Schutzbereiche und besondere Räume» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Bäder, Schutzbereiche und besondere Räume» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Normstellen anhand fiktiver Räume identifizieren; Planprüfung ohne Montage. Halte zusätzlich die Antwort auf die Frage «Wo findest Du die besonderen Anforderungen an Badezimmer?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Vergleiche zwei fiktive Betriebsstätten und erstelle eine Liste von Umgebungsbedingungen, die für die Fachbeurteilung wichtig sind."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Wo findest Du die besonderen Anforderungen an Badezimmer?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/3.09-A.svg"},{"id":"3.09-B","year":3,"title":"Aussenanlagen, Baustellen und Landwirtschaft","goals":["Stromversorgung in medizinisch genutzten Räumen (Überblick)","Brandschutz und Fluchtwege"],"parts":[{"heading":"Dein Dozent erklärt: Aussenanlagen, Baustellen und Landwirtschaft","text":"Heute geht es um aussenanlagen, baustellen und landwirtschaft. Aussenanlagen, temporäre Baustelleninstallationen und landwirtschaftliche Bereiche unterscheiden sich erheblich bei Feuchtigkeit, mechanischer Beanspruchung, Staub, Tieren und Nutzung. Geeignete Schutzarten und Schutzmassnahmen hängen von der tatsächlich erwartbaren Umgebung ab. Die NIN behandelt dazu besondere Anlagen und Betriebsstätten; pauschale Standardlösungen können unzulässig sein. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Vergleiche drei fiktive Einsatzorte: überdachter Balkon, Baustellencontainer und Stall. Erstelle für jeden eine Liste der Umwelteinflüsse und die erforderlichen normativen Recherchen. Notiere auch, welche zusätzlichen Fachstellen möglicherweise einzubeziehen sind. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: «Aussen» ist keine hinreichend präzise technische Umgebungsbeschreibung. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Stromversorgung in medizinisch genutzten Räumen (Überblick); Brandschutz und Fluchtwege. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIN Teil 7 (besondere Anlagen/Räume); Teil 4/5. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Besondere Umgebungen verändern Randbedingungen","bridge":"Feuchte, leitfähige Umgebung, temporäre Installationen, Brandgefährdung und äussere Einflüsse verändern Schutzbedarf und Materialauswahl. Eine gewohnte Lösung aus einem Wohnraum kann deshalb nicht einfach auf ein Bad, eine Baustelle oder einen landwirtschaftlichen Betrieb übertragen werden. Konkrete Zonen und Zahlenwerte müssen in der gültigen NIN überprüft werden.","exercise":"Normstellen anhand fiktiver Räume identifizieren; Planprüfung ohne Montage. Halte zusätzlich die Antwort auf die Frage «Welche Grösse spielt bei Aussenbetriebsmitteln eine besondere Rolle?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Vergleiche zwei fiktive Betriebsstätten und erstelle eine Liste von Umgebungsbedingungen, die für die Fachbeurteilung wichtig sind.","solution":"«Aussen» ist keine hinreichend präzise technische Umgebungsbeschreibung. Der Merksatz lautet: «Aussen» ist keine hinreichend präzise technische Umgebungsbeschreibung. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Welche Grösse spielt bei Aussenbetriebsmitteln eine besondere Rolle?","options":["Nur die Kabellänge","Nur die Innenraumtapete","Umwelteinflüsse wie Feuchtigkeit und UV"],"c":2,"why":"«Aussen» ist keine hinreichend präzise technische Umgebungsbeschreibung.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: «Aussen» ist keine hinreichend präzise technische Umgebungsbeschreibung."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Nur die Kabellänge","«Aussen» ist keine hinreichend präzise technische Umgebungsbeschreibung.","Nur die Innenraumtapete"],"c":1,"why":"Der Merksatz lautet: «Aussen» ist keine hinreichend präzise technische Umgebungsbeschreibung.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: «Aussen» ist keine hinreichend präzise technische Umgebungsbeschreibung."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Be ne Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/3.09-B.svg"},{"id":"3.09-C","year":3,"title":"Blitz-, Überspannungs- und Brandschutzkonzepte","goals":["Schutz gegen Überspannung und Blitzrisiko","Auswahl von Betriebsmitteln nach Umwelteinflüssen"],"parts":[{"heading":"Dein Dozent erklärt: Blitz-, Überspannungs- und Brandschutzkonzepte","text":"Heute geht es um blitz-, überspannungs- und brandschutzkonzepte. Blitzschutz und Überspannungsschutz haben unterschiedliche, aber zusammenhängende Funktionen. Eine Gebäudehülle mit äusserem Blitzschutz beeinflusst unter anderem die Koordination von Erdung, Potenzialausgleich und Überspannungsschutz. Daneben können Flucht- und Rettungswege besondere Anforderungen an Leitungsanlagen haben. Diese Themen erfordern eine integrale Fachplanung. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Prüfe für ein fiktives Mehrfamilienhaus, welche Grundlagen zu Gebäudehöhe, Blitzschutzkonzept, PV-Anlage und Brandabschnitten vorliegen. Stelle gezielte Fragen an die zuständigen Planungsfachpersonen. Bestimme keine Schutzgeräte oder Sicherheitsabstände ohne die relevanten Originalnormen. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Brandschutz, Blitzschutz und elektrische Sicherheit müssen abgestimmt sein. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Schutz gegen Überspannung und Blitzrisiko; Auswahl von Betriebsmitteln nach Umwelteinflüssen. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIN Teil 7 (besondere Anlagen/Räume); Teil 4/5. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Besondere Umgebungen verändern Randbedingungen","bridge":"Feuchte, leitfähige Umgebung, temporäre Installationen, Brandgefährdung und äussere Einflüsse verändern Schutzbedarf und Materialauswahl. Eine gewohnte Lösung aus einem Wohnraum kann deshalb nicht einfach auf ein Bad, eine Baustelle oder einen landwirtschaftlichen Betrieb übertragen werden. Konkrete Zonen und Zahlenwerte müssen in der gültigen NIN überprüft werden.","exercise":"Normstellen anhand fiktiver Räume identifizieren; Planprüfung ohne Montage. Halte zusätzlich die Antwort auf die Frage «Was ist bei einer PV-Anlage auf einem Gebäude mit Blitzschutz wichtig?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Vergleiche zwei fiktive Betriebsstätten und erstelle eine Liste von Umgebungsbedingungen, die für die Fachbeurteilung wichtig sind.","solution":"Brandschutz, Blitzschutz und elektrische Sicherheit müssen abgestimmt sein. Der Merksatz lautet: Brandschutz, Blitzschutz und elektrische Sicherheit müssen abgestimmt sein. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was ist bei einer PV-Anlage auf einem Gebäude mit Blitzschutz wichtig?","options":["Koordination des gesamten Schutz- und Erdungskonzepts","Nur eine neue Modulfarbe","Ignorieren bestehender Blitzschutzteile"],"c":0,"why":"Brandschutz, Blitzschutz und elektrische Sicherheit müssen abgestimmt sein.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Brandschutz, Blitzschutz und elektrische Sicherheit müssen abgestimmt sein."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Nur eine neue Modulfarbe","Brandschutz, Blitzschutz und elektrische Sicherheit müssen abgestimmt sein.","Ignorieren bestehender Blitzschutzteile"],"c":1,"why":"Der Merksatz lautet: Brandschutz, Blitzschutz und elektrische Sicherheit müssen abgestimmt sein.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Brandschutz, Blitzschutz und elektrische Sicherheit müssen abgestimmt sein."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["4.3.4b–4.3.7b; 5.1.8b","Norm-/Regelwerk: NIN Teil 7 (besondere Anlagen/Räume); Teil 4/5","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Schutz gegen Überspannung und Blitzrisiko"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Blitz-, Überspannungs- und Brandschutzkonzepte» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Blitz-, Überspannungs- und Brandschutzkonzepte» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Normstellen anhand fiktiver Räume identifizieren; Planprüfung ohne Montage. Halte zusätzlich die Antwort auf die Frage «Was ist bei einer PV-Anlage auf einem Gebäude mit Blitzschutz wichtig?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Vergleiche zwei fiktive Betriebsstätten und erstelle eine Liste von Umgebungsbedingungen, die für die Fachbeurteilung wichtig sind."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Was ist bei einer PV-Anlage auf einem Gebäude mit Blitzschutz wichtig?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/3.09-C.svg"},{"id":"3.10-A","year":3,"title":"Strukturierte Kupferverkabelung und Patchfelder","goals":["Kommunikationsverteiler, Kupferverkabelung und Patchfelder","Datendosen, Anschlusskategorien, Schirmung"],"parts":[{"heading":"Dein Dozent erklärt: Strukturierte Kupferverkabelung und Patchfelder","text":"Heute geht es um strukturierte kupferverkabelung und patchfelder. Passive Kommunikationsverkabelung besteht aus fest installierten Strecken, Anschlussdosen, Patchfeldern und flexiblen Patchkabeln. Kategorien der Komponenten und Klassen der Übertragungsstrecke sind zu unterscheiden. Ein Link funktioniert nur im Rahmen der gewählten Verkabelungssystematik; falsche Kontaktierung und unsaubere Schirmführung können Probleme verursachen. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Entwirf einen kleinen Kommunikationsverteiler mit sechs Datenanschlüssen. Erstelle Portnummern, eine Belegungsliste und einen Verbindungsplan. Nutze spannungsfreie Demonstrationskabel und dokumentiere, welche Messung eine fachliche Zertifizierung des Kabelsystems erfordern würde. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Ein korrektes Pinout ist noch kein vollständiger Qualitätsnachweis der Strecke. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Kommunikationsverteiler, Kupferverkabelung und Patchfelder; Datendosen, Anschlusskategorien, Schirmung. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: ISO/IEC 11801; Lehrplan 6.1/6.2. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Übertragungsstrecke gegen Systemfehler abgrenzen","bridge":"Bei Kupferverbindungen sind Pinbelegung, Dämpfung und Übersprechen unterschiedliche Fehlerklassen. Glasfaserstrecken benötigen zusätzlich eine Betrachtung optischer Dämpfung und geeigneter Steckflächen. Koaxialstrecken haben wiederum eigene Abschluss- und Pegelbedingungen. Ein Messbericht ist ohne passende Streckenklasse und Messmethode unvollständig.","exercise":"RJ45-Patch-/Installationskabel ausschließlich an spannungsfreier Dateninstallation/Trainingsmaterial; LWL nur Fachkurs. Halte zusätzlich die Antwort auf die Frage «Welche Aufgabe übernimmt ein Patchfeld?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Ordne drei symptomatische Netzwerkfehler einer möglichen Messstrategie zu, ohne reale Faseranschlüsse zu manipulieren.","solution":"Ein korrektes Pinout ist noch kein vollständiger Qualitätsnachweis der Strecke. Der Merksatz lautet: Ein korrektes Pinout ist noch kein vollständiger Qualitätsnachweis der Strecke. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Welche Aufgabe übernimmt ein Patchfeld?","options":["Fehlerschutz der Hausverteilung","Umwandlung von AC in DC","Strukturierte Terminierung und Zuordnung von Datenleitungen"],"c":2,"why":"Ein korrektes Pinout ist noch kein vollständiger Qualitätsnachweis der Strecke.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Ein korrektes Pinout ist noch kein vollständiger Qualitätsnachweis der Strecke."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Fehlerschutz der Hausverteilung","Ein korrektes Pinout ist noch kein vollständiger Qualitätsnachweis der Strecke.","Umwandlung von AC in DC"],"c":1,"why":"Der Merksatz lautet: Ein korrektes Pinout ist noch kein vollständiger Qualitätsnachweis der Strecke.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Ein korrektes Pinout ist noch kein vollständiger Qualitätsnachweis der Strecke."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["6.1.1a–6.1.6b; 6.2.1b–6.2.2b","Norm-/Regelwerk: ISO/IEC 11801; Lehrplan 6.1/6.2","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Kommunikationsverteiler, Kupferverkabelung und Patchfelder"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Strukturierte Kupferverkabelung und Patchfelder» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Strukturierte Kupferverkabelung und Patchfelder» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"RJ45-Patch-/Installationskabel ausschließlich an spannungsfreier Dateninstallation/Trainingsmaterial; LWL nur Fachkurs. Halte zusätzlich die Antwort auf die Frage «Welche Aufgabe übernimmt ein Patchfeld?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Ordne drei symptomatische Netzwerkfehler einer möglichen Messstrategie zu, ohne reale Faseranschlüsse zu manipulieren."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Welche Aufgabe übernimmt ein Patchfeld?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/3.10-A.svg"},{"id":"3.10-B","year":3,"title":"Glasfaser und optische Übertragung","goals":["Glasfaserstecker, Biegeradius und Hygiene","Koaxialverteilung, Dämpfung und Pegel"],"parts":[{"heading":"Dein Dozent erklärt: Glasfaser und optische Übertragung","text":"Heute geht es um glasfaser und optische übertragung. Glasfaser nutzt Licht als Übertragungsträger und ist gegen viele elektromagnetische Störfelder unempfindlich. Optische Stecker, Faserarten und Biegeradien sind jedoch empfindliche Systemelemente. Schlechte Sauberkeit oder unpassende Kontaktflächen verursachen Dämpfung und Reflexionen. Fachgerechte Verarbeitung und Messung erfordern spezielle Geräte und Schulung. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Vergleiche zwei Glasfaser-Datenblätter und erstelle eine Checkliste zu Faserart, Steckertyp, Dämpfung und Biegeradius. Berechne auf Papier ein einfaches Dämpfungsbudget aus angenommenen Strecken- und Steckerverlusten. Führe keine eigenen Fasertrenn- oder Laserexperimente durch. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Optische Übertragung braucht saubere Stecker und passende Messverfahren. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Glasfaserstecker, Biegeradius und Hygiene; Koaxialverteilung, Dämpfung und Pegel. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: ISO/IEC 11801; Lehrplan 6.1/6.2. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Übertragungsstrecke gegen Systemfehler abgrenzen","bridge":"Bei Kupferverbindungen sind Pinbelegung, Dämpfung und Übersprechen unterschiedliche Fehlerklassen. Glasfaserstrecken benötigen zusätzlich eine Betrachtung optischer Dämpfung und geeigneter Steckflächen. Koaxialstrecken haben wiederum eigene Abschluss- und Pegelbedingungen. Ein Messbericht ist ohne passende Streckenklasse und Messmethode unvollständig.","exercise":"RJ45-Patch-/Installationskabel ausschließlich an spannungsfreier Dateninstallation/Trainingsmaterial; LWL nur Fachkurs. Halte zusätzlich die Antwort auf die Frage «Was kann die Dämpfung einer Glasfaserstrecke erhöhen?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Ordne drei symptomatische Netzwerkfehler einer möglichen Messstrategie zu, ohne reale Faseranschlüsse zu manipulieren.","solution":"Optische Übertragung braucht saubere Stecker und passende Messverfahren. Der Merksatz lautet: Optische Übertragung braucht saubere Stecker und passende Messverfahren. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was kann die Dämpfung einer Glasfaserstrecke erhöhen?","options":["Verschmutzte Steckflächen und ungünstige Biegeradien","Eine neue Netzwerkadresse","Ein besser beschrifteter Plan"],"c":0,"why":"Optische Übertragung braucht saubere Stecker und passende Messverfahren.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Optische Übertragung braucht saubere Stecker und passende Messverfahren."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Eine neue Netzwerkadresse","Optische Übertragung braucht saubere Stecker und passende Messverfahren.","Ein besser beschrifteter Plan"],"c":1,"why":"Der Merksatz lautet: Optische Übertragung braucht saubere Stecker und passende Messverfahren.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Optische Übertragung braucht saubere Stecker und passende Messverfahren."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["6.1.1a–6.1.6b; 6.2.1b–6.2.2b","Norm-/Regelwerk: ISO/IEC 11801; Lehrplan 6.1/6.2","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Glasfaserstecker, Biegeradius und Hygiene"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Glasfaser und optische Übertragung» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Glasfaser und optische Übertragung» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"RJ45-Patch-/Installationskabel ausschließlich an spannungsfreier Dateninstallation/Trainingsmaterial; LWL nur Fachkurs. Halte zusätzlich die Antwort auf die Frage «Was kann die Dämpfung einer Glasfaserstrecke erhöhen?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Ordne drei symptomatische Netzwerkfehler einer möglichen Messstrategie zu, ohne reale Faseranschlüsse zu manipulieren."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Was kann die Dämpfung einer Glasfaserstrecke erhöhen?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/3.10-B.svg"},{"id":"3.10-C","year":3,"title":"Koaxialtechnik, Pegel und Messberichte","goals":["Messreport und Pass/Fail-Interpretation","Dokumentation vom Providerpunkt bis Endgerät"],"parts":[{"heading":"Dein Dozent erklärt: Koaxialtechnik, Pegel und Messberichte","text":"Heute geht es um koaxialtechnik, pegel und messberichte. Bei koaxialen Kommunikationsanlagen werden Signale über einen definierten Wellenwiderstand transportiert. Kabeldämpfung, Verteiler, Steckverbindungen und Frequenzbereich beeinflussen den Pegel beim Endgerät. Eine Pegelangabe in Dezibel muss auf die korrekte Bezugsgrösse bezogen werden. Ein Messbericht dokumentiert deshalb nicht nur Zahlen, sondern auch Frequenz und Messbedingungen. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Ein fiktiver Signalweg besitzt drei aufeinanderfolgende Dämpfungen von zwei, drei und vier Dezibel. Die Gesamtdämpfung beträgt neun Dezibel. Erkläre, warum die Beurteilung des Empfangspegelbereichs zusätzlich den Eingangspegel und die Gerätespezifikation benötigt. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Dämpfungen in dB lassen sich bei derselben Bezugsdefinition addieren. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Messreport und Pass/Fail-Interpretation; Dokumentation vom Providerpunkt bis Endgerät. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: ISO/IEC 11801; Lehrplan 6.1/6.2. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Übertragungsstrecke gegen Systemfehler abgrenzen","bridge":"Bei Kupferverbindungen sind Pinbelegung, Dämpfung und Übersprechen unterschiedliche Fehlerklassen. Glasfaserstrecken benötigen zusätzlich eine Betrachtung optischer Dämpfung und geeigneter Steckflächen. Koaxialstrecken haben wiederum eigene Abschluss- und Pegelbedingungen. Ein Messbericht ist ohne passende Streckenklasse und Messmethode unvollständig.","exercise":"RJ45-Patch-/Installationskabel ausschließlich an spannungsfreier Dateninstallation/Trainingsmaterial; LWL nur Fachkurs. Halte zusätzlich die Antwort auf die Frage «Wie gross ist die Gesamtdämpfung von 2 dB + 3 dB + 4 dB?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Ordne drei symptomatische Netzwerkfehler einer möglichen Messstrategie zu, ohne reale Faseranschlüsse zu manipulieren.","solution":"Dämpfungen in dB lassen sich bei derselben Bezugsdefinition addieren. Der Merksatz lautet: Dämpfungen in dB lassen sich bei derselben Bezugsdefinition addieren. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Wie gross ist die Gesamtdämpfung von 2 dB + 3 dB + 4 dB?","options":["24 dB","9 dB","1 dB"],"c":1,"why":"Dämpfungen in dB lassen sich bei derselben Bezugsdefinition addieren.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Dämpfungen in dB lassen sich bei derselben Bezugsdefinition addieren."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["1 dB","Dämpfungen in dB lassen sich bei derselben Bezugsdefinition addieren.","24 dB"],"c":1,"why":"Der Merksatz lautet: Dämpfungen in dB lassen sich bei derselben Bezugsdefinition addieren.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Dämpfungen in dB lassen sich bei derselben Bezugsdefinition addieren."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["6.1.1a–6.1.6b; 6.2.1b–6.2.2b","Norm-/Regelwerk: ISO/IEC 11801; Lehrplan 6.1/6.2","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Messreport und Pass/Fail-Interpretation"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Koaxialtechnik, Pegel und Messberichte» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Koaxialtechnik, Pegel und Messberichte» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"RJ45-Patch-/Installationskabel ausschließlich an spannungsfreier Dateninstallation/Trainingsmaterial; LWL nur Fachkurs. Halte zusätzlich die Antwort auf die Frage «Wie gross ist die Gesamtdämpfung von 2 dB + 3 dB + 4 dB?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Ordne drei symptomatische Netzwerkfehler einer möglichen Messstrategie zu, ohne reale Faseranschlüsse zu manipulieren."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Wie gross ist die Gesamtdämpfung von 2 dB + 3 dB + 4 dB?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/3.10-C.svg"},{"id":"3.11-A","year":3,"title":"Fehlerbaum und sicherer Diagnoseprozess","goals":["Störungen kategorisieren: Versorgung, Schutzorgan, Verbraucher, Steuerung","Sicherheitsfreigaben und Dokumente vor Messungen"],"parts":[{"heading":"Dein Dozent erklärt: Fehlerbaum und sicherer Diagnoseprozess","text":"Heute geht es um fehlerbaum und sicherer diagnoseprozess. Professionelle Fehlerdiagnose beginnt mit sicherheitsrelevanten Fragen: Welche Energiequellen sind vorhanden, welche Symptome sind reproduzierbar und welche Arbeiten darf die Person ausführen? Danach wird der Fehlerbaum nach Versorgung, Schutzorgan, Leitungsweg, Steuerung und Verbraucher gegliedert. Ein unkontrollierter Austausch von Teilen kann Hinweise zerstören und neue Risiken schaffen. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Ein 24-Volt-Lehrmodell schaltet einen Verbraucher nicht ein. Entwerfe einen Fehlerbaum mit vier Hauptästen und jeweils zwei Unterursachen. Priorisiere Hypothesen anhand ungefährlicher Beobachtungen und dokumentierter Messwerte, nicht anhand von Vermutungen. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Diagnose ist eine nachvollziehbare Abfolge von Hypothesen und Belegen. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Störungen kategorisieren: Versorgung, Schutzorgan, Verbraucher, Steuerung; Sicherheitsfreigaben und Dokumente vor Messungen. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIV Art. 24; NIN Teil 6; Suva 84042.D. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Diagnose als Hypothesenprüfung","bridge":"Eine strukturierte Fehlersuche beginnt mit Symptomen, Randbedingungen und einer überprüfbaren Hypothese. Durch die Auswahl möglichst aussagekräftiger und sicherer Beobachtungen wird die Ursache eingegrenzt. Dokumentierte Soll-Ist-Vergleiche helfen, voreilige Teilewechsel zu vermeiden. Sichere Grenzen und Freigaben gelten auch bei scheinbar einfachen Fehlern.","exercise":"Fehlersuche an 24-V-Board mit verdeckten Fehlern und Logbuch. Halte zusätzlich die Antwort auf die Frage «Womit beginnt die strukturierte Fehlersuche?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erstelle einen Fehlerbaum für eine fiktive Leuchte, die im Kleinspannungsmodell nicht funktioniert. Notiere sichere Prüfschritte.","solution":"Diagnose ist eine nachvollziehbare Abfolge von Hypothesen und Belegen. Der Merksatz lautet: Diagnose ist eine nachvollziehbare Abfolge von Hypothesen und Belegen. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Womit beginnt die strukturierte Fehlersuche?","options":["Sicherheitsbeurteilung und Symptomaufnahme","Sofortiger Austausch aller Bauteile","Wahlloses Überbrücken von Klemmen"],"c":0,"why":"Diagnose ist eine nachvollziehbare Abfolge von Hypothesen und Belegen.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Diagnose ist eine nachvollziehbare Abfolge von Hypothesen und Belegen."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Sofortiger Austausch aller Bauteile","Diagnose ist eine nachvollziehbare Abfolge von Hypothesen und Belegen.","Wahlloses Überbrücken von Klemmen"],"c":1,"why":"Der Merksatz lautet: Diagnose ist eine nachvollziehbare Abfolge von Hypothesen und Belegen.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Diagnose ist eine nachvollziehbare Abfolge von Hypothesen und Belegen."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["1.1.3a; 1.2.3a; 5.1.7a; 5.3.6a","Norm-/Regelwerk: NIV Art. 24; NIN Teil 6; Suva 84042.D","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Störungen kategorisieren: Versorgung, Schutzorgan, Verbraucher, Steuerung"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Fehlerbaum und sicherer Diagnoseprozess» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Fehlerbaum und sicherer Diagnoseprozess» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Fehlersuche an 24-V-Board mit verdeckten Fehlern und Logbuch. Halte zusätzlich die Antwort auf die Frage «Womit beginnt die strukturierte Fehlersuche?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erstelle einen Fehlerbaum für eine fiktive Leuchte, die im Kleinspannungsmodell nicht funktioniert. Notiere sichere Prüfschritte."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Womit beginnt die strukturierte Fehlersuche?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/3.11-A.svg"},{"id":"3.11-B","year":3,"title":"Messstrategie, Gegenprüfung und Ursachenanalyse","goals":["Fehlerbaum, Hypothesen und Priorisierung","Mess-/Prüfentscheid und Fachkompetenzgrenzen"],"parts":[{"heading":"Dein Dozent erklärt: Messstrategie, Gegenprüfung und Ursachenanalyse","text":"Heute geht es um messstrategie, gegenprüfung und ursachenanalyse. Eine Diagnose gewinnt an Qualität, wenn für jede Hypothese eine erwartete Beobachtung definiert wird. Ein Messwert allein beweist selten eine Ursache. Erst eine unabhängige Gegenprüfung, ein Vergleich mit dem Sollzustand und eine abschliessende Funktionsprüfung machen den Befund belastbar. Änderungen sind zurückverfolgbar zu dokumentieren. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Ein simulierter Taster scheint defekt. Vergleiche die erwartete und tatsächliche Signallogik im 24-Volt-Modell. Prüfe, ob das beobachtete Verhalten auch durch eine falsche Parametrierung oder eine unterbrochene Leitung erklärbar ist. Formuliere eine zweite Prüfung, die diese Ursachen trennt. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Ein reproduzierbarer Befund ist besser als ein zufällig verschwundener Fehler. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Fehlerbaum, Hypothesen und Priorisierung; Mess-/Prüfentscheid und Fachkompetenzgrenzen. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIV Art. 24; NIN Teil 6; Suva 84042.D. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Diagnose als Hypothesenprüfung","bridge":"Eine strukturierte Fehlersuche beginnt mit Symptomen, Randbedingungen und einer überprüfbaren Hypothese. Durch die Auswahl möglichst aussagekräftiger und sicherer Beobachtungen wird die Ursache eingegrenzt. Dokumentierte Soll-Ist-Vergleiche helfen, voreilige Teilewechsel zu vermeiden. Sichere Grenzen und Freigaben gelten auch bei scheinbar einfachen Fehlern.","exercise":"Fehlersuche an 24-V-Board mit verdeckten Fehlern und Logbuch. Halte zusätzlich die Antwort auf die Frage «Was dient zur Unterscheidung mehrerer möglicher Ursachen?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erstelle einen Fehlerbaum für eine fiktive Leuchte, die im Kleinspannungsmodell nicht funktioniert. Notiere sichere Prüfschritte.","solution":"Ein reproduzierbarer Befund ist besser als ein zufällig verschwundener Fehler. Der Merksatz lautet: Ein reproduzierbarer Befund ist besser als ein zufällig verschwundener Fehler. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was dient zur Unterscheidung mehrerer möglicher Ursachen?","options":["Nur der erste Verdacht","Eine passende Gegenprüfung","Nur ein Neustart ohne Protokoll"],"c":1,"why":"Ein reproduzierbarer Befund ist besser als ein zufällig verschwundener Fehler.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Ein reproduzierbarer Befund ist besser als ein zufällig verschwundener Fehler."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Nur ein Neustart ohne Protokoll","Ein reproduzierbarer Befund ist besser als ein zufällig verschwundener Fehler.","Nur der erste Verdacht"],"c":1,"why":"Der Merksatz lautet: Ein reproduzierbarer Befund ist besser als ein zufällig verschwundener Fehler.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Ein reproduzierbarer Befund ist technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Entwirf ein Einfamilienhaus mit Wärmepumpe, PV, Ladepunkt, Datenverteiler und zehn Stromkreisgruppen als fiktive Anforderungsliste. Zeichne ein übersichtliches Blockschema mit den Hauptsystemen und nenne für jede Schnittstelle die fehlenden Fachabklärungen. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Gute Systemplanung zeigt Schnittstellen und Zuständigkeiten explizit. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Ein Gebäude: Verbraucher, Hausverteilung, PV, Daten und Automation; Stromlauf- und Übersichtsplan, Stringplan. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIN Teile 4–7; NIV; ESTI 220. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Mehrere Teilsysteme koordinieren","bridge":"Gebäudelasten, PV-Erzeugung, Speicher, Ladepunkt und Kommunikation beeinflussen sich gegenseitig. Jede Teilauslegung kann im Einzelnen plausibel erscheinen und dennoch an Schnittstellen unvollständig sein. Deshalb braucht ein Gesamtdossier konsistente Annahmen, Schnittstellen und dokumentierte Verantwortlichkeiten.","exercise":"Reines Planungsprojekt, Messungen ggf. nur an zertifizierter Übungsanlage unter Leitung. Halte zusätzlich die Antwort auf die Frage «Was steht am Beginn der Gesamtplanung?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erstelle eine Schnittstellenliste zu einem Haus mit PV, Wärmepumpe und Ladestation; markiere fehlende Daten.","solution":"Gute Systemplanung zeigt Schnittstellen und Zuständigkeiten explizit. Der Merksatz lautet: Gute Systemplanung zeigt Schnittstellen und Zuständigkeiten explizit. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was steht am Beginn der Gesamtplanung?","options":["Eine zufällige Verdrahtung","Funktionsanforderungen und Schnittstellen","Nur die Auswahl des Wechselrichter-Logos"],"c":1,"why":"Gute Systemplanung zeigt Schnittstellen und Zuständigkeiten explizit.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Gute Systemplanung zeigt Schnittstellen und Zuständigkeiten explizit."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Nur die Auswahl des Wechselrichter-Logos","Gute Systemplanung zeigt Schnittstellen und Zuständigkeiten explizit.","Eine zufällige Verdrahtung"],"c":1,"why":"Der Merksatz lautet: Gute Systemplanung zeigt Schnittstellen und Zuständigkeiten explizit.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Gute Systemplanung zeigt Schnittstellen und Zuständigkeiten explizit."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Pla
