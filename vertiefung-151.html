en fehlen, bevor eine Fachperson überhaupt entscheiden kann?"},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Welche Prüfung behandelt die vorgesehene Verbindung des Schutzleiters?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/3.03-B.svg"},{"id":"3.03-C","year":3,"title":"RCD, Schleifenimpedanz und Prüfprotokoll","goals":["Stromkreise eindeutig identifizieren, Ergebnisnachvollziehbarkeit","Voraussetzungen für sichere Inbetriebnahme und Übergabe"],"parts":[{"heading":"Dein Dozent erklärt: RCD, Schleifenimpedanz und Prüfprotokoll","text":"Heute geht es um rcd, schleifenimpedanz und prüfprotokoll. Die elektrische Schutzwirkung wird im jeweiligen Netzsystem und mit den passenden Prüfmethoden beurteilt. RCD-Prüfung, Fehlerschleifenimpedanz, Kurzschlussstrom und Funktionsnachweis sind verschiedene Grössen. Ein fachliches Messprotokoll enthält nachvollziehbare Ergebnisse, nicht nur ein pauschales Häkchen. Bei Bestandsanlagen muss ausserdem der Umfang der geänderten Installation definiert werden. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Du erhältst für eine fiktive Anlage einen anonymisierten Messreport. Ordne jedem Wert Stromkreis, Messverfahren, Messgerät und Sollvorgabe zu. Markiere unklare Angaben als offene Punkte, statt sie mit erfundenen Grenzwerten als bestanden zu deklarieren. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: «Bestanden» ist eine fachliche Beurteilung auf Basis passender Kriterien. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Stromkreise eindeutig identifizieren, Ergebnisnachvollziehbarkeit; Voraussetzungen für sichere Inbetriebnahme und Übergabe. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIV Art. 24; NIN Teil 6. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Ein Messergebnis ist noch kein Prüfentscheid","bridge":"Für die Erstprüfung müssen Verfahren, Messbedingungen, Geräteangaben und Ergebnisse zusammen dokumentiert werden. Messunsicherheit, ungeeignete Messpunkte und fehlende Vorprüfungen können die Beurteilung verfälschen. Die Freigabe einer Installation folgt nicht aus einem einzigen grünen Messwert.","exercise":"Messungen an normgerechter Schulungsanlage ausschliesslich unter unmittelbarer Aufsicht autorisierter Fachperson. Halte zusätzlich die Antwort auf die Frage «Was gehört in ein verwertbares Prüfprotokoll?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Bewerte eine fiktive Liste unvollständiger Prüfdaten: Welche Angaben fehlen, bevor eine Fachperson überhaupt entscheiden kann?","solution":"«Bestanden» ist eine fachliche Beurteilung auf Basis passender Kriterien. Der Merksatz lautet: «Bestanden» ist eine fachliche Beurteilung auf Basis passender Kriterien. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was gehört in ein verwertbares Prüfprotokoll?","options":["Nachvollziehbare Messwerte und Beurteilungsgrundlage","Nur die Unterschrift des Lieferanten","Nur ein grünes Symbol"],"c":0,"why":"«Bestanden» ist eine fachliche Beurteilung auf Basis passender Kriterien.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: «Bestanden» ist eine fachliche Beurteilung auf Basis passender Kriterien."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Nur die Unterschrift des Lieferanten","«Bestanden» ist eine fachliche Beurteilung auf Basis passender Kriterien.","Nur ein grünes Symbol"],"c":1,"why":"Der Merksatz lautet: «Bestanden» ist eine fachliche Beurteilung auf Basis passender Kriterien.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: «Bestanden» ist eine fachliche Beurteilung auf Basis passender Kriterien."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["5.1.7a–c; 4.3.6b; 2.2.4a","Norm-/Regelwerk: NIV Art. 24; NIN Teil 6","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Fo ronen Drehfelddrehzahl; die Differenz wird durch den Schlupf beschrieben. Drehmoment, Drehzahl und Leistungsaufnahme hängen vom Betriebspunkt ab. Typenschilder geben wichtige Bemessungsdaten an. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Für eine Maschine mit synchroner Drehfelddrehzahl 1500 Umdrehungen pro Minute und realer Rotorzahl 1450 beträgt der Schlupf rund 3,3 Prozent. Erkläre, weshalb die Rotorzahl von der Last abhängt und nicht nur von der Netzfrequenz. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Synchron- und Asynchrondrehzahl unterscheiden sich im motorischen Betrieb. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Gleichstrom- und Drehstrommotor, Syn-/Asynchron; Leistung, Drehmoment, Drehzahl, Schlupf. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIN Teil 4/5; Herstellerunterlagen; EMV-Grundlagen. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Drehmoment, Drehzahl und Schlupf","bridge":"Bei einem Asynchronmotor liegt die mechanische Drehzahl im Motorbetrieb typischerweise unter der Drehfelddrehzahl. Die Differenz wird als Schlupf beschrieben. Mechanische Leistung folgt aus Drehmoment und Winkelgeschwindigkeit; elektrische Aufnahmeleistung ist wegen Verlusten grösser. Motor-, Leitungs- und Schutzauslegung sind getrennt zu betrachten.","exercise":"Motoren mit Simulation/Schulungsgerät analysieren; reale Anlaufversuche nur im bewilligten Fachlabor. Halte zusätzlich die Antwort auf die Frage «Was bezeichnet Schlupf beim Asynchronmotor?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Berechne bei 10 N·m und 1500 U/min die mechanische Leistung. Trenne diesen Wert ausdrücklich von der elektrischen Aufnahmeleistung.","solution":"Synchron- und Asynchrondrehzahl unterscheiden sich im motorischen Betrieb. Der Merksatz lautet: Synchron- und Asynchrondrehzahl unterscheiden sich im motorischen Betrieb. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was bezeichnet Schlupf beim Asynchronmotor?","options":["Den Schutzleiterwiderstand","Nur die Netzspannung","Relative Differenz zwischen Drehfeld- und Rotordrehzahl"],"c":2,"why":"Synchron- und Asynchrondrehzahl unterscheiden sich im motorischen Betrieb.\n\nBezug zum Unterrichtsteil «Dein Dozent erklärt: Drehstrom-Asynchronmotor und Schlupf»: Die mechanische Rotordrehzahl liegt im motorischen Betrieb normalerweise unter der synchronen Drehfelddrehzahl; die Differenz wird durch den Schlupf beschrieben."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Den Schutzleiterwiderstand","Synchron- und Asynchrondrehzahl unterscheiden sich im motorischen Betrieb.","Nur die Netzspannung"],"c":1,"why":"Der Merksatz lautet: Synchron- und Asynchrondrehzahl unterscheiden sich im motorischen Betrieb.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Synchron- und Asynchrondrehzahl unterscheiden sich im motorischen Betrieb."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["5.2.4b–5.2.7b; 5.3.4b","Norm-/Regelwerk: NIN Teil 4/5; Herstellerunterlagen; EMV-Grundlagen","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Gleichstrom- und Drehstrommotor, Syn-/Asynchron"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Drehstrom-Asynchronmotor und Schlupf» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Drehstrom-Asynchronmotor und Schlupf» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Motoren mit Simulation/Schulungsgerät analysieren; reale Anlaufversuche nur im bewilligten Fachlabor. Halte zusätzlich die Antwort auf die Frage «Was bezeichnet Schlupf beim Asynchronmotor?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächt Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Motor-Schutzorgane und Anlaufarten; Stern-Dreieck und Frequenzumrichter (Prinzip). Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIN Teil 4/5; Herstellerunterlagen; EMV-Grundlagen. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Drehmoment, Drehzahl und Schlupf","bridge":"Bei einem Asynchronmotor liegt die mechanische Drehzahl im Motorbetrieb typischerweise unter der Drehfelddrehzahl. Die Differenz wird als Schlupf beschrieben. Mechanische Leistung folgt aus Drehmoment und Winkelgeschwindigkeit; elektrische Aufnahmeleistung ist wegen Verlusten grösser. Motor-, Leitungs- und Schutzauslegung sind getrennt zu betrachten.","exercise":"Motoren mit Simulation/Schulungsgerät analysieren; reale Anlaufversuche nur im bewilligten Fachlabor. Halte zusätzlich die Antwort auf die Frage «Wieso wird die Motoranlaufart geplant?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Berechne bei 10 N·m und 1500 U/min die mechanische Leistung. Trenne diesen Wert ausdrücklich von der elektrischen Aufnahmeleistung.","solution":"Die Anlaufmethode muss zur Last und zum Motor passen. Der Merksatz lautet: Die Anlaufmethode muss zu n und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Erstelle eine Blockskizze von Netz, Umrichter, Motor und Prozesslast. Markiere Zwischenkreis, Signal- und Leistungspfade sowie mögliche EMV-Kopplungen. Vergleiche die Herstellerhinweise zweier Geräte hinsichtlich Motorkabel und Abschaltwartezeit. Die Skizze ist keine Arbeitsanweisung zur Installation. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Ein Frequenzumrichter kann nach Abschalten gespeicherte Energie enthalten. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Netzrückwirkungen, EMV und Schirmkonzepte; Lastfall Motor und Anschlussschema lesen. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIN Teil 4/5; Herstellerunterlagen; EMV-Grundlagen. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Drehmoment, Drehzahl und Schlupf","bridge":"Bei einem Asynchronmotor liegt die mechanische Drehzahl im Motorbetrieb typischerweise unter der Drehfelddrehzahl. Die Differenz wird als Schlupf beschrieben. Mechanische Leistung folgt aus Drehmoment und Winkelgeschwindigkeit; elektrische Aufnahmeleistung ist wegen Verlusten grösser. Motor-, Leitungs- und Schutzauslegung sind getrennt zu betrachten.","exercise":"Motoren mit Simulation/Schulungsgerät analysieren; reale Anlaufversuche nur im bewilligten Fachlabor. Halte zusätzlich die Antwort auf die Frage «Welche Baugruppe kann beim Umrichter nach Abschalten Energie speichern?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Berechne bei 10 N·m und 1500 U/min die mechanische Leistung. Trenne diesen Wert ausdrücklich von der elektrischen Aufnahmeleistung.","solution":"Ein Frequenzumrichter kann nach Abschalten gespeicherte Energie enthalten. Der Merksatz lautet: Ein Frequenzumrichter kann nach Abschalten gespeicherte Energie enthalten. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Welche Baugruppe kann beim Umrichter nach Abschalten Energie speichern?","options":["Ein gewöhnliches Namensschild","Zwischenkreiskondensator","Nur der Bedienknopf"],"c":1,"why":"Ein Frequenzumrichter kann nach Abschalten gespeicherte Energie enthalten.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Ein Frequenzumrichter kann nach Abschalten gespeicherte Energie enthalten."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Nur der Bedienknopf","Ein Frequenzumrichter kann nach Abschalten gespeicherte Energie enthalten.","Ein gewöhnliches Namensschild"],"c":1,"why":"Der Merksatz lautet: Ein Frequenzumrichter kann nach Abschalten gespeicherte Energie enthalten.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Ein Frequenzumrichter kann nach Abschalten gespeicherte Energie enthalten."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligu Not-Halt-Konzept vs. funktionales Ausschalten. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: Lehrplan 5.4; SN EN 60204-1 (Maschinenelektrik – Abgrenzung). Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Steuerungslogik nachvollziehbar dokumentieren","bridge":"Eine Selbsthaltung ist eine logische Speicherwirkung durch rückgeführten Kontakt. Verriegelung verhindert bestimmte gleichzeitig unzulässige Zustände. Eine gewöhnliche Funktionslogik ist nicht automatisch eine sicherheitsgerichtete Steuerung. Bei einem Not-Halt-System sind andere Anforderungen und Nachweise relevant als bei einer Bedienfunktion.","exercise":"24-V-DC-Lernsteuerung mit Simulation oder Kleinspannungsrelais; keine Sicherheitsfunktionen an echten Maschinen ändern. Halte zusätzlich die Antwort auf die Frage «Welche Aufgabe erfüllt eine Selbsthaltung?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Formuliere eine Wahrheitstabelle für Start, Stopp und Betriebsmeldung in einem Kleinspannungs-Funktionsmodell.","solution":"Funktionale Logik und funktionale Sicherheit sind nicht identisch. Der Merksatz lautet: Funktionale Logik und funktionale Sicherheit sind nicht identisch. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen."," t mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Ein fiktiver Lüfter soll zehn Sekunden nach einer Freigabe starten. Zeichne Eingangssignal und Ausgangssignal in einem Zeitdiagramm. Prüfe, was geschieht, wenn die Freigabe nach fünf Sekunden wieder wegfällt, und formuliere die angenommene Timerfunktion. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Ein Zeitglied braucht eine genaue Definition von Flanken und Rücksetzverhalten. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Zeitrelais, Verzögerungen und Prioritäten; Logikplan, KOP/FUP, Ein-/Ausgangsliste. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: Lehrplan 5.4; SN EN 60204-1 (Maschinenelektrik – Abgrenzung). Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Steuerungslogik nachvollziehbar dokumentieren","bridge":"Eine Selbsthaltung ist eine logische Speicherwirkung durch rückgeführten Kontakt. Verriegelung verhindert bestimmte gleichzeitig unzulässige Zustände. Eine gewöhnliche Funktionslogik ist nicht automatisch eine sicherheitsgerichtete Steuerung. Bei einem Not-Halt-System sind andere Anforderungen und Nachweise relevant als bei einer Bedienfunktion.","exercise":"24-V-DC-Lernsteuerung mit Simulation oder Kleinspannungsrelais; keine Sicherheitsfunktionen an echten Maschinen ändern. Halte zusätzlich die Antwort auf die Frage «Wofür wird eine Einschaltverzögerung verwendet?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Formuliere eine Wahrheitstabelle für Start, Stopp und Betriebsmeldung in einem Kleinspannungs-Funktionsmodell.","solution":"Ein Zeitglied braucht eine genaue Definition von Flanken und Rücksetzverhalten. Der Merksatz lautet: Ein Zeitglied braucht eine genaue Definition von Flanken und Rücksetzverhalten. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Wofür wird eine Einschaltverzögerung verwendet?","options":["Leitungsquerschnitt erhöhen","Ausgang erst nach Ablauf einer definierten Zeit aktivieren","Die Netzfrequenz messen"],"c":1,"why":"Ein Zeitglied braucht eine genaue Definition von Flanken und Rücksetzverhalten.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Ein Zeitglied braucht eine genaue Definition von Flanken und Rücksetzverhalten."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Die Netzfrequenz messen","Ein Zeitglied braucht eine genaue Definition von Flanken und Rücksetzverhalten.","Leitungsquerschnitt erhöhen"],"c":1,"why":"Der Merksatz lautet: Ein Zeitglied braucht eine genaue Definition von Flanken und Rücksetzverhalten.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Ein Zeitglied braucht eine genaue Definition von Flanken und Rücksetzverhalten."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantw ion":"Beantworte zunächst ohne Lösungshilfe: Wofür wird eine Einschaltverzögerung verwendet?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/3.05-B.svg"},{"id":"3.05-C","year":3,"title":"KOP/FUP, Fehlerdiagnose und Not-Halt-Abgrenzung","goals":["Fehlersuche am Signalfluss","Dokumentation von Steuerungsänderungen"],"parts":[{"heading":"Dein Dozent erklärt: KOP/FUP, Fehlerdiagnose und Not-Halt-Abgrenzung","text":"Heute geht es um kop/fup, fehlerdiagnose und not-halt-abgrenzung. Kontaktplan und Funktionsplan sind Darstellungsformen derselben logischen Anforderungen. Die Ausgänge werden durch Eingangszustände, Verknüpfungen und gegebenenfalls Speicher bestimmt. Eine reale Not-Halt-Funktion darf nicht ohne passende Sicherheitsbewertung als gewöhnliche SPS-Logik umgesetzt werden. Für die Lernübung werden ausschliesslich nicht sicherheitsrelevante Modellfunktionen beschrieben. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Erstelle die Logik für eine Meldelampe, die nur bei Freigabe und ohne Störung leuchten soll. Setze sie einmal in Kontaktplan und einmal in Funktionsplan um. Notiere, warum der Begriff «Not-Halt» besondere normative und sicherheitsgerichtete Anforderungen auslöst. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Eine saubere Logikdarstellung ersetzt keinen Sicherheitsnachweis. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Fehlersuche am Signalfluss; Dokumentation von Steuerungsänderungen. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: Lehrplan 5.4; SN EN 60204-1 (Maschinenelektrik – Abgrenzung). Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Steuerungslogik nachvollziehbar dokumentieren","bridge":"Eine Selbsthaltung ist eine logische Speicherwirkung durch rückgeführten Kontakt. Verriegelung verhindert bestimmte gleichzeitig unzulässige Zustände. Eine gewöhnliche Funktionslogik ist nicht automatisch eine sicherheitsgerichtete Steuerung. Bei einem Not-Halt-System sind andere Anforderungen und Nachweise relevant als bei einer Bedienfunktion.","exercise":"24-V-DC-Lernsteuerung mit Simulation oder Kleinspannungsrelais; keine Sicherheitsfunktionen an echten Maschinen ändern. Halte zusätzlich die Antwort auf die Frage «Welche Aussage zu Not-Halt trifft zu?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Formuliere eine Wahrheitstabelle für Start, Stopp und Betriebsmeldung in einem Kleinspannungs-Funktionsmodell.","solution":"Eine saubere Logikdarstellung ersetzt keinen Sicherheitsnachweis. Der Merksatz lautet: Eine saubere Logikdarstellung ersetzt keinen Sicherheitsnachweis. Modell, Theorie und echte berechtigte Inst a":""}],"bridgeTitle":"Buskommunikation verändert die Fehlersuche","bridge":"Ein Bussystem verteilt Informationen zwischen Teilnehmern. Ein fehlerhaftes Verhalten kann von Sensorik, Parametrierung, Übertragung oder Aktorik verursacht werden. Topologie und Zuordnung sind deshalb Teil der technischen Dokumentation. Fernzugriff schafft zusätzliche Anforderungen an Berechtigungen, Datenschutz und sichere Konfiguration.","exercise":"KNX-Simulator oder Schulungsboard mit Schutzkleinspannung; ohne Änderungen an Hausinstallation. Halte zusätzlich die Antwort auf die Frage «Welche Aufgabe übernimmt ein KNX-Aktor typischerweise?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erstelle eine Raumskizze mit zwei Sensoren, einem Aktor und einem Bus. Erkläre, welche Information bei einer Störung zuerst geprüft werden müsste.","solution":"Buskommunikation und Netzleistungsverkabelung sind nicht dasselbe. Der Merksatz lautet: Buskommunikation und Netzleistungsverkabelung sind nicht dasselbe. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Welche Aufgabe übernimmt ein KNX-Aktor typischerweise?","options":["Er misst allein den Kabelquerschnitt","Er setzt Busbefehle in eine physische Aktion um","Er ersetzt automatisch einen Hausanschluss"],"c":1,"why":"Buskommunikation und Netzleistungsverkabelung sind nicht dasselbe.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Buskommunikation und Netzleistungsverkabelung sind nicht dasselbe."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Er ersetzt automatisch einen Hausanschluss","Buskommunikation und Netzleistungsverkabelung sind nicht dasselbe.","Er misst allein den Kabelquerschnitt"],"c":1,"why":"Der Merksatz lautet: Buskommunikation und Netzleistungsverkabelung sind nicht dasselbe.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Buskommunikation und Netzleist formation bei einer Störung zuerst geprüft werden müsste."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Welche Aufgabe übernimmt ein KNX-Aktor typischerweise?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/3.06-A.svg"},{"id":"3.06-B","year":3,"title":"Sensorik, Szenen und Raumfunktionen","goals":["Dimmen, Präsenz, Jalousien, Heizung","KNX-Logik und Szenen als Grundkonzept"],"parts":[{"heading":"Dein Dozent erklärt: Sensorik, Szenen und Raumfunktionen","text":"Heute geht es um sensorik, szenen und raumfunktionen. Ein Gebäudeautomationssystem erfasst Helligkeit, Temperatur, Anwesenheit oder Benutzerbefehle und führt definierte Aktionen aus. Szenen fassen Zustände mehrerer Aktoren zusammen. Eine saubere Planung verhindert widersprüchliche Automationen, unerwartete Zustände und Energieverschwendung. Die automatische Funktion muss zudem auch bei Ausfall einzelner Komponenten überlegt werden. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Definiere für einen fiktiven Konferenzraum Szenen «Präsentation», «Besprechung» und «Aus». Erstelle eine Matrix der Leuchten- und Beschattungszustände. Ergänze eine Vorrangregel für manuelle Bedienung und erläutere, wie sie dokumentiert wird. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Jede Automationsszene braucht Zustände und Prioritäten. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passend odell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was beschreibt eine Szene in der Gebäudeautomation?","options":["Den Strompreis eines Jahres","Nur die Bauform eines Kabels","Einen definierten Satz von Geräte- oder Raumzuständen"],"c":2,"why":"Jede Automationsszene braucht Zustände und Prioritäten.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Jede Automationsszene braucht Zustände und Prioritäten."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Den Strompreis eines Jahres","Jede Automationsszene braucht Zustände und Prioritäten.","Nur die Bauform eines Kabels"],"c":1,"why":"Der Merksatz lautet: Jede Automationsszene braucht Zustände und Prioritäten.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Jede Automationsszene braucht Zustände und Prioritäten."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["5.5.1b–5.5.3b; 3.3.2b","Norm-/Regelwerk: Lehrplan 5.5; KNX-Standard (Hersteller/KNX-Association)","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Dimmen, Präsenz, Jalousien, Heizung"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte Änderungen. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. In einem simulierten KNX-Projekt reagiert eine Leuchte nicht. Ordne mögliche Ursachen nach Buskommunikation, Gruppenadresse, Ausgangskanal und tatsächlichem Aktorzustand. Definiere eine nachvollziehbare Diagnoseabfolge und einen dokumentierten Rollback bei fehlerhafter Parametrierung. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Konfiguration gehört genauso zur Dokumentation wie der Stromlaufplan. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Fehlerdiagnose, Busmonitor, Dokumentation; Datenschutz, Fernzugriff und Schnittstellen. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: Lehrplan 5.5; KNX-Standard (Hersteller/KNX-Association). Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Buskommunikation verändert die Fehlersuche","bridge":"Ein Bussystem verteilt Informationen zwischen Teilnehmern. Ein fehlerhaftes Verhalten kann von Sensorik, Parametrierung, Übertragung oder Aktorik verursacht werden. Topologie und Zuordnung sind deshalb Teil der technischen Dokumentation. Fernzugriff schafft zusätzliche Anforderungen an Berechtigungen, Datenschutz und sichere Konfiguration.","exercise":"KNX-Simulator oder Schulungsboard mit Schutzkleinspannung; ohne Änderungen an Hausinstallation. Halte zusätzlich die Antwort auf die Frage «Was erleichtert die KNX-Fehlersuche besonders?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erstelle eine Raumskizze mit zwei Sensoren, einem Aktor und einem Bus. Erkläre, welche Information bei einer Störung zuerst geprüft werden müsste.","solution":"Konfiguration gehört genauso zur Dokumentation wie der Stromlaufplan. Der Merksatz lautet: Konfiguration gehört genauso zur Dokumentation wie der Stromlaufplan. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was erleichtert die KNX-Fehlersuche besonders?","options":["Gruppenadressliste und Busdiagnose","Beliebiger Fernzugriff ohne Rechte","Nur die optische Leuchtenfarbe"],"c":0,"why":"Konfiguration gehört genauso zur Dokumentation wie der Stromlaufplan.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Konfiguration gehört genauso zur Dokumentation wie der Stromlaufplan."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Beliebiger Fernzugriff ohne Rechte","Konfiguration gehört genauso zur Dokumentation wie der Stromlaufplan.","Nur die optische Leuchtenfarbe"],"c":1,"why":"Der Merksatz lautet: Konfiguration gehört genauso zur Dokumentation wie der Stromlaufplan.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Konfiguration gehört genauso zur Dokumentation wie der Stromlaufplan."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar ":"Beantworte zunächst ohne Lösungshilfe: Was erleichtert die KNX-Fehlersuche besonders?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/3.06-C.svg"},{"id":"3.07-A","year":3,"title":"PV-Kennlinie, MPP und Ertragsfaktoren","goals":["PV-Zellenkennlinien, MPP und MPPT","Stringplanung, STC-Kenndaten, Temperaturverhalten"],"parts":[{"heading":"Dein Dozent erklärt: PV-Kennlinie, MPP und Ertragsfaktoren","text":"Heute geht es um pv-kennlinie, mpp und ertragsfaktoren. Photovoltaikzellen liefern Gleichstrom, dessen Strom-Spannungs-Kennlinie von Einstrahlung und Temperatur abhängt. Der Maximum Power Point ist der Betriebspunkt mit maximaler elektrischer Leistung unter den gegebenen Bedingungen. Ein Wechselrichter verwendet MPPT, um diesen Punkt anzustreben. Verschattung, Ausrichtung, Modulalterung und Systemverluste beeinflussen den Jahresertrag. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Ein Modul arbeitet im betrachteten Kennlinienpunkt bei 35 Volt und 10 Ampere. Die Leistung beträgt 350 Watt. Ändert sich die Einstrahlung, verschiebt sich die Kennlinie. Zeichne verschiedene theoretische Kennlinien und markiere den Punkt des maximalen Produkts U × I. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Ein Moduldatenblattwert gilt nur unter definierten Prüfbedingungen. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: PV-Zellenkennlinien, MPP und MPPT; Stringplanung, STC-Kenndaten, Temperaturverhalten. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIN 2025 Abschnitt 7.12; ESTI 220; SN EN 62446-1. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"PV-Kennlinien sind temperaturabhängig","bridge":"Ein PV-Modul hat keinen festen Spannungswert über alle Betriebszustände. Einstrahlung, Zelltemperatur und Lastpunkt beeinflussen die Strom-Spannungs-Kennlinie. Für eine Stringplanung müssen insbesondere Leerlaufspannung bei niedriger Temperatur und Spannungsbereich des Wechselrichters betrachtet werden. Exakte Entscheidungen erfordern die realen Herstellerkennlinien und Normvorgaben.","exercise":"PV-Konfiguration ausschließlich am Simulator auslegen, Fotos einer bestehenden Anlage beurteilen; keine DC-Steckarbeiten. Halte zusätzlich die Antwort auf die Frage «Was bedeutet MPP?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Vergleiche als reine Rechenübung zwei hypothetische Modulkennlinien bei unterschiedlichen Temperaturen. Markiere die Daten, die für eine echte Stringplanung fehlen.","solution":"Ein Moduldatenblattwert gilt nur unter definierten Prüfbedingungen. Der Merksatz lautet: Ein Moduldatenblattwert gilt nur unter definierten Prüfbedingungen. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was bedeutet MPP?","options":["Ein dauerhaft fester Wechselstromwert","Maximale Anzahl Dachziegel","Betriebspunkt maximaler Leistung"],"c":2,"why":"Ein Moduldatenblattwert gilt nur unter definierten Prüfbedingungen.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Ein Moduldatenblattwert gilt nur unter definierten Prüfbedingungen."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Ein dauerhaft fester Wechselstromwert","Ein Moduldatenblattwert gilt nur unter definierten Prüfbedingungen.","Maximale Anzahl Dachziegel"],"c":1,"why":"Der Merksatz lautet: Ein Moduldatenblattwert gilt nur unter definierten Prüfbedingungen.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Ein Moduldatenblattwert gilt nur unter definierten Prüfbedingungen."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["5.2.8a–c; 5.3.6b","Norm-/Regelwerk: NIN 2025 Abschnitt 7.12; ESTI 220; SN EN 62446-1","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: PV-Zellenkennlinien, MPP und MPPT"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: PV-Kennlinie, MPP und Ertragsfaktoren» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: PV-Kennlinie, MPP und Ertragsfaktoren» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"PV-Konfiguration ausschließlich am Simulator auslegen, Fotos einer bestehenden Anlage beurteilen; keine DC-Steckarbeiten. Halte zusätzlich die Antwort auf die Frage «Was bedeutet MPP?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Vergleiche als reine Rechenübung zwei hypothetische Modulkennlinien bei unterschiedlichen Temperaturen. Markiere die Daten, die für eine echte Stringplanung fehlen."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Was bedeutet MPP?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/3.07-A.svg"},{"id":"3.07-C","year":3,"title":"DC-Sicherheit, Stecksysteme und PV-Dokumentation","goals":["Verschattung, Ausrichtung, Ertrag, Eigenverbrauch","Stringplan, Lageplan, Typenschilder, normative Abgrenzung"],"parts":[{"heading":"Dein Dozent erklärt: DC-Sicherheit, Stecksysteme und PV-Dokumentation","text":"Heute geht es um dc-sicherheit, stecksysteme und pv-dokumentation. PV-DC-Strings können bei Tageslicht auch dann Spannung führen, wenn auf der AC-Seite abgeschaltet wird. Falsche oder unpassende Steckverbinder, schlechte Kontaktierung und ungünstige Leitungsführung können thermische Risiken und Lichtbögen verursachen. Planung, Herstellerfreigaben, Kennzeichnung, Trennstellen und Prüfprotokolle müssen deshalb zusammenpassen. Praktische DC-Steckarbeiten sind keine Selbstlernübung. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Analysiere Fotos einer bestehenden PV-Anlage ausschliesslich dokumentarisch: Stringplan, Stecksystemangaben, Leitungsführung, Trennstellen und Beschriftung. Erstelle eine Fragenliste an den bewilligten Betrieb, ohne Steckverbinder zu trennen oder den Wechselrichter zu öffnen. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Eine abgeschaltete AC-Seite bedeutet nicht spannungsfreie PV-Strings. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Verschattung, Ausrichtung, Ertrag, Eigenverbrauch; Stringplan, Lageplan, Typenschilder, normative Abgrenzung. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIN 2025 Abschnitt 7.12; ESTI 220; SN EN 62446-1. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"PV-Kennlinien sind temperaturabhängig","bridge":"Ein PV-Modul hat keinen festen Spannungswert über alle Betriebszustände. Einstrahlung, Zelltemperatur und Lastpunkt beeinflussen die Strom-Spannungs-Kennlinie. Für eine Stringplanung müssen insbesondere Leerlaufspannung bei niedriger Temperatur und Spannungsbereich des Wechselrichters betrachtet werden. Exakte Entscheidungen erfordern die realen Herstellerkennlinien und Normvorgaben.","exercise":"PV-Konfiguration ausschließlich am Simulator auslegen, Fotos einer bestehenden Anlage beurteilen; keine DC-Steckarbeiten. Halte zusätzlich die Antwort auf die Frage «Was gilt bei Lichteinfall für einen PV-String?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Vergleiche als reine Rechenübung zwei hypothetische Modulkennlinien bei unterschiedlichen Temperaturen. Markiere die Daten, die für eine echte Stringplanung fehlen.","solution":"Eine abgeschaltete AC-Seite bedeutet nicht spannungsfreie PV-Strings. Der Merksatz lautet: Eine abgeschaltete AC-Seite bedeutet nicht spannungsfreie PV-Strings. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was gilt bei Lichteinfall für einen PV-String?","options":["Er ist immer automatisch spannungsfrei","Er kann weiterhin gefährliche Gleichspannung liefern","Er wird zur reinen Datenleitung"],"c":1,"why":"Eine abgeschaltete AC-Seite bedeutet nicht spannungsfreie PV-Strings.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Eine abgeschaltete AC-Seite bedeutet nicht spannungsfreie PV-Strings."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Er wird zur reinen Datenleitung","Eine abgeschaltete AC-Seite bedeutet nicht spannungsfreie PV-Strings.","Er ist immer automatisch spannungsfrei"],"c":1,"why":"Der Merksatz lautet: Eine abgeschaltete AC-Seite bedeutet nicht spannungsfreie PV-Strings.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Eine abgeschaltete AC-Seite bedeutet nicht spannungsfreie PV-Strings."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["5.2.8a–c; 5.3.6b","Norm-/Regelwerk: NIN 2025 Abschnitt 7.12; ESTI 220; SN EN 62446-1","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Verschattung, Ausrichtung, Ertrag, Eigenverbrauch"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: DC-Sicherheit, Stecksysteme und PV-Dokumentation» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: DC-Sicherheit, Stecksysteme und PV-Dokumentation» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"PV-Konfiguration ausschließlich am Simulator auslegen, Fotos einer bestehenden Anlage beurteilen; keine DC-Steckarbeiten. Halte zusätzlich die Antwort auf die Frage «Was gilt bei Lichteinfall für einen PV-String?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Vergleiche als reine Rechenübung zwei hypothetische Modulkennlinien bei unterschiedlichen Temperaturen. Markiere die Daten, die für eine echte Stringplanung fehlen."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Was gilt bei Lichteinfall für einen PV-String?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/3.07-C.svg"},{"id":"3.08-A","year":3,"title":"NIV 14 und Abgrenzung der PV-Arbeiten","goals":["Grenzen Art. 14 und allgemeine Installationsbewilligung","ESTI 220 Abgrenzung DC/AC und Netzparallelbetrieb"],"parts":[{"heading":"Dein Dozent erklärt: NIV 14 und Abgrenzung der PV-Arbeiten","text":"Heute geht es um niv 14 und abgrenzung der pv-arbeiten. Die eingeschränkte Installationsbewilligung nach Art. 14 NIV betrifft bestimmte Anlagen und den festgelegten Bewilligungsumfang. Sie ersetzt keine allgemeine Installationsbewilligung für beliebige Gebäudeinstallationen. Der genaue Übergang zwischen PV-seitiger Installation, Anlageschalter, Hausverteilung und Netzanschluss ist anhand der jeweils geltenden ESTI-Weisung 220 zu prüfen. Betrieb, Qualifikation und Prüfpflichten bleiben getrennte Voraussetzungen. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Erstelle für ein fiktives Einfamilienhaus ein Blockschema vom PV-Modul bis zum Netzanschlusspunkt. Kennzeichne deutlich alle Stellen, an denen sich Zuständigkeiten ändern könnten. Gleiche den Sachverhalt mit der aktuellen ESTI-Weisung ab, bevor daraus irgendein Arbeitsumfang abgeleitet wird. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Eine Art.-14-Bewilligung ist keine Generalvollmacht für Hausinstallationen. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Grenzen Art. 14 und allgemeine Installationsbewilligung; ESTI 220 Abgrenzung DC/AC und Netzparallelbetrieb. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIV Art. 14, 23/24; NIN 7.12; ESTI 220; Swissolar. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"PV-Projekt umfasst Technik und Verfahren","bridge":"Planung, baurechtliche Abklärung, Anschlussgesuch, Messkonzept, Installation, Prüfung und Übergabe sind voneinander zu unterscheidende Schritte. Die Bewilligungslage hängt von der Tätigkeit ab. Auch die Dokumentation zu Kennzeichnung und Erstprüfung erfordert eine fachlich richtige und aktuelle Grundlage.","exercise":"Vorhandene private PV-Projekte als Planungs-Fallstudien anonymisieren; keine nachträglichen Eingriffe. Halte zusätzlich die Antwort auf die Frage «Welche Aussage zu NIV Art. 14 ist richtig?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Entwirf eine Prozessgrafik einer PV-Anlage von der Idee bis zur Übergabe und kennzeichne die Punkte, die eine berechtigte Fachperson bestätigen muss.","solution":"Eine Art.-14-Bewilligung ist keine Generalvollmacht für Hausinstallationen. Der Merksatz lautet: Eine Art.-14-Bewilligung ist keine Generalvollmacht für Hausinstallationen. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Welche Aussage zu NIV Art. 14 ist richtig?","options":["Die Bewilligung ist auf bestimmte Anlagen und den erteilten Umfang begrenzt","Sie ersetzt jede elektrische Prüfung","Sie erlaubt beliebige Hausverteilerumbauten"],"c":0,"why":"Eine Art.-14-Bewilligung ist keine Generalvollmacht für Hausinstallationen.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Eine Art.-14-Bewilligung ist keine Generalvollmacht für Hausinstallationen."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Sie ersetzt jede elektrische Prüfung","Eine Art.-14-Bewilligung ist keine Generalvollmacht für Hausinstallationen.","Sie erlaubt beliebige Hausverteilerumbauten"],"c":1,"why":"Der Merksatz lautet: Eine Art.-14-Bewilligung ist keine Generalvollmacht für Hausinstallationen.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Eine Art.-14-Bewilligung ist keine Generalvollmacht für Hausinstallationen."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest D
