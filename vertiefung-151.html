ahlenwert muss auf Plausibilität geprüft werden. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Wähle zufällig drei Themen aus Ohmschem Gesetz, RLC, Drehstrom, Transformator und PV-Stringplanung. Erkläre jedes Thema fünf Minuten lang mit einer Formel und einem Praxisbeispiel. Nenne abschliessend eine typische Fehlerannahme. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Ein verständlicher Aufbau zeigt, ob ein Konzept wirklich verstanden wurde. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Anlagedokumentation und Installationspläne; Elektrotechnik und Elektronik. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: BiVo2015 Wegleitung QV BK Pos. 1,2,6; EIT Musterserien. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Ein Fachgespräch prüft Begründungskompetenz","bridge":"Wer eine technische Lösung erklären kann, benennt Annahmen, relevante Regeln, Prüfschritte und Alternativen. Auswendig gelernte Formeln genügen nicht, wenn wesentliche Randbedingungen fehlen. Gute Antworten unterscheiden sichere Beobachtungen von Vermutungen und geben offen an, wann fachliche Freigabe erforderlich ist.","exercise":"Mindestens vier simulierte mündliche Prüfungsgespräche; 20 Minuten je Session mit fachkundiger Person. Halte zusätzlich die Antwort auf die Frage «Was gehört zu einer überzeugenden technischen Erklärung?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erkläre ein gewähltes Schaltbild in zwei Minuten und beantworte danach drei Rückfragen zu Annahmen, Sicherheitsgrenzen und Nachweisen.","solution":"Ein verständlicher Aufbau zeigt, ob ein Konzept wirklich verstanden wurde. Der Merksatz lautet: Ein verständlicher Aufbau zeigt, ob ein Konzept wirklich verstanden wurde. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was gehört zu einer überzeugenden technischen Erklärung?","options":["Nur die Endzahl ohne Einheit","Begriff, Zusammenhang, Beispiel und Grenzen","Nur eine Zeichnung ohne Erläuterung"],"c":1,"why":"Ein verständlicher Aufbau zeigt, ob ein Konzept wirklich verstanden wurde.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Ein verständlicher Aufbau zeigt, ob ein Konzept wirklich verstanden wurde."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Nur eine Zeichnung ohne Erläuterung","Ein verständlicher Aufbau zeigt, ob ein Konzept wirklich verstanden wurde.","Nur die Endzahl ohne Einheit"],"c":1,"why":"Der Merksatz lautet: Ein verständlicher Aufbau zeigt, ob ein Konzept wirklich verstanden wurde.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Ein verständlicher Aufbau zeigt, ob ein Konzept wirklich verstanden wurde."},{"q":"Wie lässt sich dieses Thema im Selbststudium veran fragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Was gehört zu einer überzeugenden technischen Erklärung?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/4.10-B.svg"},{"id":"4.10-C","year":4,"title":"Kommunikation, Steuerung und Prüfung unter Zeitdruck","goals":["Elektrische Systemtechnik mit PV","Steuerung und Gebäudeautomation, Kommunikation"],"parts":[{"heading":"Dein Dozent erklärt: Kommunikation, Steuerung und Prüfung unter Zeitdruck","text":"Heute geht es um kommunikation, steuerung und prüfung unter zeitdruck. Die mündliche Prüfung verlangt Themenwechsel und präzise Fachbegriffe. Typische Bereiche sind Kommunikationsverkabelung, Steuerungslogik, Gebäudeautomation und Dokumentation. Mit einer festen Antwortstruktur lassen sich auch komplexe Fragen effizient bearbeiten: Funktion beschreiben, Schema skizzieren, Fehlerfall nennen und geeignete Kontrolle angeben. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Simuliere vier Runden mit je fünf Minuten: Relais-Selbsthaltung, KNX-Gruppenadresse, Ethernet-Fehler und PV-Dokumentation. Bewerte Dich auf fachliche Richtigkeit, klare Sprache, Sicherheit und Vollständigkeit. Lass einen Fachmann bei Gelegenheit Rückmeldung geben. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Zeitdruck wird mit Struktur besser beherrscht als mit geratenen Antworten. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Elektrische Systemtechnik mit PV; Steuerung und Gebäudeautomation, Kommunikation. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: BiVo2015 Wegleitung QV BK Pos. 1,2,6; EIT Musterserien. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Ein Fachgespräch prüft Begründungskompetenz","bridge":"Wer eine technische Lösung erklären kann, benennt Annahmen, relevante Regeln, Prüfschritte und Alternativen. Auswendig gelernte Formeln genügen nicht, wenn wesentliche Randbedingungen fehlen. Gute Antworten unterscheiden sichere Beobachtungen von Vermutungen und geben offen an, wann fachliche Freigabe erforderlich ist.","exercise":"Mindestens vier simulierte mündliche Prüfungsgespräche; 20 Minuten je Session mit fachkundiger Person. Halte zusätzlich die Antwort auf die Frage «Was ist bei einer mündlichen Prüfung unter Zeitdruck sinnvoll?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erkläre ein gewähltes Schaltbild in zwei Minuten und beantworte danach drei Rückfragen zu Annahmen, Sicherheitsgrenzen und Nachweisen.","solution":"Zeitdruck wird mit Struktur besser beherrscht als mit geratenen Antworten. Der Merksatz lautet: Zeitdruck wird mit Struktur besser beherrscht als mit geratenen Antworten. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was ist bei einer mündlichen Prüfung unter Zeitdruck sinnvoll?","options":["Jeden Satz ohne Begründung wiederholen","Reines Raten technischer Grenzwerte","Eine klare Antwortstruktur mit Fachskizze"],"c":2,"why":"Zeitdruck wird mit Struktur besser beherrscht als mit geratenen Antworten.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Zeitdruck wird mit Struktur besser beherrscht als mit geratenen Antworten."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Jeden Satz ohne Begründung wiederholen","Zeitdruck wird mit Struktur besser beherrscht als mit geratenen Antworten.","Reines Raten technischer Grenzwerte"],"c":1,"why":"Der Merksatz lautet: Zeitdruck wird mit Struktur besser beherrscht als mit geratenen Antworten.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Zeitdruck wird mit Struktur besser beherrscht als mit geratenen Antworten."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["2–6 (gesamte BK und PA)","Norm-/Regelwerk: BiVo2015 Wegleitung QV BK Pos. 1,2,6; EIT Musterserien","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Elektrische Systemtechnik mit PV"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Kommunikation, Steuerung und Prüfung unter Zeitdruck» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Kommunikation, Steuerung und Prüfung unter Zeitdruck» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Mindestens vier simulierte mündliche Prüfungsgespräche; 20 Minuten je Session mit fachkundiger Person. Halte zusätzlich die Antwort auf die Frage «Was ist bei einer mündlichen Prüfung unter Zeitdruck sinnvoll?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erkläre ein gewähltes Schaltbild in zwei Minuten und beantworte danach drei Rückfragen zu Annahmen, Sicherheitsgrenzen und Nachweisen."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Was ist bei einer mündlichen Prüfung unter Zeitdruck sinnvoll?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/4.10-C.svg"},{"id":"4.11-A","year":4,"title":"Schriftliche Prüfung: Mathematik und Elektrotechnik","goals":["Normenkunde unter Zeitdruck","Schaltplan und Installationsplan"],"parts":[{"heading":"Dein Dozent erklärt: Schriftliche Prüfung: Mathematik und Elektrotechnik","text":"Heute geht es um schriftliche prüfung: mathematik und elektrotechnik. Das schriftliche Qualifikationsverfahren verlangt neben Rechnen auch Fachbeurteilung und sichere Normenorientierung. Wer nur Formeln auswendig lernt, scheitert an veränderten Aufgabentexten. Die Prüfungsvorbereitung sollte daher Rechenweg, Einheitenkontrolle, Plausibilisierung und Fehleranalyse trainieren. Die genaue Struktur und Hilfsmittelregelung bestimmt das gültige QV-Aufgebot. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Stelle zwanzig eigene Aufgaben zusammen: Ohmsches Gesetz, Energie, Leistungsfaktor, RLC, Drehstrom, Transformator und Spannungsfallmodell. Begrenze die Bearbeitungszeit und kontrolliere nicht nur das Endresultat, sondern auch Zwischenschritte und Einheiten. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Die richtige Einheit ist Teil einer richtigen Berechnung. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Normenkunde unter Zeitdruck; Schaltplan und Installationsplan. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: BiVo2015 Wegleitung QV und EIT BK-Musterserien. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Schriftliche Prüfungen erfordern Transfer","bridge":"Bei einer Prüfungsaufgabe müssen Aufgabenstellung, gegebene Daten, gesuchte Grösse und geeignete Methode zuerst sauber getrennt werden. Das Rechenergebnis ist dann mit Einheit und Plausibilität zu beurteilen. Ein falscher Ansatz lässt sich nicht durch präzisere Dezimalstellen korrigieren.","exercise":"Eine beaufsichtigte 6-stündige Eigenprüfung in zwei Blöcken; Hilfsmittel wie im aktuellen QV-Aufgebot. Halte zusätzlich die Antwort auf die Frage «Was gehört zu einer belastbaren schriftlichen Rechnung?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Bearbeite eine gemischte Übungsprüfung und vermerke zu jedem Fehler, ob er aus Begriff, Modell, Rechnen oder Normenwissen entstanden ist.","solution":"Die richtige Einheit ist Teil einer richtigen Berechnung. Der Merksatz lautet: Die richtige Einheit ist Teil einer richtigen Berechnung. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was gehört zu einer belastbaren schriftlichen Rechnung?","options":["Nur eine Zahl ohne Kontext","Rechenweg, Einheit und Plausibilitätsprüfung","Nur die verwendete Taschenrechnermarke"],"c":1,"why":"Die richtige Einheit ist Teil einer richtigen Berechnung.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Die richtige Einheit ist Teil einer richtigen Berechnung."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Nur die verwendete Taschenrechnermarke","Die richtige Einheit ist Teil einer richtigen Berechnung.","Nur eine Zahl ohne Kontext"],"c":1,"why":"Der Merksatz lautet: Die richtige Einheit ist Teil einer richtigen Berechnung.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Die richtige Einheit ist Teil einer richtigen Berechnung."},{"q":"Wie lässt sich d "title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Was gehört zu einer belastbaren schriftlichen Rechnung?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/4.11-A.svg"},{"id":"4.11-B","year":4,"title":"Schriftliche Prüfung: NIN, Pläne und Systemtechnik","goals":["Elektrische Berechnungen RLC und Drehstrom","Installations-/Systemtechnik"],"parts":[{"heading":"Dein Dozent erklärt: Schriftliche Prüfung: NIN, Pläne und Systemtechnik","text":"Heute geht es um schriftliche prüfung: nin, pläne und systemtechnik. Normenwissen wird besonders belastbar, wenn Du die passende Regelstelle zu einem technischen Sachverhalt findest. Der alte Bildungsplan enthält Fachthemen aus Installationstechnik, Schutz, Kommunikation und Dokumentation. Aufgabenformate können Pläne, Fallbeispiele und technische Kurzantworten verbinden. Exakte Normwerte dürfen erst mit zugänglicher Originalnorm geprüft werden. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Erstelle eine Übungsprüfung mit zehn Fällen: Badezimmer, Leitungsschutz, Erstprüfung, PV, Verteilung, Schaltzeichen, Steuerung, Kommunikation, Messprotokoll und Anschlussbedingungen. Trenne die Musterlösungen von den Aufgaben und notiere die verwendeten Quellen. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Normennachschlagen ist eine methodische Fähigkeit. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Elektrische Berechnungen RLC und Drehstrom; Installations-/Systemtechnik. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: BiVo2015 Wegleitung QV und EIT BK-Musterserien. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Schriftliche Prüfungen erfordern Transfer","bridge":"Bei einer Prüfungsaufgabe müssen Aufgabenstellung, gegebene Daten, gesuchte Grösse und geeignete Methode zuerst sauber getrennt werden. Das Rechenergebnis ist dann mit Einheit und Plausibilität zu beurteilen. Ein falscher Ansatz lässt sich nicht durch präzisere Dezimalstellen korrigieren.","exercise":"Eine beaufsichtigte 6-stündige Eigenprüfung in zwei Blöcken; Hilfsmittel wie im aktuellen QV-Aufgebot. Halte zusätzlich die Antwort auf die Frage «Was braucht eine normbezogene Musterlösung?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Bearbeite eine gemischte Übungsprüfung und vermerke zu jedem Fehler, ob er aus Begriff, Modell, Rechnen oder Normenwissen entstanden ist.","solution":"Normennachschlagen ist eine methodische Fähigkeit. Der Merksatz lautet: Normennachschlagen ist eine methodische Fähigkeit. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz" en und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Plane zwei mehrstündige eigenständige Theorieprüfungsblöcke. Erfasse pro Aufgabe Bearbeitungszeit, erreichte Punkte und Fehlerursache. Sortiere die Themen nach Risiko und baue aus den fünf schwächsten Gebieten neue Übungssätze auf. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Prüfungssimulationen dienen der Diagnose des Lernstands. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Kommunikationstechnik; Fehleranalyse, Notenberechnung, Wiederholung schwacher Themen. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: BiVo2015 Wegleitung QV und EIT BK-Musterserien. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Schriftliche Prüfungen erfordern Transfer","bridge":"Bei einer Prüfungsaufgabe müssen Aufgabenstellung, gegebene Daten, gesuchte Grösse und geeignete Methode zuerst sauber getrennt werden. Das Rechenergebnis ist dann mit Einheit und Plausibilität zu beurteilen. Ein falscher Ansatz lässt sich nicht durch präzisere Dezimalstellen korrigieren.","exercise":"Eine beaufsichtigte 6-stündige Eigenprüfung in zwei Blöcken; Hilfsmittel wie im aktuellen QV-Aufgebot. Halte zusätzlich die Antwort auf die Frage «Was sollte nach einer Probeklausur entstehen?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Bearbeite eine gemischte Übungsprüfung und vermerke zu jedem Fehler, ob er aus Begriff, Modell, Rechnen oder Normenwissen entstanden ist.","solution":"Prüfungssimulationen dienen der Diagnose des Lernstands. Der Merksatz lautet: Prüfungssimulationen dienen der Diagnose des Lernstands. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was sollte nach einer Probeklausur entstehen?","options":["Ein konkreter Plan für die grössten Wissenslücken","Ein sofortiges Löschen aller Fehler","Nur ein Gesamtgefühl"],"c":0,"why":"Prüfungssimulationen dienen der Diagnose des Lernstands.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Prüfungssimulationen dienen der Diagnose des Lernstands."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Ein sofortiges Löschen aller Fehler","Prüfungssimulationen dienen der Diagnose des Lernstands.","Nur ein Gesamtgefühl"],"c":1,"why":"Der Merksatz lautet: Prüfungssimulationen dienen der Diagnose des Lernstands.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Prüfungssimulationen dienen der Diagnose des Lernstands."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie "year":4,"title":"Praktisches QV: Auftrag und Arbeitsvorbereitung","goals":["Arbeitsvorbereitung, Sicherheitsverhalten und Materialplanung","Technische Dokumentation"],"parts":[{"heading":"Dein Dozent erklärt: Praktisches QV: Auftrag und Arbeitsvorbereitung","text":"Heute geht es um praktisches qv: auftrag und arbeitsvorbereitung. Das bisherige QV umfasst eine umfangreiche praktische Arbeit in einer geeigneten Prüfungsumgebung. Dazu gehören Aufgabeninterpretation, Arbeitsvorbereitung, Materialbereitstellung, sicherer Arbeitsablauf und technische Dokumentation. Die genaue Gewichtung und die geltenden Prüfungsunterlagen bestimmt die offizielle Wegleitung. Ein Selbstlernprogramm darf nicht als Ersatz für das Üben unter fachkundiger Aufsicht verstanden werden. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Nimm eine offizielle Musteraufgabe, sofern rechtmässig zugänglich, und erarbeite zunächst auf Papier Zeitplan, Stückliste, Sicherheitsfragen, Dokumente und Prüfschritte. Keine Haus- oder Netzinstallation als privates Prüfungsprojekt verwenden. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Praktische QV-Reife entsteht durch betreutes Können, nicht allein durch Lesen. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Arbeitsvorbereitung, Sicherheitsverhalten und Materialplanung; Technische Dokumentation. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: BiVo2015 Wegleitung QV; Musterserie PA; NIN; Suva. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Praktische Kompetenz bleibt nachweispflichtig","bridge":"Eine digitale Simulation kann die Planung, Analyse und Reflexion unterstützen. Sie dokumentiert aber nicht die sichere Durchführung einer Elektroinstallation, die Messkompetenz oder die Ausführung in einer beaufsichtigten Werkstatt. Für die formelle QV-Zulassung zählen die zuständigen Stellen und die verlangten Praxisnachweise.","exercise":"Ausschliesslich in offiziell ausgerüsteter Übungswerkstatt mit fachkundiger Aufsicht und gültigen Berechtigungen; nicht als DIY-Hausprojekt. Halte zusätzlich die Antwort auf die Frage «Was gehört an den Beginn einer praktischen Prüfungsaufgabe?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Stelle ein Portfolio zusammen, das Theoriebescheinigungen und von Fachpersonen bestätigte Praxisnachweise getrennt erfasst.","solution":"Praktische QV-Reife entsteht durch betreutes Können, nicht allein durch Lesen. Der Merksatz lautet: Praktische QV-Reife entsteht durch betreutes Können, nicht allein durch Lesen. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was gehört an den Beginn einer praktischen Prüfungsaufgabe?","options":["Nur einen Taschenrechner starten","Ohne Plan sofort verdrahten","Auftrag verstehen und Arbeitsvorbereitung"],"c":2 . Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Praktisches QV: Auftrag und Arbeitsvorbereitung» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Ausschliesslich in offiziell ausgerüsteter Übungswerkstatt mit fachkundiger Aufsicht und gültigen Berechtigungen; nicht als DIY-Hausprojekt. Halte zusätzlich die Antwort auf die Frage «Was gehört an den Beginn einer praktischen Prüfungsaufgabe?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Stelle ein Portfolio zusammen, das Theoriebescheinigungen und von Fachpersonen bestätigte Praxisnachweise getrennt erfasst."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Was gehört an den Beginn einer praktischen Prüfungsaufgabe?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/4.12-A.svg"},{"id":"4.12-B","year":4,"title":"Praktisches QV: Ausführung und Erstprüfung unter Aufsicht","goals":["Stark-/Schwachstrominstallationen","Schaltgerätekombination und Steuerungstechnik"],"parts":[{"heading":"Dein Dozent erklärt: Praktisches QV: Ausführung und Erstprüfung unter Aufsicht","text":"Heute geht es um praktisches qv: ausführung und erstprüfung unter aufsicht. In der praktischen EFZ-Prüfung wird beurteilt, ob berufliche Aufgaben fachlich, sicher, systematisch und innerhalb eines Zeitrahmens ausgeführt werden. Dazu zählt der korrekte Umgang mit Arbeitsmitteln und die fachgerechte Prüfung der Installation. Netzspannungsarbeiten können nur im dafür vorgesehenen Ausbildungs- und Prüfungsrahmen durchgeführt werden. Ein eigenes Haus ist keine private Prüfungswerkstatt. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Erstelle einen Kompetenznachweis, in dem die Ausführungskriterien nach Bauteil, mechanischer Qualität, Kennzeichnung, Schutzkonzept, Prüfverfahren und Dokumentation aufgeschlüsselt sind. Trage für praktische Felder «noch nicht unter Fachaufsicht nachgewiesen» ein, bis entsprechende Übungsnachweise existieren. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Praktische Kompetenz muss unter zulässigen Bedingungen tatsächlich nachgewiesen werden. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Stark-/Schwachstrominstallationen; Schaltgerätekombination und Steuerungstechnik. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: BiVo2015 Wegleitung QV; Musterserie PA; NIN; Suva. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Praktische Kompetenz bleibt nachweispflichtig","bridge":"Eine digitale Simulation kann die Planung, Analyse und Reflexion unterstützen. Sie dokumentiert aber nicht die sichere Durchführung einer Elektroinstallation, die Messkompetenz oder die Ausführung in einer beaufsichtigten Werkstatt. Für die formelle QV-Zulassung zählen die zuständigen Stellen und die verlangten Praxisnachweise.","exercise":"Ausschliesslich in offiziell ausgerüsteter Übungswerkstatt mit fachkundiger Aufsicht und gültigen Berechtigungen; nicht als DIY-Hausprojekt. Halte zusätzlich die Antwort auf die Frage «Was ersetzt eine fachlich beaufsichtigte praktische Prüfung nicht?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Stelle ein Portfolio zusammen, das Theoriebescheinigungen und von Fachpersonen bestätigte Praxisnachweise getrennt erfasst.","solution":"Praktische Kompetenz muss unter zulässigen Bedingungen tatsächlich nachgewiesen werden. Der Merksatz lautet: Praktische Kompetenz muss unter zulässigen Bedingungen tatsächlich nachgewiesen werden. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was ersetzt eine fachlich beaufsichtigte praktische Prüfung nicht?","options":["Ein reines Online-Quiz","Ein echtes fachkundiges Prüfungsfeedback","Eine anerkannte praktische Übung"],"c":0,"why":"Praktische Kompetenz muss unter zulässigen Bedingungen tatsächlich nachgewiesen werden.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Praktische Kompetenz muss unter zulässigen Bedingungen tatsächlich nachgewiesen werden."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Ein echtes fachkundiges Prüfungsfeedback","Praktische Kompetenz muss unter zulässigen Bedingungen tatsächlich nachgewiesen werden.","Eine anerkannte praktische Übung"],"c":1,"why":"Der Merksatz lautet: Praktische Kompetenz muss unter zulässigen Bedingungen tatsächlich nachgewiesen werden.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Praktische Kompetenz muss unter zulässigen Bedingungen tatsächlich nachgewiesen werden."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["Sämtliche betrieblichen/üK-Kompetenzen; QV PA Pos. 1–7","Norm-/Regelwerk: BiVo2015 Wegleitung QV; Musterserie PA; NIN; Suva","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Stark-/Schwachstrominstallationen"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Praktisches QV: Ausführung und Erstprüfung unter Aufsicht» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Praktisches QV: Ausführung und Erstprüfung unter Aufsicht» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Ausschliesslich in offiziell ausgerüsteter Übungswerkstatt mit fachkundiger Aufsicht und gültigen Berechtigungen; nicht als DIY-Hausprojekt. Halte zusätzlich die Antwor ner sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["Sämtliche betrieblichen/üK-Kompetenzen; QV PA Pos. 1–7","Norm-/Regelwerk: BiVo2015 Wegleitung QV; Musterserie PA; NIN; Suva","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Prüfung, Messung und Störungssuche"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Abschlussreview und individueller Weg zur Zulassung» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Abschlussreview und individueller Weg zur Zulassung» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Ausschliesslich in offiziell ausgerüsteter Übungswerkstatt mit fachkundiger Aufsicht und gültigen Berechtigungen; nicht als DIY-Hausprojekt. Halte zusätzlich die Antwort auf die Frage «Was ist ausser fachlichem Wissen für die EFZ-Prüfung erforderlich?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Stelle ein Portfolio zusammen, das Theoriebescheinigungen und von Fachpersonen bestätigte Praxisnachweise getrennt erfasst."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Was ist ausser fachlichem Wissen für die EFZ-Prüfung erforderlich?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/4.12-C.svg"},{"id":"N-S01","year":1,"title":"Wer trägt bei elektrischen Arbeiten welche Verantwortung?","goals":["Ein Elektroschema beschreibt den Stromkreis; ein sicherer Arbeitsauftrag beschreibt zusätzlich Menschen, Verantwortlichkeiten und Freigaben. In der Praxis scheitert Sicherheit oft nicht am fehlenden Messgerät, sondern an ungeklärter Zuständigkeit.","Du sollst ein Maschinenfeld nachrüsten. Ein Kollege sagt: „Die Sicherung habe ich gestern ausgeschaltet.“ Wer darf den Beginn freigeben und welche Informationen fehlen?"],"parts":[{"heading":"Vier Rollen bewusst auseinanderhalten","text":"Die Norm arbeitet mit Rollen für die Gesamtanlage, die Betriebsführung, die konkrete Arbeit und die ausführende Person. Ein Betrieb kann organisatorisch mehrere Rollen auf Personen verteilen; entscheidend ist, dass sie für den Auftrag eindeutig zugewiesen sind. Eine qualifizierte Fachperson darf aus ihrer Ausbildung nicht ableiten, dass sie ohne Auftrag und ohne Abstimmung überall eingreifen darf.","formula":""},{"heading":"Sicherheitsinformation ist Teil der Technik","text":"Vor Beginn braucht der Arbeitsverantwortliche Kenntnis der Anlage, der Energiequellen, der Arbeitsstelle und der möglichen Rückspeisungen. Ein Schema mit veraltetem Stand kann gefährlicher sein als keines, wenn sich Beteiligte blind darauf verlassen. Änderungen, Schaltzustände und die Arbeitsfreigabe müssen für alle Beteiligten unmissverständlich sein.","formula":""},{"heading":"Stoppen ist eine Fachentscheidung","text":"Wenn eine Rückspeisequelle, ein unbekanntes Kabel oder eine fehlende Freigabe auftaucht, wird nicht improvisiert. Die richtige fachliche Reaktion lautet: Tätigkeit unterbrechen, Zustand sichern, Verantwortliche informieren und erst nach erneuter Gefährdungsbeurteilung fortsetzen.","formula":""}],"bridgeTitle":"Spezifische Fallstudie auf Grundlage der genannten Normausgabe; normativer Einzelabgleich ausstehend.","bridge":"Ein Elektroschema beschreibt den Stromkreis; ein sicherer Arbeitsauftrag beschreibt zusätzlich Menschen, Verantwortlichkeiten und Freigaben. In der Praxis scheitert Sicherheit oft nicht am fehlenden Messgerät, sondern an ungeklärter Zuständigkeit.","exercise":"Du sollst ein Maschinenfeld nachrüsten. Ein Kollege sagt: „Die Sicherung habe ich gestern ausgeschaltet.“ Wer darf den Beginn freigeben und welche Informationen fehlen?","solution":"Ohne definierte verantwortliche Person und nachgewiesene sichere Arbeitsbedingungen beginnt die Arbeit nicht. Die Aussage „gestern“ liefert keinen verlässlichen aktuellen Schaltzustand. Erforderlich sind aktueller Anlagenzustand, eindeutige Trennstellen, mögliche Fremdversorgung und die geregelte Arbeitsfreigabe.","quiz":[{"q":"Was ersetzt die klare Zuordnung der Arbeitsverantwortung?","options":["Eine akademische Ausbildung","Nichts – die Rollen müssen festgelegt sein","Ein ausreichend aktueller Schaltplan"],"c":1,"why":"Eine Qualifikation ersetzt keine organisatorische Arbeitsfreigabe.\n\nBezug zum Unterrichtsteil «Sicherheitsinformation ist Teil der Technik»: Änderungen, Schaltzustände und die Arbeitsfreigabe müssen für alle Beteiligten unmissverständlich sein."},{"q":"Ein ungekennzeichneter Einspeisepunkt wird entdeckt. Was ist richtig?","options":["Arbeit stoppen und klären","Kabel zunächst berühren","Nur schneller arbeiten"],"c":0,"why":"Unklare Energiequellen erfordern Unterbrechung und erneute Klärung."},{"q":"Wofür ist die Übergabe eines aktuellen Schaltzustands wichtig?","options":["Nur zur Abrechnung","Für sichere Kommunikation und Arbeitsfreigabe","Damit weniger Zeichnungen nötig sind"],"c":1,"why":"Die Information muss für alle Beteiligten eindeutig sein.\n\nBezug zum Unterrichtsteil «Sicherheitsinformation ist Teil der Technik»: Änderungen, Schaltzustände und die Arbeitsfreigabe müssen für alle Beteiligten unmissverständlich sein."}],"refs":["SN EN 50110-1:2023","3.2","4.2","4.3","4.4"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Ein Elektroschema beschreibt den Stromkreis; ein sicherer Arbeitsauftrag beschreibt zusätzlich Menschen, Verantwortlichkeiten und Freigaben. In der Praxis scheitert Sicherheit oft nicht am fehlenden Messgerät, sondern an ungeklärter Zuständigkeit."},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Vier Rollen bewusst auseinanderhalten» und «Sicherheitsinformation ist Teil der Technik». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Vier Rollen bewusst auseinanderhalten» und «Stoppen ist eine Fachentscheidung». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Du sollst ein Maschinenfeld nachrüsten. Ein Kollege sagt: „Die Sicherung habe ich gestern ausgeschaltet.“ Wer darf den Beginn freigeben und welche Informationen fehlen?"},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Was ersetzt die klare Zuordnung der Arbeitsverantwortung?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/N-S01.svg"},{"id":"N-S02","year":1,"title":"Die fünf Sicherheitsregeln wirklich verstehen","goals":["Die fünf Sicherheitsregeln sind kein auswendig gelernter Spruch, sondern eine aufeinander abgestimmte Barrierenkette. Jede Regel verhindert einen anderen Fehler. Besonders bei PV, Batteriespeichern und USV ist das Denken in mehreren Energiequellen zentral.","Die Stromversorgung eines Wechselrichters ist AC-seitig abgeschaltet, aber die PV-Module sind beleuchtet. Ist die Wechselrichtereinheit dadurch vollständig energiefrei?"],"parts":[{"heading":"Energiequellen vollständig identifizieren","text":"Eine Anlage kann aus dem öffentlichen Netz, einer PV-Anlage, einem Speicher oder einem Kondensator Energie erhalten. Vor dem Freischalten werden die möglichen Quellen anhand aktueller Unterlagen und einer Begehung identifiziert. Ein einziger ausgeschalteter Leitungsschutzschalter beweist keine Spannungsfreiheit.","formula":""},{"heading":"Trennen, sichern und prüfen","text":"Erstens vollständig freischalten, zweitens gegen Wiedereinschalten sichern, drittens Spannungsfreiheit mit geeignetem Prüfmittel feststellen. Eine Status-LED, eine App-Anzeige oder ein auf Null stehendes Display sind kein Ersatz für eine geeignete elektrische Prüfung. Prüfmittel und Verfahren müssen zur Anlage und zum zulässigen Arbeitsauftrag passen.","formula":""},{"heading":"Erden, kurzschliessen und Nachbarteile schützen","text":"Viertens wird, wo erforderlich, geerdet und kurzgeschlossen; die konkreten Bedingungen unterscheiden sich nach Anlage und Gefährdung. Fünftens sind benachbarte, unter Spannung stehende Teile abzudecken oder abzuschranken. Keine dieser Massnahmen berechtigt Unqualifizierte zum Arbeiten an Netzspannung.","formula":""}],"bridgeTitle":"Spezifische Fallstudie auf Grundlage der genannten Normausgabe; normativer Einzelabgleich ausstehend.","bridge":"Die fünf Sicherheitsregeln sind kein auswendig gelernter Spruch, sondern eine aufeinander abgestimmte Barrierenkette. Jede Regel verhindert einen anderen Fehler. Besonders bei PV, Batteriespeichern und USV ist das Denken in mehreren Energiequellen zentral.","exercise":"Die Stromversorgung eines Wechselrichters ist AC-seitig abgeschaltet, aber die PV-Module sind beleuchtet. Ist die Wechselrichtereinheit dadurch vollständig energiefrei?","solution":"Nein. Die DC-Seite bleibt unter Lichteinwirkung potenziell spannungsführend; zusätzlich können interne Energiespeicher vorhanden sein. Die relevanten Herstelleranweisungen, Trennstellen und Entladezeiten sind zu berücksichtigen. Die konkrete sichere Arbeitsmethode darf nur von berechtigten Fachpersonen bestimmt und ausgeführt werden.","quiz":[{"q":"Welche Aussage belegt Spannungsfreiheit?","options":["Leuchtende grüne LED","Geeignete, fachgerecht durchgeführte Spannungsprüfung","Abgeschalteter Hauptschalter allein"],"c":1,"why":"Eine Bedienanzeige oder Schalterstellung ist kein geeigneter alleiniger Nachweis.\n\nBezug zum Unterrichtsteil «Trennen, sichern und prüfen»: Eine Status-LED, eine App-Anzeige oder ein auf Null stehendes Display sind kein Ersatz für eine geeignete elektrische Prüfung."},{"q":"Was ist bei der PV-DC-Seite besonders zu berücksichtigen?","options":["Sie ist nachts wie tags garantiert spannungsfrei","Beleuchtete Module können weiterhin Spannung liefern","Eine AC-Trennung schaltet Module mechanisch ab"],"c":1,"why":"Die PV-Energiequelle ist nicht durch die AC-Trennung beseitigt."},{"q":"Was ist der Zweck des Schutzes benachbarter Teile?","options":["Dokumentation sparen","Berührungs- und Annäherungsgefahren vermeiden","Den Stromfluss erhöhen"],"c":1,"why":"Der fünfte Schritt grenzt benachbarte gefährliche Teile ab.\n\nBezug zum Unterrichtsteil «Erden, kurzschliessen und Nachbarteile schützen»: Fünftens sind benachbarte, unter Spannung stehende Teile abzudecken oder abzuschranken."}],"refs":["SN EN 50110-1:2023","6.2","6.2.2–6.2.6"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Die fünf Sicherheitsregeln sind kein auswendig gelernter Spruch, sondern eine aufeinander abgestimmte Barrierenkette. Jede Regel verhindert einen anderen Fehler. Besonders bei PV, Batteriespeichern und USV ist das Denken in mehreren Energiequellen zentral."},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Energiequellen vollständig identifizieren» und «Trennen, sichern und prüfen». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Energiequellen vollständig identifizieren» und «Erden, kurzschliessen und Nachbarteile schützen». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Die Stromversorgung eines Wechselrichters ist AC-seitig abgeschaltet, aber die PV-Module sind beleuchtet. Ist die Wechselrichtereinheit dadurch vollständig energiefrei?"},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Welche Aussage belegt Spannungsfreiheit?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/N-S02.svg"},{"id":"N-S03","year":2,"title":"Messen, Erproben, Besichtigen – drei verschiedene Tätigkeiten","goals":["In der Alltagssprache heisst vieles „messen“. Die Norm unterscheidet betriebliche Messungen, gezielte Erprobungen und Inspektionen. Diese Tätigkeiten können ganz unterschiedliche Gefährdungen auslösen.","An einer Anlage wurde eine neue Verteilertür montiert. Welche drei unterschiedlichen Nachweise würdest Du in einer fiktiven Prüfplanung vorsehen?"],"parts":[{"heading":"Eine Messung kann die Situation verändern","text":"Das Messgerät wird Teil des Stromkreises, insbesondere bei Strommessungen. Messkategorie, Spannungsbereich, geeignete Leitungen und der Zustand des Gerätes müssen passen. Ein falsch ausgewählter Messbereich oder eine ungünstige Leitungsführung kann einen Kurzschluss verursachen.","formula":""},{"heading":"Erprobung ist mehr als ein Zahlenwert","text":"Bei Funktionsprüfungen kann ein Betriebsmittel anlaufen oder ein Schutzgerät betätigen. Deshalb müssen die Auswirkungen auf andere Personen, Prozesse und verbundene Anlagen vorab bewertet werden. Eine Maschine darf beispielsweise nicht unkontrolliert anlaufen, nur weil ein Eingang getestet wird.","formula":""},{"heading":"Besichtigen ist ein eigenständiger Prüfschritt","text":"Vor einer Messung liefert die Sichtprüfung Hinweise auf fehlende Abdeckungen, ungeeignete Leiterführung, beschädigte Isolation oder falsche Kennzeichnung. Sichtprüfung, Erprobung und Messung ergänzen sich; keine davon macht die beiden anderen überflüssig.","formula":""}],"bridgeTitle":"Spezifische Fallstudie auf Grundlage der genannten Normausgabe; normativer Einzelabgleich ausstehend.","bridge":"In der Alltagssprache heisst vieles „messen“. Die Norm unterscheidet betriebliche Messungen, gezielte Erprobungen und Inspektionen. Diese Tätigkeiten können ganz unterschiedliche Gefährdungen auslösen.","exercise":"An einer Anlage wurde eine neue Verteilertür montiert. Welche drei unterschiedlichen Nachweise würdest Du in einer fiktiven Prüfplanung vorsehen?","solution":"Sichtprüfung von Abdeckungen/Kennzeichnung und Schutzleiterverbindungen, geeignete Funktionsprüfung von Verriegelungen sowie nur durch Fachpersonen durchgeführte elektrische Prüfungen. Die konkrete Auswahl und Reihenfolge richtet sich nach Anlage, Norm und Hersteller.","quiz":[{"q":"Welcher Punkt gehört primär zur Sichtprüfung?","options":["Beschriftung und Gehäuseschäden","Oszillogramm speichern","Isolationsspannung anlegen"],"c":0,"why":"Kennzeichnung und sichtbare Mängel werden beim Besichtigen beurteilt.\n\nBezug zum Unterrichtsteil «Besichtigen ist ein eigenständiger Prüfschritt»: Vor einer Messung liefert die Sichtprüfung Hinweise auf fehlende Abdeckungen, ungeeignete Leiterführung, beschädigte Isolation oder falsche Kennzeichnung."},{"q":"Was ist bei einer Funktionsprüfung zusätzlich zu bedenken?","options":["Unerwartete Bewegungen und Wirkungen","Nur Messgerätepreis","Ausschliesslich Kabelfarbe"],"c":0,"why":"Schalthandlungen können Motoren, Aggregate oder Schutzeinrichtungen auslösen."},{"q":"Sind die drei Prüfarten austauschbar?","options":["Ja","Nein, sie ergänzen sich","Nur bei Gleichstrom"],"c":1,"why":"Eine einzelne Prüfart deckt nicht alle Qualitäts- und Sicherheitsfragen ab."}],"refs":["SN EN 50110-1:2023","5.3","5.4","5.5","6.1"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: In der Alltagssprache heisst vieles „messen“. Die Norm unterscheidet betriebliche Messungen, gezielte Erprobungen und Inspektionen. Diese Tätigkeiten können ganz unterschiedliche Gefährdungen auslösen."},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Eine Messung kann die Situation verändern» und «Erprobung ist mehr als ein Zahlenwert». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Eine Messung kann die Situation verändern» und «Besichtigen ist ein eigenständiger Prüfschritt». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"An einer Anlage wurde eine neue Verteilertür montiert. Welche drei unterschiedlichen Nachweise würdest Du in einer fiktiven Prüfplanung vorsehen?"},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Welcher Punkt gehört primär zur Sichtprüfung?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/N-S03.svg"},{"id":"N-S04","year":2,"title":"Schweizer Recht und europäische Betriebsnorm richtig kombinieren","goals":["Die EN 50110 beschreibt sichere betriebliche Abläufe. In der Schweiz treten daneben verbindliche Gesetze und Verordnungen, beispielsweise Starkstromverordnung und NIV. Du musst deshalb stets zwei Fragen auseinanderhalten: Wie arbeitet man fachlich sicher – und wer darf die Tätigkeit überhaupt ausführen?","Du besitzt einen Montagekurs für PV und möchtest eine Hausverteilung erweitern. Kannst Du aus dem Sicherheitswissen nach EN 50110 auf eine allgemeine Installationsberechtigung schliessen?"],"parts":[{"heading":"Norm und Gesetz sind nicht dasselbe","text":"Ein Verfahren aus einer anerkannten Norm ist eine technische Grundlage. Ob jemand eine Leitung installieren oder eine Prüfung durchführen darf, ergibt sich jedoch zusätzlich aus dem schweizerischen Bewilligungs- und Berufsrecht. Die Schweizer Ergänzung in Teil 2 nennt unter anderem das Elektrizitätsgesetz, die Starkstromverordnung und die NIV.","formula":""},{"heading":"Die NIN bleibt eine eigenständige Quelle","text":"SN 411000 ist für die Ausführung von Niederspannungsinstallationen zentral. Die vorhandene EN 50110 ersetzt die NIN nicht. In unserer Lernplattform werden daher Sicherheitsabläufe aus EN 50110 als quellengeprüft gekennzeichnet, NIN-Detailgrenzwerte ohne Originalnorm hingegen als noch offen.","formula":""},{"heading":"Fallanalyse vor praktischer Arbeit","text":"Für jeden Auftrag formulierst Du getrennt: rechtliche Berechtigung; technischer Sollzustand; Arbeits- und Gefährdungsorganisation; vorgesehene Prüfung und Dokumentation. Die vier Antworten müssen zusammenpassen.","formula":""}],"bridgeTitle":"Spezifische Fallstudie auf Grundlage der genannten Normausgabe; normativer Einzelabgleich ausstehend.","bridge":"Die EN 50110 beschreibt sichere betriebliche Abläufe. In der Schweiz treten daneben verbindliche Gesetze und Verordnungen, beispielsweise Starkstromverordnung und NIV. Du musst deshalb stets zwei Fragen auseinanderhalten: Wie arbeitet man fachlich sicher – und wer darf die Tätigkeit überhaupt ausführen?","exercise":"Du besitzt einen Montagekurs für PV und möchtest eine Hausverteilung erweitern. Kannst Du aus dem Sicherheitswissen nach EN 50110 auf eine allgemeine Installationsberechtigung schliessen?","solution":"Nein. Sicherheitskompetenz und Bewilligungsumfang sind getrennt. Die konkrete rechtliche Berechtigung ist nach der schweizerischen NIV und der vorhandenen betrieblichen Bewilligung zu klären.","quiz":[{"q":"Welche Quelle bestimmt den grundsätzlichen schweizerischen Bewilligungsrahmen?","options":["NIV","Ausschliesslich EN 50110-1","Das Datenblatt der PV-Module"],"c":0,"why":"Die NIV ist hierfür eine massgebliche Rechtsgrundlage."},{"q":"Ersetzt EN 50110-1 die NIN?","options":["Ja","Nein","Nur bei kleinen Gebäuden"],"c":1,"why":"Betriebssicherheit und Errichtung von Niederspannungsanlagen haben verschiedene Normenquellen.\n\nBezug zum Unterrichtsteil «Die NIN bleibt eine eigenständige Quelle»: Die vorhandene EN 50110 ersetzt die NIN nicht."},{"q":"Was muss vor einer technischen Tätigkeit ebenfalls geklärt werden?","options":["Nur Werkzeugfarbe","Die eigene rechtliche Berechtigung","Nur Liefertermin"],"c":1,"why":"Kompetenz und Befugnis sind getrennte Voraussetzungen.\n\nBezug zum Unterrichtsteil «Fallanalyse vor praktischer Arbeit»: Für jeden Auftrag formulierst Du getrennt: rechtliche Berechtigung; technischer Sollzustand; Arbeits- und Gefährdungsorganisation; vorgesehene Prüfung und Dokumentation."}],"refs":["SN EN 50110-2:2023","32.1","32.2"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Die EN 50110 beschreibt sichere betriebliche Abläufe. In der Schweiz treten daneben verbindliche Gesetze und Verordnungen, beispielsweise Starkstromverordnung und NIV. Du musst deshalb stets zwei Fragen auseinanderhalten: Wie arbeitet man fachlich sicher – und wer darf die Tätigkeit überhaupt ausführen?"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Norm und Gesetz sind nicht dasselbe» und «Die NIN bleibt eine eigenständige Quelle». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Norm und Gesetz sind nicht dasselbe» und «Fallanalyse vor praktischer Arbeit». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Du besitzt einen Montagekurs für PV und möchtest eine Hausverteilung erweitern. Kannst Du aus dem Sicherheitswissen nach EN 50110 auf eine allgemeine Installationsberechtigung schliessen?"},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Welche Quelle bestimmt den grundsätzlichen schweizerischen Bewilligungsrahmen?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/N-S04.svg"},{"id":"N-W01","year":2,"title":"Vom Haus bis zum Netz: Wer ist für was zuständig?","goals":["Die Niederspannungsanlage im Gebäude ist Teil eines Gesamtsystems. Am Netzanschlusspunkt endet nicht nur ein Kabel, sondern es treffen die Verantwortlichkeiten des Verteilnetzbetreibers (VNB) und des Installationsbetriebs aufeinander.","Ein Haus soll eine PV-Anlage und einen Speicher erhalten. Der Wechselrichter ist bereits bestellt, aber der Netzbetreiber noch nicht kontaktiert."],"parts":[{"heading":"Drei Grenzen unterscheiden","text":"Der Netzanschluss beschreibt die physische Verbindung, der Anschlusspunkt die definierte Übergabestelle und der Verknüpfungspunkt den relevanten Netzbezug für technische Bewertungen. Diese Punkte können im Plan unterschiedlich liegen. Wer sie verwechselt, dimensioniert oder meldet unter Umständen am falschen Ort.","formula":""},{"heading":"Werkvorschriften ergänzen Installationsnormen","text":"Die Werkvorschriften CH regeln insbesondere den Anschluss an das Verteilnetz, die Meldung, Messung und koordinierende technische Bedingungen. Sie ersetzen weder die NIN für die Installation noch die NIV für die Bewilligungen. Regionale Ergänzungen des zuständigen VNB sind zusätzlich zu berücksichtigen.","formula":""},{"heading":"Der VNB ist Projektpartner","text":"Bei neuen Erzeugern, Speicheranlagen oder geänderten Hauptanschlüssen kann der VNB Vorgaben zur Messung, zu Netzrückwirkungen, zu Schutzfunktionen und zur Steuerbarkeit machen. Der zuständige Fachbetrieb koordiniert diese Themen vor einer verbindlichen Bestellung.","formula":""}],"bridgeTitle":"Spezifische Fallstudie auf Grundlage der genannten Normausgabe; normativer Einzelabgleich ausstehend.","bridge":"Die Niederspannungsanlage im Gebäude ist Teil eines Gesamtsystems. Am Netzanschlusspunkt endet nicht nur ein Kabel, sondern es treffen die Verantwortlichkeiten des Verteilnetzbetreibers (VNB) und des Installationsbetriebs aufeinander.","exercise":"Ein Haus soll eine PV-Anlage und einen Speicher erhalten. Der Wechselrichter ist bereits bestellt, aber der Netzbetreiber noch nicht kontaktiert.","solution":"Das Projekt ist aus Sicht der Netzschnittstelle unvollständig. Vor der Installation sind die vorgesehenen Melde- und Anschlussverfahren, die zulässigen Betriebsarten, die Messung und die lokalen Vorgaben zu klären.","quiz":[{"q":"Ersetzen die Werkvorschriften CH die NIN?","options":["Ja","Nein, sie ergänzen sie","Nur für PV"],"c":1,"why":"Netzanschlussbedingungen sind nicht die vollständige Installationsnorm.\n\nBezug zum Unterrichtsteil «Werkvorschriften ergänzen Installationsnormen»: Die Werkvorschriften CH regeln insbesondere den Anschluss an das Verteilnetz, die Meldung, Messung und koordinierende technische Bedingungen."},{"q":"Wer legt lokale Anschlussbedingungen fest?","options":["Ausschliesslich Modulhersteller","Der zuständige VNB im geltenden Rahmen","Jeder Elektriker allein"],"c":1,"why":"Der Netzbetreiber ist an der Netzschnittstelle massgeblich beteiligt."},{"q":"Was ist zu Beginn eines PV-Projekts sinnvoll?","options":["Wechselrichter ohne Netzprüfung bestellen","Meldepflicht und Netzschnittstelle klären","Nur Dachneigung messen"],"c":1,"why":"Das Anmeldeverfahren beeinflusst Technik und Ablauf."}],"refs":["WV-CH 2025","1.1","1.2","1.5","2.1","5.1"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Die Niederspannungsanlage im Gebäude ist Teil eines Gesamtsystems. Am Netzanschlusspunkt endet nicht nur ein Kabel, sondern es treffen die Verantwortlichkeiten des Verteilnetzbetreibers (VNB) und des Installationsbetriebs aufeinander."},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Drei Grenzen unterscheiden» und «Werkvorschriften ergänzen Installationsnormen». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Drei Grenzen unterscheiden» und «Der VNB ist Projektpartner». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Ein Haus soll eine PV-Anlage und einen Speicher erhalten. Der Wechselrichter ist bereits bestellt, aber der Netzbetreiber noch nicht kontaktiert."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Ersetzen die Werkvorschriften CH die NIN?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/N-W01.svg"},{"id":"N-W02","year":2,"title":"Technisches Anschlussgesuch, Installationsanzeige und SiNa","goals":["Die drei Kürzel TAG, IA und SiNa meinen unterschiedliche Dokumente. Wer sie korrekt einordnet, kann ein PV-Projekt vom Vorprojekt bis zur Übergabe sauber strukturieren.","Du erhältst eine Rechnung für einen fertig montierten Wechselrichter. Der Lieferant behauptet: „Wir haben doch das TAG, also kann die Anlage sofort ans Netz.“"],"parts":[{"heading":"TAG: Netzverträglichkeit vorab klären","text":"Für verschiedene Anlagen, beispielsweise netzparallel betriebene Erzeuger und elektrische Speicher, ist ein technisches Anschlussgesuch vorgesehen. Es stellt der Netzbetreiberperspektive die geplante Leistung, Betriebsart und die technischen Kenndaten zur Verfügung. Das TAG ist kein Ersatz für eine Installationsbewilligung.","formula":""},{"heading":"IA: geplante elektrische Arbeiten anzeigen","text":"Die Installationsanzeige beschreibt die geplanten Installationsarbeiten und beinhaltet je nach Projekt Schema, Leistungsangaben und Messeinrichtungen. Eine Bestätigung des VNB ist keine Aussage, dass jede Schraubverbindung, jeder Querschnitt und jeder Schutz korrekt ausgelegt wurde. Diese Verantwortung bleibt bei den berechtigten Fachpersonen.","formula":""},{"heading":"Nach Installation: Prüfung und Nachweise","text":"Vor Inbetriebnahme sind die Voraussetzungen des VNB sowie die notwendigen Prüfungen und Messprotokolle zu erfüllen. Der Sicherheitsnachweis dokumentiert den geprüften Zustand im gesetzlichen Rahmen. Die normgerechte PV-Systemdokumentation nach SN EN 62446-1 kommt zusätzlich hinzu.","formula":""}],"bridgeTitle":"Spezifische Fallstudie auf Grundlage der genannten Normausgabe; normativer Einzelabgleich ausstehend.","bridge":"Die drei Kürzel TAG, IA und SiNa meinen unterschiedliche Dokumente. Wer sie korrekt einordnet, kann ein PV-Projekt vom Vorprojekt bis zur Übergabe sauber strukturieren.","exercise":"Du erhältst eine Rechnung für einen fertig montierten Wechselrichter. Der Lieferant behauptet: „Wir haben doch das TAG, also kann die Anlage sofort ans Netz.“","solution":"Nein. Das TAG behandelt die technische Anschlussabklärung. Es ersetzt weder freigegebene Installation, noch Inbetriebnahmebedingungen und Nachweise. Prüfe die erforderlichen Dokumente und die VNB-Freigaben.","quiz":[{"q":"Was klärt das TAG in erster Linie?","options":["Technische Anschlussbedingungen","Endgültige elektrische Sicherheit jeder Klemme","Privates Baugesuch"],"c":0,"why":"Es ist der technische Netzanschlussantrag."},{"q":"Was bedeutet eine genehmigte IA?","options":["Jede Leitung ist automatisch normgerecht","Die angemeldeten Arbeiten können nach Vorgaben begonnen werden, ohne die Installateurverantwortung zu ersetzen","Die PV ist automatisch abgenommen"],"c":1,"why":"Eine Freigabe ist kein pauschales Qualitätszertifikat."},{"q":"Welche Unterlage weist eine kontrollierte Elektroinstallation nach?","options":["SiNa, soweit gesetzlich erforderlich","TAG allein","Dachstatik allein"],"c":0,"why":"Der SiNa erfüllt eine andere Funktion als das Anschlussgesuch."}],"refs":["WV-CH 2025","2.1","2.2","2.3","2.4","2.6","Anhang A 10.2"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Die drei Kürzel TAG, IA und SiNa meinen unterschiedliche Dokumente. Wer sie korrekt einordnet, kann ein PV-Projekt vom Vorprojekt bis zur Übergabe sauber strukturieren."},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «TAG: Netzverträglichkeit vorab klären» und «IA: geplante elektrische Arbeiten anzeigen». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «TAG: Netzverträglichkeit vorab klären» und «Nach Installation: Prüfung und Nachweise». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Du erhältst eine Rechnung für einen fertig montierten Wechselrichter. Der Lieferant behauptet: „Wir haben doch das TAG, also kann die Anlage sofort ans Netz.“"},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Was klärt das TAG in erster Linie?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/N-W02.svg"},{"id":"N-W03","year":3,"title":"Zähler, Hauptanschluss und Messkonzepte verstehen","goals":["Ein PV-System kann technisch Strom erzeugen und trotzdem falsch abgerechnet werden. Deshalb ist die Messeinrichtung kein nachträgliches Zubehör, sondern Bestandteil des gesamten Anlagenkonzepts.","Bei einer neuen PV soll der alte Zähler ersetzt werden. Der Eigentümer will selbst vorab die Plombe entfernen."],"parts":[{"heading":"Anschlussüberstromschutz und Hauptverteilung","text":"Überstromschutzgeräte an der Netzschnittstelle begrenzen und schützen innerhalb ihres jeweiligen Aufgabenbereichs. Auswahl und Platzierung müssen zum Anschlusskonzept und den Vorgaben des VNB passen. Für die detaillierte innere Installation ist die NIN zusätzlich erforderlich.","formula":""},{"heading":"Messkonzept vor Hardware","text":"Bezug und Einspeisung können getrennt oder bidirektional gemessen werden. Bei mehreren Verbrauchsstätten, einem Speicher oder einem Eigenverbrauchszusammenschluss wird das Schema komplexer: Was ist Netzbezug, Eigenverbrauch, Speicherladung und Rückspeisung? Diese Definition bestimmt Zähleranordnung und Abrechnung.","formula":""},{"heading":"Zugang, Plomben und Kommunikation","text":"Zählerplätze müssen nach VNB-Vorgaben erreichbar und geeignet sein. Plombierte Bereiche sind keine frei zugängliche Übungsfläche. Fernablesung, Kommunikation und Steuerung sind früh in die Planung einzubeziehen.","formula":""}],"bridgeTitle":"Spezifische Fallstudie auf Grundlage der genannten Normausgabe; normativer Einzelabgleich ausstehend.","bridge":"Ein PV-System kann technisch Strom erzeugen und trotzdem falsch abgerechnet werden. Deshalb ist die Messeinrichtung kein nachträgliches Zubehör, sondern Bestandteil des gesamten Anlagenkonzepts.","exercise":"Bei einer neuen PV soll der alte Zähler ersetzt werden. Der Eigentümer will selbst vorab die Plombe entfernen.","solution":"Das ist keine zulässige Selbsthilfemassnahme. Planung und Auswechslung der Messeinrichtung sind mit dem VNB und den berechtigten Fachpersonen abzustimmen.","quiz":[{"q":"Weshalb beeinflusst ein Speicher das Messkonzept?","options":["Er ist nur mechanisch","Ladung und Entladung verändern Energieflüsse","Er ersetzt den Hausanschluss"],"c":1,"why":"Mehrere mögliche Energieflüsse müssen messtechnisch und abrechnungstechnisch beschrieben sein.\n\nBezug zum Unterrichtsteil «Messkonzept vor Hardware»: Bei mehreren Verbrauchsstätten, einem Speicher oder einem Eigenverbrauchszusammenschluss wird das Schema komplexer: Was ist Netzbezug, Eigenverbrauch, Speicherladung und Rückspeisung?"},{"q":"Darf eine private Person plombierte Zählereinrichtungen beliebig öffnen?","options":["Ja","Nein","Nur am Wochenende"],"c":1,"why":"Plombierte und VNB-eigene Bereiche unterliegen besonderen Regeln.\n\nBezug zum Unterrichtsteil «Zugang, Plomben und Kommunikation»: Plombierte Bereiche sind keine frei zugängliche Übungsfläche."},{"q":"Was ist vor einer PV-Zählerumrüstung sinnvoll?","options":["Das VNB-Messkonzept klären","Nur Modulfarbe wählen","Zählerstand ignorieren"],"c":0,"why":"Die Messung gehört zur frühzeitigen Projektierung."}],"refs":["WV-CH 2025","4","5","7.1–7.10","Anhang A 7.1"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Ein PV-System kann technisch Strom erzeugen und trotzdem falsch abgerechnet werden. Deshalb ist die Messeinrichtung kein nachträgliches Zubehör, sondern Bestandteil des gesamten Anlagenkonzepts."},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Anschlussüberstromschutz und Hauptverteilung» und «Messkonzept vor Hardware». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Anschlussüberstromschutz und Hauptverteilung» und «Zugang, Plomben und Kommunikation». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Bei einer neuen PV soll der alte Zähler ersetzt werden. Der Eigentümer will selbst vorab die Plombe entfernen."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Weshalb beeinflusst ein Speicher das Messkonzept?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/N-W03.svg"},{"id":"N-W04","year":3,"title":"Netzparallele PV: Phasen, Unsymmetrie und Inbetriebnahme","goals":["Bei einer PV-Anlage ist nicht nur die DC-Leistung wichtig. Für das Verteilnetz zählt die Wechselrichterleistung an den Aussenleitern und das Verhalten des Wechselrichters bei Netzstörungen.","Ein Bauherr plant zwei einphasige 4-kVA-Wechselrichter auf derselben Phase, weil es günstiger ist."],"parts":[{"heading":"Symmetrie und Anschlussart","text":"Die WV-CH 2025 behandelt in Abschnitt 10.3.1 unter anderem den dreiphasig symmetrischen Anschluss sowie eine besondere Grenze für einphasige Erzeugung: Ein einzelner einphasiger Wechselrichter darf in dem beschriebenen Rahmen bis 3,7 kVA angeschlossen werden. Die zulässige Unsymmetrie ist gleichfalls auf 3,7 kVA begrenzt. Es gilt zusätzlich die konkrete VNB-Vorgabe.","formula":""},{"heading":"Grenzwert nicht falsch interpretieren","text":"3,7 kVA bezeichnet Scheinleistung, nicht zwingend Wirkleistung in kW. Bei cos φ gleich 1 sind die Zahlen gleich; bei cos φ gleich 0,9 beträgt die Wirkleistung 3,33 kW. Mehrere einphasige Geräte können je nach Phasenverteilung und Kopplung andere Netzbewertungen erfordern.","formula":""},{"heading":"Die Inbetriebnahme ist ein dokumentierter Vorgang","text":"Vorausgesetzt sind unter anderem genehmigte Unterlagen, die für die Schweiz relevanten Wechselrichtereinstellungen, Mess-/Kommunikationseinrichtungen und die Abnahme mit dem VNB. Eine leuchtende Einspeiseanzeige allein beweist keine regelkonforme Inbetriebnahme.","formula":""}],"bridgeTitle":"Spezifische Fallstudie auf Grundlage der genannten Normausgabe; normativer Einzelabgleich ausstehend.","bridge":"Bei einer PV-Anlage ist nicht nur die DC-Leistung wichtig. Für das Verteilnetz zählt die Wechselrichterleistung an den Aussenleitern und das Verhalten des Wechselrichters bei Netzstörungen.","exercise":"Ein Bauherr plant zwei einphasige 4-kVA-Wechselrichter auf derselben Phase, weil es günstiger ist.","solution":"Das Konzept kollidiert mit den in WV-CH 2025, 10.3.1 behandelten Grenzen und muss durch eine fachkundige Planung samt VNB-Abklärung ersetzt werden. Nicht selbst umverdrahten.","quiz":[{"q":"Welche Grösse ist kVA?","options":["Scheinleistung","Energie","Widerstand"],"c":0,"why":"kVA ist eine Leistungseinheit für Scheinleistung."},{"q":"Wie viel Wirkleistung ergeben 3,7 kVA bei cos φ = 0,9?","options":["4,11 kW","3,33 kW","0,9 kW"],"c":1,"why":"P = S × cos φ = 3,7 × 0,9 = 3,33 kW."},{"q":"Wer muss vor dem Netzparallelbetrieb eingebunden werden?","options":["Der zuständige VNB","Nur der Dachdecker","Niemand"],"c":0,"why":"Netzanschluss und Inbetriebnahme erfolgen nach VNB-Prozess."}],"refs":["WV-CH 2025","1.6","10.1","10.2","10.3"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Bei einer PV-Anlage ist nicht nur die DC-Leistung wichtig. Für das Verteilnetz zählt die Wechselrichterleistung an den Aussenleitern und das Verhalten des Wechselrichters bei Netzstörungen."},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Symmetrie und Anschlussart» und «Grenzwert nicht falsch interpretieren». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Symmetrie und Anschlussart» und «Die Inbetriebnahme ist ein dokumentierter Vorgang». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Ein Bauherr plant zwei einphasige 4-kVA-Wechselrichter auf derselben Phase, weil es günstiger ist."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Welche Grösse ist kVA?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/N-W04.svg"},{"id":"N-W05","year":4,"title":"Batteriespeicher, USV und Rückspeisung beurteilen","goals":["Ein Batteriespeicher ist keine gewöhnliche Last. Er kann Energie beziehen, ins Haus liefern, ins Netz einspeisen oder im Ersatzstrombetrieb Versorgung bereitstellen. Jede Betriebsart hat andere Konsequenzen.","Bei Stromausfall schaltet ein Heimakku einen Steckdosenkreis weiter. Eine Person möchte die Netztrennung mit einem gewöhnlichen Schalter improvisieren."],"parts":[{"heading":"AC- und DC-gekoppelte Systeme unterscheiden","text":"Beim AC-gekoppelten Speicher besitzt die Batterie typischerweise einen eigenen Wechselrichter. Beim DC-gekoppelten System wird die Batterie auf der Gleichstromseite mit einer geeigneten Systemarchitektur integriert. Für den Netzanschluss sind Funktionsschaltbild, Phasenverteilung, Schutzkonzept und Messanordnung massgebend.","formula":""},{"heading":"Ersatzstrom ist nicht identisch mit Eigenverbrauch","text":"Ein Speicher für Eigenverbrauch optimiert den Energiefluss im Netzparallelbetrieb. Bei Ersatzstrombetrieb sind Netztrennung, Rückspeiseschutz, Neutralleiter-/Erdungskonzept und zulässige Betriebsart besonders kritisch. Ein nicht korrekt getrenntes Inselnetz könnte das öffentliche Netz gefährlich rückspeisen.","formula":""},{"heading":"USV und Speicher nicht verwechseln","text":"Eine USV soll bestimmte Verbraucher bei Unterbruch versorgen. Die WV-CH behandeln auch die Verhinderung unerlaubter Rückspeisung. Ob ein System gleichzeitig USV- und netzparallelfähige Speicherfunktionen bietet, muss aus seiner vorgesehenen und zugelassenen Betriebsart hervorgehen.","formula":""}],"bridgeTitle":"Spezifische Fallstudie auf Grundlage der genannten Normausgabe; normativer Einzelabgleich ausstehend.","bridge":"Ein Batteriespeicher ist keine gewöhnliche Last. Er kann Energie beziehen, ins Haus liefern, ins Netz einspeisen oder im Ersatzstrombetrieb Versorgung bereitstellen. Jede Betriebsart hat andere Konsequenzen.","exercise":"Bei Stromausfall schaltet ein Heimakku einen Steckdosenkreis weiter. Eine Person möchte die Netztrennung mit einem gewöhnlichen Schalter improvisieren.","solution":"Nicht zulässig. Die Netztrennung und das Erdungs-/Schutzkonzept müssen für den vorgesehenen Betrieb von qualifizierten Fachpersonen projektiert, geprüft und dokumentiert werden.","quiz":[{"q":"Ist jeder Heimspeicher automatisch ersatzstromfähig?","options":["Ja","Nein, es hängt von System und Ausführung ab","Nur ohne PV"],"c":1,"why":"Ersatzstrom erfordert eine passende zugelassene Systemarchitektur.\n\nBezug zum Unterrichtsteil «AC- und DC-gekoppelte Systeme unterscheiden»: Beim DC-gekoppelten System wird die Batterie auf der Gleichstromseite mit einer geeigneten Systemarchitektur integriert."},{"q":"Wie lange liefern 10 kWh idealisiert 5 kW?","options":["2 h","5 h","50 h"],"c":0,"why":"Energie geteilt durch Leistung ist Zeit; real ist die Dauer meist kleiner."},{"q":"Was ist im Inselbetrieb besonders kritisch?","
