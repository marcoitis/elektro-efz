fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/3.12-A.svg"},{"id":"3.12-B","year":3,"title":"Schutz-, Leitungs- und PV-Dokumentation","goals":["Schutzkonzept, Leitungsauslegung, Netzvorgaben","Funktions-, Prüf- und Abnahmeplan"],"parts":[{"heading":"Dein Dozent erklärt: Schutz-, Leitungs- und PV-Dokumentation","text":"Heute geht es um schutz-, leitungs- und pv-dokumentation. Aus einem Systemkonzept entsteht ein Satz fachlich zusammenhängender Unterlagen. Dazu zählen Übersichtsschema, Verbraucher- und Lastliste, Stromkreisplan, Stringplan, Netzwerkstruktur und ein vorläufiges Schutzkonzept. Der planerische Nachweis muss offene normative Punkte deutlich markieren. Ohne Einsicht in die komplette NIN werden keine fiktiven Bemessungen als ausführungsreif erklärt. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Erstelle ein Dokumentenverzeichnis mit Versionsnummern und Verantwortlichkeiten. Berechne für die PV-Anlage eine beispielhafte Modulleistung und einen theoretischen Jahresertrag, kennzeichne die Annahmen und dokumentiere die zusätzlich notwendigen Netzbetreiber- und NIN-Nachweise. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Vollständig dokumentiert bedeutet auch, Unsicherheiten sichtbar zu machen. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Schutzkonzept, Leitungsauslegung, Netzvorgaben; Funktions-, Prüf- und Abnahmeplan. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIN Teile 4–7; NIV; ESTI 220. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Mehrere Teilsysteme koordinieren","bridge":"Gebäudelasten, PV-Erzeugung, Speicher, Ladepunkt und Kommunikation beeinflussen sich gegenseitig. Jede Teilauslegung kann im Einzelnen plausibel erscheinen und dennoch an Schnittstellen unvollständig sein. Deshalb braucht ein Gesamtdossier konsistente Annahmen, Schnittstellen und dokumentierte Verantwortlichkeiten.","exercise":"Reines Planungsprojekt, Messungen ggf. nur an zertifizierter Übungsanlage unter Leitung. Halte zusätzlich die Antwort auf die Frage «Welches Dokument gehört zu einer PV-Systemplanung?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erstelle eine Schnittstellenliste zu einem Haus mit PV, Wärmepumpe und Ladestation; markiere fehlende Daten.","solution":"Vollständig dokumentiert bedeutet auch, Unsicherheiten sichtbar zu machen. Der Merksatz lautet: Vollständig dokumentiert bedeutet auch, Unsicherheiten sichtbar zu machen. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Welches Dokument gehört zu einer PV-Systemplanung?","options":["Nur eine Heizkurve","Nur der Kaufbeleg des Dachs","String- und Übersichtsschema"],"c":2,"why":"Vollständig dokumentiert bedeutet auch, Unsicherheiten sichtbar zu machen.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Vollständig dokumentiert bedeutet auch, Unsicherheiten sichtbar zu machen."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Nur eine Heizkurve","Vollständig dokumentiert bedeutet auch, Unsicherheiten sichtbar zu machen.","Nur der Kaufbeleg des Dachs"],"c":1,"why":"Der Merksatz lautet: Vollständig dokumentiert bedeutet auch, Unsicherheiten sichtbar zu machen.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Vollständig dokumentiert bedeutet auch, Unsicherheiten sichtbar zu machen."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["4.1–4.3; 5.1–5.5; 6.1–6.2","Norm-/Regelwerk: NIN Teile 4–7; NIV; ESTI 220","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Schutzkonzept, Leitungsauslegung, Netzvorgaben"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Schutz-, Leitungs- und PV-Dokumentation» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Schutz-, Leitungs- und PV-Dokumentation» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Reines Planungsprojekt, Messungen ggf. nur an zertifizierter Übungsanlage unter Leitung. Halte zusätzlich die Antwort auf die Frage «Welches Dokument gehört zu einer PV-Systemplanung?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erstelle eine Schnittstellenliste zu einem Haus mit PV, Wärmepumpe und Ladestation; markiere fehlende Daten."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Welches Dokument gehört zu einer PV-Systemplanung?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/3.12-B.svg"},{"id":"3.12-C","year":3,"title":"Projektprüfung und Sicherheits-Fachgespräch","goals":["Kostenschätzung/Materialliste","Fachgespräch mit 15 Fragen und Sicherheitsreview"],"parts":[{"heading":"Dein Dozent erklärt: Projektprüfung und Sicherheits-Fachgespräch","text":"Heute geht es um projektprüfung und sicherheits-fachgespräch. Ein Systemprojekt wird erst überzeugend, wenn eine andere Fachperson Annahmen und Entscheidungen kritisch nachvollziehen kann. Ein Review prüft Plausibilität, Schutzkonzept, Kennzeichnung, Dokumentenstand und Zuständigkeiten. Sicherheitsfragen haben Vorrang vor Kostenoptimierung. Im Fachgespräch solltest Du jeden Teil des Schemas in einfachen, präzisen Worten erläutern können. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Führe ein simuliertes Fachgespräch mit fünfzehn Fragen durch: fünf zu Schutz und Normen, fünf zu PV und Netz, fünf zu Dokumentation und Kommunikation. Notiere unbeantwortete Fragen als Lernlücken. Reale Netzarbeiten werden ausdrücklich nicht ausgeführt. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Ein Review soll Fehler finden, nicht eine fertige Lösung bestätigen. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Kostenschätzung/Materialliste; Fachgespräch mit 15 Fragen und Sicherheitsreview. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIN Teile 4–7; NIV; ESTI 220. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Mehrere Teilsysteme koordinieren","bridge":"Gebäudelasten, PV-Erzeugung, Speicher, Ladepunkt und Kommunikation beeinflussen sich gegenseitig. Jede Teilauslegung kann im Einzelnen plausibel erscheinen und dennoch an Schnittstellen unvollständig sein. Deshalb braucht ein Gesamtdossier konsistente Annahmen, Schnittstellen und dokumentierte Verantwortlichkeiten.","exercise":"Reines Planungsprojekt, Messungen ggf. nur an zertifizierter Übungsanlage unter Leitung. Halte zusätzlich die Antwort auf die Frage «Was ist das Hauptziel eines unabhängigen Projekt-Reviews?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erstelle eine Schnittstellenliste zu einem Haus mit PV, Wärmepumpe und Ladestation; markiere fehlende Daten.","solution":"Ein Review soll Fehler finden, nicht eine fertige Lösung bestätigen. Der Merksatz lautet: Ein Review soll Fehler finden, nicht eine fertige Lösung bestätigen. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was ist das Hauptziel eines unabhängigen Projekt-Reviews?","options":["Annahmen und Fehler kritisch aufdecken","Alle offenen Fragen ignorieren","Ungeprüfte Ausführung beschleunigen"],"c":0,"why":"Ein Review soll Fehler finden, nicht eine fertige Lösung bestätigen.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Ein Review soll Fehler finden, nicht eine fertige Lösung bestätigen."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Alle offenen Fragen ignorieren","Ein Review soll Fehler finden, nicht eine fertige Lösung bestätigen.","Ungeprüfte Ausführung beschleunigen"],"c":1,"why":"Der Merksatz lautet: Ein Review soll Fehler finden, nicht eine fertige Lösung bestätigen.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Ein Review soll Fehler finden, nicht eine fertige Lösung bestätigen."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «S ,"Kirchhoffsche Regeln bei Wechselstrom"],"parts":[{"heading":"Dein Dozent erklärt: Komplexe Impedanz und Wechselstromnetze","text":"Heute geht es um komplexe impedanz und wechselstromnetze. In einem Wechselstromnetzwerk werden ohmscher Widerstand und Blindwiderstand in der komplexen Impedanz zusammengeführt. Für eine R-L-Reihenschaltung ist der Betrag der Impedanz gleich der Quadratwurzel aus R² + X_L². Der Phasenwinkel beschreibt den Bezug zwischen Strom und Spannung. Diese Methoden erlauben konsistente Rechnungen, wenn Sinusform und lineare Bauteile vorausgesetzt werden. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Gegeben seien R = 30 Ohm und X_L = 40 Ohm in Reihe. Dann ergibt sich die Impedanz Z = 30 + j40 Ohm und ihr Betrag 50 Ohm. Bei 100 Volt effektiv beträgt die idealisierte Stromstärke 2 Ampere. Zeichne das Impedanzdreieck. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Ein komplexer Widerstand besitzt Betrag und Winkel. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Zeigerrechnung mit R, L, C; Impedanz und Admittanz; Kirchhoffsche Regeln bei Wechselstrom. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: Lehrplan 5.3; NIN Teil 3 (Lastdaten). Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Wirkleistung folgt aus dem passenden Modell","bridge":"Bei symmetrischen sinusförmigen Drehstromsystemen lässt sich Wirkleistung mit P = √3 · ULL · IL · cos φ berechnen. Bei unsymmetrischen Systemen muss die Rechnung angemessen aufgeteilt werden. Blindleistung und Leistungsfaktor beschreiben verschiedene Aspekte der Energienutzung. Rechenergebnisse brauchen Annahmen, Einheiten und Plausibilitätskontrolle.","exercise":"Schaltungs-Simulation, Berechnung von 20 wechselstromtechnischen Aufgaben. Halte zusätzlich die Antwort auf die Frage «Wie gross ist der Betrag von Z bei R=30 Ω und XL=40 Ω in Reihe?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Berechne bei 400 V, 10 A und cos φ = 0,8 die Wirkleistung einer symmetrischen Last und erläutere die Modellgrenzen.","solution":"Ein komplexer Widerstand besitzt Betrag und Winkel. Der Merksatz lautet: Ein komplexer Widerstand besitzt Betrag und Winkel. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Wie gross ist der Betrag von Z bei R=30 Ω und XL=40 Ω in Reihe?","options":["50 Ω","10 Ω","70 Ω"],"c":0,"why":"Ein komplexer Widerstand besitzt Betrag und Winkel.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Ein komplexer Widerstand besitzt Betrag und Winkel."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["10 Ω","Ein komplexer Widerstand besitzt Betrag und Winkel.","70 Ω"],"c":1,"why":"Der Merksatz lautet: Ein komplexer Widerstand besitzt Betrag und Winkel.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Ein komplexer Widerstand besitzt Betrag und Winkel."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["5.3.1b–5.3.4b","Norm-/Regelwerk: Lehrplan 5.3; NIN Teil 3 (Lastdaten)","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Zeigerrechnung mit R, L, C; Impedanz und Admittanz"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Komplexe Impedanz und Wechselstromnetze» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Komplexe Impedanz und Wechselstromnetze» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Schaltungs-Simulation, Berechnung von 20 wechselstromtechnischen Aufgaben. Halte zusätzlich die Antwort auf die Frage «Wie gross ist der Betrag von Z bei R=30 Ω und XL=40 Ω in Reihe?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Berechne bei 400 V, 10 A und cos φ = 0,8 die Wirkleistung einer symmetrischen Last und erläutere die Modellgrenzen."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Wie gross ist der Betrag von Z bei R=30 Ω und XL=40 Ω in Reihe?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/4.01-A.svg"},{"id":"4.01-B","year":4,"title":"Leistungsdreieck und Blindleistung","goals":["P, Q, S, cos φ und Kompensation","Drehstrom-Wirkleistung, Symmetrie/Unsymmetrie"],"parts":[{"heading":"Dein Dozent erklärt: Leistungsdreieck und Blindleistung","text":"Heute geht es um leistungsdreieck und blindleistung. Scheinleistung, Wirkleistung und Blindleistung werden bei sinusförmigen Bedingungen als Leistungsdreieck dargestellt. Der Leistungsfaktor beeinflusst die für eine bestimmte Wirkleistung erforderliche Stromstärke. Eine Kompensation kann die Blindleistungsbelastung senken, muss aber systemtechnisch und wirtschaftlich beurteilt werden. Nichtlineare Lasten erfordern eine Betrachtung der Oberschwingungen. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Ein idealisierter Verbraucher benötigt 800 Watt Wirkleistung und 600 var Blindleistung. Die Scheinleistung beträgt nach dem Satz des Pythagoras 1000 VA. Der Leistungsfaktor ist 0,8. Erläutere, wie sich der benötigte Strom ändern kann, wenn derselbe P-Wert mit höherem Leistungsfaktor bereitgestellt wird. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Wirkleistung bleibt bei Blindleistungskompensation nicht automatisch gleich der Scheinleistung. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: P, Q, S, cos φ und Kompensation; Drehstrom-Wirkleistung, Symmetrie/Unsymmetrie. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: Lehrplan 5.3; NIN Teil 3 (Lastdaten). Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Wirkleistung folgt aus dem passenden Modell","bridge":"Bei symmetrischen sinusförmigen Drehstromsystemen lässt sich Wirkleistung mit P = √3 · ULL · IL · cos φ berechnen. Bei unsymmetrischen Systemen muss die Rechnung angemessen aufgeteilt werden. Blindleistung und Leistungsfaktor beschreiben verschiedene Aspekte der Energienutzung. Rechenergebnisse brauchen Annahmen, Einheiten und Plausibilitätskontrolle.","exercise":"Schaltungs-Simulation, Berechnung von 20 wechselstromtechnischen Aufgaben. Halte zusätzlich die Antwort auf die Frage «Welche Scheinleistung folgt aus P=800 W und Q=600 var?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Berechne bei 400 V, 10 A und cos φ = 0,8 die Wirkleistung einer symmetrischen Last und erläutere die Modellgrenzen.","solution":"Wirkleistung bleibt bei ierte Grössen von tatsächlich gemessenen. Beim Zusammenfassen von Lasten sind Phasenwinkel, Gleichzeitigkeit und die Eigenschaften elektronischer Verbraucher zu berücksichtigen. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Erstelle eine fiktive Lastliste mit Beleuchtung, Wärmepumpe, PV-Wechselrichter und Ladeeinrichtung. Vergleiche die maximale installierte Anschlussleistung mit einem plausiblen zeitabhängigen Lastprofil. Diskutiere, warum einfaches Addieren aller Typenschildwerte keine vollständige Netzbelastungsrechnung ergibt. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Plausible Annahmen sind wichtiger als eine unnötig genaue Scheinzahl. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Transformatoren/Leistungsübertragung; Formelwahl, Einheitenprüfung und Grenzfälle. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: Lehrplan 5.3; NIN Teil 3 (Lastdaten). Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Wirkleistung folgt aus dem passenden Modell","bridge":"Bei symmetrischen sinusförmigen Drehstromsystemen lässt sich Wirkleistung mit P = √3 · ULL · IL · cos φ berechnen. Bei unsymmetrischen Systemen muss die Rechnung angemessen aufgeteilt werden. Blindleistung und Leistungsfaktor beschreiben verschiedene Aspekte der Energienutzung. Rechenergebnisse brauchen Annahmen, Einheiten und Plausibilitätskontrolle.","exercise":"Schaltungs-Simulation, Berechnung von 20 wechselstromtechnischen Aufgaben. Halte zusätzlich die Antwort auf die Frage «Was erschwert das Addieren realer Verbraucherleistungen?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Berechne bei 400 V, 10 A und cos φ = 0,8 die Wirkleistung einer symmetrischen Last und erläutere die Modellgrenzen.","solution":"Plausible Annahmen sind wichtiger als eine unnötig genaue Scheinzahl. Der Merksatz lautet: Plausible Annahmen sind wichtiger als eine unnötig genaue Scheinzahl. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was erschwert das Addieren realer Verbraucherleistungen?","options":["Die Kabelfarbe allein","Nur die Schriftart im Plan","Unterschiedliche Betriebszeiten und Phasenbedingungen"],"c":2,"why":"Plausible Annahmen sind wichtiger als eine unnötig genaue Scheinzahl.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Plausible Annahmen sind wichtiger als eine unnötig genaue Scheinzahl."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Die Kabelfarbe allein","Plausible Annahmen sind wichtiger als eine unnötig genaue Scheinzahl.","Nur die Schriftart im Plan"],"c":1,"why":"Der Merksatz lautet: Plausible Annahmen sind wichtiger als eine unnötig genaue Scheinzahl.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Plausible Annahmen sind wichtiger als eine unnötig genaue Scheinzahl."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["5.3.1b–5.3.4b","Norm-/Regelwerk: Lehrplan 5.3; NIN Teil 3 (Lastdaten)","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Transformatoren/Leistungsübertragung"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Drehstromlasten und Plausibilitätsprüfung» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Drehstromlasten und Plausibilitätsprüfung» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Schaltungs-Simulation, Berechnung von 20 wechselstromtechnischen Aufgaben. Halte zusätzlich die Antwort auf die Frage «Was erschwert das Addieren realer Verbraucherleistungen?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Berechne bei 400 V, 10 A und cos φ = 0,8 die Wirkleistung einer symmetrischen Last und erläutere die Modellgrenzen."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Was erschwert das Addieren realer Verbraucherleistungen?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/4.01-C.svg"},{"id":"4.02-A","year":4,"title":"Fehlerschleifenimpedanz und Abschaltbedingungen","goals":["Schleifenimpedanz und prospektiver Kurzschlussstrom","Auslösecharakteristik und Abschaltzeit"],"parts":[{"heading":"Dein Dozent erklärt: Fehlerschleifenimpedanz und Abschaltbedingungen","text":"Heute geht es um fehlerschleifenimpedanz und abschaltbedingungen. Im Fehlerfall hängt der mögliche Strom unter anderem von Quellimpedanz und Rückweg ab. Eine hohe Fehlerschleifenimpedanz kann den Fehlerstrom begrenzen und damit eine geforderte Abschaltung erschweren. Abschaltzeiten, Schutzgeräte und Netzsystem müssen zusammen betrachtet werden. Die entscheidenden Werte und Prüfverfahren sind in der gültigen NIN und den Gerätedaten nachzuweisen. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Ein stark vereinfachtes Rechenmodell mit 230 Volt und insgesamt 1 Ohm Fehlerschleifenimpedanz ergibt rechnerisch 230 Ampere. Das ist noch keine Freigabe einer konkreten Anlage: Impedanzverhältnisse, Messfehler, Schutzgerät und geforderte Abschaltbedingungen müssen nachgewiesen werden. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Ein hoher rechnerischer Fehlerstrom ist kein Ersatz für den normativen Schutzbeweis. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Schleifenimpedanz und prospektiver Kurzschlussstrom; Auslösecharakteristik und Abschaltzeit. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIN Teil 4/5/6; Hersteller-Selektivitätstabellen. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Abschaltbedingung und Selektivität auseinanderhalten","bridge":"Schutz gegen elektrischen Schlag und möglichst störungsarme Abschaltung bei Fehlern sind unterschiedliche Planungsziele. Für die Beurteilung braucht es Fehlerweg, Schutzgerät, Kennlinien und die anwendbaren Abschaltbedingungen. Ein bestimmter Leitungsschutzschalter kann ohne Kenntnis des gesamten Stromkreises nicht als passend oder selektiv freigegeben werden.","exercise":"Reine Rechen- und Tabellenstudien; jede reale Schutzprüfung nur unter fachkundiger Leitung. Halte zusätzlich die Antwort auf die Frage «Welche Grösse beeinflusst den prospektiven Fehlerstrom wesentlich?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erstelle eine Prüf-Checkliste für einen vorliegenden Kurzschluss- und Schutzgerätefall: Welche Mess- und Herstellerdaten fehlen?","solution":"Ein hoher rechnerischer Fehlerstrom ist kein Ersatz für den normativen Schutzbeweis. Der Merksatz lautet: Ein hoher rechnerischer Fehlerstrom ist kein Ersatz für den normativen Schutzbeweis. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Welche Grösse beeinflusst den prospektiven Fehlerstrom wesentlich?","options":["Nur die Stromkreisnummer","Fehlerschleifenimpedanz","Die Farbe des Schutzschalters"],"c":1,"why":"Ein hoher rechnerischer Fehlerstrom ist kein Ersatz für den normativen Schutzbeweis.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Ein hoher rechnerischer Fehlerstrom ist kein Ersatz für den normativen Schutzbeweis."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Die Farbe des Schutzschalters","Ein hoher rechnerischer Fehlerstrom ist kein Ersatz für den normativen Schutzbeweis.","Nur die Stromkreisnummer"],"c":1,"why":"Der Merksatz lautet: Ein hoher rechnerischer Fehlerstrom ist kein Ersatz für den normativen Schutzbeweis.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Ein hoher rechnerischer Fehlerstrom ist kein Ersatz für den normativen Schutzbeweis."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["5.1.4b–5.1.7b; 5.3.6b","Norm-/Regelwerk: NIN Teil 4/5/6; Hersteller-Selektivitätstabellen","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Schleifenimpedanz und prospektiver Kurzschlussstrom"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Fehlerschleifenimpedanz und Abschaltbedingungen» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Fehlerschleifenimpedanz und Abschaltbedingungen» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Reine Rechen- und Tabellenstudien; jede reale Schutzprüfung nur unter fachkundiger Leitung. Halte zusätzlich die Antwort auf die Frage «Welche Grösse beeinflusst den prospektiven Fehlerstrom wesentlich?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erstelle eine Prüf-Checkliste für einen vorliegenden Kurzschluss- und Schutzgerätefall: Welche Mess- und Herstellerdaten fehlen?"},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Welche Grösse beeinflusst den prospektiven Fehlerstrom wesentlich?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/4.02-A.svg"},{"id":"4.02-B","year":4,"title":"Selektivität und Schutzgerätabstimmung","goals":["Koordination LS/RCD/SPD und Vorsicherung","Fehlerfallanalyse und Freigabekriterien"],"parts":[{"heading":"Dein Dozent erklärt: Selektivität und Schutzgerätabstimmung","text":"Heute geht es um selektivität und schutzgerätabstimmung. Selektivität bedeutet, dass bei  genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Abschaltbedingung und Selektivität auseinanderhalten","bridge":"Schutz gegen elektrischen Schlag und möglichst störungsarme Abschaltung bei Fehlern sind unterschiedliche Planungsziele. Für die Beurteilung braucht es Fehlerweg, Schutzgerät, Kennlinien und die anwendbaren Abschaltbedingungen. Ein bestimmter Leitungsschutzschalter kann ohne Kenntnis des gesamten Stromkreises nicht als passend oder selektiv freigegeben werden.","exercise":"Reine Rechen- und Tabellenstudien; jede reale Schutzprüfung nur unter fachkundiger Leitung. Halte zusätzlich die Antwort auf die Frage «Wodurch wird eine Selektivitätsaussage belastbar?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erstelle eine Prüf-Checkliste für einen vorliegenden Kurzschluss- und Schutzgerätefall: Welche Mess- und Herstellerdaten fehlen?","solution":"Selektivität ist ein nachgewiesener Geräteverbund, keine Bauchregel. Der Merksatz lautet: Selektivität ist ein nachgewiesener Geräteverbund, keine Bauchregel. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Wodurch wird eine Selektivitätsaussage belastbar?","options":["Durch Abschalten aller Stromkreise","Nur durch grössere Zahlen auf dem Vorsicherungsgerät","Durch geeignete Herstellerdaten und Anlagenprüfung"],"c":2,"why":"Selektivität ist ein nachgewiesener Geräteverbund, keine Bauchregel.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Selektivität ist ein nachgewiesener Geräteverbund, keine Bauchregel."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Durch Abschalten aller Stromkreise","Selektivität ist ein nachgewiesener Geräteverbund, keine Bauchregel."," an, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["5.1.4b–5.1.7b; 5.3.6b","Norm-/Regelwerk: NIN Teil 4/5/6; Hersteller-Selektivitätstabellen","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Schutz in langen Leitungen und bei besonderen Netzen"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Schutzfälle und sichere Freigabeentscheidungen» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Schutzfälle und sichere Freigabeentscheidungen» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Reine Rechen- und Tabellenstudien; jede reale Schutzprüfung nur unter fachkundiger Leitung. Halte zusätzlich die Antwort auf die Frage «Was ist bei fehlendem Schutz-Nachweis angemessen?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erstelle eine Prüf-Checkliste für einen vorliegenden Kurzschluss- und Schutzgerätefall: Welche Mess- und Herstellerdaten fehlen?"},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Was ist bei fehlendem Schutz-Nachweis angemessen?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/4.02-C.svg"},{"id":"4.03-A","year":4,"title":"Lastprofile, Eigenverbrauch und Energieflüsse","goals":["Lastprofile und Energiefluss über 24 Stunden","PV-Eigenverbrauch, Batteriespeicher und Wechselrichterkopplung"],"parts":[{"heading":"Dein Dozent erklärt: Lastprofile, Eigenverbrauch und Energieflüsse","text":"Heute geht es um lastprofile, eigenverbrauch und energieflüsse. Ein Haus mit PV-Anlage bezieht und liefert Energie je nach Tageszeit. Die Jahresbilanz allein erklärt nicht, wie viel eigener Solarstrom direkt verbraucht wird. Dazu müssen Erzeugungs- und Verbrauchsprofile zeitgleich betrachtet werden. Batterien verschieben Energie, erzeugen sie aber nicht und verursachen Umwandlungs- sowie Speicherverluste. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Erstelle eine 24-Stunden-Tabelle mit stündlicher PV-Produktion und Haushaltslast. Berechne pro Stunde Direktverbrauch als kleineren Wert von Erzeugung und Verbrauch und summiere anschliessend Netzbezug und Überschuss. Vergleiche mit einer einfachen Tagesenergiesumme. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Zeitgleiche Leistung ist für Eigenverbrauch wichtiger als die reine Jahresbilanz. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Lastprofile und Energiefluss über 24 Stunden; PV-Eigenverbrauch, Batteriespeicher und Wechselrichterkopplung. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIN 2025 Teil 7.12 (PV), 7.22 (EV), Teil 8; ESTI 220. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Eigenverbrauch und Speicherverluste bilanzieren","bridge":"Photovoltaikertrag und zeitgleicher Strombedarf bestimmen den unmittelbaren Eigenverbrauch. Ein Speicher verschiebt Energie zeitlich, verursacht aber Verluste und hat Kapazitäts- sowie Leistungsgrenzen. Eine Ladestation benötigt zusätzlich ein Lastmanagement, das den anderen Verbrauchern und den Anschlussbedingungen Rechnung trägt.","exercise":"Energiemanagement-Simulation für Haus/PV/Ladestation; keine reale Anbindung. Halte zusätzlich die Antwort auf die Frage «Wann entsteht direkter PV-Eigenverbrauch?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Zeichne für einen fiktiven Haushalt Tageskurven von Last und PV-Erzeugung. Markiere Eigenverbrauch und Überschüsse qualitativ.","solution":"Zeitgleiche Leistung ist für Eigenverbrauch wichtiger als die reine Jahresbilanz. Der Merksatz lautet: Zeitgleiche Leistung ist für Eigenverbrauch wichtiger als die reine Jahresbilanz. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Wann entsteht direkter PV-Eigenverbrauch?","options":["Nur bei abgeschaltetem Wechselrichter","Nur nachts","Wenn Erzeugung und Verbraucher zeitgleich aktiv sind"],"c":2,"why":"Zeitgleiche Leistung ist für Eigenverbrauch wichtiger als die reine Jahresbilanz.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Zeitgleiche Leistung ist für Eigenverbrauch wichtiger als die reine Jahresbilanz."},{" rtschaftlichkeit oder zulässigen elektrischen Installation folgt. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Speicherkapazität und Ausgangsleistung müssen getrennt betrachtet werden. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Ladeinfrastruktur und Lastmanagement; Netzanschluss, Meldung und Messkonzept. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIN 2025 Teil 7.12 (PV), 7.22 (EV), Teil 8; ESTI 220. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Eigenverbrauch und Speicherverluste bilanzieren","bridge":"Photovoltaikertrag und zeitgleicher Strombedarf bestimmen den unmittelbaren Eigenverbrauch. Ein Speicher verschiebt Energie zeitlich, verursacht aber Verluste und hat Kapazitäts- sowie Leistungsgrenzen. Eine Ladestation benötigt zusätzlich ein Lastmanagement, das den anderen Verbrauchern und den Anschlussbedingungen Rechnung trägt.","exercise":"Energiemanagement-Simulation für Haus/PV/Ladestation; keine reale Anbindung. Halte zusätzlich die Antwort auf die Frage «Was . BiVo2015-Prüfungsumfang getrennt halten"],"parts":[{"heading":"Dein Dozent erklärt: Elektromobilität und intelligentes Lastmanagement","text":"Heute geht es um elektromobilität und intelligentes lastmanagement. Ladeinfrastruktur verbindet elektrische Installation, Kommunikationssysteme, Netzbetreiberbedingungen und Gebäudebetrieb. Dynamisches Lastmanagement verteilt die verfügbare Anschlussleistung auf mehrere Verbraucher und Ladepunkte. Die NIN enthält besondere Regelungen für Stromversorgung von Elektrofahrzeugen, die im Original für die Detailplanung nachzuschlagen sind. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Plane rein schematisch einen Hausanschluss mit Wärmepumpe, Ladepunkt und PV. Definiere eine Priorität, die bei hoher Gebäudegrundlast die Ladeleistung senkt. Berechne einfache Leistungsbudgets, aber gib keine reale Sicherungs- oder Leitungsdimensionierung ohne Norm- und Fachprüfung frei. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Lastmanagement begrenzt gleichzeitige Leistung und koordiniert Verbraucher. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Wirkungsgradketten, Rundsteuerung und Smart Meter; NIN 2025 neue Themen vs. BiVo2015-Prüfungsumfang getrennt halten. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIN 2025 Teil 7.12 (PV), 7.22 (EV), Teil 8; ESTI 220. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Eigenverbrauch und Speicherverluste bilanzieren","bridge":"Photovoltaikertrag und zeitgleicher Strombedarf bestimmen den unmittelbaren Eigenverbrauch. Ein Speicher verschiebt Energie zeitlich, verursacht aber Verluste und hat Kapazitäts- sowie Leistungsgrenzen. Eine Ladestation benötigt zusätzlich ein Lastmanagement, das den anderen Verbrauchern und den Anschlussbedingungen Rechnung trägt.","exercise":"Energiemanagement-Simulation für Haus/PV/Ladestation; keine reale Anbindung. Halte zusätzlich die Antwort auf die Frage «Was macht dynamisches Lastmanagement typischerweise?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Zeichne für einen fiktiven Haushalt Tageskurven von Last und PV-Erzeugung. Markiere Eigenverbrauch und Überschüsse qualitativ.","solution":"Lastmanagement begrenzt gleichzeitige Leistung und koordiniert Verbraucher. Der Merksatz lautet: Lastmanagement begrenzt gleichzeitige Leistung und koordiniert Verbraucher. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was macht dynamisches Lastmanagement typischerweise?","options":["Es erhöht unbeschränkt die Hausanschlussleistung","Es passt Ladeleistungen an verfügbare Anschlussleistung an","Es ersetzt die Netzbetreiberanmeldung"],"c":1,"why":"Lastmanagement begrenzt gleichzeitige Leistung und koordiniert Verbraucher.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der K ik den Übergang zwischen «Dein Dozent erklärt: Elektromobilität und intelligentes Lastmanagement» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Energiemanagement-Simulation für Haus/PV/Ladestation; keine reale Anbindung. Halte zusätzlich die Antwort auf die Frage «Was macht dynamisches Lastmanagement typischerweise?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Zeichne für einen fiktiven Haushalt Tageskurven von Last und PV-Erzeugung. Markiere Eigenverbrauch und Überschüsse qualitativ."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Was macht dynamisches Lastmanagement typischerweise?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/4.03-C.svg"},{"id":"4.04-A","year":4,"title":"Ablauflogik und Zustandsautomaten","goals":["Mehrfache Verriegelungen, Ablauf-/Zustandslogik","KOP/FUP und Fehlertabellen, Funktionsgraph"],"parts":[{"heading":"Dein Dozent erklärt: Ablauflogik und Zustandsautomaten","text":"Heute geht es um ablauflogik und zustandsautomaten. Komplexere Steuerungen benötigen ein definiertes Verhalten über die Zeit. Ein Zustandsautomat beschreibt Zustände, Ereignisse und Übergangsbedingungen. Eine Ablaufkette wird nachvollziehbarer, wenn Startbedingungen, Fehlerbehandlung und Rücksetzung ausdrücklich dargestellt sind. Für sicherheitsbezogene Funktionen braucht es zusätzlich die jeweils geltenden Anforderungen an die funktionale Sicherheit. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Entwickle für eine virtuelle Förderstrecke drei Zustände: bereit, transportieren und Störung. Lege fest, welche Eingänge jeden Übergang auslösen und wann die Rückkehr in den Bereitschaftszustand erlaubt ist. Prüfe alle Übergänge anhand einer Zustandsmatrix. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Jeder mögliche Zustand braucht ein definiertes Verhalten. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Mehrfache Verriegelungen, Ablauf-/Zustandslogik; KOP/FUP und Fehlertabellen, Funktionsgraph. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: Lehrplan 5.4/5.5; NIN Teile 4/5. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Zustandsautomaten für nachvollziehbare Funktionen","bridge":"Eine Steuerung sollte nicht nur mit lose verbundenen Schaltbedingungen beschrieben werden. Zustände, Auslöser und erlaubte Übergänge machen unerwartetes Verhalten erkennbar. Sicherheitskritische Funktionen benötigen zusätzlich einen eigenständigen sicherheitsbezogenen Nachweis. Eine Simulation kann Logikfehler sichtbar machen, ersetzt aber keine Inbetriebnahmeprüfung.","exercise":"Komplexere 24-V-Steuerung bzw. Software-Simulation mit 6 Ein- und Ausgängen. Halte zusätzlich die Antwort auf die Frage «Wofür eignet sich ein Zustandsautomat?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Modelliere einen kleinen Zustandsautomaten mit Aus, Bereit, Betrieb und Störung. Beschreibe die erlaubten Übergänge.","solution":"Jeder mögliche Zustand braucht ein definiertes Verhalten. Der Merksatz lautet: Jeder mögliche Zustand braucht ein definiertes Verhalten. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Wofür eignet sich ein Zustandsautomat?","options":["Zur Beschreibung von Zuständen und Übergängen","Zur Messung des Schutzleiterwiderstands","Zur ausschliesslichen Farbwahl von Kabeln"],"c":0,"why":"Jeder mögliche Zustand braucht ein definiertes Verhalten.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Jeder mögliche Zustand braucht ein definiertes Verhalten."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Zur Messung des Schutzleiterwiderstands","Jeder mögliche Zustand braucht ein definiertes Verhalten.","Zur ausschliesslichen Farbwahl von Kabeln"],"c":1,"why":"Der Merksatz lautet: Jeder mögliche Zustand braucht ein definiertes Verhalten.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Jeder mögliche Zustand braucht ein definiertes Verhalten."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen. n und Szenen"],"parts":[{"heading":"Dein Dozent erklärt: Verriegelungen, Sensorik und Fehlertabelle","text":"Heute geht es um verriegelungen, sensorik und fehlertabelle. In Anlagen wirken Freigaben, Rückmeldungen, Zeitüberwachungen und Sperren zusammen. Eine Verriegelung verhindert bestimmte unzulässige Kombinationen. Die Fehlertabelle ordnet Symptomen mögliche Ursachen und Prüfschritte zu. Um falsche Freigaben zu vermeiden, muss der tatsächliche Zustand von Sensor und Aktor getrennt betrachtet werden. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Simuliere eine Maschine mit zwei Positionssensoren und einem Antrieb. Der Antrieb darf nur bei freigegebener Position einschalten. Erzeuge einen fehlerhaften Sensorzustand und dokumentiere, wie die Logik reagieren müsste. Für eine reale Anlage wäre ein Sicherheitskonzept nötig. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Ein Signal «Freigabe» ist nicht dasselbe wie ein nachgewiesener sicherer Zustand. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Motorsteuerung und Schutz als System; KNX-Lastenlisten und Szenen. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: Lehrplan 5.4/5.5; NIN Teile 4/5. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Zustandsautomaten für nachvollziehbare Funktionen","bridge":"Eine Steuerung sollte nicht nur mit lose verbundenen Schaltbedingungen beschrieben werden. Zustände, Auslöser und erlaubte Übergänge machen unerwartetes Verhalten erkennbar. Sicherheitskritische Funktionen benötigen zusätzlich einen eigenständigen sicherheitsbezogenen Nachweis. Eine Simulation kann Logikfehler sichtbar machen, ersetzt aber keine Inbetriebnahmeprüfung.","exercise":"Komplexere 24-V-Steuerung bzw. Software-Simulation mit 6 Ein- und Ausgängen. Halte zusätzlich die Antwort auf die Frage «Was ist der Zweck einer Verriegelung?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Modelliere einen kleinen Zustandsautomaten mit Aus, Bereit, Betrieb und Störung. Beschreibe die erlaubten Übergänge.","solution":"Ein Signal «Freigabe» ist nicht dasselbe wie ein nachgewiesener sicherer Zustand. Der Merksatz lautet: Ein Signal «Freigabe» ist nicht dasselbe wie ein nachgewiesener sicherer Zustand. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was ist der Zweck einer Verriegelung?","options":["Den Motor ohne Bedingungen starten","Bestimmte unzulässige Kombinationen verhindern","Die Netzspannung automatisch stabilisieren"],"c":1,"why":"Ein Signal «Freigabe» ist nicht dasselbe wie ein nachgewiesener sicherer Zustand.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Ein Signal «Freigabe» ist nicht dasselbe wie ein nachgewiesener sicherer Zustand."},{"q":"Welche Aussage ist als fachlicher Mer eine eigenmächtigen Netzarbeiten. Modelliere einen kleinen Zustandsautomaten mit Aus, Bereit, Betrieb und Störung. Beschreibe die erlaubten Übergänge.","solution":"Bedienoberflächen müssen die tatsächlichen Zustände korrekt wiedergeben. Der Merksatz lautet: Bedienoberflächen müssen die tatsächlichen Zustände korrekt wiedergeben. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Wozu dient eine Prioritätenmatrix?","options":["Zur Einspeisung von Netzspannung","Zur Kabellängenmessung","Zur eindeutigen Auflösung widersprüchlicher Befehle"],"c":2,"why":"Bedienoberflächen müssen die tatsächlichen Zustände korrekt wiedergeben.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Bedienoberflächen müssen die tatsächlichen Zustände korrekt wiedergeben."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Zur Einspeisung von Netzspannung","Bedienoberflächen müssen die tatsächlichen Zustände korrekt wiedergeben.","Zur Kabellängenmessung"],"c":1,"why":"Der Merksatz lautet: Bedienoberflächen müssen die tatsächlichen Zustände korrekt wiedergeben.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Bedienoberflächen müssen die tatsächlichen Zustände korrekt wiedergeben."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["5.4.1b–5.4.4b; 5.5.1b–5.5.3b","Norm-/Regelw satz eines Messgeräts vorbereitet. Anlagenzustand, Gefährdungen, Befugnisse, Dokumentation und die anzuwendenden Schutzvorgaben sind zu kennen. Das Prüfverfahren muss so gewählt sein, dass weder Personen noch Betriebsmittel unzulässig gefährdet werden. Prüfschritte, die Netzspannung oder Prüfspannungen verwenden, gehören in eine beaufsichtigte fachliche Umgebung. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Erstelle einen Prüfplan für eine rein fiktive Installation. Ordne den Schritten Sichtprüfung, Schutzleiterbeurteilung, Isolationsprüfung, RCD-Bewertung und Funktionskontrolle geeignete Dokumente und Verantwortlichkeiten zu. Füge vor jedem Schritt die notwendige Sicherheitsfreigabe ein. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Prüfreihenfolge ist Teil des Sicherheitskonzepts. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Systematische Sichtprüfung und Prüfstrategie; Schutzleiterprüfung und Isolationswiderstand. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIN Teil 6; NIV Art. 24, 37; ESTI Weisung 220. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Prüfdossier als überprüfbare Begründung","bridge":"Ein vollständiges Prüfungsdossier verbindet Anlagenidentifikation, Prüfumfang, verwendete Messmittel, Einzelergebnisse und Abweichungen. Die Freigabe ist ein begründeter Fachentscheid. Liegt ein entscheidender Nachweis nicht vor, ist «nicht beurteilbar» ehrlicher als ein grüner Haken.","exercise":"Fachgeleitete praktische Messübung an geeigneter, freigegebener Trainingsinstallation; keine eigenen Netztests. Halte zusätzlich die Antwort auf die Frage «Was muss vor der ersten Messung geklärt sein?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Prüfe ein fiktives Messprotokoll auf fehlende Felder und begründe, warum einzelne Zahlen nicht für eine Freigabe reichen.","solution":"Prüfreihenfolge ist Teil des Sicherheitskonzepts. Der Merksatz lautet: Prüfreihenfolge ist Teil des Sicherheitskonzepts. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was muss vor der ersten Messung geklärt sein?","options":["Nur die Uhrzeit","Anlagenzustand, Befugnisse und Prüfverfahren","Nur die Marke des Prüfgeräts"],"c":1,"why":"Prüfreihenfolge ist Teil des Sicherheitskonzepts.\n\nBezug zum Unterrichtsteil «Dein Dozent erklärt: Sichtprüfung, Prüfreihenfolge und Freigaben»: Das Prüfverfahren muss so gewählt sein, dass weder Personen noch Betriebsmittel unzulässig gefährdet werden."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Nur die Marke des Prüfgeräts","Prüfreihenfolge ist Teil des Sicherheitskonzepts.","Nur die Uhrzeit"],"c":1,"why":"Der Merksatz lautet: Prüfreihenfolge ist Teil des Sicherheitskonzepts.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Prüfreihenfolge ist Teil des Sicherheitskonzepts."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["5.1.7a–c; 5.3.6a–c; 4.3.6b","Norm-/Regelwerk: NIN Teil 6; NIV Art. 24, 37; ESTI Weisung 220","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Systematische Sichtprüfung und Prüfstrategie"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Sichtprüfung, Prüfreihenfolge und Freigaben» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Sichtprüfung, Prüfreihenfolge und Freigaben» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Fachgeleitete praktische Messübung an geeigneter, freigegebener Trainingsinstallation; keine eigenen Netztests. Halte zusätzlich die Antwort auf die Frage «Was muss vor der ersten Messung geklärt sein?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Prüfe ein fiktives Messprotokoll auf fehlende Felder und begründe, warum einzelne Zahlen nicht für eine Freigabe reichen."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Was muss vor der ersten Messung geklärt sein?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/4.05-A.svg"},{"id":"4.05-B","year":4,"title":"Messunsicherheit, Grenzwerte und Bewertungslogik","goals":["Kurzschlussstrom, RCD, Schleifenimpedanz und Funktion","Prüfmittel und Messunsicherheit"],"parts":[{"heading":"Dein Dozent erklärt: Messunsicherheit, Grenzwerte und Bewertungslogik","text":"Heute geht es um messunsicherheit, grenzwerte und bewertungslogik. Ein Messwert ohne Referenz kann nicht als gut oder schlecht bewertet werden. Die gültige Norm definiert je nach Verfahren Prüfschritte und Kriterien; das verwendete Gerät besitzt Spezifikationen und Messunsicherheiten. Eine Grenzwertnähe verlangt besonders sorgfältige Bewertung. Dokumentation und Plausibilität sind daher genauso wichtig wie die angezeigten Ziffern. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Eine fiktive Prüfung liefert einen Messwert knapp am zulässigen Grenzbereich. Notiere, welche Informationen fehlen: Normfassung, Messbedingungen, Messgerätedaten, anzuwendende Toleranzen und Betriebszustand. Entscheide nicht eigenmächtig aufgrund einer unbestätigten Internetzahl. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Präzise Anzeige ist nicht automatisch präzise Beurteilung. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Kurzschlussstrom, RCD, Schleifenimpedanz und Funktion; Prüfmittel und Messunsicherheit. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIN Teil 6; NIV Art. 24, 37; ESTI Weisung 220. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Prüfdossier als überprüfbare Begründung","bridge":"Ein vollständiges Prüfungsdossier verbindet Anlagenidentifikation, Prüfumfang, verwendete Messmittel, Einzelergebnisse und Abweichungen. Die Freigabe ist ein begründeter Fachentscheid. Liegt ein entscheidender Nachweis nicht vor, ist «nicht beurteilbar» ehrlicher als ein grüner Haken.","exercise":"Fachgeleitete praktische Messübung an geeigneter, freigegebener Trainingsinstallation; keine eigenen Netztests. Halte zusätzlich die Antwort auf die Frage «Was macht eine Grenzwertbewertung verlässlich?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Prüfe ein fiktives Messprotokoll auf fehlende Felder und begründe, warum einzelne Zahlen nicht für eine Freigabe reichen.","solution":"Präzise Anzeige ist nicht automatisch präzise Beurteilung. Der Merksatz lautet: Präzise Anzeige ist nicht automatisch präzise Beurteilung. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was macht eine Grenzwertbewertung verlässlich?","options":["Nur ein grüner Hintergrund am Display","Nur viele Nachkommastellen","Normvorgabe, Prüfbedingungen und Messunsicherheit"],"c":2,"why":"Präzise Anzeige ist nicht automatisch präzise Beurteilung.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Präzise Anzeige ist nicht automatisch präzise Beurteilung."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Nur ein grüner Hintergrund am Display","Präzise Anzeige ist nicht automatisch präzise Beurteilung.","Nur viele Nachkommastellen"],"c":1,"why":"Der Merksatz lautet: Präzise Anzeige ist nicht automatisch präzise Beurteilung.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Präzise Anzeige ist nicht automatisch präzise Beurteilung."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["5.1.7a–c; 5.3.6a–c; 4.3.6b","Norm-/Regelwerk: NIN Teil 6; NIV Art. 24, 37; ESTI Weisung 220","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Kurzschlussstrom, RCD, Schleifenimpedanz und Funktion"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Messunsicherheit, Grenzwerte und Bewertungslogik» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Messunsicherheit, Grenzwerte und Bewertungslogik» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Fachgeleitete praktische Messübung an geeigneter, freigegebener Trainingsinstallation; keine eigenen Netztests. Halte zusätzlich die Antwort auf die Frage «Was macht eine Grenzwertbewertung verlässlich?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Prüfe ein fiktives Messprotokoll auf fehlende Felder und begründe, warum einzelne Zahlen nicht für eine Freigabe reichen."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Was macht eine Grenzwertbewertung verlässlich?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/4.05-B.svg"},{"id":"4.05-C","year":4,"title":"Erstprüfungsdossier und Übergabe","goals":["Vollständige Dokumentation und Interpretation","Abgrenzung Erstprüfung, Schlusskontrolle und Sicherheitsnachweis"],"parts":[{"heading":"Dein Dozent erklärt: Erstprüfungsdossier und Übergabe","text":"Heute geht es um erstprüfungsdossier und übergabe. Ein Prüfdossier verbindet Anlagenbeschreibung, Stromkreisverzeichnis, angewendete Regeln, Mess- und Prüfprotokolle sowie die erforderlichen Verantwortlichkeiten. Erstprüfung, Schlusskontrolle und Sicherheitsnachweis dürfen dabei nicht verwechselt werden. Die abschliessende Bewertung enthält gegebenenfalls Mängel, Massnahmen und eine fachgerechte Nachkontrolle. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Entwerfe eine Mappe für eine fiktive Wohnungssanierung. Lege ein Deckblatt mit Prüfobjekt und Umfang, eine Stromkreisliste, ein Prüfblatt und eine Mängelliste an. Markiere Felder, die nur die entsprechend berechtigte prüfende Person ausfüllen darf. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Ein Prüfdossier ist nachvollziehbare technische Evidenz. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Vollständige Dokumentation und Interpretation; Abgrenzung Erstprüfung, Schlusskontrolle und Sicherheitsnachweis. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIN Teil 6; NIV Art. 24, 37; ESTI Weisung 220. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Prüfdossier als überprüfbare Begründung","bridge":"Ein vollständiges Prüfungsdossier verbindet Anlagenidentifikation, Prüfumfang, verwendete Messmittel, Einzelergebnisse und Abweichungen. Die Freigabe ist ein begründeter Fachentscheid. Liegt ein entscheidender Nachweis nicht vor, ist «nicht beurteilbar» ehrlicher als ein grüner Haken.","exercise":"Fachgeleitete praktische Messübung an geeigneter, freigegebener Trainingsinstallation; keine eigenen Netztests. Halte zusätzlich die Antwort auf die Frage «Was gehört in ein vollständiges Prüfdossier?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Prüfe ein fiktives Messprotokoll auf fehlende Felder und begründe, warum einzelne Zahlen nicht für eine Freigabe reichen.","solution":"Ein Prüfdossier ist nachvollziehbare technische Evidenz. Der Merksatz lautet: Ein Prüfdossier ist nachvollziehbare technische Evidenz. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was gehört in ein vollständiges Prüfdossier?","options":["Anlagenumfang, Prüfergebnisse und Verantwortlichkeiten","Nur ein Foto des Werkzeugs","Nur eine Schlussrechnung"],"c":0,"why":"Ein Prüfdossier ist nachvollziehbare technische Evidenz.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Ein Prüfdossier ist nachvollziehbare technische Evidenz."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Nur ein Foto des Werkzeugs","Ein Prüfdossier ist nachvollziehbare technische Evidenz.","Nur eine Schlussrechnung"],"c":1,"why":"Der Merksatz lautet: Ein Prüfdossier ist nachvollziehbare technische Evidenz.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Ein Prüfdossier ist nachvollziehbare technische Evidenz."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit eine
