ng":"Messwerte brauchen einen Zweck","text":"Welche Messungen in einem konkreten Erdungssystem sinnvoll sind, hängt von Bauart, Schutzkonzept und Prüfziel ab. Eine einzelne scheinbar gute Zahl beweist nicht sämtliche Verbindungen und nicht die Langzeitbeständigkeit.","formula":""}],"bridgeTitle":"Spezifische Fallstudie auf Grundlage der genannten Normausgabe; normativer Einzelabgleich ausstehend.","bridge":"Erdungsanlagen müssen über Jahrzehnte funktionieren, obwohl Teile später nicht mehr zugänglich sind. Dauerhaftigkeit und Qualität der Verbindungen sind deshalb genauso wichtig wie die reine Leitfähigkeit zum Zeitpunkt der Montage.","exercise":"Nach einem Neubau fehlen Fotos, Armierungspläne und die Dokumentation der Erdanschlüsse.","solution":"Das ist ein gravierender Dokumentationsmangel. Die verantwortlichen Fachpersonen müssen klären, welche Nachweise nachträglich noch möglich sind und was nicht verifiziert werden kann.","quiz":[{"q":"Ersetzt ein guter Anfangsmesswert die Dauerhaftigkeitsprüfung?","options":["Ja","Nein","Nur bei Fundamenten"],"c":1,"why":"Korrosion und mechanische Dauerhaftigkeit benötigen eigene Betrachtung."},{"q":"Warum ist die Vor-Betonage-Dokumentation wertvoll?","options":["Verdeckte Arbeiten werden nachvollziehbar","Sie erhöht den Erdwiderstand","Sie ersetzt die gesamte Planung"],"c":0,"why":"Später verdeckte Details lassen sich nachweisen.\n\nBezug zum Unterrichtsteil «Kontrollpunkte bewusst planen»: Verdeckte Bauleistungen sind früh abnahmefähig zu machen."},{"q":"Worauf zielt die Materialauswahl?","options":["Dauerhaft geeignete Verbindungen","Einfach die billigste Legierung","Nur optische Wirkung"],"c":0,"why":"Werkstoffwahl ist Teil der Langzeitfunktion."}],"refs":["SN 414113:2024-12","5","6.3–6.6","7","9"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Erdungsanlagen müssen über Jahrzehnte funktionieren, obwohl Teile später nicht mehr zugänglich sind. Dauerhaftigkeit und Qualität der Verbindungen sind deshalb genauso wichtig wie die reine Leitfähigkeit zum Zeitpunkt der Montage."},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Korrosion als schleichender Ausfall» und «Kontrollpunkte bewusst planen». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Korrosion als schleichender Ausfall» und «Messwerte brauchen einen Zweck». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Nach einem Neubau fehlen Fotos, Armierungspläne und die Dokumentation der Erdanschlüsse."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Ersetzt ein guter Anfangsmesswert die Dauerhaftigkeitsprüfung?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/N-E03.svg"},{"id":"N-B01","year":3,"title":"Blitzschutz als System statt einzelner Fangstange","goals":["Bei Blitzschutz ist die Fangstange nur ein sichtbarer Teil. Ein Blitzschutzsystem muss einen Blitzstrom möglichst kontrolliert aufnehmen, ableiten und in das Erdungs- und Potentialausgleichssystem einbinden.","Auf einem Gewerbedach mit bestehendem Blitzschutz werden PV-Module näher an die Fangstangen montiert."],"parts":[{"heading":"Äusserer und innerer Blitzschutz","text":"Der äussere Blitzschutz betrachtet Fangeinrichtungen, Ableitungen und Erdungsanlage. Der innere Blitzschutz zielt unter anderem darauf, gefährliche Funkenüberschläge und Überspannungen zu beherrschen. Beide Bereiche hängen eng zusammen.","formula":""},{"heading":"Schutzklassen und Risiko","text":"Die Norm behandelt Schutzklassen, Pflichten und Kontrollintervalle. Die konkrete Notwendigkeit und Klasse hängen von Bauwerk, Nutzung und rechtlichem Rahmen ab; sie können nicht allein aus der Höhe eines Hauses oder dem Eigentümerwunsch abgeleitet werden.","formula":""},{"heading":"PV ändert die Dachlandschaft","text":"PV-Module, Gestelle, Leitungswege und Dachaufbauten verändern die vorhandenen metallischen Strukturen. Eine bestehende Blitzschutzanlage muss daher bei einem PV-Umbau fachkundig hinsichtlich Schutzraum, Abständen und Potentialausgleich neu bewertet werden.","formula":""}],"bridgeTitle":"Spezifische Fallstudie auf Grundlage der genannten Normausgabe; normativer Einzelabgleich ausstehend.","bridge":"Bei Blitzschutz ist die Fangstange nur ein sichtbarer Teil. Ein Blitzschutzsystem muss einen Blitzstrom möglichst kontrolliert aufnehmen, ableiten und in das Erdungs- und Potentialausgleichssystem einbinden.","exercise":"Auf einem Gewerbedach mit bestehendem Blitzschutz werden PV-Module näher an die Fangstangen montiert.","solution":"Prüfen lassen, ob Schutzräume und Trennungsabstände noch eingehalten sind. Keine eigenmächtige Verbindung oder Kürzung der Ableitungen vornehmen.","quiz":[{"q":"Was gehört zum äusseren Blitzschutz?","options":["Fangeinrichtung, Ableitung, Erdung","Nur ein Wechselrichter","Nur ein Zähler"],"c":0,"why":"Der äussere Blitzschutz ist ein zusammenhängendes System.\n\nBezug zum Unterrichtsteil «Äusserer und innerer Blitzschutz»: Der äussere Blitzschutz betrachtet Fangeinrichtungen, Ableitungen und Erdungsanlage."},{"q":"Ist ein PV-Umbau auf einem Blitzschutzdach immer neutral?","options":["Nein","Ja","Nur bei Glas-Glas-Modulen"],"c":0,"why":"Dachaufbauten und Leiterwege verändern die Schutzsituation.\n\nBezug zum Unterrichtsteil «PV ändert die Dachlandschaft»: PV-Module, Gestelle, Leitungswege und Dachaufbauten verändern die vorhandenen metallischen Strukturen."},{"q":"Wird die Schutzklasse allein durch die Dachfarbe festgelegt?","options":["Ja","Nein","Nur im Sommer"],"c":1,"why":"Schutzklasse und Pflicht folgen einer technischen und rechtlichen Beurteilung."}],"refs":["SN 414022:2024","2","4","5","6","7"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Bei Blitzschutz ist die Fangstange nur ein sichtbarer Teil. Ein Blitzschutzsystem muss einen Blitzstrom möglichst kontrolliert aufnehmen, ableiten und in das Erdungs- und Potentialausgleichssystem einbinden."},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Äusserer und innerer Blitzschutz» und «Schutzklassen und Risiko». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Äusserer und innerer Blitzschutz» und «PV ändert die Dachlandschaft». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Auf einem Gewerbedach mit bestehendem Blitzschutz werden PV-Module näher an die Fangstangen montiert."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Was gehört zum äusseren Blitzschutz?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/N-B01.svg"},{"id":"N-B02","year":4,"title":"Trennungsabstand, Potentialausgleich und Überspannungsschutz","goals":["Blitzströme können grosse Potentialdifferenzen erzeugen. Daher ist nicht jede metallische Nähe unproblematisch; ebenso wenig ist die blosse Verbindung aller Teile in jeder Situation automatisch die richtige Lösung.","Bei einer Dachsanierung sollen PV-Kabel unmittelbar an einem vorhandenen Blitzableiter befestigt werden."],"parts":[{"heading":"Trennungsabstand als Schutzprinzip","text":"Der Trennungsabstand soll gefährliche Überschläge zwischen Blitzschutzleiter und anderen leitfähigen Teilen vermeiden. Sein erforderlicher Wert ist eine projektspezifische Berechnung. Die Norm behandelt dafür mehrere Einflussgrössen; eine pauschale Zahl wäre fachlich unzureichend.","formula":""},{"heading":"Potentialausgleich und SPD ergänzen sich","text":"An geeignet definierten Stellen werden leitfähige Systeme einbezogen, um Potentialdifferenzen zu begrenzen. Überspannungsschutzgeräte begrenzen bestimmte transiente Überspannungen. Die Auswahl und Anordnung hängen vom Schutzkonzept, den Leitungswegen und den Normvorgaben ab.","formula":""},{"heading":"Leitungsschleifen auf PV-Dächern vermeiden","text":"Grosse DC-Leitungsschleifen begünstigen die Einkopplung von Störspannungen. Deshalb ist eine fachgerechte gemeinsame Führung von Hin- und Rückleitern und eine gezielte Überspannungsschutzplanung wichtig. Das ersetzt keinen Blitzschutz-Nachweis.","formula":""}],"bridgeTitle":"Spezifische Fallstudie auf Grundlage der genannten Normausgabe; normativer Einzelabgleich ausstehend.","bridge":"Blitzströme können grosse Potentialdifferenzen erzeugen. Daher ist nicht jede metallische Nähe unproblematisch; ebenso wenig ist die blosse Verbindung aller Teile in jeder Situation automatisch die richtige Lösung.","exercise":"Bei einer Dachsanierung sollen PV-Kabel unmittelbar an einem vorhandenen Blitzableiter befestigt werden.","solution":"Diese Ausführung keinesfalls ohne Blitzschutzplanung vorsehen. Erforderlich ist eine fachkundige Beurteilung von Trennungsabstand, Potentialausgleich, Schirmung und Überspannungsschutz.","quiz":[{"q":"Ist der Trennungsabstand für alle Gebäude immer gleich?","options":["Ja","Nein, er ist systemabhängig","Nur bei Wohngebäuden"],"c":1,"why":"Die notwendige Distanz hängt von Blitzschutzsystem und Geometrie ab."},{"q":"Wofür dienen SPDs?","options":["Begrenzung bestimmter Überspannungen","Erhöhung des PV-Ertrags um 50 %","Als Zähler"],"c":0,"why":"Überspannungsschutzgeräte schützen gegen transiente Beanspruchung.\n\nBezug zum Unterrichtsteil «Potentialausgleich und SPD ergänzen sich»: Überspannungsschutzgeräte begrenzen bestimmte transiente Überspannungen."},{"q":"Warum sind kleine DC-Leitungsschleifen günstig?","options":["Weniger induzierte Überspannung","Weniger Tageslicht","Höherer Kurzschlussstrom"],"c":0,"why":"Die Schleifenfläche beeinflusst induktive Einkopplung.\n\nBezug zum Unterrichtsteil «Leitungsschleifen auf PV-Dächern vermeiden»: Grosse DC-Leitungsschleifen begünstigen die Einkopplung von Störspannungen."}],"refs":["SN 414022:2024 / SN EN 62446-1:2016+A1:2018","414022: 7.1–7.3, 8","62446-1: 5.2.7"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Blitzströme können grosse Potentialdifferenzen erzeugen. Daher ist nicht jede metallische Nähe unproblematisch; ebenso wenig ist die blosse Verbindung aller Teile in jeder Situation automatisch die richtige Lösung."},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Trennungsabstand als Schutzprinzip» und «Potentialausgleich und SPD ergänzen sich». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Trennungsabstand als Schutzprinzip» und «Leitungsschleifen auf PV-Dächern vermeiden». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Bei einer Dachsanierung sollen PV-Kabel unmittelbar an einem vorhandenen Blitzableiter befestigt werden."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Ist der Trennungsabstand für alle Gebäude immer gleich?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/N-B02.svg"},{"id":"N-B03","year":4,"title":"Blitzschutz nach Änderungen inspizieren und dokumentieren","goals":["Blitzschutz ist kein „einmal montiert und vergessen“-Bauteil. Ein Dachumbau, eine neue PV oder eine geänderte Gebäudenutzung können die Anlage verändern, ohne dass dies im Stromzähler sichtbar wird.","Ein Dach wurde saniert, dabei wurden mehrere Ableiter zeitweise ausgehängt. Nach Bauende existiert kein Abnahmeprotokoll."],"parts":[{"heading":"Vorher-Nachher-Zustand erfassen","text":"Dokumentiert werden sollen insbesondere die wesentlichen Systemteile, ihre Führung, Verbindungen, relevante Dachaufbauten und die vorgesehenen Kontrollen. Nur so kann später zwischen ursprünglichem Konzept und Umbau unterschieden werden.","formula":""},{"heading":"Inspektion ist mehr als äusserer Anblick","text":"Äussere Beschädigung, Korrosion, lose Halterungen und fehlende Anschlüsse sind offensichtliche Prüfthemen. Ebenso wichtig sind unerkannte Änderungen und nicht mehr eingehaltene Schutzgeometrien. Welche Prüfungen und Perioden gelten, hängt von der Anlage und der Norm ab.","formula":""},{"heading":"Koordination mit anderen Gewerken","text":"Dachdecker, PV-Monteure, Elektroinstallateur und Blitzschutzfachleute haben unterschiedliche Aufgaben. Eine Übergabe muss klar machen, wer bestehende Schutzfunktionen kontrolliert und wer Nacharbeiten bestätigt hat.","formula":""}],"bridgeTitle":"Spezifische Fallstudie auf Grundlage der genannten Normausgabe; normativer Einzelabgleich ausstehend.","bridge":"Blitzschutz ist kein „einmal montiert und vergessen“-Bauteil. Ein Dachumbau, eine neue PV oder eine geänderte Gebäudenutzung können die Anlage verändern, ohne dass dies im Stromzähler sichtbar wird.","exercise":"Ein Dach wurde saniert, dabei wurden mehrere Ableiter zeitweise ausgehängt. Nach Bauende existiert kein Abnahmeprotokoll.","solution":"Ein berechtigtes Fachunternehmen muss die Anlage in Bezug auf Ausführung und Prüfumfang wieder beurteilen; das blosse Wiederbefestigen beweist keine unveränderte Schutzwirkung.","quiz":[{"q":"Kann eine Dachänderung den Blitzschutz beeinflussen?","options":["Ja","Nein","Nur im Winter"],"c":0,"why":"Neue Aufbauten und Leitungswege verändern die Situation."},{"q":"Reicht ein alter Plan ohne Nachführung?","options":["Immer","Nein","Nur bei PV"],"c":1,"why":"Der Istzustand muss dokumentiert und geprüft werden.\n\nBezug zum Unterrichtsteil «Vorher-Nachher-Zustand erfassen»: Dokumentiert werden sollen insbesondere die wesentlichen Systemteile, ihre Führung, Verbindungen, relevante Dachaufbauten und die vorgesehenen Kontrollen."},{"q":"Wer kontrolliert den Blitzschutz nach einem Umbau?","options":["Qualifizierte Fachpersonen im vorgesehenen Rahmen","Beliebige Laien","Nur die Versicherung per Foto"],"c":0,"why":"Die Beurteilung erfordert dafür qualifizierte Fachleute.\n\nBezug zum Unterrichtsteil «Vorher-Nachher-Zustand erfassen»: Dokumentiert werden sollen insbesondere die wesentlichen Systemteile, ihre Führung, Verbindungen, relevante Dachaufbauten und die vorgesehenen Kontrollen."}],"refs":["SN 414022:2024","11","Anhang A"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Blitzschutz ist kein „einmal montiert und vergessen“-Bauteil. Ein Dachumbau, eine neue PV oder eine geänderte Gebäudenutzung können die Anlage verändern, ohne dass dies im Stromzähler sichtbar wird."},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Vorher-Nachher-Zustand erfassen» und «Inspektion ist mehr als äusserer Anblick». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Vorher-Nachher-Zustand erfassen» und «Koordination mit anderen Gewerken». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Ein Dach wurde saniert, dabei wurden mehrere Ableiter zeitweise ausgehängt. Nach Bauende existiert kein Abnahmeprotokoll."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Kann eine Dachänderung den Blitzschutz beeinflussen?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/N-B03.svg"},{"id":"N-I01","year":4,"title":"Gesamtfall: Aufdach-PV vom Entwurf bis zur Übergabe","goals":["In dieser Fallstudie verknüpfst Du die zuvor getrennt gelernten Themen. Das Ziel ist, einen fachlichen Projektablauf zu begründen – nicht eine Netzanlage selbstständig zu installieren.","Der Bauherr fordert, die Anlage heute zu montieren und morgen ohne weitere Unterlagen einspeisen zu lassen."],"parts":[{"heading":"Projektannahmen und technische Daten","text":"Ein Einfamilienhaus erhält 24 Module zu 430 Wp, verteilt auf zwei Strings. DC-Spannungen werden anhand des Datenblatts, der lokalen Temperaturen und der geplanten Wechselrichtergrenzen geprüft. Parallel werden Dachstatik, Leitungstrassen, mechanischer Schutz und vorhandener Blitzschutz abgeklärt.","formula":""},{"heading":"Netzanbindung und Dokumente","text":"Vor der Ausführung sind die erforderlichen Netzmeldungen und Bewilligungen zu klären. Zu den technischen Unterlagen gehören Stringschema, Netz-/Messkonzept, Geräte-/Schutzdaten, Herstelleranweisungen und eine gültige IA mit den geforderten VNB-Unterlagen. Die Installation erfolgt nur im zulässigen betrieblichen Bewilligungsumfang.","formula":""},{"heading":"Abnahme und Übergabe","text":"Die PV-Teile sind zu besichtigen und entsprechend SN EN 62446-1 zu prüfen. Zusätzlich gelten die nationalen Regeln für elektrische Installationen, SiNa und die Netzabnahme. Übergabeunterlagen sollen spätere Erweiterungen oder Störungen nachvollziehbar machen.","formula":""}],"bridgeTitle":"Spezifische Fallstudie auf Grundlage der genannten Normausgabe; normativer Einzelabgleich ausstehend.","bridge":"In dieser Fallstudie verknüpfst Du die zuvor getrennt gelernten Themen. Das Ziel ist, einen fachlichen Projektablauf zu begründen – nicht eine Netzanlage selbstständig zu installieren.","exercise":"Der Bauherr fordert, die Anlage heute zu montieren und morgen ohne weitere Unterlagen einspeisen zu lassen.","solution":"Planung und Normen verbieten ein unkoordiniertes Abkürzen der Verfahren. Es fehlen mindestens die konkret einschlägigen Netzmeldungen, das fachlich nachgewiesene Installations- und Schutzkonzept sowie Inbetriebnahme- und Prüfunterlagen.","quiz":[{"q":"Was ist 24 × 430 Wp?","options":["10,32 kWp","1,032 kWp","103,2 kWp"],"c":0,"why":"24 × 430 = 10 320 Wp = 10,32 kWp."},{"q":"Ist die DC-Nennleistung gleich garantierte AC-Einspeisung?","options":["Ja","Nein","Immer bei cos φ = 1"],"c":1,"why":"Leistungsumwandlung, Begrenzungen und Bedingungen beeinflussen AC."},{"q":"Was gehört zur fachlichen Übergabe?","options":["Nur eine Rechnung","Dokumentation und Prüf-/Inbetriebnahmeunterlagen","Nur ein Foto"],"c":1,"why":"Die normengerechte Übergabe umfasst nachvollziehbare technische Nachweise."}],"refs":["WV-CH 2025 / SN EN 62446-1:2016+A1:2018 / SN 414022:2024","WV-CH: 2, 10","62446-1: 4–9","414022: 7–8"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: In dieser Fallstudie verknüpfst Du die zuvor getrennt gelernten Themen. Das Ziel ist, einen fachlichen Projektablauf zu begründen – nicht eine Netzanlage selbstständig zu installieren."},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Projektannahmen und technische Daten» und «Netzanbindung und Dokumente». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Projektannahmen und technische Daten» und «Abnahme und Übergabe». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Der Bauherr fordert, die Anlage heute zu montieren und morgen ohne weitere Unterlagen einspeisen zu lassen."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Was ist 24 × 430 Wp?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/N-I01.svg"},{"id":"N-I02","year":4,"title":"Gesamtfall: Einen Maschinenverteiler fachlich beurteilen","goals":["Hier kannst Du Dein Maschinenbauwissen direkt nutzen: Die elektrische Verteilung ist ein technisches System, das wie eine Maschine bemessen, dokumentiert, hergestellt und sicher betrieben werden muss.","Nach Inbetriebnahme soll ein zusätzlicher Frequenzumrichter eingebaut werden, ohne die Verteiler-Unterlagen anzupassen."],"parts":[{"heading":"Anforderungen aufnehmen","text":"Eine fiktive Produktionsanlage benötigt 80 A Einspeisung, mehrere Motorabgänge und eine Steuerstromversorgung. Du definierst Spannung, Versorgungssystem, erwartete Kurzschlussbeanspruchung, Umgebung, Bedienkonzept und Leistungsfluss als technische Anforderungen.","formula":""},{"heading":"Nachweisstruktur erstellen","text":"Für das geplante Gehäuse und die Komponenten müssen u. a. Schutz, Erwärmung, Isolation und Kurzschlussfestigkeit bewertet werden. Ein vorhandener Bauartnachweis wird nur innerhalb seiner Bedingungen genutzt. Für das gefertigte Exemplar folgt der erforderliche Stücknachweis.","formula":""},{"heading":"Sicherer Betrieb nach Übergabe","text":"Ein aktuelles Schema, eindeutige Kennzeichnung und festgelegte Schalt-/Arbeitsverantwortung ermöglichen eine sichere Instandhaltung. Spätere Änderungen müssen fachlich und dokumentarisch nachverfolgt werden.","formula":""}],"bridgeTitle":"Spezifische Fallstudie auf Grundlage der genannten Normausgabe; normativer Einzelabgleich ausstehend.","bridge":"Hier kannst Du Dein Maschinenbauwissen direkt nutzen: Die elektrische Verteilung ist ein technisches System, das wie eine Maschine bemessen, dokumentiert, hergestellt und sicher betrieben werden muss.","exercise":"Nach Inbetriebnahme soll ein zusätzlicher Frequenzumrichter eingebaut werden, ohne die Verteiler-Unterlagen anzupassen.","solution":"Vor Änderung sind Wärme, EMV, Schutz, Leitungswege, der Nachweisumfang und die Dokumentation neu zu beurteilen. Eine mechanisch freie Hutschiene bedeutet nicht automatisch elektrische oder thermische Reserve.","quiz":[{"q":"Was ist kein ausreichender alleiniger Nachweis der Verteilereignung?","options":["Mechanisch freie Hutschiene","Geeignete Bauartnachweise","Passender Stücknachweis"],"c":0,"why":"Platzreserve ist nicht gleich elektrischer oder thermischer Nachweis."},{"q":"Was folgt auf einen Bauartnachweis bei einem gebauten Verteiler?","options":["Stücknachweis","Nichts","Nur Preiskalkulation"],"c":0,"why":"Das konkrete Exemplar wird geprüft.\n\nBezug zum Unterrichtsteil «Nachweisstruktur erstellen»: Für das gefertigte Exemplar folgt der erforderliche Stücknachweis."},{"q":"Welche Norm behandelt die sichere Arbeitsorganisation?","options":["EN 50110-1","Nur 61439-2","Nur die PV-Norm"],"c":0,"why":"EN 50110-1 behandelt Betrieb und sicheres Arbeiten an elektrischen Anlagen.\n\nBezug zum Unterrichtsteil «Sicherer Betrieb nach Übergabe»: Ein aktuelles Schema, eindeutige Kennzeichnung und festgelegte Schalt-/Arbeitsverantwortung ermöglichen eine sichere Instandhaltung."}],"refs":["SN EN IEC 61439-1:2021 / -2:2021 / SN EN 50110-1:2023","61439-1: 5–11","61439-2: 8–11","50110-1: 4–6"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Hier kannst Du Dein Maschinenbauwissen direkt nutzen: Die elektrische Verteilung ist ein technisches System, das wie eine Maschine bemessen, dokumentiert, hergestellt und sicher betrieben werden muss."},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Anforderungen aufnehmen» und «Nachweisstruktur erstellen». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Anforderungen aufnehmen» und «Sicherer Betrieb nach Übergabe». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Nach Inbetriebnahme soll ein zusätzlicher Frequenzumrichter eingebaut werden, ohne die Verteiler-Unterlagen anzupassen."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Was ist kein ausreichender alleiniger Nachweis der Verteilereignung?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/N-I02.svg"},{"id":"N-I03","year":1,"title":"Quellenkritik: Was wir wirklich wissen – und was noch fehlt","goals":["Eine der wichtigsten beruflichen Fähigkeiten ist, zwischen nachgewiesenem Norminhalt, Fachwissen und ungeprüften Annahmen zu unterscheiden. Gerade bei elektrischer Sicherheit darf ein selbstbewusst klingender Text nie als Ersatz für eine verifizierte Quelle gelten.","Ein Online-Text behauptet einen bestimmten RCD-Grenzwert und führt eine NIN-Tabelle an, die Du nicht öffnen kannst."],"parts":[{"heading":"Vollständige und unvollständige Dateien unterscheiden","text":"Die gelieferten Volltexte enthalten zum Beispiel EN 50110-1, EN 62446-1, EN IEC 61439-1/-2, die WV-CH, SN 414113
