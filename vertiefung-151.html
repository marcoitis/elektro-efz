klärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Wirk-, Blind- und Scheinleistung» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Wirk-, Blind- und Scheinleistung» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Phasoren in Tabellenkalkulation berechnen; Lasten nur simulieren. Halte zusätzlich die Antwort auf die Frage «Was bezeichnet S = Ueff × Ieff bei einphasiger Last?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Skizziere qualitativ das Verhalten eines Widerstands, einer idealen Spule und eines idealen Kondensators bei steigender Frequenz."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Was bezeichnet S = Ueff × Ieff bei einphasiger Last?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/2.01-C.svg"},{"id":"2.02-B","year":2,"title":"Dreieck, Leistung und Lastsymmetrie","goals":["Neutralleiter, Unsymmetrie und Oberschwingung (Einführung)","Leistung bei symmetrischem Drehstrom"],"parts":[{"heading":"Dein Dozent erklärt: Dreieck, Leistung und Lastsymmetrie","text":"Heute geht es um dreieck, leistung und lastsymmetrie. Bei der Dreieckschaltung liegen die Stränge zwischen jeweils zwei Aussenleitern. Deshalb ist die Strangspannung gleich der Leiterspannung; die Beziehungen der Ströme unterscheiden sich von der Sternschaltung. Bei symmetrischer sinusförmiger Last lässt sich die Wirkleistung mit P = √3 × U_L × I_L × cos φ bestimmen. Dieser Ausdruck ist nicht ohne Prüfung auf beliebig unsymmetrische Fälle übertragbar. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Eine symmetrische Drehstromlast mit 400 Volt Leiterspannung, 10 Ampere Leiterstrom und Leistungsfaktor 0,9 nimmt rechnerisch rund 6,24 Kilowatt Wirkleistung auf. Dokumentiere Deine Annahmen zur Symmetrie und zu sinusförmigen Betriebsbedingungen, bevor Du ein Ergebnis präsentierst. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Drehstromformeln gelten nur innerhalb ihrer Modellannahmen. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Neutralleiter, Unsymmetrie und Oberschwingung (Einführung); Leistung bei symmetrischem Drehstrom. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: Lehrplan 3.2/5.3; NIN Teil 3. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Drehstrom nicht als dreimal Einphasenstrom behandeln","bridge":"Ein symmetrisches Drehstromsystem hat drei um 120 Grad phasenverschobene Spannungen. Bei Stern und Dreieck unterscheiden sich die Beziehungen zwischen Strang- und Leiterspannungen beziehungsweise -strömen. Die bekannten √3-Beziehungen setzen die jeweils passende Schaltung und Symmetrie voraus. Bei unsymmetrischen Lasten muss nach Strängen gerechnet werden.","exercise":"Drehstrom ausschließlich an Simulator/Schulungsmodell; rechnerische Lastbilanz eines Wohnhauses. Halte zusätzlich die Antwort auf die Frage «Welche Formel passt für symmetrische sinusförmige Drehstrom-Wirkleistung?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Stelle für das ideale 400-V-System die Strangspannung einer Sternlast einer entsprechenden Dreiecklast gegenüber. Begründe jede verwendete Formel.","solution":"Drehstromformeln gelten nur innerhalb ihrer Modellannahmen. Der Merksatz lautet: Drehstromformeln gelten nur innerhalb ihrer Modellannahmen. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Welche Formel passt für symmetrische sinusförmige Drehstrom-Wirkleistung?","options":["P = √3 · U_L · I_L · cos φ","P = I / t","P = U · R"],"c":0,"why":"Drehstromformeln gelten nur innerhalb ihrer Modellannahmen.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Drehstromformeln gelten nur innerhalb ihrer Modellannahmen."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["P = I / t","Drehstromformeln gelten nur innerhalb ihrer Modellannahmen.","P = U · R"],"c":1,"why":"Der Merksatz lautet: Drehstromformeln gelten nur innerhalb ihrer Modellannahmen.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Drehstromformeln gelten nur innerhalb ihrer Modellannahmen."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["3.2.2b–3.2.4b; 5.3.4b (Vertiefung später)","Norm-/Regelwerk: Lehrplan 3.2/5.3; NIN Teil 3","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Neutralleiter, Unsymmetrie und Oberschwingung (Einführung)"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Dreieck, Leistung und Lastsymmetrie» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Dreieck, Leistung und Lastsymmetrie» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Drehstrom ausschließlich an Simulator/Schulungsmodell; rechnerische Lastbilanz eines Wohnhauses. Halte zusätzlich die Antwort auf die Frage «Welche Formel passt für symmetrische sinusförmige Drehstrom-Wirkleistung?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Stelle für das ideale 400-V-System die Strangspannung einer Sternlast einer entsprechenden Dreiecklast gegenüber. Begründe jede verwendete Formel."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Welche Formel passt für symmetrische sinusförmige Drehstrom-Wirkleistung?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/2.02-B.svg"},{"id":"2.02-C","year":2,"title":"Neutralleiter, Unsymmetrie und Lastverteilung","goals":["Anwendungsbeispiele Motor, Herd und PV-Wechselrichter","Einphasige Belastung/Phasenaufteilung als Planungsaufgabe"],"parts":[{"heading":"Dein Dozent erklärt: Neutralleiter, Unsymmetrie und Lastverteilung","text":"Heute geht es um neutralleiter, unsymmetrie und lastverteilung. Bei ungleichmässiger Belastung der drei Phasen gleichen sich die Ströme im Neutralleiter nicht vollständig aus. Auch Oberschwingungen elektronischer Lasten beeinflussen die Leiterströme. Für die Gebäudeplanung müssen Lasten, Gleichzeitigkeit und die Eigenschaften der Verbraucher bekannt sein. Einfach aus drei Einzelströmen einen arithmetischen Mittelwert zu bilden genügt nicht. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Ein fiktives Haus weist auf Phase eins deutlich mehr einphasige Verbraucher als auf Phase zwei und drei auf. Erstelle eine Lastliste mit installierter Leistung und typischer Nutzung. Schlage eine plausiblere Verteilung vor, ohne eine bestehende Verteilung zu verändern. Die Schutz- und Leiterbemessung bleibt eine normgebundene Aufgabe. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Symmetrie ist ein Planungsziel und kein unveränderlicher Naturzustand. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Anwendungsbeispiele Motor, Herd und PV-Wechselrichter; Einphasige Belastung/Phasenaufteilung als Planungsaufgabe. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: Lehrplan 3.2/5.3; NIN Teil 3. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Drehstrom nicht als dreimal Einphasenstrom behandeln","bridge":"Ein symmetrisches Drehstromsystem hat drei um 120 Grad phasenverschobene Spannungen. Bei Stern und Dreieck unterscheiden sich die Beziehungen zwischen Strang- und Leiterspannungen beziehungsweise -strömen. Die bekannten √3-Beziehungen setzen die jeweils passende Schaltung und Symmetrie voraus. Bei unsymmetrischen Lasten muss nach Strängen gerechnet werden.","exercise":"Drehstrom ausschließlich an Simulator/Schulungsmodell; rechnerische Lastbilanz eines Wohnhauses. Halte zusätzlich die Antwort auf die Frage «Was kann bei unsymmetrischer Drehstrombelastung auftreten?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Stelle für das ideale 400-V-System die Strangspannung einer Sternlast einer entsprechenden Dreiecklast gegenüber. Begründe jede verwendete Formel.","solution":"Symmetrie ist ein Planungsziel und kein unveränderlicher Naturzustand. Der Merksatz lautet: Symmetrie ist ein Planungsziel und kein unveränderlicher Naturzustand. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was kann bei unsymmetrischer Drehstrombelastung auftreten?","options":["Automatisch stets null Neutralleiterstrom","Neutralleiterstrom","Verschwinden jeder Oberschwingung"],"c":1,"why":"Symmetrie ist ein Planungsziel und kein unveränderlicher Naturzustand.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Symmetrie ist ein Planungsziel und kein unveränderlicher Naturzustand."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Verschwinden jeder Oberschwingung","Symmetrie ist ein Planungsziel und kein unveränderlicher Naturzustand.","Automatisch stets null Neutralleiterstrom"],"c":1,"why":"Der Merksatz lautet: Symmetrie ist ein Planungsziel und kein unveränderlicher Naturzustand.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Symmetrie ist ein Planungsziel und kein unveränderlicher Naturzustand."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["3.2.2b–3.2.4b; 5.3.4b (Vertiefung später)","Norm-/Regelwerk: Lehrplan 3.2/5.3; NIN Teil 3","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formu d viele Sensoren. Die Höhe der Induktionsspannung hängt vereinfacht unter anderem von Windungszahl und Flussänderungsgeschwindigkeit ab. Die Richtung folgt der Lenzschen Regel. Ohne Flussänderung gibt es in diesem vereinfachten Modell keine Induktion. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Stelle Dir eine Spule mit mehr Windungen und dieselbe zeitliche Flussänderung vor. In einer idealisierten Betrachtung steigt die induzierte Spannung mit der Windungszahl. Zeichne den zeitlichen Flussverlauf und markiere Phasen mit grösserer Änderungsrate, ohne mit Netzspulen zu experimentieren. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Induktion verlangt eine Änderung des magnetischen Flusses. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Magnetisches Feld und Induktionsgesetz; Selbstinduktion, Gegeninduktion, Lenzsche Regel. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: Lehrplan 3.2/5.1; NIN Teil 4 (Schutztrennung). Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Induktion und Übersetzung","bridge":"Ein Transformator nutzt einen zeitlich veränderlichen magnetischen Fluss. Im idealisierten Modell folgt die Spannungsübersetzung dem Windungsverhältnis. In realen Geräten begrenzen Verluste, Erwärmung, Isolation und Betriebsbedingungen die Aussagekraft des einfachen Modells. Schutztrennung ist eine zusätzliche sicherheitstechnische Eigenschaft, nicht eine automatische Folge jeder Übersetzung.","exercise":"Unbedenklichen 12-V-AC-Schultransformator ohne Anschlussarbeiten charakterisieren, nur beaufsichtigt. Halte zusätzlich die Antwort auf die Frage «Wodurch entsteht in einer Spule Induktionsspannung?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Berechne die Ausgangsspannung eines idealen Transformators mit 1000:100 Windungen und 230 V Eingang; dokumentiere die Grenzen des Modells.","solution":"Induktion verlangt eine Änderung des magnetischen Flusses. Der Merksatz lautet: Induktion verlangt eine Änderung des magnetischen Flusses. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Wodurch entsteht in einer Spule Induktionsspannung?","options":["Zeitliche Flussänderung","Nur durch höhere Kabelfarbe","Ein dauerhaft konstanter Fluss allein"],"c":0,"why":"Induktion verlangt eine Änderung des magnetischen Flusses.\n\nBezug zum Unterrichtsteil «Dein Dozent erklärt: Faradaysches Induktionsgesetz»: Eine zeitliche Änderung des magnetischen Flusses kann eine elektrische Spannung erzeugen."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Nur durch höhere Kabelfarbe","Induktion verlangt eine Änderung des magnetischen Flusses.","Ein dauerhaft konstanter Fluss allein"],"c":1,"why":"Der Merksatz lautet: Induktion verlangt eine Änderung des magnetischen Flusses.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Induktion verlangt eine Änderung des magnetischen Flusses."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["3.2.5b–3.2.7b; 5.1.6b","Norm-/Regelwerk: Lehrplan 3.2/5.1; NIN Teil 4 (Schutztrennung)","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Magnetisches Feld und Induktionsgesetz"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Faradaysches Induktionsgesetz» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Faradaysches Induktionsgesetz» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Unbedenklichen 12-V-AC-Schultransformator ohne Anschlussarbeiten charakterisieren, nur beaufsichtigt. Halte zusätzlich die Antwort auf die Frage «Wodurch entsteht in einer Spule Induktionsspannung?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Berechne die Ausgangsspannung eines idealen Transformators mit 1000:100 Windungen und 230 V Eingang; dokumentiere die Grenzen des Modells."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Wodurch entsteht in einer Spule Induktionsspannung?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/2.03-A.svg"},{"id":"2.03-B","year":2,"title":"Transformatorenübersetzung und Verluste","goals":["Aufbau, Übersetzung und Wirkungsgrad eines Trafos","Einphasen-/Drehstromtransformatoren"],"parts":[{"heading":"Dein Dozent erklärt: Transformatorenübersetzung und Verluste","text":"Heute geht es um transformatorenübersetzung und verluste. Ein Transformator überträgt Wechselstromenergie über magnetische Kopplung. Im idealen Modell ist das Verhältnis von Primär- und Sekundärspannung gleich dem Verhältnis der Windungszahlen. Reale Transformatoren besitzen Kupferverluste, Eisenverluste, Streufelder und Erwärmung. Ein Transformator ist deshalb weder ein Energieerzeuger noch ohne Weiteres ein geeigneter Schutztransformator. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Ein idealer Trafo mit 1000 Windungen primär und 100 Windungen sekundär besitzt das Übersetzungsverhältnis zehn zu eins. Bei 230 Volt primär wären sekundär ideal 23 Volt zu erwarten. In einer realen Anwendung sind Isolationsart, Schutzklasse, zulässige Last und Datenblatt wichtiger als diese reine Rechenzahl. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Das Übersetzungsverhältnis sagt nichts über alle sicherheitsrelevanten Eigenschaften aus. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Aufbau, Übersetzung und Wirkungsgrad eines Trafos; Einphasen-/Drehstromtransformatoren. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: Lehrplan 3.2/5.1; NIN Teil 4 (Schutztrennung). Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Induktion und Übersetzung","bridge":"Ein Transformator nutzt einen zeitlich veränderlichen magnetischen Fluss. Im idealisierten Modell folgt die Spannungsübersetzung dem Windungsverhältnis. In realen Geräten begrenzen Verluste, Erwärmung, Isolation und Betriebsbedingungen die Aussagekraft des einfachen Modells. Schutztrennung ist eine zusätzliche sicherheitstechnische Eigenschaft, nicht eine automatische Folge jeder Übersetzung.","exercise":"Unbedenklichen 12-V-AC-Schultransformator ohne Anschlussarbeiten charakterisieren, nur beaufsichtigt. Halte zusätzlich die Antwort auf die Frage «Wie verhalten sich beim idealen Trafo U1/U2 und N1/N2?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Berechne die Ausgangsspannung eines idealen Transformators mit 1000:100 Windungen und 230 V Eingang; dokumentiere die Grenzen des Modells.","solution":"Das Übersetzungsverhältnis sagt nichts über alle sicherheitsrelevanten Eigenschaften aus. Der Merksatz lautet: Das Übersetzungsverhältnis sagt nichts über alle sicherheitsrelevanten Eigenschaften aus. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Wie verhalten sich beim idealen Trafo U1/U2 und N1/N2?","options":["Sie sind stets reziprok","Sie sind gleich","Sie sind unabhängig voneinander"],"c":1,"why":"Das Übersetzungsverhältnis sagt nichts über alle sicherheitsrelevanten Eigenschaften aus.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Das Übersetzungsverhältnis sagt nichts über alle sicherheitsrelevanten Eigenschaften aus."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Sie sind unabhängig voneinander","Das Übersetzungsverhältnis sagt nichts über alle sicherheitsrelevanten Eigenschaften aus.","Sie sind stets reziprok"],"c":1,"why":"Der Merksatz lautet: Das Übersetzungsverhältnis sagt nichts über alle sicherheitsrelevanten Eigenschaften aus.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Das Übersetzungsverhältnis sagt nichts über alle sicherheitsrelevanten Eigenschaften aus."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["3. rennung und Transformatoranwendung","text":"Heute geht es um schutztrennung und transformatoranwendung. Eine galvanische Trennung kann Bestandteil einer Schutzmassnahme sein, ist aber nur unter definierten Bedingungen wirksam. Ein beliebiger Transformator stellt keine sichere Schutztrennung her. Entscheidend sind Bauart, Isolationskoordination, angeschlossene Stromkreise und das vollständige Schutzkonzept. Auch eine vermeintlich kleine Sekundärspannung darf nicht ohne Systembetrachtung als ungefährlich eingestuft werden. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Vergleiche Datenblätter eines Netzteils für SELV und eines gewöhnlichen Steuertransformators. Suche nach Angaben zur Schutztrennung, Isolationsausführung und zulässigen Verwendung. Erstelle eine Freigabeliste für eine Schulungsanwendung, die ausdrücklich von einer befähigten Person geprüft werden muss. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Sicherheit entsteht aus einer geprüften Schutzmassnahme, nicht allein aus dem Spannungswert. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Trenntransformator und Schutztrennung als Konzept; Verluste, Erwärmung, Belastungskennlinie. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: Lehrplan 3.2/5.1; NIN Teil 4 (Schutztrennung). Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Induktion und Übersetzung","bridge":"Ein Transformator nutzt einen zeitlich veränderlichen magnetischen Fluss. Im idealisierten Modell folgt die Spannungsübersetzung dem Windungsverhältnis. In realen Geräten begrenzen Verluste, Erwärmung, Isolation und Betriebsbedingungen die Aussagekraft des einfachen Modells. Schutztrennung ist eine zusätzliche sicherheitstechnische Eigenschaft, nicht eine automatische Folge jeder Übersetzung.","exercise":"Unbedenklichen 12-V-AC-Schultransformator ohne Anschlussarbeiten charakterisieren, nur beaufsichtigt. Halte zusätzlich die Antwort auf die Frage «Was ist bei Schutztrennung entscheidend?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Berechne die Ausgangsspannung eines idealen Transformators mit 1000:100 Windungen und 230 V Eingang; dokumentiere die Grenzen des Modells.","solution":"Sicherheit entsteht aus einer geprüften Schutzmassnahme, nicht allein aus dem Spannungswert. Der Merksatz lautet: Sicherheit entsteht aus einer geprüften Schutzmassnahme, nicht allein aus dem Spannungswert. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was ist bei Schutztrennung entscheidend?","options":["Ein selbst geklebtes Warnetikett","Nur eine kleine Sekundärspannung","Das vollständige geeignete Schutzkonzept"],"c":2,"why":"Sicherheit entsteht aus einer geprüften Schutzmassnahme, nicht allein aus dem Spannungswert.\n\nBezug zum Unterrichtsteil «Das musst Du behalt truction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Schutztrennung und Transformatoranwendung» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Unbedenklichen 12-V-AC-Schultransformator ohne Anschlussarbeiten charakterisieren, nur beaufsichtigt. Halte zusätzlich die Antwort auf die Frage «Was ist bei Schutztrennung entscheidend?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Berechne die Ausgangsspannung eines idealen Transformators mit 1000:100 Windungen und 230 V Eingang; dokumentiere die Grenzen des Modells."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Was ist bei Schutztrennung entscheidend?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/2.03-C.svg"},{"id":"2.04-A","year":2,"title":"Dioden, Gleichrichter und Glättung","goals":["Halbleiter, Dioden, Brückengleichrichter","Transistor/Relais, Schützschnittstelle"],"parts":[{"heading":"Dein Dozent erklärt: Dioden, Gleichrichter und Glättung","text":"Heute geht es um dioden, gleichrichter und glättung. Dioden leiten je nach Polung und elektrischen Randbedingungen sehr unterschiedlich. Ein Brückengleichrichter kann eine Wechselspannung in eine pulsierende Gleichspannung umsetzen. Mit geeigneten Kondensatoren lässt sich die Restwelligkeit reduzieren. Die Auswahl der Bauteile hängt unter anderem von Sperrspannung, Strom, thermischer Belastung und vorgesehenem Einsatz ab. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Simuliere einen Brückengleichrichter an einer rein virtuellen Wechselspannungsquelle. Betrachte zunächst die pulsierende Ausgangsspannung ohne Glättung und danach mit Kondensator. Notiere, wie sich die zeitliche Spannung verändert und weshalb die Spitzenwerte bei realen Bauteilen wichtig sind. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Gleichrichtung erzeugt zunächst keine perfekte konstante Gleichspannung. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Halbleiter, Dioden, Brückengleichrichter; Transistor/Relais, Schützschnittstelle. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: Lehrplan 3.3; EMV-Grundlagen. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Elektronische Bauelemente unterscheiden","bridge":"Eine Diode lässt Strom unter passenden Bedingungen überwiegend in einer Richtung fliessen; ein Transistor kann verstärken oder schalten. Ein Relais verbindet eine elektrische Ansteuerung mit einem getrennten Kontaktkreis. Digitale Logik beschreibt Zustände und Bedingungen; erst die reale Schaltung legt fest, wie Signale und Energie übertragen werden.","exercise":"Schaltungen für LED, Optokoppler und Relaisfunktion mit 5–12 V simulieren. Halte zusätzlich die Antwort auf die Frage «Welche Funktion hat ein Brückengleichrichter?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Zeichne die Funktionskette Sensor → Logik → Schaltglied → Last für ein Kleinspannungsmodell.","solution":"Gleichrichtung erzeugt zunächst keine perfekte konstante Gleichspannung. Der Merksatz lautet: Gleichrichtung erzeugt zunächst keine perfekte konstante Gleichspannung. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Welche Funktion hat ein Brückengleichrichter?","options":["Er erhöht immer die Netzfrequenz","Er wandelt AC in pulsierende DC um","Er ersetzt jede Sicherung"],"c":1,"why":"Gleichrichtung erzeugt zunächst keine perfekte konstante Gleichspannung.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Gleichrichtung erzeugt zunächst keine perfekte konstante Gleichspannung."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Er ersetzt jede Sicherung","Gleichrichtung erzeugt zunächst keine perfekte konstante Gleichspannung.","Er erhöht immer die Netzfrequenz"],"c":1,"why":"Der Merksatz lautet: Gleichrichtung erzeugt zunächst keine perfekte konstante Gleichspannung.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Gleichrichtung erzeugt zunächst keine perfekte konstante Gleichspannung."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["3.3.1b–3.3.4b","Norm-/Regelwerk: Lehrplan 3.3; EMV-Grundlagen","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Halbleiter, Dioden, Brückengleichrichter"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Dioden, Gleichrichter und Glättung» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Dioden, Gleichrichter und Glättung» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Schaltungen für LED, Optokoppler und Relaisfunktion mit 5–12 V simulieren. Halte zusätzlich die Antwort auf die Frage «Welche Funktion hat ein Brückengleichrichter?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Zeichne die Funktionskette Sensor → Logik → Schaltglied → Last für ein Kleinspannungsmodell."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Welche Funktion hat ein Brückengleichrichter?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/2.04-A.svg"},{"id":"2.04-B","year":2,"title":"Transistoren, Relais und Optokoppler","goals":["Thyristor, Triac, Phasenanschnitt und Dimmer","Optokoppler, Entstörung, Überspannung"],"parts":[{"heading":"Dein Dozent erklärt: Transistoren, Relais und Optokoppler","text":"Heute geht es um transistoren, relais und optokoppler. Ein Transistor kann als elektronischer Schalter oder als Verstärker eingesetzt werden. Relais ermöglichen eine mechanisch betätigte Kontaktfunktion, Optokoppler übertragen Signale optisch zwischen getrennten Schaltungsteilen. Diese Bauteile unterscheiden sich erheblich hinsichtlich galvanischer Trennung, Schaltgeschwindigkeit, Belastbarkeit und Fehlerverhalten. Antriebs- und Schutzschaltungen müssen entsprechend geplant werden. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Zeichne eine 5-Volt-Signalschaltung, die über einen Transistor ein kleines Relais auf einer geeigneten Kleinspannungsquelle schaltet. Analysiere nur mit Schaltungssoftware, warum eine Induktionsspannungsbegrenzung am Relaisspulenanschluss nötig sein kann. Der Anschluss an Gebäude- oder Maschinenstromkreise ist nicht Teil des Selbststudiums. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Elektronisches Steuern und sichere galvanische Trennung sind verschiedene Anforderungen. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Thyristor, Triac, Phasenanschnitt und Dimmer; Optokoppler, Entstörung, Überspannung. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: Lehrplan 3.3; EMV-Grundlagen. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Elektronische Bauelemente unterscheiden","bridge":"Eine Diode lässt Strom unter passenden Bedingungen überwiegend in einer Richtung fliessen; ein Transistor kann verstärken oder schalten. Ein Relais verbindet eine elektrische Ansteuerung mit einem getrennten Kontaktkreis. Digitale Logik beschreibt Zustände und Bedingungen; erst die reale Schaltung legt fest, wie Signale und Energie übertragen werden.","exercise":"Schaltungen für LED, Optokoppler und Relaisfunktion mit 5–12 V simulieren. Halte zusätzlich die Antwort auf die Frage «Wofür ist ein Optokoppler typischerweise vorgesehen?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Zeichne die Funktionskette Sensor → Logik → Schaltglied → Last für ein Kleinspannungsmodell.","solution":"Elektronisches Steuern und sichere galvanische Trennung sind verschiedene Anforderungen. Der Merksatz lautet: Elektronisches Steuern und sichere galvanische Trennung sind verschiedene Anforderungen. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Wofür ist ein Optokoppler typischerweise vorgesehen?","options":["Ersatz einer Gebäudeerdung","Übertragung rein mechanischer Drehmomente","Signalübertragung über eine optische Kopplung"],"c":2,"why":"Elektronisches Steuern und sichere galvanische Trennung sind verschiedene Anforderungen.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Elektronisches Steuern und sichere galvanische Trennung sind verschiedene Anforderungen."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Ersatz einer Gebäudeerdung","Elektronisches Steuern und sichere galvanische Trennung sind verschiedene Anforderungen.","Übertragung rein mechanischer Drehmomente"],"c":1,"why":"Der Merksatz lautet: Elektronisches Steuern und sichere galvanische Trennung sind verschiedene Anforderungen.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Elektronisches Steuern und sichere galvanische Trennung sind verschiedene Anforderungen."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["3.3.1b–3.3.4b","Norm-/Regelwerk: Lehrplan 3.3; EMV-Grundlagen","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Thyristor, Triac, Phasenanschnitt und Dimmer"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Transistoren, Relais und Optokoppler» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Transistoren, Relais und Optokoppler» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Schaltungen für LED, Optokoppler und Relaisfunktion mit 5–12 V simulieren. Halte zusätzlich die Antwort auf die Frage «Wofür ist ein Optokoppler typischerweise vorgesehen?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Zeichne die Funktionskette Sensor → Logik → Schaltglied → Last für ein Kleinspannungsmodell."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Wofür ist ein Optokoppler typischerweise vorgesehen?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/2.04-B.svg"},{"id":"2.04-C","year":2,"title":"Digitale Logik und Sensor-Aktor-Prinzip","goals":["Boolesche Logik, Schaltschwellen, Binärzahlen","Steuerung vs. Regelung, Sensor/Aktor"],"parts":[{"heading":"Dein Dozent erklärt: Digitale Logik und Sensor-Aktor-Prinzip","text":"Heute geht es um digitale logik und sensor-aktor-prinzip. Digitale Steuerungen verarbeiten definierte Zustände, häufig als logisch null und eins beschrieben. AND, OR und NOT bilden elementare Verknüpfungen. Ein Sensor liefert Information, eine Steuerung entscheidet nach Programm oder Verdrahtung, und ein Aktor wirkt auf die Anlage. Für reale Sicherheitsfunktionen sind besondere Nachweise nötig; ein einfacher Logikbaustein genügt nicht. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Entwirf eine virtuelle Freigabeschaltung mit zwei Bedingungen. Der Ausgang soll nur aktiv sein, wenn beide Eingänge aktiv sind. Erstelle die Wahrheitstabelle mit vier Kombinationen und prüfe sie mit einer Simulation. Vergleiche anschliessend, wie sich ein OR-Verhalten davon unterscheidet. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Ein digitales Funktionssignal ist noch keine nachgewiesene Sicherheitsfunktion. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Boolesche Logik, Schaltschwellen, Binärzahlen; Steuerung vs. Regelung, Sensor/Aktor. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: Lehrplan 3.3; EMV-Grundlagen. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Elektronische Bauelemente unterscheiden","bridge":"Eine Diode lässt Strom unter passenden Bedingungen überwiegend in einer Richtung fliessen; ein Transistor kann verstärken oder schalten. Ein Relais verbindet eine elektrische Ansteuerung mit einem getrennten Kontaktkreis. Digitale Logik beschreibt Zustände und Bedingungen; erst die reale Schaltung legt fest, wie Signale und Energie übertragen werden.","exercise":"Schaltungen für LED, Optokoppler und Relaisfunktion mit 5–12 V simulieren. Halte zusätzlich die Antwort auf die Frage «Welche Funktion ist nur bei zwei aktiven Eingängen wahr?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Zeichne die Funktionskette Sensor → Logik → Schaltglied → Last für ein Kleinspannungsmodell.","solution":"Ein digitales Funktionssignal ist noch keine nachgewiesene Sicherheitsfunktion. Der Merksatz lautet: Ein digitales Funktionssignal ist noch keine nachgewiesene Sicherheitsfunktion. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Welche Funktion ist nur bei zwei aktiven Eingängen wahr?","options":["AND","NOT","OR"],"c":0,"why":"Ein digitales Funktionssignal ist noch keine nachgewiesene Sicherheitsfunktion.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Ein digitales Funktionssignal ist noch keine nachgewiesene Sicherheitsfunktion."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["NOT","Ein digitales Funktionssignal ist noch keine nachgewiesene Sicherheitsfunktion.","OR"],"c":1,"why":"Der Merksatz lautet: Ein digitales Funktionssignal ist noch keine nachgewiesene Sicherheitsfunktion.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Ein digitales Funktionssignal ist noch keine nachgewiesene Sicherheitsfunktion."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["3.3.1b–3.3.4b","Norm-/Regelwerk: Lehrplan 3.3; EMV-Grundlagen","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Boolesche Logik, Schaltschwellen, Binärzahlen"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Digitale Logik und Sensor-Aktor-Prinzip» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Digitale Logik und Sensor-Aktor-Prinzip» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Schaltungen für LED, Optokoppler und Relaisfunktion mit 5–12 V simulieren. Halte zusätzlich die Antwort auf die Frage «Welche Funktion ist nur bei zwei aktiven Eingängen wahr?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Zeichne die Funktionskette Sensor → Logik → Schaltglied → Last für ein Kleinspannungsmodell."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Welche Funktion ist nur bei zwei aktiven Eingängen wahr?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/2.04-C.svg"},{"id":"2.05-A","year":2,"title":"TN-, TT- und IT-Systeme","goals":["Schutz durch automatische Abschaltung (ADS)","TN-, TT- und IT-Netzkonzepte, Trennung PE/N/PEN"],"parts":[{"heading":"Dein Dozent erklärt: TN-, TT- und IT-Systeme","text":"Heute geht es um tn-, tt- und it-systeme. Netzsysteme beschreiben unter anderem, wie Versorgungspunkt und Körper elektrischer Betriebsmittel geerdet oder verbunden sind. Die Benennungen TN, TT und IT stehen für unterschiedliche Konzepte, aus denen sich verschiedene Anforderungen an Fehlerschutz und Überwachung ergeben. Ohne Kenntnis des konkreten Systems können Abschaltbedingungen nicht fachgerecht beurteilt werden. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Zeichne drei stark vereinfachte Netzskizzen und markiere Versorgungspunkt, Gehäuse, Schutzleiter und Erdungsbezug. Frage bei jeder Skizze, wohin ein Fehlerstrom prinzipiell fliessen kann. Leite daraus keine realen Schalt- oder Schutzgeräteentscheidungen ohne die gültige NIN ab. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Der Fehlerschutz muss zum tatsächlichen Netzsystem passen. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Schutz durch automatische Abschaltung (ADS); TN-, TT- und IT-Netzkonzepte, Trennung PE/N/PEN. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIN Teil 4 (insbes. 4.1 Schutz gegen elektrischen Schlag); Teil 5 Erdung. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Schutz hängt vom Fehlerweg ab","bridge":"TN-, TT- und IT-Systeme unterscheiden sich in der Beziehung der aktiven Leiter und Körper zur Erde. Damit ändern sich Fehlerstrompfade und die Auswahl beziehungsweise Beurteilung von Schutzmassnahmen. Ein RCD beobachtet eine Stromdifferenz, ersetzt jedoch keine systematische Prüfung von Schutzleiter, Fehlerweg und Anlagenbedingungen.","exercise":"Nur schematische Fehlerstrompfade, Bilddiagnose und Ausbildungsexponate ohne Netzspannung. Halte zusätzlich die Antwort auf die Frage «Warum muss das Netzsystem vor einer Schutzbeurteilung bekannt sein?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Stelle die Unterschiede von TN, TT und IT in einer Vergleichstabelle mit je einem zu prüfenden Schutzaspekt dar.","solution":"Der Fehlerschutz muss zum tatsächlichen Netzsystem passen. Der Merksatz lautet: Der Fehlerschutz muss zum tatsächlichen Netzsystem passen. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Warum muss das Netzsystem vor einer Schutzbeurteilung bekannt sein?","options":["Nur wegen der Gehäusefarbe","Weil alle Systeme identisch funktionieren","Weil Fehlerstromwege und Schutzbedingungen unterschiedlich sind"],"c":2,"why":"Der Fehlerschutz muss zum tatsächlichen Netzsystem passen.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Der Fehlerschutz muss zum tatsächlichen Netzsystem passen."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Nur wegen der Gehäusefarbe","Der Fehlerschutz muss zum tatsächlichen Netzsystem passen.","Weil alle Systeme identisch funktionieren"],"c":1,"why":"Der Merksatz lautet: Der Fehlerschutz muss zum tatsächlichen Netzsystem passen.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Der Fehlerschutz muss zum tatsächlichen Netzsystem passen."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["4.3.3b–4.3.6b; 5.1.5b","Norm-/Regelwerk: NIN Teil 4 (insbes. 4.1 Schutz gegen elektrischen Schlag); Teil 5 Erdung","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Schutz durch automatische Abschaltung (ADS)"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: TN-, TT- und IT-Systeme» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: TN-, TT- und IT-Systeme» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Nur schematische Fehlerstrompfade, Bilddiagnose und Ausbildungsexponate ohne Netzspannung. Halte zusätzlich ngaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Ein RCD ist kein Allzweckschutz und kein Messersatz. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Berührungsspannung und Fehlerstrompfade; Schutzpotentialausgleich, Haupterdungsschiene. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIN Teil 4 (insbes. 4.1 Schutz gegen elektrischen Schlag); Teil 5 Erdung. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Schutz hängt vom Fehlerweg ab","bridge":"TN-, TT- und IT-Systeme unterscheiden sich in der Beziehung der aktiven Leiter und Körper zur Erde. Damit ändern sich Fehlerstrompfade und die Auswahl beziehungsweise Beurteilung von Schutzmassnahmen. Ein RCD beobachtet eine Stromdifferenz, ersetzt jedoch keine systematische Prüfung von Schutzleiter, Fehlerweg und Anlagenbedingungen.","exercise":"Nur schematische Fehlerstrompfade, Bilddiagnose und Ausbildungsexponate ohne Netzspannung. Halte zusätzlich die Antwort auf die Frage «Worauf reagiert ein RCD prinzipiell?» schriftlich fest und erkläre Deinen Lösungsweg. Keine e d die Umgebung zusammengedacht. Ein einzelnes normatives Schlagwort genügt nicht. Auch die Erreichbarkeit von leitfähigen Teilen und mögliche Fremdspannungsquellen sind zu beachten. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Analysiere auf Papier ein Metallgehäuse, dessen aktiver Leiter einen Isolationsfehler hat. Markiere möglichen Stromweg und die Schutzelemente, die den Fehler beherrschen sollen. Erstelle eine Liste der Nachweise, welche eine befähigte Person bei der Erstprüfung erbringen müsste. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Der Schutz muss für den konkreten Fehlerfall belegbar funktionieren. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: RCD-Typen und Auslösekonzepte; Schutzmassnahmen nach Umgebung und Anlage auswählen. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIN Teil 4 (insbes. 4.1 Schutz gegen elektrischen Schlag); Teil 5 Erdung. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Schutz hängt vom Fehlerweg ab","bridge":"TN-, TT- und IT-Systeme unterscheiden sich in der Beziehung der aktiven Leiter und Körper zur Erde. Damit ändern sich Fehlerstrompfade und die Auswahl beziehungsweise Beurteilung von Schutzmassnahmen. Ein RCD beobachtet eine Stromdifferenz, ersetzt jedoch keine systematische Prüfung von Schutzleiter, Fehlerweg und Anlagenbedingungen.","exercise":"Nur schematische Fehlerstrompfade, Bilddiagnose und Ausbildungsexponate ohne Netzspannung. Halte zusätzlich die Antwort auf die Frage «Was ist bei einem Körperschluss zentral?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Stelle die Unterschiede von TN, TT und IT in einer Vergleichstabelle mit je einem zu prüfenden Schutzaspekt dar.","solution":"Der Schutz muss für den konkreten Fehlerfall belegbar funktionieren. Der Merksatz lautet: Der Schutz muss für den konkreten Fehlerfall belegbar funktionieren. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was ist bei einem Körperschluss zentral?","options":["Allein eine Schalterbeschriftung","Ein wirksames abgestimmtes Fehlerschutzkonzept","Das Abschalten des Monitors"],"c":1,"why":"Der Schutz muss für den konkreten Fehlerfall belegbar funktionieren.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Der Schutz muss für den konkreten Fehlerfall belegbar funktionieren."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Das Abschalten des Monitors","Der Schutz muss für den konkreten Fehlerfall belegbar funktionieren.","Allein eine Schalterbeschriftung"],"c":1,"why":"Der Merksatz lautet: Der Schutz muss für den konkreten Fehlerfall belegbar funktionieren.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Der Schutz muss für den konkreten F r."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Was ist bei einem Körperschluss zentral?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/2.05-C.svg"},{"id":"2.06-A","year":2,"title":"Überlast, Kurzschluss und Schutzgerät","goals":["Betriebsstrom, Bemessungsstrom, zulässige Strombelastbarkeit","Überlast- und Kurzschlussschutz, LS-Kennlinien"],"parts":[{"heading":"Dein Dozent erklärt: Überlast, Kurzschluss und Schutzgerät","text":"Heute geht es um überlast, kurzschluss und schutzgerät. Ein hoher Strom kann aus dauernder Überlast oder einem Fehlerkurzschluss resultieren. Schutzgeräte unterscheiden sich in ihrem Verhalten bei thermischer Überlast und magnetischer Schnellauslösung. Die Auslegung muss Betriebsstrom, Belastbarkeit der Leitung und Charakteristik des Schutzorgans gemeinsam berücksichtigen. Nennstrom allein ist deshalb keine vollständige Auswahlbasis. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Eine fiktive Leitung soll einen Verbraucher mit 12 Ampere Betriebsstrom versorgen. Eine Sicherung mit 16 Ampere Bemessungsstrom sagt ohne Kenntnis der zulässigen Leitungsbelastbarkeit, Verlegeart und Abschaltbedingungen noch nichts Endgültiges über die Sicherheit aus. Schreibe die fehlenden Daten auf. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Der Schutz richtet sich nach der gesamten Anlage, nicht nur nach einem Amperewert. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Betriebsstrom, Bemessungsstrom, zulässige Strombelastbarkeit; Überlast- und Kurzschlussschutz, LS-Kennlinien. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIN Teil 4 Überstromschutz; Teil 5 Leitungsanlagen. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Leitung und Schutzorgan gehören zusammen","bridge":"Die Strombelastbarkeit einer Leitung ist nicht allein eine Materialkonstante. Sie hängt unter anderem von Leiterquerschnitt, Verlegeart, Temperatur und Häufung ab. Überlast- und Kurzschlussschutz verfolgen unterschiedliche Anforderungen. Ein akzeptabler Spannungsfall ist ebenfalls noch keine ausreichende Sicherheitsfreigabe. Belastbare Entscheidungen benötigen die anwendbaren Normtabellen und Herstellerkennlinien.","exercise":"Normtabellen mit Schulungsunterlagen auswerten, vier hypothetische Stromkreise schriftlich auslegen. Halte zusätzlich die Antwort auf die Frage «Welche Angabe genügt allein nicht für die Schutzgerätewahl?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erstelle ein fiktives Lastenblatt und eine Liste fehlender Randbedingungen zur Leitungsdimensionierung. Berechne einen ausdrücklich idealisierten Spannungsfall separat.","solution":"Der Schutz richtet sich nach der gesamten Anlage, nicht nur nach einem Amperewert. Der Merksatz lautet: Der Schutz richtet sich nach der gesamten Anlage, nicht nur nach einem Amperewert. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Welche Angabe genügt allein nicht für die Schutzgerätewahl?","options":["Nur der Bemessungsstrom des LS","Eine geprüfte Leitungsdimensionierung","Alle Auslegungsdaten und Normnachweise"],"c":0,"why":"Der Schutz richtet sich nach der gesamten Anlage, nicht nur nach einem Amperewert.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Der Schutz richtet sich nach der gesamten Anlage, nicht nur nach einem Amperewert."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Eine geprüfte Leitungsdimensionierung","Der Schutz richtet sich nach der gesamten Anlage, nicht nur nach einem Amperewert.","Alle Auslegungsdaten und Normnachweise"],"c":1,"why":"Der Merksatz lautet: Der Schutz richtet sich nach der gesamten Anlage, nicht nur nach einem Amperewert.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Der Schutz richtet sich nach der gesamten Anlage, nicht nur nach einem Amperewert."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["4.3.4b–4.3.6b; 5.1.4b","Norm- ent erklärt: Leitungsdimensionierung und Spannungsfall","text":"Heute geht es um leitungsdimensionierung und spannungsfall. Die Strombelastbarkeit eines Leiters hängt von Querschnitt, Isolierung, Verlegeart, Umgebungstemperatur und Häufung ab. Spannungsfall ist ein zusätzlicher Entwurfsaspekt, ersetzt aber weder Erwärmungs- noch Kurzschlussnachweis. Die konkreten Tabellen und Grenzwerte müssen in der geltenden NIN und in der Herstellerdokumentation nachgeschlagen werden. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Vergleiche auf Papier zwei Varianten eines langen Stromkreises mit gleichem Verbraucher, aber unterschiedlichem Leiterquerschnitt. Berechne den vereinfachten ohmschen Spannungsfall mit angenommenen Materialdaten. Notiere dann ausdrücklich, welche normativen Nachweise noch fehlen. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Ein rechnerisch kleiner Spannungsfall garantiert keine sichere Installation. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Verlegearten, Häufung, Umgebungstemperatur; Spannungsfall, Leiterquerschnitt, Erwärmung. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIN Teil 4 Überstromschutz; Teil 5 Leitungsanlagen. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Leitung und Schutzorgan gehören zusammen","bridge":"Die Strombelastbarkeit einer Leitung ist nicht allein eine Materialkonstante. Sie hängt unter anderem von Leiterquerschnitt, Verlegeart, Temperatur und Häufung ab. Überlast- und Kurzschlussschutz verfolgen unterschiedliche Anforderungen. Ein akzeptabler Spannungsfall ist ebenfalls noch keine ausreichende Sicherheitsfreigabe. Belastbare Entscheidungen benötigen die anwendbaren Normtabellen und Herstellerkennlinien.","exercise":"Normtabellen mit Schulungsunterlagen auswerten, vier hypothetische Stromkreise schriftlich auslegen. Halte zusätzlich die Antwort auf die Frage «Weshalb hängt die Strombelastbarkeit von der Verlegeart ab?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erstelle ein fiktives Lastenblatt und eine Liste fehlender Randbedingungen zur Leitungsdimensionierung. Berechne einen ausdrücklich idealisierten Spannungsfall separat.","solution":"Ein rechnerisch kleiner Spannungsfall garantiert keine sichere Installation. Der Merksatz lautet: Ein rechnerisch kleiner Spannungsfall garantiert keine sichere Installation. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Weshalb hängt die Strombelastbarkeit von der Verlegeart ab?","options":["Weil Kupfer seine Farbe ändert","Wegen unterschiedlicher Wärmeabfuhr","Nur wegen des Leitungsnamens"],"c":1,"why":"Ein rechnerisch kleiner Spannungsfall garantiert keine sichere Installation.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Ein rec  Leitungsschutzschalter in Serie. Einer hat zehn, der andere sechzehn Ampere Bemessungsstrom. Erkläre, weshalb allein diese beiden Zahlen keine Aussage über Selektivität im gesamten Kurzschlussbereich zulassen. Suche nach passenden Hersteller-Kennliniendaten. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Selektivität muss anhand der realen Geräte nachgewiesen werden. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Kurzschlussstrom und Abschaltbedingung als Konzept; Selektivität und Kaskadierung als Ausblick. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIN Teil 4 Überstromschutz; Teil 5 Leitungsanlagen. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Leitung und Schutzorgan gehören zusammen","bridge":"Die Strombelastbarkeit einer Leitung ist nicht allein eine Materialkonstante. Sie hängt unter anderem von Leiterquerschnitt, Verlegeart, Temperatur und Häufung ab. Überlast- und Kurzschlussschutz verfolgen unterschiedliche Anforderungen. Ein akzeptabler Spannungsfall ist ebenfalls noch keine ausreichende Sicherheitsfreigabe. Belastbare Entscheidungen benötigen die anwendbaren Normtabellen und Herstellerkennlinien.","exercise":"Normtabellen mit Schulungsunterlagen auswerten, vier hypothetische Stromkreise schriftlich auslegen. Halte zusätzlich die Antwort auf die Frage «Wie wird Selektivität fachgerecht beurteilt?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erstelle ein fiktives Lastenblatt und eine Liste fehlender Randbedingungen zur Leitungsdimensionierung. Berechne einen ausdrücklich idealisierten Spannungsfall separat.","solution":"Selektivität muss anhand der realen Geräte nachgewiesen werden. Der Merksatz lautet: Selektivität muss anhand der realen Geräte nachgewiesen werden. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Wie wird Selektivität fachgerecht beurteilt?","options":["Durch Abkleben eines Schutzschalters","Nur mit den zwei aufgedruckten Nennströmen","Mit Gerätekombinationen und Herstellerdaten"],"c":2,"why":"Selektivität muss anhand der realen Geräte nachgewiesen werden.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Selektivität muss anhand der realen Geräte nachgewiesen werden."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Durch Abkleben eines Schutzschalters","Selektivität muss anhand der realen Geräte nachgewiesen werden.","Nur mit den zwei aufgedruckten Nennströmen"],"c":1,"why":"Der Merksatz lautet: Selektivität muss anhand der realen Geräte nachgewiesen werden.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Selektivität muss anhand der realen Geräte nachgewiesen werden."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer
