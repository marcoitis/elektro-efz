<!DOCTYPE html><html lang="de-CH"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>151 Ergänzende Unterrichtseinheiten – Elektro EFZ</title><style>body{font:16px/1.62 system-ui,sans-serif;background:#f5f7fa;color:#172b3c;margin:0}header{background:#133c52;color:white;padding:18px 26px}header h1{margin:0;font-size:1.3rem}.shell{max-width:1280px;margin:auto;display:grid;grid-template-columns:300px 1fr;gap:20px;padding:20px}aside,main{background:white;border:1px solid #dce5eb;border-radius:12px;padding:20px}aside{position:sticky;top:12px;height:calc(100vh - 120px);overflow:auto}aside select,aside input{padding:9px;width:100%;box-sizing:border-box;margin-bottom:10px}aside button{display:block;text-align:left;width:100%;background:white;border:0;border-bottom:1px solid #e3ebef;padding:10px;cursor:pointer}aside button:hover,aside button.active{background:#e6f3f6}main{min-height:75vh}main h1{line-height:1.2}main h2{margin-top:30px;border-bottom:1px solid #ddd;padding-bottom:6px}main h3{margin-top:24px}.notice{background:#fff2df;border-left:4px solid #ad732d;padding:12px;margin:14px 0}.stage{background:#eff7f7;padding:12px;border-radius:9px;margin:10px 0}.question{background:#f3f6fb;border-radius:8px;padding:12px;margin:16px 0}details{margin:12px 0}textarea{width:100%;box-sizing:border-box;min-height:85px;font:inherit;border:1px solid #ccd9e2;border-radius:6px;padding:10px}img{max-width:100%;max-height:320px}button{font:inherit}a{color:#086a85}@media(max-width:760px){.shell{display:block;padding:8px}aside{position:static;height:auto;max-height:250px;margin-bottom:8px}}@media print{header,aside,textarea,.printskip{display:none}.shell{display:block}main{border:0}}</style><header><h1>Elektro EFZ · 151 ergänzende Unterrichtseinheiten</h1><span>25-Minuten-Selbstlerneinheiten · Quellstand v0.9.7</span></header><div class="shell"><aside><label for="search">Lektionen durchsuchen</label><input id="search" placeholder="ID oder Thema"><label for="lessons">Lektion auswählen</label><select size="12" id="lessons"></select></aside><main id="viewer"></main></div><script>const data=[{"id":"1.01-A","year":1,"title":"Berufsbild, EFZ und Installationsbewilligung","goals":["Unterscheide Fachabschluss, Berufspraxis und Installationsbewilligung.","Erkläre, weshalb ein EFZ keine allgemeine Installationsbewilligung ersetzt."],"parts":[{"heading":"Drei unterschiedliche Begriffe","text":"Stell dir drei Ebenen vor. Erstens: Du lernst elektrotechnische Fachkenntnisse und bestehst ein Qualifikationsverfahren. Das kann zum eidgenössischen Fähigkeitszeugnis führen. Zweitens: Du sammelst praktische Berufserfahrung unter fachlicher Anleitung. Drittens: Ein Betrieb oder eine berechtigte natürliche Person verfügt über eine passende Installationsbewilligung. Diese drei Ebenen sind rechtlich nicht dasselbe.","formula":""},{"heading":"Wofür ist die NIV da?","text":"Die Schweizer Niederspannungs-Installationsverordnung regelt unter anderem, wer elektrische Installationen erstellen, ändern oder kontrollieren darf. Bei vielen Arbeiten an fest angeschlossenen Installationen reicht technisches Können allein nicht. Die Anforderungen hängen von der konkreten Arbeit, ihrer Umgebung und den gesetzlichen Ausnahmen ab.","formula":""},{"heading":"Ein wichtiges Beispiel","text":"Wenn jemand ein EFZ als Elektroinstallateur besitzt, hat diese Person einen anerkannten beruflichen Abschluss. Daraus folgt aber nicht automatisch, dass sie selbstständig sämtliche Kundeninstallationen anbieten und verantworten darf. Für allgemeine selbstständige Installationsarbeiten gelten die Fachkundigkeit und die Bewilligungsbestimmungen der NIV. Die eingeschränkte PV-Bewilligung nach Art. 14 ist ein anderer, genau abgegrenzter Weg.","formula":""},{"heading":"Dein Lernziel","text":"Du möchtest PV-Anlagen verstehen und möglichst viele Arbeiten an eigenen Immobilien fachgerecht durchführen. Im Lernprogramm trainieren wir dafür zunächst das technische Verständnis. Wo die Grenze zwischen Lernübung und bewilligungspflichtiger Netzarbeit liegt, wird stets ausdrücklich hervorgehoben.","formula":""}],"bridgeTitle":"Berufliche Qualifikation, Verantwortung und sichere Praxis","bridge":"Ein EFZ bescheinigt einen Bildungsabschluss. Die Erlaubnis, Arbeiten an Niederspannungsinstallationen eigenverantwortlich auszuführen, folgt dagegen den einschlägigen gesetzlichen Bewilligungsregeln. Im Fachgespräch muss man deshalb immer getrennt fragen: Wer verfügt über die berufliche Qualifikation, wer führt die Arbeiten aus, wer trägt die Verantwortung, und welche Bewilligung ist für den konkreten Auftrag erforderlich? Nicht jede PV-Arbeit ist dieselbe Tätigkeit.","exercise":"Erstelle auf Papier eine Tabelle mit drei Spalten: «Ausbildung», «Berechtigung» und «Verantwortung». Ordne EFZ, Art. 14 NIV, Art. 16 NIV und allgemeine Installationsbewilligung zu. Keine Arbeiten an Installationen ausführen. Zeichne ein Vier-Felder-Schema mit den Begriffen Berufsabschluss, Fachkundigkeit, Betriebsbewilligung und Auftrag. Markiere für jeden Begriff, welche konkrete Frage Du an eine zuständige Fachperson stellen würdest.","solution":"Das EFZ ist ein Berufsabschluss. Zusätzliche Berechtigungen folgen aus den jeweiligen gesetzlichen Bestimmungen. Die Niederspannungs-Installationsverordnung (NIV) behandelt die Installationsbewilligungen. Die Kenntnisse sind notwendig, die Bewilligungslage muss für die konkrete Arbeit separat stimmen.","quiz":[{"q":"Was ist mit dem EFZ allein automatisch erteilt?","options":["Eine allgemeine Installationsbewilligung","Ein anerkannter Berufsabschluss","Eine Kontrollbewilligung"],"c":1,"why":"Das EFZ ist ein Berufsabschluss. Zusätzliche Berechtigungen folgen aus den jeweiligen gesetzlichen Bestimmungen.\n\nBezug zum Unterrichtsteil «Wofür ist die NIV da?»: Bei vielen Arbeiten an fest angeschlossenen Installationen reicht technisches Können allein nicht."},{"q":"Welche Regelung ist für Installationsbewilligungen zentral?","options":["NIV","Obligationenrecht allein","Strassenverkehrsgesetz"],"c":0,"why":"Die Niederspannungs-Installationsverordnung (NIV) behandelt die Installationsbewilligungen.\n\nBezug zum Unterrichtsteil «Wofür ist die NIV da?»: Die Schweizer Niederspannungs-Installationsverordnung regelt unter anderem, wer elektrische Installationen erstellen, ändern oder kontrollieren darf."},{"q":"Welche Aussage ist korrekt?","options":["Fachwissen ersetzt immer eine Bewilligung","Jede PV-Anlage darf ohne Kontrolle ans Netz","Lernen und gesetzliche Arbeitsberechtigung sind getrennt zu betrachten"],"c":2,"why":"Die Kenntnisse sind notwendig, die Bewilligungslage muss für die konkrete Arbeit separat stimmen."}],"refs":["NIV SR 734.27 Art. 6–16","ESTI – Bewilligungen NIV"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Unterscheide Fachabschluss, Berufspraxis und Installationsbewilligung."},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Drei unterschiedliche Begriffe» und «Wofür ist die NIV da?». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Drei unterschiedliche Begriffe» und «Ein wichtiges Beispiel». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Erstelle auf Papier eine Tabelle mit drei Spalten: «Ausbildung», «Berechtigung» und «Verantwortung». Ordne EFZ, Art. 14 NIV, Art. 16 NIV und allgemeine Installationsbewilligung zu. Keine Arbeiten an Installationen ausführen. Zeichne ein Vier-Felder-Schema mit den Begriffen Berufsabschluss, Fachkundigkeit, Betriebsbewilligung und Auftrag. Markiere für jeden Begriff, welche konkrete Frage Du an eine zuständige Fachperson stellen würdest."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Was ist mit dem EFZ allein automatisch erteilt?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/1.01-A.svg"},{"id":"1.01-B","year":1,"title":"Elektrische Gefahren verstehen","goals":["Erkläre die Wirkung von Körperstrom und Lichtbögen.","Erkenne Situationen, bei denen Arbeiten gestoppt werden müssen."],"parts":[{"heading":"Warum Elektrizität gefährlich ist","text":"Elektrizität ist unsichtbar und häufig geräuschlos. Ein Körperstrom kann Muskeln verkrampfen, die Atmung stören und das Herz gefährden. Wie schwer ein Unfall verläuft, hängt nicht allein von der Spannung ab, sondern auch vom Stromweg durch den Körper, der Einwirkdauer, der Frequenz und den Kontaktbedingungen.","formula":""},{"heading":"Stromschlag und Lichtbogen","text":"Ein Stromschlag bedeutet, dass Strom durch den Körper fliesst. Ein Lichtbogen ist dagegen eine Entladung durch ein Gas, bei der sehr hohe Temperaturen und Druckwirkungen entstehen können. Es sind unterschiedliche Gefahren; beide erfordern passende Schutzmassnahmen. Auch ohne direkten Kontakt kann ein gefährlicher Lichtbogen entstehen.","formula":""},{"heading":"Was der Widerstand erklärt – und was nicht","text":"Das Ohmsche Gesetz beschreibt einen idealisierten Zusammenhang zwischen Spannung, Strom und Widerstand. Der menschliche Körper ist aber kein fester 1000-Ohm-Widerstand. Hautzustand, Feuchtigkeit, Kontaktfläche und viele weitere Umstände verändern die Situation. Aus einer simplen Rechnung darfst du deshalb keine «sichere Berührungsspannung» für einen konkreten Arbeitsplatz ableiten.","formula":""},{"heading":"Sicherheitsentscheidung vor Fachstolz","text":"Eine korrekte Sicherheitsentscheidung kann darin bestehen, eine Arbeit nicht auszuführen. Wenn der Arbeitsauftrag unklar ist, die Spannungsfreiheit nicht nachgewiesen ist oder eine andere Energiequelle vorhanden sein kann, lautet die Antwort: stoppen, sichern lassen und eine entsprechend befähigte Person hinzuziehen.","formula":""}],"bridgeTitle":"Berufliche Qualifikation, Verantwortung und sichere Praxis","bridge":"Ein EFZ bescheinigt einen Bildungsabschluss. Die Erlaubnis, Arbeiten an Niederspannungsinstallationen eigenverantwortlich auszuführen, folgt dagegen den einschlägigen gesetzlichen Bewilligungsregeln. Im Fachgespräch muss man deshalb immer getrennt fragen: Wer verfügt über die berufliche Qualifikation, wer führt die Arbeiten aus, wer trägt die Verantwortung, und welche Bewilligung ist für den konkreten Auftrag erforderlich? Nicht jede PV-Arbeit ist dieselbe Tätigkeit.","exercise":"Notiere fünf unterschiedliche Gefährdungen an einer bestehenden Elektroverteilung. Ordne zu, welche davon auch ohne Berührung gefährlich werden können. Arbeite ausschliesslich mit Fotos oder Plänen. Zeichne ein Vier-Felder-Schema mit den Begriffen Berufsabschluss, Fachkundigkeit, Betriebsbewilligung und Auftrag. Markiere für jeden Begriff, welche konkrete Frage Du an eine zuständige Fachperson stellen würdest.","solution":"Stromweg und Einwirkdauer sind wichtige Einflussgrössen; es gibt viele weitere. Ein Lichtbogen kann starke Wärme- und Druckwirkungen verursachen. STOPP ist die einzig geeignete Entscheidung.","quiz":[{"q":"Welche Aussage ist richtig?","options":["Nur hohe Spannung ist gefährlich","Gefahr hängt von Stromweg und Einwirkdauer ab","Trockene Hände machen jede Arbeit sicher"],"c":1,"why":"Stromweg und Einwirkdauer sind wichtige Einflussgrössen; es gibt viele weitere.\n\nBezug zum Unterrichtsteil «Warum Elektrizität gefährlich ist»: Wie schwer ein Unfall verläuft, hängt nicht allein von der Spannung ab, sondern auch vom Stromweg durch den Körper, der Einwirkdauer, der Frequenz und den Kontaktbedingungen."},{"q":"Was kann auch ohne direkte Berührung gefährlich sein?","options":["Ein Lichtbogen","Ein auf Papier gezeichneter Widerstand","Ein ausgeschalteter Taschenrechner"],"c":0,"why":"Ein Lichtbogen kann starke Wärme- und Druckwirkungen verursachen.\n\nBezug zum Unterrichtsteil «Stromschlag und Lichtbogen»: Ein Lichtbogen ist dagegen eine Entladung durch ein Gas, bei der sehr hohe Temperaturen und Druckwirkungen entstehen können."},{"q":"Was ist bei ungeklärter Spannungsfreiheit angemessen?","options":["Anfassen, um zu testen","Die Arbeit unterbrechen und fachkundig prüfen lassen","Auf ein Geräusch warten"],"c":1,"why":"STOPP ist die einzig geeignete Entscheidung.\n\nBezug zum Unterrichtsteil «Sicherheitsentscheidung vor Fachstolz»: Wenn der Arbeitsauftrag unklar ist, die Spannungsfreiheit nicht nachgewiesen ist oder eine andere Energiequelle vorhanden sein kann, lautet die Antwort: stoppen, sichern lassen und eine entsprechend befähigte Person hinzuziehen."}],"refs":["Suva 5+5 lebenswichtige Regeln","NIN Teil 4 – Schutz gegen elektrischen Schlag (Normtext separat prüfen)"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Erkläre die Wirkung von Körperstrom und Lichtbögen."},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Warum Elektrizität gefährlich ist» und «Stromschlag und Lichtbogen». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Warum Elektrizität gefährlich ist» und «Was der Widerstand erklärt – und was nicht». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Notiere fünf unterschiedliche Gefährdungen an einer bestehenden Elektroverteilung. Ordne zu, welche davon auch ohne Berührung gefährlich werden können. Arbeite ausschliesslich mit Fotos oder Plänen. Zeichne ein Vier-Felder-Schema mit den Begriffen Berufsabschluss, Fachkundigkeit, Betriebsbewilligung und Auftrag. Markiere für jeden Begriff, welche konkrete Frage Du an eine zuständige Fachperson stellen würdest."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Welche Aussage ist richtig?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/1.01-B.svg"},{"id":"1.01-C","year":1,"title":"Sicherheitsregeln und Besonderheiten von PV-Anlagen","goals":["Nenne die fünf Sicherheitsregeln in ihrer Reihenfolge.","Erkenne Mehrfacheinspeisungen und PV-DC-Gefahren."],"parts":[{"heading":"Die fünf Sicherheitsregeln","text":"Für Arbeiten im spannungsfreien Zustand gelten die Schritte: vollständig freischalten; gegen Wiedereinschalten sichern; Spannungsfreiheit feststellen; erden und kurzschliessen, soweit erforderlich; gegen benachbarte unter Spannung stehende Teile schützen. Welche konkreten Massnahmen notwendig sind, muss jeweils durch befähigte Fachpersonen beurteilt und umgesetzt werden.","formula":""},{"heading":"Die weiteren fünf lebenswichtigen Regeln","text":"Die Suva ergänzt diese um klare Aufträge, geeignetes Personal, sichere Arbeitsmittel, passende Schutzausrüstung und die Inbetriebnahme nur nach vorgeschriebener Prüfung. Das ist kein Merkblatt für Mutproben, sondern eine Stop-Regel: Bei Unsicherheit ist die Arbeit zu unterbrechen.","formula":""},{"heading":"Warum Photovoltaik besonders ist","text":"Ein PV-Modul kann bei Lichteinfall elektrische Energie liefern. Das bedeutet, dass eine auf der Wechselstromseite abgeschaltete Anlage auf der Gleichstromseite dennoch gefährliche Spannung führen kann. Batteriespeicher und mehrere Einspeisungen erhöhen die Komplexität zusätzlich. Ein einzelner ausgeschalteter Schalter ist daher kein Beweis für Spannungsfreiheit des Gesamtsystems.","formula":""},{"heading":"Fallbeispiel aus dem Alltag","text":"Ein Wechselrichter zeigt «aus» an. Die Module auf dem Dach werden weiterhin von der Sonne beschienen. Was wissen wir sicher? Dass eine Anzeige ausgeschaltet ist. Was wissen wir nicht? Welche Bereiche tatsächlich spannungsfrei sind. Deshalb keine Anschlüsse öffnen oder prüfen, solange nicht eine befähigte Person nach dem gültigen Arbeitsverfahren vorgeht.","formula":""}],"bridgeTitle":"Berufliche Qualifikation, Verantwortung und sichere Praxis","bridge":"Ein EFZ bescheinigt einen Bildungsabschluss. Die Erlaubnis, Arbeiten an Niederspannungsinstallationen eigenverantwortlich auszuführen, folgt dagegen den einschlägigen gesetzlichen Bewilligungsregeln. Im Fachgespräch muss man deshalb immer getrennt fragen: Wer verfügt über die berufliche Qualifikation, wer führt die Arbeiten aus, wer trägt die Verantwortung, und welche Bewilligung ist für den konkreten Auftrag erforderlich? Nicht jede PV-Arbeit ist dieselbe Tätigkeit.","exercise":"Erstelle eine STOPP-Checkliste für die Beurteilung einer PV-Anlage: mögliche Einspeisequellen, klare Zuständigkeit, Nachweise, Freigabe, PSA und Dokumentation. Nur theoretisch bearbeiten. Zeichne ein Vier-Felder-Schema mit den Begriffen Berufsabschluss, Fachkundigkeit, Betriebsbewilligung und Auftrag. Markiere für jeden Begriff, welche konkrete Frage Du an eine zuständige Fachperson stellen würdest.","solution":"Eine Abschaltung auf AC-Seite beseitigt nicht automatisch jede DC-Spannung. Die Regeln haben eine festgelegte Reihenfolge; Umsetzung nur durch Berechtigte. Klare Aufträge und Befugnisse sind eine Voraussetzung.","quiz":[{"q":"Kann eine PV-DC-Leitung bei abgeschaltetem AC-Hauptschalter noch Spannung führen?","options":["Ja, bei Lichteinfall möglich","Nein, nie","Nur nachts"],"c":0,"why":"Eine Abschaltung auf AC-Seite beseitigt nicht automatisch jede DC-Spannung.\n\nBezug zum Unterrichtsteil «Warum Photovoltaik besonders ist»: Das bedeutet, dass eine auf der Wechselstromseite abgeschaltete Anlage auf der Gleichstromseite dennoch gefährliche Spannung führen kann."},{"q":"Welche Regel steht am Anfang der fünf Sicherheitsregeln?","options":["Spannungsfreiheit feststellen","Vollständig freischalten","Erden und kurzschliessen"],"c":1,"why":"Die Regeln haben eine festgelegte Reihenfolge; Umsetzung nur durch Berechtigte.\n\nBezug zum Unterrichtsteil «Die fünf Sicherheitsregeln»: Für Arbeiten im spannungsfreien Zustand gelten die Schritte: vollständig freischalten; gegen Wiedereinschalten sichern; Spannungsfreiheit feststellen; erden und kurzschliessen, soweit erforderlich; gegen benachbarte unter Spannung stehende Teile schützen."},{"q":"Was gilt bei unklarer Zuständigkeit?","options":["Trotzdem beginnen","Nur kurz einen Draht anschliessen","Arbeit nicht beginnen"],"c":2,"why":"Klare Aufträge und Befugnisse sind eine Voraussetzung.\n\nBezug zum Unterrichtsteil «Die weiteren fünf lebenswichtigen Regeln»: Die Suva ergänzt diese um klare Aufträge, geeignetes Personal, sichere Arbeitsmittel, passende Schutzausrüstung und die Inbetriebnahme nur nach vorgeschriebener Prüfung."}],"refs":["Suva Publikation 84042.D","Suva Instruktionshilfe 88814.D","NIV SR 734.27"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Nenne die fünf Sicherheitsregeln in ihrer Reihenfolge."},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Die fünf Sicherheitsregeln» und «Die weiteren fünf lebenswichtigen Regeln». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Die fünf Sicherheitsregeln» und «Warum Photovoltaik besonders ist». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Erstelle eine STOPP-Checkliste für die Beurteilung einer PV-Anlage: mögliche Einspeisequellen, klare Zuständigkeit, Nachweise, Freigabe, PSA und Dokumentation. Nur theoretisch bearbeiten. Zeichne ein Vier-Felder-Schema mit den Begriffen Berufsabschluss, Fachkundigkeit, Betriebsbewilligung und Auftrag. Markiere für jeden Begriff, welche konkrete Frage Du an eine zuständige Fachperson stellen würdest."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Kann eine PV-DC-Leitung bei abgeschaltetem AC-Hauptschalter noch Spannung führen?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/1.01-C.svg"},{"id":"1.02-A","year":1,"title":"SI-Einheiten und Zehnerpotenzen","goals":["Rechne mA, kA, mV, kW, Wh und kWh sicher um.","Erkenne Grössenordnungsfehler."],"parts":[{"heading":"Einheiten sind die Sprache der Elektrotechnik","text":"Ein Messwert braucht Zahl und Einheit. Ein Strom von 2 Ampere ist etwas anderes als 2 Milliampere. Der Vorsatz milli bedeutet ein Tausendstel, kilo bedeutet tausend. Mega steht für eine Million. Gerade bei Strom, Spannung und Leistung verhindern saubere Einheiten schwerwiegende Fehler.","formula":""},{"heading":"Die drei wichtigsten Vorsätze","text":"Milli ist zehn hoch minus drei. Kilo ist zehn hoch drei. Mega ist zehn hoch sechs. Als Regel kannst du bei einem Schritt von kilo zu Milli mit einer Million rechnen. Beispiele: 0,025 Ampere sind 25 Milliampere. 3,5 Kilowatt sind 3500 Watt.","formula":""},{"heading":"Wattstunden und Kilowattstunden","text":"Elektrische Energie wird häufig in Wattstunden oder Kilowattstunden angegeben. 1 Kilowattstunde entspricht 1000 Wattstunden. Eine Leistung von 2 Kilowatt über eine halbe Stunde ergibt 1 Kilowattstunde Energie. Die Einheit Kilowatt ist hingegen nur eine Leistung und sagt ohne Zeit noch nichts über die verbrauchte Energiemenge aus.","formula":""},{"heading":"Plausibilität prüfen","text":"Bevor du mit einem Ergebnis weiterrechnest, halte kurz inne. Wenn ein kleiner 12-Volt-Lüfter angeblich 35 Kilowatt benötigt, stimmt wahrscheinlich eine Einheit oder ein Rechenschritt nicht. Gewöhne dir an, jede Formel zuerst in Grundeinheiten einzusetzen.","formula":""}],"bridgeTitle":"Grössen und Einheiten vor Formeln","bridge":"Eine technische Rechnung beginnt bei der Dimension: Millimeter sind Längen, Quadratmillimeter Flächen und Kubikmillimeter Volumina. Vor dem Einsetzen müssen Einheiten vereinheitlicht werden. Die abschliessende Grössenordnung dient als Fehlerkontrolle; 0,8 kW sind beispielsweise 800 W und nicht 80 W. Ein Taschenrechner bestätigt nur die arithmetische Operation, nicht die richtige physikalische Modellwahl.","exercise":"Rechne schriftlich: 450 mA in A, 0,075 kW in W, 2,4 kWh in Wh und 75 000 µA in A. Lege zu jeder Umrechnung einen Rechenweg an. Schreibe jede verwendete Grösse mit Symbol, Zahlenwert und Einheit auf. Prüfe die Gleichung zuerst symbolisch und erst dann numerisch.","solution":"Milli bedeutet ein Tausendstel: 250 geteilt durch 1000. Kilo bedeutet tausend. kWh ist eine Energiemenge; W ist Leistung.","quiz":[{"q":"Wie viele Ampere sind 250 mA?","options":["0,25 A","2,5 A","250 A"],"c":0,"why":"Milli bedeutet ein Tausendstel: 250 geteilt durch 1000.\n\nBezug zum Unterrichtsteil «Einheiten sind die Sprache der Elektrotechnik»: Der Vorsatz milli bedeutet ein Tausendstel, kilo bedeutet tausend."},{"q":"3 kW sind ...","options":["300 W","3000 W","0,003 W"],"c":1,"why":"Kilo bedeutet tausend.\n\nBezug zum Unterrichtsteil «Einheiten sind die Sprache der Elektrotechnik»: Der Vorsatz milli bedeutet ein Tausendstel, kilo bedeutet tausend."},{"q":"Welche Einheit beschreibt Energie?","options":["W","V","kWh"],"c":2,"why":"kWh ist eine Energiemenge; W ist Leistung.\n\nBezug zum Unterrichtsteil «Wattstunden und Kilowattstunden»: Die Einheit Kilowatt ist hingegen nur eine Leistung und sagt ohne Zeit noch nichts über die verbrauchte Energiemenge aus."}],"refs":["Lehrplan Berufsfachschule 2015 – Mathematik","SI-Einheitensystem"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Rechne mA, kA, mV, kW, Wh und kWh sicher um."},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Einheiten sind die Sprache der Elektrotechnik» und «Die drei wichtigsten Vorsätze». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Einheiten sind die Sprache der Elektrotechnik» und «Wattstunden und Kilowattstunden». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Rechne schriftlich: 450 mA in A, 0,075 kW in W, 2,4 kWh in Wh und 75 000 µA in A. Lege zu jeder Umrechnung einen Rechenweg an. Schreibe jede verwendete Grösse mit Symbol, Zahlenwert und Einheit auf. Prüfe die Gleichung zuerst symbolisch und erst dann numerisch."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Wie viele Ampere sind 250 mA?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/1.02-A.svg"},{"id":"1.02-B","year":1,"title":"Formeln sicher umstellen","goals":["Stelle U=R·I nach jeder Variablen um.","Löse mehrstufige Gleichungen mit Einheiten."],"parts":[{"heading":"Rechnen ist ein Werkzeug","text":"Du kennst aus dem Maschinenbau bereits technische Formeln. In der Elektroinstallation brauchst du dieselbe Sorgfalt. Die Grundidee ist: Was du auf einer Seite der Gleichung machst, musst du auf der anderen ebenfalls tun. Beim Umstellen ist die Einheit eine zusätzliche Kontrollmöglichkeit.","formula":""},{"heading":"Ein Beispiel mit dem Ohmschen Gesetz","text":"Aus U gleich R mal I wird I gleich U geteilt durch R. Gesucht ist der Widerstand, dann lautet die Formel R gleich U geteilt durch I. In Symbolen: U = R · I, I = U / R und R = U / I. Du solltest diese drei Schreibweisen ohne Nachdenken erzeugen können.","formula":"U = R · I   |   I = U / R   |   R = U / I"},{"heading":"Mit Zahlen kontrollieren","text":"Eine Spannungsquelle liefert 12 Volt an einen Widerstand von 6 Ohm. Dann berechnet sich der Strom zu 12 Volt geteilt durch 6 Ohm, also 2 Ampere. Die Rückprobe lautet 6 Ohm mal 2 Ampere gleich 12 Volt.","formula":""},{"heading":"Ein häufiger Fehler","text":"Verwechsle nicht Multiplikation und Addition. Aus U = R mal I darfst du nicht U = R plus I machen. Schreibe erst die Formel auf, dann das Gesuchte, dann die Umstellung, und setze zuletzt die Zahlen mit Einheiten ein.","formula":""}],"bridgeTitle":"Grössen und Einheiten vor Formeln","bridge":"Eine technische Rechnung beginnt bei der Dimension: Millimeter sind Längen, Quadratmillimeter Flächen und Kubikmillimeter Volumina. Vor dem Einsetzen müssen Einheiten vereinheitlicht werden. Die abschliessende Grössenordnung dient als Fehlerkontrolle; 0,8 kW sind beispielsweise 800 W und nicht 80 W. Ein Taschenrechner bestätigt nur die arithmetische Operation, nicht die richtige physikalische Modellwahl.","exercise":"Löse zehn frei gewählte Formelumstellungen: U=R·I, P=U·I, E=P·t und η=P_ab/P_zu. Erstelle bei jeder Aufgabe eine Rückprobe. Schreibe jede verwendete Grösse mit Symbol, Zahlenwert und Einheit auf. Prüfe die Gleichung zuerst symbolisch und erst dann numerisch.","solution":"Teile beide Seiten durch I. I = 12/4 = 3 Ampere. Die Rückprobe prüft Umstellung und Einsetzen.","quiz":[{"q":"Stelle U=R·I nach R um.","options":["R=U·I","R=U/I","R=I/U"],"c":1,"why":"Teile beide Seiten durch I."},{"q":"12 V liegen an 4 Ω. Wie hoch ist I?","options":["3 A","48 A","0,33 A"],"c":0,"why":"I = 12/4 = 3 Ampere."},{"q":"Welche Kontrolle hilft besonders?","options":["Einheit weglassen","Ergebnis immer aufrunden","Rückprobe in Ausgangsformel"],"c":2,"why":"Die Rückprobe prüft Umstellung und Einsetzen."}],"refs":["Lehrplan Berufsfachschule 2015 – Mathematik"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Stelle U=R·I nach jeder Variablen um."},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Rechnen ist ein Werkzeug» und «Ein Beispiel mit dem Ohmschen Gesetz». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Rechnen ist ein Werkzeug» und «Mit Zahlen kontrollieren». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Löse zehn frei gewählte Formelumstellungen: U=R·I, P=U·I, E=P·t und η=P_ab/P_zu. Erstelle bei jeder Aufgabe eine Rückprobe. Schreibe jede verwendete Grösse mit Symbol, Zahlenwert und Einheit auf. Prüfe die Gleichung zuerst symbolisch und erst dann numerisch."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Stelle U=R·I nach R um."},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/1.02-B.svg"},{"id":"1.02-C","year":1,"title":"Prozent, Wirkungsgrad und Energie","goals":["Berechne Wirkungsgrade und Energieverbrauch.","Unterscheide Leistung und Energie."],"parts":[{"heading":"Was ein Wirkungsgrad aussagt","text":"Ein Gerät wandelt zugeführte Energie in eine gewünschte Form um. Ein Teil geht beispielsweise als Wärme verloren. Der Wirkungsgrad ist das Verhältnis von nutzbarer abgegebener Leistung zur zugeführten Leistung, sofern wir im gleichen Zeitrahmen rechnen. Ein Wert von 0,90 entspricht 90 Prozent.","formula":"η = P_ab / P_zu"},{"heading":"Ein Rechenbeispiel","text":"Ein Netzteil nimmt 100 Watt auf und gibt 88 Watt an die Last ab. Der Wirkungsgrad beträgt 88 geteilt durch 100 gleich 0,88, also 88 Prozent. Die Differenz von 12 Watt wird in anderen Formen abgegeben, häufig überwiegend als Wärme.","formula":""},{"heading":"Leistung mal Zeit","text":"Eine elektrische Heizung mit 1,5 Kilowatt wird zwei Stunden betrieben. Die Energie ist 1,5 Kilowatt mal zwei Stunden, also drei Kilowattstunden. Wenn du Energiekosten abschätzen möchtest, multiplizierst du die Kilowattstunden mit dem vereinbarten Preis pro Kilowattstunde.","formula":"E = P · t"},{"heading":"PV als Vergleich","text":"Eine PV-Anlage mit einer Nennleistung von 5 Kilowatt produziert nicht in jeder Stunde 5 Kilowattstunden. Der Ertrag hängt unter anderem von Einstrahlung, Temperatur, Ausrichtung, Schatten und Verlusten ab. Nennleistung, Momentanleistung und Tagesenergie müssen klar unterschieden werden.","formula":""}],"bridgeTitle":"Grössen und Einheiten vor Formeln","bridge":"Eine technische Rechnung beginnt bei der Dimension: Millimeter sind Längen, Quadratmillimeter Flächen und Kubikmillimeter Volumina. Vor dem Einsetzen müssen Einheiten vereinheitlicht werden. Die abschliessende Grössenordnung dient als Fehlerkontrolle; 0,8 kW sind beispielsweise 800 W und nicht 80 W. Ein Taschenrechner bestätigt nur die arithmetische Operation, nicht die richtige physikalische Modellwahl.","exercise":"Berechne für drei frei gewählte Geräte den Energieverbrauch pro Tag. Führe die Formeln, Annahmen, Einheiten und eine Plausibilitätskontrolle auf. Schreibe jede verwendete Grösse mit Symbol, Zahlenwert und Einheit auf. Prüfe die Gleichung zuerst symbolisch und erst dann numerisch.","solution":"E = 2 kW × 3 h = 6 kWh. 90 geteilt durch 100 entspricht 0,9. Leistung und Energie sind verschiedene Grössen.","quiz":[{"q":"Ein Gerät verbraucht 2 kW während 3 h. Wie viel Energie?","options":["6 kWh","0,67 kWh","5 kW"],"c":0,"why":"E = 2 kW × 3 h = 6 kWh.\n\nBezug zum Unterrichtsteil «Was ein Wirkungsgrad aussagt»: Ein Gerät wandelt zugeführte Energie in eine gewünschte Form um."},{"q":"90 W Abgabe bei 100 W Aufnahme: η?","options":["10 %","90 %","110 %"],"c":1,"why":"90 geteilt durch 100 entspricht 0,9.\n\nBezug zum Unterrichtsteil «Ein Rechenbeispiel»: Der Wirkungsgrad beträgt 88 geteilt durch 100 gleich 0,88, also 88 Prozent."},{"q":"Was ist korrekt?","options":["kW und kWh sind dasselbe","kW misst Energie","kW misst Leistung, kWh Energie"],"c":2,"why":"Leistung und Energie sind verschiedene Grössen.\n\nBezug zum Unterrichtsteil «Was ein Wirkungsgrad aussagt»: Ein Gerät wandelt zugeführte Energie in eine gewünschte Form um."}],"refs":["Lehrplan Berufsfachschule 2015 – Mathematik und Elektrotechnik"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Berechne Wirkungsgrade und Energieverbrauch."},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Was ein Wirkungsgrad aussagt» und «Ein Rechenbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Was ein Wirkungsgrad aussagt» und «Leistung mal Zeit». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Berechne für drei frei gewählte Geräte den Energieverbrauch pro Tag. Führe die Formeln, Annahmen, Einheiten und eine Plausibilitätskontrolle auf. Schreibe jede verwendete Grösse mit Symbol, Zahlenwert und Einheit auf. Prüfe die Gleichung zuerst symbolisch und erst dann numerisch."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Ein Gerät verbraucht 2 kW während 3 h. Wie viel Energie?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/1.02-C.svg"},{"id":"1.11-A","year":1,"title":"Rechtsquellen, Normen und Verantwortlichkeit","goals":["Normen- und Rechtsquellenhierarchie ElG, NIV, NIN, ESTI","Personenschutz: Basisschutz, Fehlerschutz, zusätzlicher Schutz"],"parts":[{"heading":"Dein Dozent erklärt: Rechtsquellen, Normen und Verantwortlichkeit","text":"Heute geht es um rechtsquellen, normen und verantwortlichkeit. Ein Gesetz, eine Verordnung, eine anerkannte technische Norm und ein Herstellerdatenblatt haben unterschiedliche Funktionen. Die NIV bestimmt unter anderem Bewilligungen und Kontrollen. Die NIN konkretisiert technische Regeln der Niederspannungsinstallation, während ESTI-Weisungen und Netzbetreibervorgaben spezifische Sachverhalte betreffen können. Vor einer konkreten Entscheidung muss die jeweils gültige Fassung und ihr Geltungsbereich geprüft werden. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Beurteile einen fiktiven Auftrag, bei dem eine bestehende Verteilung erweitert werden soll. Frage nacheinander nach dem befugten Betrieb, dem technischen Schutzkonzept, den Vorgaben des Netzbetreibers und den erforderlichen Kontrollen. Das blosse Zitieren einer Normnummer ist noch keine rechtlich oder technisch belastbare Freigabe. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Die Zuständigkeit wird vor dem technischen Detail geklärt. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Normen- und Rechtsquellenhierarchie ElG, NIV, NIN, ESTI; Personenschutz: Basisschutz, Fehlerschutz, zusätzlicher Schutz. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIV Art. 24, 35–37; NIN Teile 4/5/6; ESTI Weisungen. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Schutzebenen nicht verwechseln","bridge":"Basisschutz, Fehlerschutz und Zusatzschutz erfüllen unterschiedliche Aufgaben. Eine zusätzliche Schutzmassnahme ist kein Freipass, Grundschutzmassnahmen wegzulassen. Die Wahl und Prüfung hängt vom jeweiligen Netzsystem, der konkreten Installation und den massgeblichen technischen Regeln ab. Für Installationsfreigaben sind Normtext und die zuständige Fachperson entscheidend.","exercise":"Normrecherche anhand von sechs Fällen: relevante Quelle und zuständige Stelle bestimmen. Halte zusätzlich die Antwort auf die Frage «Was regelt die NIV insbesondere?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Nimm drei fiktive Fehlerbilder und ordne zu, welche Art von Schutzversagen oder Schutzbedarf jeweils diskutiert werden muss.","solution":"Die Zuständigkeit wird vor dem technischen Detail geklärt. Der Merksatz lautet: Die Zuständigkeit wird vor dem technischen Detail geklärt. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was regelt die NIV insbesondere?","options":["Die jährliche Sonnenscheindauer","Installationsbewilligungen und Kontrollen","Farben von Gebäudegrundrissen"],"c":1,"why":"Die Zuständigkeit wird vor dem technischen Detail geklärt.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Die Zuständigkeit wird vor dem technischen Detail geklärt."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Farben von Gebäudegrundrissen","Die Zuständigkeit wird vor dem technischen Detail geklärt.","Die jährliche Sonnenscheindauer"],"c":1,"why":"Der Merksatz lautet: Die Zuständigkeit wird vor dem technischen Detail geklärt.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Die Zuständigkeit wird vor dem technischen Detail geklärt."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["4.3.1b–4.3.6b; 2.2.4b","Norm-/Regelwerk: NIV Art. 24, 35–37; NIN Teile 4/5/6; ESTI Weisungen","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Normen- und Rechtsquellenhierarchie ElG, NIV, NIN, ESTI"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Rechtsquellen, Normen und Verantwortlichkeit» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Rechtsquellen, Normen und Verantwortlichkeit» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Normrecherche anhand von sechs Fällen: relevante Quelle und zuständige Stelle bestimmen. Halte zusätzlich die Antwort auf die Frage «Was regelt die NIV insbesondere?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Nimm drei fiktive Fehlerbilder und ordne zu, welche Art von Schutzversagen oder Schutzbedarf jeweils diskutiert werden muss."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Was regelt die NIV insbesondere?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/1.11-A.svg"},{"id":"1.11-B","year":1,"title":"Basisschutz, Fehlerschutz und Zusatzschutz","goals":["Schutzklassen I/II/III und SELV/PELV als Überblick","Überstrom, Kurzschluss, Überlast, thermische Wirkung"],"parts":[{"heading":"Dein Dozent erklärt: Basisschutz, Fehlerschutz und Zusatzschutz","text":"Heute geht es um basisschutz, fehlerschutz und zusatzschutz. Beim elektrischen Schutz werden unterschiedliche Gefährdungssituationen auseinandergehalten. Basisschutz verhindert im Normalbetrieb gefährliche Berührung. Fehlerschutz vermindert Risiken bei einem einzelnen Fehler. Zusätzlicher Schutz kann beispielsweise durch geeignete Fehlerstrom-Schutzeinrichtungen erreicht werden. Keine einzelne Massnahme ersetzt automatisch alle anderen; die vollständige Planung ist vom Netzsystem und der Nutzung abhängig. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Zeichne das Konzept eines Geräts mit leitfähigem Gehäuse. Erkläre, welche Funktion Isolierung, Schutzleiter und automatische Abschaltung im Fehlerfall übernehmen. Ergänze, weshalb ein RCD trotz seines Nutzens keine ausreichende Begründung ist, ungeschützte aktive Teile berührbar zu machen. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Schutzmassnahmen wirken als abgestimmtes Gesamtsystem. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Schutzklassen I/II/III und SELV/PELV als Überblick; Überstrom, Kurzschluss, Überlast, thermische Wirkung. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIV Art. 24, 35–37; NIN Teile 4/5/6; ESTI Weisungen. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Schutzebenen nicht verwechseln","bridge":"Basisschutz, Fehlerschutz und Zusatzschutz erfüllen unterschiedliche Aufgaben. Eine zusätzliche Schutzmassnahme ist kein Freipass, Grundschutzmassnahmen wegzulassen. Die Wahl und Prüfung hängt vom jeweiligen Netzsystem, der konkreten Installation und den massgeblichen technischen Regeln ab. Für Installationsfreigaben sind Normtext und die zuständige Fachperson entscheidend.","exercise":"Normrecherche anhand von sechs Fällen: relevante Quelle und zuständige Stelle bestimmen. Halte zusätzlich die Antwort auf die Frage «Welche Aussage zu einem RCD ist richtig?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Nimm drei fiktive Fehlerbilder und ordne zu, welche Art von Schutzversagen oder Schutzbedarf jeweils diskutiert werden muss.","solution":"Schutzmassnahmen wirken als abgestimmtes Gesamtsystem. Der Merksatz lautet: Schutzmassnahmen wirken als abgestimmtes Gesamtsystem. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Welche Aussage zu einem RCD ist richtig?","options":["Er macht blanke Leiter ungefährlich","Er verhindert jeden elektrischen Unfall","Er ergänzt Schutzkonzepte, ersetzt aber nicht jede andere Massnahme"],"c":2,"why":"Schutzmassnahmen wirken als abgestimmtes Gesamtsystem.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Schutzmassnahmen wirken als abgestimmtes Gesamtsystem."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Er macht blanke Leiter ungefährlich","Schutzmassnahmen wirken als abgestimmtes Gesamtsystem.","Er verhindert jeden elektrischen Unfall"],"c":1,"why":"Der Merksatz lautet: Schutzmassnahmen wirken als abgestimmtes Gesamtsystem.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Schutzmassnahmen wirken als abgestimmtes Gesamtsystem."},{"q":"Wie lässt sich dieses Thema im Selbststudium ve e zunächst ohne Lösungshilfe: Welche Aussage zu einem RCD ist richtig?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/1.11-B.svg"},{"id":"1.11-C","year":1,"title":"Kontrollen, Sicherheitsnachweis und Dokumentationspflicht","goals":["Erdung und Potenzialausgleich als Grundverständnis","Dokumentations- und Meldepflichten, SiNa und Kontrollarten"],"parts":[{"heading":"Dein Dozent erklärt: Kontrollen, Sicherheitsnachweis und Dokumentationspflicht","text":"Heute geht es um kontrollen, sicherheitsnachweis und dokumentationspflicht. Die NIV unterscheidet verschiedene Prüf- und Kontrollsituationen. Baubegleitende Erstprüfung, Schlusskontrolle, Abnahmekontrolle und periodische Kontrolle haben unterschiedliche Zuständigkeiten und Nachweise. Der Sicherheitsnachweis fasst die sicherheitstechnische Beurteilung einer Installation zusammen; das Mess- und Prüfprotokoll liefert dazu konkrete technische Ergebnisse. Die vollständige rechtliche Abgrenzung ist am aktuellen NIV-Text zu prüfen. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Erstelle für eine hypothetische Sanierung eine Dokumentenübersicht: Auftrag, Plan, Änderungsliste, Ergebnisse der vorgeschriebenen Prüfungen, Sicherheitsnachweis und Übergabe. Beschreibe, wer diese Unterlagen im konkreten Auftrag erstellen oder unterschreiben dürfte. Eine selbst erstellte Unterrichtsvorlage ist kein gültiger Sicherheitsnachweis. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Prüfung, Kontrolle und Nachweis sind definierte Tätigkeiten mit Verantwortung. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Erdung und Potenzialausgleich als Grundverständnis; Dokumentations- und Meldepflichten, SiNa und Kontrollarten. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIV Art. 24, 35–37; NIN Teile 4/5/6; ESTI Weisungen. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Schutzebenen nicht verwechseln","bridge":"Basisschutz, Fehlerschutz und Zusatzschutz erfüllen unterschiedliche Aufgaben. Eine zusätzliche Schutzmassnahme ist kein Freipass, Grundschutzmassnahmen wegzulassen. Die Wahl und Prüfung hängt vom jeweiligen Netzsystem, der konkreten Installation und den massgeblichen technischen Regeln ab. Für Installationsfreigaben sind Normtext und die zuständige Fachperson entscheidend.","exercise":"Normrecherche anhand von sechs Fällen: relevante Quelle und zuständige Stelle bestimmen. Halte zusätzlich die Antwort auf die Frage «Welches Dokument beschreibt die sicherheitstechnische Beurteilung der Installation?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Nimm drei fiktive Fehlerbilder und ordne zu, welche Art von Schutzversagen oder Schutzbedarf jeweils diskutiert werden muss.","solution":"Prüfung, Kontrolle und Nachweis sind definierte Tätigkeiten mit Verantwortung. Der Merksatz lautet: Prüfung, Kontrolle und Nachweis sind definierte Tätigkeiten mit Verantwortung. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Welches Dokument beschreibt die sicherheitstechnische Beurteilung der Installation?","options":["Sicherheitsnachweis","Raumtemperaturprotokoll","Kaufbeleg des Akkuschraubers"],"c":0,"why":"Prüfung, Kontrolle und Nachweis sind definierte Tätigkeiten mit Verantwortung.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Prüfung, Kontrolle und Nachweis sind definierte Tätigkeiten mit Verantwortung."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Raumtemperaturprotokoll","Prüfung, Kontrolle und Nachweis sind definierte Tätigkeiten mit Verantwortung.","Kaufbeleg des Akkuschraubers"],"c":1,"why":"Der Merksatz lautet: Prüfung, Kontrolle und Nachweis sind definierte Tätigkeiten mit Verantwortung.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Prüfung, Kontrolle und Nachweis sind definierte Tätigkeiten mit Verantwortung."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Dein Dozent erklärt: Kontrollen, Sicherheitsnachweis und Dokumentationspflicht»: Baubegleitende Erstprüfung, Schlusskontrolle, Abnahmekontrolle und periodische Kontrolle haben unterschiedliche Zuständigkeiten und Nachweise."} -V-Schaltkonzept erstellen"],"parts":[{"heading":"Dein Dozent erklärt: Anforderungskatalog für ein 12-V-Lichtmodell","text":"Heute geht es um anforderungskatalog für ein 12-v-lichtmodell. Ein technisches Projekt beginnt mit der Funktion. Die Aufgabe beschreibt, welche Bedienstellen vorhanden sind, welcher Verbraucher versorgt wird, welche Spannung die Demonstrationsquelle hat und wie sich das System im Fehlerfall verhalten soll. Statt gleich Verdrahtungen zu setzen, werden Anforderungen in ein prüfbares Funktionsmodell übersetzt. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Plane eine Modellleuchte, die an zwei Stellen ein- und ausgeschaltet werden kann. Schreibe fünf überprüfbare Anforderungen auf: Spannung, Bedienfunktion, Sichtbarkeit der Zustände, mechanische Stabilität und Dokumentation. Nutze ausschliesslich eine geeignete galvanisch getrennte Kleinspannungsquelle oder Software. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Das Ziel wird vor der Lösung definiert. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Anforderungen an zwei Lichtschaltstellen erfassen; 12-V-Schaltkonzept erstellen. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: Lehrplan 2015 Fächer 2–4; NIN nur als Referenz, nicht als Abnahme. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Ein Modellprojekt dokumentieren","bridge":"Bei einem 12-V-Lichtmodell wird aus einer Anforderung eine überprüfbare Funktion. Erst kommt die Lastannahme, dann der Stromlaufplan, danach Stückliste und Sollwerte, und abschliessend die Fehlersuche. Gerade das Protokoll trennt eine erfolgreich beobachtete Funktion von einer nachvollziehbar geprüften Funktion.","exercise":"12-V-Modell einer Lichtfunktion auf Prüfbrett, ggf. Simulation als Alternative. Halte zusätzlich die Antwort auf die Frage «Was gehört an den Anfang eines technischen Lichtmodellprojekts?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erstelle für ein 12-V-Lichtmodell Anforderung, Schaltplan, Stückliste, Sollwert und Messprotokoll als zusammenhängendes Dossier.","solution":"Das Ziel wird vor der Lösung definiert. Der Merksatz lautet: Das Ziel wird vor der Lösung definiert. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was gehört an den Anfang eines technischen Lichtmodellprojekts?","options":["Nur die Gehäusefarbe","Unkontrolliertes Anklemmen","Ein überprüfbarer Anforderungskatalog"],"c":2,"why":"Das Ziel wird vor der Lösung definiert.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Das Ziel wird vor der Lösung definiert."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Nur die Gehäusefarbe","Das Ziel wird vor der Lösung definiert.","Unkontrolliertes Anklemmen"],"c":1,"why":"Der Merk cher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Ein gutes Modell lässt sich schon auf Papier prüfen. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Kabel- und Komponentenwahl für SELV prüfen; Mechanisch sauberen Aufbau und Klemmenbezeichnung herstellen. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: Lehrplan 2015 Fächer 2–4; NIN nur als Referenz, nicht als Abnahme. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Ein Modellprojekt dokumentieren","bridge":"Bei einem 12-V-Lichtmodell wird aus einer Anforderung eine überprüfbare Funktion. Erst kommt die Lastannahme, dann der Stromlaufplan, danach Stückliste und Sollwerte, und abschliessend die Fehlersuche. Gerade das Protokoll trennt eine erfolgreich beobachtete Funktion von einer nachvollziehbar geprüften Funktion.","exercise":"12-V-Modell einer Lichtfunktion auf Prüfbrett, ggf. Simulation als Alternative. Halte zusätzlich die Antwort auf die Frage «Welche Dokumente bilden zusammen eine nachvollziehbare Modelllösung?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erstelle für ein 12-V-Lichtm usätzlich die Antwort auf die Frage «Was gehört in ein strukturiertes Fehlerprotokoll?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erstelle für ein 12-V-Lichtmodell Anforderung, Schaltplan, Stückliste, Sollwert und Messprotokoll als zusammenhängendes Dossier."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Was gehört in ein strukturiertes Fehlerprotokoll?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/1.12-C.svg"},{"id":"2.01-A","year":2,"title":"Zeigerbilder und Phasenverschiebung","goals":["Sinusfunktion, Frequenz, Phasenlage und Verschiebungswinkel","Phasoren/Zeigerbilder und komplexe Widerstände"],"parts":[{"heading":"Dein Dozent erklärt: Zeigerbilder und Phasenverschiebung","text":"Heute geht es um zeigerbilder und phasenverschiebung. Sinusförmige Wechselgrössen lassen sich als zeitliche Kurven oder als Zeiger darstellen. Ein Zeiger enthält Betrag und Phasenlage. Bei einem idealen Widerstand sind Strom und Spannung phasengleich; bei idealen Induktivitäten und Kapazitäten treten charakteristische Phasenbeziehungen auf. Diese Darstellung ist Grundlage für komplexe Impedanzen und die Berechnung von Wechselstromnetzwerken. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Zeichne drei Sinuskurven gleicher Frequenz mit Phasenwinkeln von null, plus neunzig und minus neunzig Grad. Ergänze ein Zeigerdiagramm. Überlege, welche Messgrösse aus dem Diagramm allein noch nicht bekannt ist, wenn nur der Winkel angegeben wird: der tatsächliche Betrag. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Ein Winkel ohne Bezug und Betrag ist keine vollständige Wechselstrombeschreibung. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Sinusfunktion, Frequenz, Phasenlage und Verschiebungswinkel; Phasoren/Zeigerbilder und komplexe Widerstände. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: Lehrplan 3.2; 5.3. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Wechselgrössen benötigen Betrag und Phase","bridge":"Spannungen und Ströme können im Wechselstrom zeitlich gegeneinander verschoben sein. Eine Impedanz besitzt deshalb nicht nur einen Betrag, sondern auch Phaseninformation. Bei idealen Spulen steigt der induktive Blindwiderstand mit der Frequenz, bei idealen Kondensatoren sinkt der kapazitive Blindwiderstand. Ergebnisse brauchen eine klare Angabe des Modells.","exercise":"Phasoren in Tabellenkalkulation berechnen; Lasten nur simulieren. Halte zusätzlich die Antwort auf die Frage «Welche Grössen benötigt ein Wechselstromzeiger?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Skizziere qualitativ das Verhalten eines Widerstands, einer idealen Spule und eines idealen Kondensators bei steigender Frequenz.","solution":"Ein Winkel ohne Bezug und Betrag ist keine vollständige Wechselstrombeschreibung. Der Merksatz lautet: Ein Winkel ohne Bezug und Betrag ist keine vollständige Wechselstrombeschreibung. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Welche Grössen benötigt ein Wechselstromzeiger?","options":["Nur die Frequenz des Netzbetreibers","Betrag und Phasenlage","Ausschliesslich den Kabelquerschnitt"],"c":1,"why":"Ein Winkel ohne Bezug und Betrag ist keine vollständige Wechselstrombeschreibung.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Ein Winkel ohne Bezug und Betrag ist keine vollständige Wechselstrombeschreibung."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Ausschliesslich den Kabelquerschnitt","Ein Winkel ohne Bezug und Betrag ist keine vollständige Wechselstrombeschreibung.","Nur die Frequenz des Netzbetreibers"],"c":1,"why":"Der Merksatz lautet: Ein Winkel ohne Bezug und Betrag ist keine vollständige Wechselstrombeschreibung.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Ein Winkel ohne Bezug und Betrag ist keine vollständige Wechselstrombeschreibung."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["3.2.6b–3.2.8b; 5.3.1b–5.3.3b (Vorgriff)","Norm-/Regelwerk: Lehrplan 3.2; 5.3","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Sinusfunktion, Frequenz, Phasenlage und Verschiebungswinkel"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Zeigerbilder und Phasenverschiebung» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Zeigerbilder und Phasenverschiebung» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Phasoren in Tabellenkalkulation berechnen; Lasten nur simulieren. Halte zusätzlich die Antwort auf die Frage «Welche Grössen benötigt ein Wechselstromzeiger?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Skizziere qualitativ das Verhalten eines Widerstands, einer idealen Spule und eines idealen Kondensators bei steigender Frequenz."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Welche Grössen benötigt ein Wechselstromzeiger?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/2.01-A.svg"},{"id":"2.01-B","year":2,"title":"Impedanz und RLC-Schaltungen","goals":["R–L- und R–C-Serien- und Parallelschaltung","Wirk-, Blind- und Scheinleistung, cos φ"],"parts":[{"heading":"Dein Dozent erklärt: Impedanz und RLC-Schaltungen","text":"Heute geht es um impedanz und rlc-schaltungen. In Wechselstromschaltungen übernehmen Widerstand, Induktivität und Kapazität unterschiedliche Rollen. Der ohmsche Widerstand setzt Energie um, während ideale Spule und idealer Kondensator Energie periodisch speichern und zurückgeben. Impedanz Z fasst Betrag und Phasenwirkung zusammen; kapazitive und induktive Blindwiderstände hängen von der Frequenz ab. Erst mit dem passenden Schaltmodell ist die Berechnung sinnvoll. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Berechne den induktiven Blindwiderstand einer idealen Spule mit L = 0,1 Henry bei 50 Hertz: X_L = 2πfL ≈ 31,4 Ohm. Bei Verdoppelung der Frequenz verdoppelt sich dieser Wert. Vergleiche mit einem idealen Kondensator, bei dem der kapazitive Blindwiderstand mit steigender Frequenz abnimmt. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Der Wechselstromwiderstand hängt teilweise von der Frequenz ab. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: R–L- und R–C-Serien- und Parallelschaltung; Wirk-, Blind- und Scheinleistung, cos φ. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: Lehrplan 3.2; 5.3. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Wechselgrössen benötigen Betrag und Phase","bridge":"Spannungen und Ströme können im Wechselstrom zeitlich gegeneinander verschoben sein. Eine Impedanz besitzt deshalb nicht nur einen Betrag, sondern auch Phaseninformation. Bei idealen Spulen steigt der induktive Blindwiderstand mit der Frequenz, bei idealen Kondensatoren sinkt der kapazitive Blindwiderstand. Ergebnisse brauchen eine klare Angabe des Modells.","exercise":"Phasoren in Tabellenkalkulation berechnen; Lasten nur simulieren. Halte zusätzlich die Antwort auf die Frage «Was passiert bei idealem L mit X_L bei doppelter Frequenz?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Skizziere qualitativ das Verhalten eines Widerstands, einer idealen Spule und eines idealen Kondensators bei steigender Frequenz.","solution":"Der Wechselstromwiderstand hängt teilweise von der Frequenz ab. Der Merksatz lautet: Der Wechselstromwiderstand hängt teilweise von der Frequenz ab. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was passiert bei idealem L mit X_L bei doppelter Frequenz?","options":["Er wird null","Er halbiert sich","Er verdoppelt sich"],"c":2,"why":"Der Wechselstromwiderstand hängt teilweise von der Frequenz ab.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Der Wechselstromwiderstand hängt teilweise von der Frequenz ab."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Er wird null","Der Wechselstromwiderstand hängt teilweise von der Frequenz ab.","Er halbiert sich"],"c":1,"why":"Der Merksatz lautet: Der Wechselstromwiderstan tion lautet: Voltampere und Watt dürfen nicht blind gleichgesetzt werden. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Leistungsfaktor und Blindleistungskompensation; Energie und Strom aus Lastdaten berechnen. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: Lehrplan 3.2; 5.3. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Wechselgrössen benötigen Betrag und Phase","bridge":"Spannungen und Ströme können im Wechselstrom zeitlich gegeneinander verschoben sein. Eine Impedanz besitzt deshalb nicht nur einen Betrag, sondern auch Phaseninformation. Bei idealen Spulen steigt der induktive Blindwiderstand mit der Frequenz, bei idealen Kondensatoren sinkt der kapazitive Blindwiderstand. Ergebnisse brauchen eine klare Angabe des Modells.","exercise":"Phasoren in Tabellenkalkulation berechnen; Lasten nur simulieren. Halte zusätzlich die Antwort auf die Frage «Was bezeichnet S = Ueff × Ieff bei einphasiger Last?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Skizziere qualitativ das Verhalten eines Widerstands, einer idealen Spule und eines idealen Kondensators bei steigender Frequenz.","solution":"Voltampere und Watt dürfen nicht blind gleic
