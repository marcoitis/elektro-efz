C","year":2,"title":"RCD-Prüfung, Schleifenimpedanz und Messprotokoll","goals":["Messgeräte, Messgrenzen, Protokollierung","Verantwortung Erstprüfung vs. Schluss-/Abnahmekontrolle"],"parts":[{"heading":"Dein Dozent erklärt: RCD-Prüfung, Schleifenimpedanz und Messprotokoll","text":"Heute geht es um rcd-prüfung, schleifenimpedanz und messprotokoll. Die Prüfung der Abschaltbedingungen umfasst je nach Anlagenkonzept unterschiedliche Verfahren. RCD-Funktion, Schleifenimpedanz, prospektiver Fehlerstrom und Anlagenzustand dürfen nicht isoliert beurteilt werden. Entscheidend ist, ob die Schutzmassnahme nach den anzuwendenden Vorschriften wirksam nachgewiesen wird. Die Prüfwerte sind mit Datum, Messgerät, Messbedingungen und fachlicher Bewertung festzuhalten. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Ordne zu einer fiktiven Prüfliste die Spalten Stromkreis, Prüfmethode, Sollvorgabe aus der Norm, Messergebnis, Beurteilung und Prüfer. Trage absichtlich keine unbestätigten Grenzwerte ein. Diskutiere, warum eine Messzahl ohne Bezug auf die konkrete Schutzvorgabe wenig aussagt. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Ein Messprotokoll braucht die normative Soll-Anforderung. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Messgeräte, Messgrenzen, Protokollierung; Verantwortung Erstprüfung vs. Schluss-/Abnahmekontrolle. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIN Teil 6; NIV Art. 24; ESTI zu Erstprüfungen. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Prüfen ist eine begründete Reihenfolge","bridge":"Eine Erstprüfung verbindet Sichtprüfung, geeignete Messverfahren und dokumentierte Bewertung. Der Prüfende muss wissen, welche Eigenschaft der Anlage untersucht wird und welche Aussage ein bestimmtes Messresultat erlaubt. Für reale Prüfverfahren und Grenzwerte gelten die aktuelle Norm und die erforderliche Qualifikation. Im Selbststudium werden Messberichte interpretiert, nicht Netzprüfungen ausgeführt.","exercise":"Theoretische Messprotokolle auswerten; reale Installationsmessungen nur im beaufsichtigten Ausbildungslabor. Halte zusätzlich die Antwort auf die Frage «Welche Kombination macht einen Messwert beurteilbar?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Entwirf ein Musterprüfprotokoll mit Prüfschritt, Zweck, Messwert, Bewertung und fehlender Grundlage für einen fiktiven Fall.","solution":"Ein Messprotokoll braucht die normative Soll-Anforderung. Der Merksatz lautet: Ein Messprotokoll braucht die normative Soll-Anforderung. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Welche Kombination macht einen Messwert beurteilbar?","options":["Nur die Seriennummer des Gebäudes","Messverfahren, Sollvorgabe und dokumentiertes Ergebnis","Nur eine grüne Markierung"],"c":1,"why":"Ein Messprotokoll braucht die normative Soll-Anforderung.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Ein Messprotokoll braucht die normative Soll-Anforderung."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Nur eine grüne Markierung","Ein Messprotokoll braucht die normative Soll-Anforderung.","Nur die Seriennummer des Gebäudes"],"c":1,"why":"Der Merksatz lautet: Ein Messprotokoll braucht die normative Soll-Anforderung.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Ein Messprotokoll braucht die normative Soll-Anforderung."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["4.3.6b; 5.1.7b (Vorgriff)","Norm-/Regelwerk: NIN Teil 6; NIV Art. 24; ESTI zu Erstprüfungen","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Messgeräte, Messgrenzen, Protokollierung"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: RCD-Prüfung, Schleifenimpedanz und Messprotokoll» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: RCD-Prüfung, Schleifenimpedanz und Messprotokoll» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Theoretische Messprotokolle auswerten; reale Installationsmessungen nur im beaufsichtigten Ausbildungslabor. Halte zusätzlich die Antwort auf die Frage «Welche Kombination macht einen Messwert beurteilbar?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Entwirf ein Musterprüfprotokoll mit Prüfschritt, Zweck, Messwert, Bewertung und fehlender Grundlage für einen fiktiven Fall."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Welche Kombination macht einen Messwert beurteilbar?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/2.11-C.svg"},{"id":"2.12-A","year":2,"title":"Raumbuch und Lastenliste erstellen","goals":["Raumbuch, Anforderungen, Stromkreisstruktur","Leiter-/Schutzkonzept und Normrecherche"],"parts":[{"heading":"Dein Dozent erklärt: Raumbuch und Lastenliste erstellen","text":"Heute geht es um raumbuch und lastenliste erstellen. Ein Planungsprojekt für eine Wohnung beginnt mit Nutzeranforderungen: Räume, Verbraucher, Lichtfunktionen, Kommunikationsbedarf und mögliche spätere Erweiterungen. Das Raumbuch übersetzt diese Anforderungen in systematische Angaben. Erst danach lassen sich Stromkreisgruppen, Standorte und Schnittstellen sinnvoll entwickeln. Eine reine Anordnung von Steckdosensymbolen ist noch kein vollständiges Elektroprojekt. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Plane eine fiktive Dreizimmerwohnung mit Küche, Bad und Wohnbereich. Erstelle ein Raumbuch mit gewünschter Nutzung, Leistungsschätzung, Lichtsteuerung und Netzwerkanforderungen. Trenne sichere Planungsannahmen von normativ zu prüfenden Details. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Ein Raumbuch beschreibt Anforderungen, nicht schon die fertige Installation. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Raumbuch, Anforderungen, Stromkreisstruktur; Leiter-/Schutzkonzept und Normrecherche. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIN Teile 3–7; NIV Art. 24. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Ein Wohnungsdossier durchdenken","bridge":"Eine Elektroplanung beginnt mit Nutzung, Anschlussbedarf und Randbedingungen. Danach werden Stromkreise, Schutzkonzept, Leitungswege und Dokumentation aufeinander abgestimmt. Ein Planungsentwurf ist kein freigegebener Ausführungsplan; dafür sind gültige Regeln und fachkundige Prüfung notwendig.","exercise":"Planungsprojekt ohne reale Umsetzung; Simulation von Schaltungen als Zusatz. Halte zusätzlich die Antwort auf die Frage «Was ist ein geeignetes erstes Projektdokument?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erstelle zu einer fiktiven Wohnung ein Raumbuch, Lastenliste und eine Liste der offenen Dimensionierungsangaben.","solution":"Ein Raumbuch beschreibt Anforderungen, nicht schon die fertige Installation. Der Merksatz lautet: Ein Raumbuch beschreibt Anforderungen, nicht schon die fertige Installation. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was ist ein geeignetes erstes Projektdokument?","options":["Raumbuch mit Nutzungsanforderungen","Nur eine Einkaufsliste","Ein unkommentierter Verteilerplan"],"c":0,"why":"Ein Raumbuch beschreibt Anforderungen, nicht schon die fertige Installation.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Ein Raumbuch beschreibt Anforderungen, nicht schon die fertige Installation."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Nur eine Einkaufsliste","Ein Raumbuch beschreibt Anforderungen, nicht schon die fertige Installation.","Ein unkommentierter Verteilerplan"],"c":1,"why":"Der Merksatz lautet: Ein Raumbuch beschreibt Anforderungen, nicht schon die fertige Installation.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Ein Raumbuch beschreibt Anforderungen, nicht schon die fertige Installation."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["3/4/5 (integrierte Leistungskontrolle)","Norm-/Regelwerk: NIN Teile 3–7; NIV Art. 24","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Raumbuch, Anforderungen, Stromkreisstruktur"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Raumbuch und Lastenliste erstellen» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Raumbuch und Lastenliste erstellen» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Planungsprojekt ohne reale Umsetzung; Simulation von Schaltungen als Zusatz. Halte zusätzlich die Antwort auf die Frage «Was ist ein geeignetes erstes Projektdokument?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erstelle zu einer fiktiven Wohnung ein Raumbuch, Lastenliste und eine Liste der offenen Dimensionierungsangaben."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Was ist ein geeignetes erstes Projektdokument?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/2.12-A.svg"},{"id":"2.12-B","year":2,"title":"Schutz- und Leitungsentwurf im Planungsfall","goals":["Licht-, Steckdosen- und Verbraucherkreise","Schaltpläne, Dimensionierung und Materialkalkulation"],"parts":[{"heading":"Dein Dozent erklärt: Schutz- und Leitungsentwurf im Planungsfall","text":"Heute geht es um schutz- und leitungsentwurf im planungsfall. Leitungsentwurf berücksichtigt Verbraucher, Leitungslängen, Belastbarkeit, Schutzorgane, Umgebungsbedingungen und die vorgesehenen Netzsysteme. Die NIN liefert dafür technische Regeln; ohne Originalnorm können keine verbindlichen Grenzwerte freigegeben werden. Ein Planungsfall für Lernende soll gerade zeigen, welche Annahmen noch offen sind und wie diese dokumentiert werden. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Erstelle für drei hypothetische Stromkreise eine Tabelle mit Leistung, angenommenem Betriebsstrom, Trassenlänge, Verlegeart und offenem Normnachweis. Markiere bewusst die Punkte, an denen die vollständige NIN und eine qualifizierte Fachperson erforderlich sind. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Ein Entwurf ist noch kein geprüfter Ausführungsplan. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Licht-, Steckdosen- und Verbraucherkreise; Schaltpläne, Dimensionierung und Materialkalkulation. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIN Teile 3–7; NIV Art. 24. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Ein Wohnungsdossier durchdenken","bridge":"Eine Elektroplanung beginnt mit Nutzung, Anschlussbedarf und Randbedingungen. Danach werden Stromkreise, Schutzkonzept, Leitungswege und Dokumentation aufeinander abgestimmt. Ein Planungsentwurf ist kein freigegebener Ausführungsplan; dafür sind gültige Regeln und fachkundige Prüfung notwendig.","exercise":"Planungsprojekt ohne reale Umsetzung; Simulation von Schaltungen als Zusatz. Halte zusätzlich die Antwort auf die Frage «Was muss bei einer Leitungsauswahl neben dem Betriebsstrom bekannt sein?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erstelle zu einer fiktiven Wohnung ein Raumbuch, Lastenliste und eine Liste der offenen Dimensionierungsangaben.","solution":"Ein Entwurf ist noch kein geprüfter Ausführungsplan. Der Merksatz lautet: Ein Entwurf ist noch kein geprüfter Ausführungsplan. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was muss bei einer Leitungsauswahl neben dem Betriebsstrom bekannt sein?","options":["Nur der Raumname","Verlegeart und Schutzbedingungen","Nur der Hersteller des Schalters"],"c":1,"why":"Ein Entwurf ist noch kein geprüfter Ausführungsplan.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Ein Entwurf ist noch kein geprüfter Ausführungsplan."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Nur der Hersteller des Schalters","Ein Entwurf ist noch kein geprüfter Ausführungsplan.","Nur der Raumname"],"c":1,"why":"Der Merksatz lautet: Ein Entwurf ist noch kein geprüfter Ausführungsplan.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Ein Entwurf ist noch kein geprüfter Ausführungsplan."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["3/4/5 (integrierte Leistungskontrolle)","Norm-/Regelwerk: NIN Teile 3–7; NIV Art. 24","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Licht-, Steckdosen- und Verbraucherkreise"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Schutz- und Leitungsentwurf im Planungsfall» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Schutz- und Leitungsentwurf im Planungsfall» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Planungsprojekt ohne reale Umsetzung; Simulation von Schaltungen als Zusatz. Halte zusätzlich die Antwort auf die Frage «Was muss bei einer Leitungsauswahl neben dem Betriebsstrom bekannt sein?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erstelle zu einer fiktiven Wohnung ein Raumbuch, Lastenliste und eine Liste der offenen Dimensionierungsangaben."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Was muss bei einer Leitungsauswahl neben dem Betriebsstrom bekannt sein?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/2.12-B.svg"},{"id":"2.12-C","year":2,"title":"Dokumentation, Fehlerreview und Jahresprüfung","goals":["Mess-/Kontrollplan sowie Sicherheitsdokumente","Mündliches Fachgespräch und Abschlussprüfung 90 Minuten"],"parts":[{"heading":"Dein Dozent erklärt: Dokumentation, Fehlerreview und Jahresprüfung","text":"Heute geht es um dokumentation, fehlerreview und jahresprüfung. Ein fertiges Projekt umfasst Pläne, Tabellen, Revisionsstände, Materialplanung und ein prüfbares Schutzkonzept. Die Lernkontrolle des zweiten Jahres verbindet Wechselstrom, Drehstrom, Schutzmassnahmen, Beleuchtung und Kommunikation. Die Qualität zeigt sich darin, dass Du offene Annahmen begründen und Korrekturen sauber dokumentieren kannst. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Führe für die fiktive Wohnung einen Planungsreview durch. Lasse drei künstliche Fehler einbauen: ein vergessenes Gerät, eine widersprüchliche Stromkreisbezeichnung und eine fehlende Schutzkonzeptangabe. Erstelle eine korrigierte Revision sowie fünf Fachfragen, die Du ohne Unterlagen beantwortest. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Eine dokumentierte Korrektur ist Teil professioneller Qualität. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Mess-/Kontrollplan sowie Sicherheitsdokumente; Mündliches Fachgespräch und Abschlussprüfung 90 Minuten. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIN Teile 3–7; NIV Art. 24. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Ein Wohnungsdossier durchdenken","bridge":"Eine Elektroplanung beginnt mit Nutzung, Anschlussbedarf und Randbedingungen. Danach werden Stromkreise, Schutzkonzept, Leitungswege und Dokumentation aufeinander abgestimmt. Ein Planungsentwurf ist kein freigegebener Ausführungsplan; dafür sind gültige Regeln und fachkundige Prüfung notwendig.","exercise":"Planungsprojekt ohne reale Umsetzung; Simulation von Schaltungen als Zusatz. Halte zusätzlich die Antwort auf die Frage «Was ist ein nützlicher Abschluss eines Planungsprojekts?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erstelle zu einer fiktiven Wohnung ein Raumbuch, Lastenliste und eine Liste der offenen Dimensionierungsangaben.","solution":"Eine dokumentierte Korrektur ist Teil professioneller Qualität. Der Merksatz lautet: Eine dokumentierte Korrektur ist Teil professioneller Qualität. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was ist ein nützlicher Abschluss eines Planungsprojekts?","options":["Löschen aller älteren Revisionen","Ungenehmigte Ausführung","Dokumentations- und Fehlerreview"],"c":2,"why":"Eine dokumentierte Korrektur ist Teil professioneller Qualität.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Eine dokumentierte Korrektur ist Teil professioneller Qualität."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Löschen aller älteren Revisionen","Eine dokumentierte Korrektur ist Teil professioneller Qualität.","Ungenehmigte Ausführung"],"c":1,"why":"Der Merksatz lautet: Eine dokumentierte Korrektur ist Teil professioneller Qualität.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Eine dokumentierte Korrektur ist Teil professioneller Qualität."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["3/4/5 (integrierte Leistungskontrolle)","Norm-/Regelwerk: NIN Teile 3–7; NIV Art. 24","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Mess-/Kontrollplan sowie Sicherheitsdokumente"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Dokumentation, Fehlerreview und Jahresprüfung» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Dokumentation, Fehlerreview und Jahresprüfung» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Planungsprojekt ohne reale Umsetzung; Simulation von Schaltungen als Zusatz. Halte zusätzlich die Antwort auf die Frage «Was ist ein nützlicher Abschluss eines Planungsprojekts?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erstelle zu einer fiktiven Wohnung ein Raumbuch, Lastenliste und eine Liste der offenen Dimensionierungsangaben."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Was ist ein nützlicher Abschluss eines Planungsprojekts?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/2.12-C.svg"},{"id":"3.01-A","year":3,"title":"Rohbau-, Hohlwand- und Aufputzinstallation","goals":["Rohbauinstallation, Hohlwand, Aufputz und Unterputz","Steigzonen, Leitungswege, Durchführungen, Brandschott"],"parts":[{"heading":"Dein Dozent erklärt: Rohbau-, Hohlwand- und Aufputzinstallation","text":"Heute geht es um rohbau-, hohlwand- und aufputzinstallation. Installationsmethoden unterscheiden sich nach Bauphase, Untergrund, Sichtbarkeit, mechanischer Beanspruchung und späterer Zugänglichkeit. Unterputzinstallation erfordert Abstimmung mit dem Bauablauf, Hohlwände besondere Befestigungen und Aufputzsysteme sorgfältige Oberflächen- und Trassenführung. Rohrsystem, Leitung und Anschlussräume bilden eine Einheit. Bei tragenden Bauteilen und Brandschutzfragen sind Fachplanung und Freigaben erforderlich. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Vergleiche auf einem fiktiven Grundriss drei Wandaufbauten. Kennzeichne jeweils Installationszone, geeignete Befestigungsart und potenzielle Konflikte mit anderen Gewerken. Berücksichtige Zugänglichkeit für spätere Prüfungen. Die Übung bleibt reine Planung ohne Öffnen von Wand- oder Elektroinstallationen. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Die Verlegeart bestimmt nicht nur das Aussehen, sondern die Schutz- und Wärmebedingungen. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Rohbauinstallation, Hohlwand, Aufputz und Unterputz; Steigzonen, Leitungswege, Durchführungen, Brandschott. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIN Teil 5; Normenreihe SN EN IEC 61439 (Schaltgerätekombinationen). Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Installationssysteme und Verteiler als Gesamtsystem","bridge":"Unterputz-, Aufputz- und Hohlwandinstallationen unterscheiden sich in Zugänglichkeit, mechanischer Beanspruchung und Umgebungsbedingungen. Ein Verteiler ist keine beliebige Sammlung von Einzelgeräten, sondern Teil einer abgestimmten Schaltgerätekombination. Bei Planung und Bewertung müssen Kennwerte der Gesamtkombination und Herstellerangaben zusammengeführt werden.","exercise":"Schematische Verteilerplanung; mechanischer Aufbau eines stromlosen Schulungsmodells nur fachlich beaufsichtigt. Halte zusätzlich die Antwort auf die Frage «Was unterscheidet eine Hohlwandinstallation besonders?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Skizziere schematisch einen Leitungsweg von einer Verteilung zu drei Räumen und notiere mechanische und brandschutztechnische Prüfpunkte.","solution":"Die Verlegeart bestimmt nicht nur das Aussehen, sondern die Schutz- und Wärmebedingungen. Der Merksatz lautet: Die Verlegeart bestimmt nicht nur das Aussehen, sondern die Schutz- und Wärmebedingungen. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was unterscheidet eine Hohlwandinstallation besonders?","options":["Die grundsätzlich fehlende Dokumentationspflicht","Nur die Farbe des Schalters","Der Wandaufbau und passende Befestigungsmittel"],"c":2,"why":"Die Verlegeart bestimmt nicht nur das Aussehen, sondern die Schutz- und Wärmebedingungen.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Die Verlegeart bestimmt nicht nur das Aussehen, sondern die Schutz- und Wärmebedingungen."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Die grundsätzlich fehlende Dokumentationspflicht","Die Verlegeart bestimmt nicht nur das Aussehen, sondern die Schutz- und Wärmebedingungen.","Nur die Farbe des Schalters"],"c":1,"why":"Der Merksatz lautet: Die Verlegeart bestimmt nicht nur das Aussehen, sondern die Schutz- und Wärmebedingungen.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Die Verlegeart bestimmt nicht nur das Aussehen, sondern die Schutz- und Wärmebedingungen."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["5.1.1a–5.1.5b; 2.3.1a–2.3.7a","Norm-/Regelwerk: NIN Teil 5; Normenreihe SN EN IEC 61439 (Schaltgerätekombinationen)","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Rohbauinstallation, Hohlwand, Aufputz und Unterputz"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Rohbau-, Hohlwand- und Aufputzinstallation» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Rohbau-, Hohlwand- und Aufputzinstallation» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Schematische Verteilerplanung; mechanischer Aufbau eines stromlosen Schulungsmodells nur fachlich beaufsichtigt. Halte zusätzlich die Antwort auf die Frage «Was unterscheidet eine Hohlwandinstallation besonders?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Skizziere schematisch einen Leitungsweg von einer Verteilung zu drei Räumen und notiere mechanische und brandschutztechnische Prüfpunkte."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Was unterscheidet eine Hohlwandinstallation besonders?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/3.01-A.svg"},{"id":"3.01-B","year":3,"title":"Leitungstrassen, Schacht und Brandabschnitt","goals":["Schaltgerätekombinationen, Feldaufteilung und Beschriftung","PE/N-Trennung, Potentialausgleich, Erderkonzept"],"parts":[{"heading":"Dein Dozent erklärt: Leitungstrassen, Schacht und Brandabschnitt","text":"Heute geht es um leitungstrassen, schacht und brandabschnitt. In Steigzonen treffen Elektrotechnik, Gebäudestruktur, Brandschutz, Wartung und andere Medien aufeinander. Die Trassenführung muss räumlich funktionieren und thermische sowie mechanische Anforderungen erfüllen. Bei Durchführungen durch Brandabschnitte sind zugelassene Systeme und die Brandschutzplanung verbindlich. Auch ein nachträglich hinzugefügtes Datenkabel kann die Funktion einer bestehenden Abschottung beeinflussen. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Plane für ein fiktives dreigeschossiges Gebäude eine Steigzone mit Energie- und Datenleitungen. Stelle eine Konfliktliste für Tragwerk, Wasserleitungen, Zugänglichkeit, Brandabschottungen und Erweiterungsreserven auf. Eine konkrete Leitungsführung wird erst nach Fachprüfung freigegeben. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Ein Trassensystem ist Teil der Gebäudesicherheit. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Schaltgerätekombinationen, Feldaufteilung und Beschriftung; PE/N-Trennung, Potentialausgleich, Erderkonzept. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIN Teil 5; Normenreihe SN EN IEC 61439 (Schaltgerätekombinationen). Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Installationssysteme und Verteiler als Gesamtsystem","bridge":"Unterputz-, Aufputz- und Hohlwandinstallationen unterscheiden sich in Zugänglichkeit, mechanischer Beanspruchung und Umgebungsbedingungen. Ein Verteiler ist keine beliebige Sammlung von Einzelgeräten, sondern Teil einer abgestimmten Schaltgerätekombination. Bei Planung und Bewertung müssen Kennwerte der Gesamtkombination und Herstellerangaben zusammengeführt werden.","exercise":"Schematische Verteilerplanung; mechanischer Aufbau eines stromlosen Schulungsmodells nur fachlich beaufsichtigt. Halte zusätzlich die Antwort auf die Frage «Was muss bei einer Durchdringung eines Brandabschnitts berücksichtigt werden?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Skizziere schematisch einen Leitungsweg von einer Verteilung zu drei Räumen und notiere mechanische und brandschutztechnische Prüfpunkte.","solution":"Ein Trassensystem ist Teil der Gebäudesicherheit. Der Merksatz lautet: Ein Trassensystem ist Teil der Gebäudesicherheit. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was muss bei einer Durchdringung eines Brandabschnitts berücksichtigt werden?","options":["Ein freigegebenes Abschottungssystem","Nur der Kabeldurchmesser","Beliebiges Füllmaterial"],"c":0,"why":"Ein Trassensystem ist Teil der Gebäudesicherheit.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Ein Trassensystem ist Teil der Gebäudesicherheit."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Nur der Kabeldurchmesser","Ein Trassensystem ist Teil der Gebäudesicherheit.","Beliebiges Füllmaterial"],"c":1,"why":"Der Merksatz lautet: Ein Trassensystem ist Teil der Gebäudesicherheit.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Ein Trassensystem ist Teil der Gebäudesicherheit."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["5.1.1a–5.1.5b; 2.3.1a–2.3.7a","Norm-/Regelwerk: NIN Teil 5; Normenreihe SN EN IEC 61439 (Schaltgerätekombinationen)","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Schaltgerätekombinationen, Feldaufteilung und Beschriftung"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Leitungstrassen, Schacht und Brandabschnitt» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Leitungstrassen, Schacht und Brandabschnitt» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Schematische Verteilerplanung; mechanischer Aufbau eines stromlosen Schulungsmodells nur fachlich beaufsichtigt. Halte zusätzlich die Antwort auf die Frage «Was muss bei einer Durchdringung eines Brandabschnitts berücksichtigt werden?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Skizziere schematisch einen Leitungsweg von einer Verteilung zu drei Räumen und notiere mechanische und brandschutztechnische Prüfpunkte."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Was muss bei einer Durchdringung eines Brandabschnitts berücksichtigt werden?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/3.01-B.svg"},{"id":"3.01-C","year":3,"title":"Schaltgerätekombinationen und Verteilerplanung","goals":["Baustellenorganisation und Freigabepunkte","Umweltbedingungen und mechanischer Schutz"],"parts":[{"heading":"Dein Dozent erklärt: Schaltgerätekombinationen und Verteilerplanung","text":"Heute geht es um schaltgerätekombinationen und verteilerplanung. Ein elektrischer Verteiler enthält nicht einfach beliebige Einzelapparate. Die Kombination aus Gehäuse, Einbaugeräten, Verdrahtung, Wärme, Schutzleiterkonzept und Herstellergrenzen muss nach den anwendbaren Regeln für Schaltgerätekombinationen beurteilt werden. Die SN EN IEC 61439 ist eine relevante Normenreihe. Für einen Selbstlerner sind Schemaanalyse und Lastplanung möglich, während eine reale Netzverteilung nur durch entsprechend berechtigte Fachpersonen bearbeitet werden darf. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Erstelle ein Blockschema eines fiktiven Wohnungsverteilers mit Einspeisung, Schutzorganen und drei Verbrauchergruppen. Markiere die Stellen, für die Herstellerangaben, Kurzschlussfestigkeit, Temperatur und Schutzkonzept benötigt werden. Verwende keine selbstgebauten 230/400-Volt-Verteiler als Übungsobjekt. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Ein Verteiler ist ein nachweispflichtiges Gesamtsystem. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Baustellenorganisation und Freigabepunkte; Umweltbedingungen und mechanischer Schutz. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIN Teil 5; Normenreihe SN EN IEC 61439 (Schaltgerätekombinationen). Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Installationssysteme und Verteiler als Gesamtsystem","bridge":"Unterputz-, Aufputz- und Hohlwandinstallationen unterscheiden sich in Zugänglichkeit, mechanischer Beanspruchung und Umgebungsbedingungen. Ein Verteiler ist keine beliebige Sammlung von Einzelgeräten, sondern Teil einer abgestimmten Schaltgerätekombination. Bei Planung und Bewertung müssen Kennwerte der Gesamtkombination und Herstellerangaben zusammengeführt werden.","exercise":"Schematische Verteilerplanung; mechanischer Aufbau eines stromlosen Schulungsmodells nur fachlich beaufsichtigt. Halte zusätzlich die Antwort auf die Frage «Welche Normenreihe betrifft Schaltgerätekombinationen besonders?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Skizziere schematisch einen Leitungsweg von einer Verteilung zu drei Räumen und notiere mechanische und brandschutztechnische Prüfpunkte.","solution":"Ein Verteiler ist ein nachweispflichtiges Gesamtsystem. Der Merksatz lautet: Ein Verteiler ist ein nachweispflichtiges Gesamtsystem. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Welche Normenreihe betrifft Schaltgerätekombinationen besonders?","options":["ISO 9001 allein","SN EN IEC 61439","Nur der Farbkatalog"],"c":1,"why":"Ein Verteiler ist ein nachweispflichtiges Gesamtsystem.\n\nBezug zum Unterrichtsteil «Dein Dozent erklärt: Schaltgerätekombinationen und Verteilerplanung»: Die SN EN IEC 61439 ist eine relevante Normenreihe."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Nur der Farbkatalog","Ein Verteiler ist ein nachweispflichtiges Gesamtsystem.","ISO 9001 allein"],"c":1,"why":"Der Merksatz lautet: Ein Verteiler ist ein nachweispflichtiges Gesamtsystem.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Ein Verteiler ist ein nachweispflichtiges Gesamtsystem."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["5.1.1a–5.1.5b; 2.3.1a–2.3.7a","Norm-/Regelwerk: NIN Teil 5; Normenreihe SN EN IEC 61439 (Schaltgerätekombinationen)","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Baustellenorganisation und Freigabepunkte"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Schaltgerätekombinationen und Verteilerplanung» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Schaltgerätekombinationen und Verteilerplanung» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Schematische Verteilerplanung; mechanischer Aufbau eines stromlosen Schulungsmodells nur fachlich beaufsichtigt. Halte zusätzlich die Antwort auf die Frage «Welche Normenreihe betrifft Schaltgerätekombinationen besonders?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Skizziere schematisch einen Leitungsweg von einer Verteilung zu drei Räumen und notiere mechanische und brandschutztechnische Prüfpunkte."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Welche Normenreihe betrifft Schaltgerätekombinationen besonders?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/3.01-C.svg"},{"id":"3.02-A","year":3,"title":"Leitungsschutz, RCD und Gerätefunktionen","goals":["Sicherungen, Leitungsschutzschalter, Geräteschutz","RCD-Typen, Überspannungsschutz SPD, AFDD als Überblick"],"parts":[{"heading":"Dein Dozent erklärt: Leitungsschutz, RCD und Gerätefunktionen","text":"Heute geht es um leitungsschutz, rcd und gerätefunktionen. Schutzgeräte haben unterschiedliche Aufgaben. Ein Leitungsschutzschalter soll beispielsweise Leitungen vor unzulässigen Überströmen schützen; ein RCD bewertet Differenzströme. Beide können in kombinierten Geräten zusammengeführt werden, müssen aber weiterhin passend ausgewählt und geprüft werden. Kennlinien, Bemessungsdaten und Bauart sind unter realen Randbedingungen zu beurteilen. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Vergleiche anhand von Datenblättern einen Leitungsschutzschalter, einen RCD und einen FI/LS. Erstelle eine Tabelle mit Schutzziel, relevantem Auslöseprinzip und typischen Einsatzfragen. Ergänze ausdrücklich, welche Schutzfunktionen das jeweilige Gerät nicht übernimmt. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Gleiche Bauform bedeutet nicht gleiche Schutzfunktion. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Sicherungen, Leitungsschutzschalter, Geräteschutz; RCD-Typen, Überspannungsschutz SPD, AFDD als Überblick. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIN Teil 4/5; SN EN 61439-Serie. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Schutzgerätekoordination als Systemfrage","bridge":"Ein Leitungsschutzschalter begrenzt nicht automatisch jede beliebige Fehlerenergie, und ein RCD erfüllt eine andere Schutzfunktion. Selektivität betrachtet, ob bei Fehlern möglichst nur das betroffene Schutzorgan anspricht. Dafür braucht es passende Kennlinien, Kurzschlussdaten und die konkreten Gerätekombinationen; die Nennstromangabe allein reicht nicht.","exercise":"24-V-DC-Steuerungsdemo auf vorbereitetem Board; keine realen Verteilereingriffe. Halte zusätzlich die Antwort auf die Frage «Was erfasst ein klassischer RCD vorrangig?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Vergleiche zwei abstrakte Zeit-Strom-Kennlinien qualitativ. Welche zusätzlichen Herstellerdaten wären für eine Selektivitätsaussage nötig?","solution":"Gleiche Bauform bedeutet nicht gleiche Schutzfunktion. Der Merksatz lautet: Gleiche Bauform bedeutet nicht gleiche Schutzfunktion. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was erfasst ein klassischer RCD vorrangig?","options":["Differenzstrom","Die Raumtemperatur","Jeden Überlastfall wie ein Leitungsschutzschalter"],"c":0,"why":"Gleiche Bauform bedeutet nicht gleiche Schutzfunktion.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Gleiche Bauform bedeutet nicht gleiche Schutzfunktion."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Die Raumtemperatur","Gleiche Bauform bedeutet nicht gleiche Schutzfunktion.","Jeden Überlastfall wie ein Leitungsschutzschalter"],"c":1,"why":"Der Merksatz lautet: Gleiche Bauform bedeutet nicht gleiche Schutzfunktion.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Gleiche Bauform bedeutet nicht gleiche Schutzfunktion."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehen men","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/3.02-A.svg"},{"id":"3.02-B","year":3,"title":"Überspannungsschutz und Schutzgerätekoordination","goals":["Schütze, Relais, Zeitrelais, Schaltuhren","Mess-/Steuerstromkreise, Klemmen, Reihenklemmen"],"parts":[{"heading":"Dein Dozent erklärt: Überspannungsschutz und Schutzgerätekoordination","text":"Heute geht es um überspannungsschutz und schutzgerätekoordination. Überspannungen können aus Blitzbeeinflussungen und Schaltvorgängen entstehen. Ein Überspannungsschutzgerät begrenzt unter definierten Bedingungen transiente Überspannungen, ersetzt aber weder Blitzschutzplanung noch Überstrom- und Fehlerschutz. Auswahl, Einbauort, Anschlussführung und Koordination mehrerer Stufen müssen gemeinsam betrachtet werden. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Zeichne ein Konzept mit Gebäudeanschluss, Unterverteilung und empfindlicher Elektronik. Kennzeichne, wo Schutzgeräte konzeptionell vorgesehen sein könnten und welche Informationen zur Blitzschutzsituation und Netzform fehlen. Die genauen NIN-Anforderungen werden erst anhand der Originalnorm entschieden. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Überspannungsschutz wirkt nur im passenden Gesamtkonzept. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Schütze, Relais, Zeitrelais, Schaltuhren; Mess-/Steuerstromkreise, Klemmen, Reihenklemmen. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIN Teil 4/5; SN EN 61439-Serie. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Schutzgerätekoordination als Systemfrage","bridge":"Ein Leitungsschutzschalter begrenzt nicht automatisch jede beliebige Fehlerenergie, und ein RCD erfüllt eine andere Schutzfunktion. Selektivität betrachtet, ob bei Fehlern möglichst nur das betroffene Schutzorgan anspricht. Dafür braucht es passende Kennlinien, Kurzschlussdaten und die konkreten Gerätekombinationen; die Nennstromangabe allein reicht nicht.","exercise":"24-V-DC-Steuerungsdemo auf vorbereitetem Board; keine realen Verteilereingriffe. Halte zusätzlich die Antwort auf die Frage «Welche Aussage zu einem SPD ist richtig?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Vergleiche zwei abstrakte Zeit-Strom-Kennlinien qualitativ. Welche zusätzlichen Herstellerdaten wären für eine Selektivitätsaussage nötig?","solution":"Überspannungsschutz wirkt nur im passenden Gesamtkonzept. Der Merksatz lautet: Überspannungsschutz wirkt nur im passenden Gesamtkonzept. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Welche Aussage zu einem SPD ist richtig?","options":["Er ersetzt grundsätzlich den Schutzleiter","Er begrenzt bestimmte transiente Überspannungen","Er erzeugt eine zweite Einspeisung"],"c":1,"why":"Überspannungsschutz wirkt nur im passenden Gesamtkonzept.\n\nBezug zum Unterrichtsteil «Dein Dozent erklärt: Überspannungsschutz und Schutzgerätekoordination»: Ein Überspannungsschutzgerät begrenzt unter definierten Bedingungen transiente Überspannungen, ersetzt aber weder Blitzschutzplanung noch Überstrom- und Fehlerschutz."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Er erzeugt eine zweite Einspeisung","Überspannungsschutz wirkt nur im passenden Gesamtkonzept.","Er ersetzt grundsätzlich den Schutzleiter"],"c":1,"why":"Der Merksatz lautet: Überspannungsschutz wirkt nur im passenden Gesamtkonzept.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Überspannungsschutz wirkt nur im passenden Gesamtkonzept."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["5.1.4b; 5.1.5b; 5.4.1b–5.4.2b","Norm-/Regelwerk: NIN Teil 4/5; SN EN 61439-Serie","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Schütze, Relais, Zeitrelais, Schaltuhren"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Überspannungsschutz und Schutzgerätekoordination» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Überspannungsschutz und Schutzgerätekoordination» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"24-V-DC-Steuerungsdemo auf vorbereitetem Board; keine realen Verteilereingriffe. Halte zusätzlich die Antwort auf die Frage «Welche Aussage zu einem SPD ist richtig?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Vergleiche zwei abstrakte Zeit-Strom-Kennlinien qualitativ. Welche zusätzlichen Herstellerdaten wären für eine Selektivitätsaussage nötig?"},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Welche Aussage zu einem SPD ist richtig?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/3.02-B.svg"},{"id":"3.02-C","year":3,"title":"Schutzgeräteauswahl und thermische Betrachtung","goals":["Typenschild, Herstelleranleitung, Erwärmung","Verdrahtungsfehler im Schaltplan erkennen"],"parts":[{"heading":"Dein Dozent erklärt: Schutzgeräteauswahl und thermische Betrachtung","text":"Heute geht es um schutzgeräteauswahl und thermische betrachtung. In einem Verteiler können sich Wärmeverluste verschiedener Betriebsmittel addieren. Die verfügbare Einbaulage, Belüftung, Leitungseinführung und die vom Hersteller vorgesehene Bemessung beeinflussen die Planung. Bei hohen Fehlerströmen muss die Kombination ausreichend widerstandsfähig sein. Aus einem aufgedruckten Amperewert allein folgt keine Freigabe für jede Einbausituation. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Vergleiche zwei fiktive Verteilervarianten mit unterschiedlicher Anzahl Verlustleistung erzeugender Geräte. Rechne die angenommenen Verlustleistungen zusammen und nenne die zusätzlichen Hersteller- und Normdaten für eine fachgerechte Erwärmungsbewertung. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Die Betriebsmittel müssen als gemeinsam betriebenes System bewertet werden. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Typenschild, Herstelleranleitung, Erwärmung; Verdrahtungsfehler im Schaltplan erkennen. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIN Teil 4/5; SN EN 61439-Serie. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Schutzgerätekoordination als Systemfrage","bridge":"Ein Leitungsschutzschalter begrenzt nicht automatisch jede beliebige Fehlerenergie, und ein RCD erfüllt eine andere Schutzfunktion. Selektivität betrachtet, ob bei Fehlern möglichst nur das betroffene Schutzorgan anspricht. Dafür braucht es passende Kennlinien, Kurzschlussdaten und die konkreten Gerätekombinationen; die Nennstromangabe allein reicht nicht.","exercise":"24-V-DC-Steuerungsdemo auf vorbereitetem Board; keine realen Verteilereingriffe. Halte zusätzlich die Antwort auf die Frage «Was ist bei einer Verteilerplanung neben Nennströmen relevant?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Vergleiche zwei abstrakte Zeit-Strom-Kennlinien qualitativ. Welche zusätzlichen Herstellerdaten wären für eine Selektivitätsaussage nötig?","solution":"Die Betriebsmittel müssen als gemeinsam betriebenes System bewertet werden. Der Merksatz lautet: Die Betriebsmittel müssen als gemeinsam betriebenes System bewertet werden. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was ist bei einer Verteilerplanung neben Nennströmen relevant?","options":["Nur die Etikettenfarbe","Nur die Frontabdeckung","Wärmeabfuhr und Kurzschlussfestigkeit"],"c":2,"why":"Die Betriebsmittel müssen als gemeinsam betriebenes System bewertet werden.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Die Betriebsmittel müssen als gemeinsam betriebenes System bewertet werden."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Nur die Etikettenfarbe","Die Betriebsmittel müssen als gemeinsam betriebenes System bewertet werden.","Nur die Frontabdeckung"],"c":1,"why":"Der Merksatz lautet: Die Betriebsmittel müssen als gemeinsam betriebenes System bewertet werden.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Die Betriebsmittel müssen als gemeinsam betriebenes System bewertet werden."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["5.1.4b; 5.1.5b; 5.4.1b–5.4.2b","Norm-/Regelwerk: NIN Teil 4/5; SN EN 61439-Serie","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Typenschild, Herstelleranleitung, Erwärmung"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Schutzgeräteauswahl und thermische Betrachtung» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Schutzgeräteauswahl und thermische Betrachtung» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"24-V-DC-Steuerungsdemo auf vorbereitetem Board; keine realen Verteilereingriffe. Halte zusätzlich die Antwort auf die Frage «Was ist bei einer Verteilerplanung neben Nennströmen relevant?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Vergleiche zwei abstrakte Zeit-Strom-Kennlinien qualitativ. Welche zusätzlichen Herstellerdaten wären für eine Selektivitätsaussage nötig?"},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Was ist bei einer Verteilerplanung neben Nennströmen relevant?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/3.02-C.svg"},{"id":"3.03-A","year":3,"title":"Erstprüfung als geplanter Prozess","goals":["Messreihenfolge und Dokumentationspflicht bei Erstprüfung","Durchgängigkeit Schutzleiter, Isolation, RCD, Schleifenimpedanz"],"parts":[{"heading":"Dein Dozent erklärt: Erstprüfung als geplanter Prozess","text":"Heute geht es um erstprüfung als geplanter prozess. Die Erstprüfung einer Niederspannungsinstallation umfasst nicht nur die abschliessende Messung. Sie begleitet die Errichtung und verlangt eine Kombination aus Besichtigen, Erproben und Messen. Die Reihenfolge muss zur konkreten Anlage passen und Gefährdungen durch Prüfverfahren berücksichtigen. Fachkundigkeit, Verantwortlichkeiten und Dokumentation sind eigenständige Voraussetzungen. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Erstelle für eine vollständig fiktive Neuinstallation einen Prüfablauf mit Spalten: Arbeitsschritt, Prüfziel, notwendige Freigaben, Gerätetyp, Normstelle, Dokumentation. Kennzeichne Prüfungen, die nur durch eine befähigte und berechtigte Person an einer geeigneten Trainingsanlage durchgeführt werden dürfen. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Ein Messgerät alleine stellt weder Fachkunde noch Prüfbefugnis her. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Messreihenfolge und Dokumentationspflicht bei Erstprüfung; Durchgängigkeit Schutzleiter, Isolation, RCD, Schleifenimpedanz. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIV Art. 24; NIN Teil 6. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Ein Messergebnis ist noch kein Prüfentscheid","bridge":"Für die Erstprüfung müssen Verfahren, Messbedingungen, Geräteangaben und Ergebnisse zusammen dokumentiert werden. Messunsicherheit, ungeeignete Messpunkte und fehlende Vorprüfungen können die Beurteilung verfälschen. Die Freigabe einer Installation folgt nicht aus einem einzigen grünen Messwert.","exercise":"Messungen an normgerechter Schulungsanlage ausschliesslich unter unmittelbarer Aufsicht autorisierter Fachperson. Halte zusätzlich die Antwort auf die Frage «Welche drei Elemente kennzeichnen eine fachliche Erstprüfung?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Bewerte eine fiktive Liste unvollständiger Prüfdaten: Welche Angaben fehlen, bevor eine Fachperson überhaupt entscheiden kann?","solution":"Ein Messgerät alleine stellt weder Fachkunde noch Prüfbefugnis her. Der Merksatz lautet: Ein Messgerät alleine stellt weder Fachkunde noch Prüfbefugnis her. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Welche drei Elemente kennzeichnen eine fachliche Erstprüfung?","options":["Nur Einschalten und Ablesen","Besichtigen, Erproben und Messen","Nur eine Materialliste"],"c":1,"why":"Ein Messgerät alleine stellt weder Fachkunde noch Prüfbefugnis her.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Ein Messgerät alleine stellt weder Fachkunde noch Prüfbefugnis her."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Nur eine Materialliste","Ein Messgerät alleine stellt weder Fachkunde noch Prüfbefugnis her.","Nur Einschalten und Ablesen"],"c":1,"why":"Der Merksatz lautet: Ein Messgerät alleine stellt weder Fachkunde noch Prüfbefugnis her.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Ein Messgerät alleine stellt weder Fachkunde noch Prüfbefugnis her."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["5.1.7a–c; 4.3.6b; 2.2.4a","Norm-/Regelwerk: NIV Art. 24; NIN Teil 6","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Messreihenfolge und Dokumentationspflicht bei Erstprüfung"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Erstprüfung als geplanter Prozess» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Erstprüfung als geplanter Prozess» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Messungen an normgerechter Schulungsanlage ausschliesslich unter unmittelbarer Aufsicht autorisierter Fachperson. Halte zusätzlich die Antwort auf die Frage «Welche drei Elemente kennzeichnen eine fachliche Erstprüfung?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Bewerte eine fiktive Liste unvollständiger Prüfdaten: Welche Angaben fehlen, bevor eine Fachperson überhaupt entscheiden kann?"},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Welche drei Elemente kennzeichnen eine fachliche Erstprüfung?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/3.03-A.svg"},{"id":"3.03-B","year":3,"title":"Schutzleiter, Isolation und Polarisierung","goals":["Messbedingungen und typische Störgrössen","Interpretation von Abschaltzeiten und Kennlinien"],"parts":[{"heading":"Dein Dozent erklärt: Schutzleiter, Isolation und Polarisierung","text":"Heute geht es um schutzleiter, isolation und polarisierung. Prüfungen zum Schutzleiter und zur Isolation beantworten unterschiedliche Fragen. Die Schutzleiterprüfung kontrolliert die vorgesehene Kontinuität; Isolationsprüfungen untersuchen unerwünschte leitende Verbindungen unter festgelegten Testbedingungen. Weitere Prüfschritte betreffen je nach Anlage Polarität, Leiterzuordnung und die richtige Schaltungsfunktion. Prüfen heisst immer, Messergebnisse gegen die passende Normanforderung zu interpretieren. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Analysiere eine Musterprüftabelle mit drei fiktiven Stromkreisen. Ergänze, welches Schutzmerkmal jeweils beurteilt wird und welches Prüfverfahren qualitativ geeignet wäre. Setze keine freien Prüfspannungen oder Grenzwerte fest; diese werden nur der Originalnorm entnommen. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Wer ein Messergebnis nicht interpretieren kann, hat die Prüfung nicht abgeschlossen. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Messbedingungen und typische Störgrössen; Interpretation von Abschaltzeiten und Kennlinien. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIV Art. 24; NIN Teil 6. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Ein Messergebnis ist noch kein Prüfentscheid","bridge":"Für die Erstprüfung müssen Verfahren, Messbedingungen, Geräteangaben und Ergebnisse zusammen dokumentiert werden. Messunsicherheit, ungeeignete Messpunkte und fehlende Vorprüfungen können die Beurteilung verfälschen. Die Freigabe einer Installation folgt nicht aus einem einzigen grünen Messwert.","exercise":"Messungen an normgerechter Schulungsanlage ausschliesslich unter unmittelbarer Aufsicht autorisierter Fachperson. Halte zusätzlich die Antwort auf die Frage «Welche Prüfung behandelt die vorgesehene Verbindung des Schutzleiters?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Bewerte eine fiktive Liste unvollständiger Prüfdaten: Welche Angaben fehlen, bevor eine Fachperson überhaupt entscheiden kann?","solution":"Wer ein Messergebnis nicht interpretieren kann, hat die Prüfung nicht abgeschlossen. Der Merksatz lautet: Wer ein Messergebnis nicht interpretieren kann, hat die Prüfung nicht abgeschlossen. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Welche Prüfung behandelt die vorgesehene Verbindung des Schutzleiters?","options":["Netzwerkdurchsatz","Beleuchtungsstärke","Durchgängigkeit des Schutzleiters"],"c":2,"why":"Wer ein Messergebnis nicht interpretieren kann, hat die Prüfung nicht abgeschlossen.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Wer ein Messergebnis nicht interpretieren kann, hat die Prüfung nicht abgeschlossen."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Netzwerkdurchsatz","Wer ein Messergebnis nicht interpretieren kann, hat die Prüfung nicht abgeschlossen.","Beleuchtungsstärke"],"c":1,"why":"Der Merksatz lautet: Wer ein Messergebnis nicht interpretieren kann, hat die Prüfung nicht abgeschlossen.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Wer ein Messergebnis nicht in
