r dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["5.1.7a–c; 5.3.6a–c; 4.3.6b","Norm-/Regelwerk: NIN Teil 6; NIV Art. 24, 37; ESTI Weisung 220","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Vollständige Dokumentation und Interpretation"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Erstprüfungsdossier und Übergabe» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Erstprüfungsdossier und Übergabe» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Fachgeleitete praktische Messübung an geeigneter, freigegebener Trainingsinstallation; keine eigenen Netztests. Halte zusätzlich die Antwort auf die Frage «Was gehört in ein vollständiges Prüfdossier?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Prüfe ein fiktives Messprotokoll auf fehlende Felder und begründe, warum einzelne Zahlen nicht für eine Freigabe reichen."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Was gehört in ein vollständiges Prüfdossier?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/4.05-C.svg"},{"id":"4.06-A","year":4,"title":"Gesetze, Verordnungen und technische Regeln auseinanderhalten","goals":["Normenkette: ElG, NIV, NIN, ESTI, Netzbetreiber","NIN systematisch nach Teilen 1–8 nachschlagen"],"parts":[{"heading":"Dein Dozent erklärt: Gesetze, Verordnungen und technische Regeln auseinanderhalten","text":"Heute geht es um gesetze, verordnungen und technische regeln auseinanderhalten. Das schweizerische Elektrosicherheitsrecht verwendet verschiedene Ebenen: Gesetz, Verordnungen, technische Normen, ESTI-Weisungen und netzbetreiberspezifische Werkvorschriften. Jede hat einen eigenen Geltungsbereich. In einer Prüfung und später im Betrieb ist wichtig, eine technische Regel zur richtigen Frage nachzuschlagen. Normnummern allein ohne Ausgabe sind zu wenig präzise. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Erstelle einen Quellenbaum für einen fiktiven PV-Auftrag: NIV für Bewilligung und Kontrollen, NIN für Installationstechnik, ESTI für konkrete Weisungen und Netzbetreiber für Anschlussbedingungen. Ergänze Versionsdatum und Link, ohne ungekannte Detailwerte zu erfinden. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Zitieren heisst Quelle, Ausgabe und Sachverhalt eindeutig verbinden. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Normenkette: ElG, NIV, NIN, ESTI, Netzbetreiber; NIN systematisch nach Teilen 1–8 nachschlagen. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: ElG SR 734.0; NIV SR 734.27; NIN SN 411000:2025; ESTI. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Hierarchie und Geltungsbereich von Regeln","bridge":"Ein Gesetz, eine Verordnung, eine Norm und eine Herstelleranweisung sind unterschiedliche Quellen. Ihre Rolle und Verbindlichkeit hängen von der konkreten Anwendung ab. Ein Normzitat muss Ausgabe und Abschnitt nennen; ohne Originaltext darf aus einer Kapitelüberschrift kein detaillierter Grenzwert abgeleitet werden.","exercise":"25 geschlossene Fallkarten mit jeweils gesuchter Normstelle und Entscheidung erstellen. Halte zusätzlich die Antwort auf die Frage «Welche Quelle beschreibt die Installationsbewilligungspflicht wesentlich?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Wähle drei fachliche Aussagen und dokumentiere jeweils: Quelle, Ausgabe, Abschnitt und ob die Aussage anhand des Originaltextes geprüft wurde.","solution":"Zitieren heisst Quelle, Ausgabe und Sachverhalt eindeutig verbinden. Der Merksatz lautet: Zitieren heisst Quelle, Ausgabe und Sachverhalt eindeutig verbinden. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Welche Quelle beschreibt die Installationsbewilligungspflicht wesentlich?","options":["Das Handbuch eines Multimeters allein","Nur der Wechselrichterprospekt","NIV"],"c":2,"why":"Zitieren heisst Quelle, Ausgabe und Sachverhalt eindeutig verbinden.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Zitieren heisst Quelle, Ausgabe und Sachverhalt eindeutig verbinden."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Das Handbuch eines Multimeters allein","Zitieren heisst Quelle, Ausgabe und Sachverhalt eindeutig verbinden.","Nur der Wechselrichterprospekt"],"c":1,"why":"Der Merksatz lautet: Zitieren heisst Quelle, Ausgabe und Sachverhalt eindeutig verbinden.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Zitieren heisst Quelle, Ausgabe und Sachverhalt eindeutig verbinden."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["4.3.1b–4.3.7b","Norm-/Regelwerk: ElG SR 734.0; NIV SR 734.27; NIN SN 411000:2025; ESTI","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Normenkette: ElG, NIV, NIN, ESTI, Netzbetreiber"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Gesetze, Verordnungen und technische Regeln auseinanderhalten» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Gesetze, Verordnungen und technische Regeln auseinanderhalten» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"25 geschlossene Fallkarten mit jeweils gesuchter Normstelle und Entscheidung erstellen. Halte zusätzlich die Antwort auf die Frage «Welche Quelle beschreibt die Installationsbewilligungspflicht wesentlich?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Wähle drei fachliche Aussagen und dokumentiere jeweils: Quelle, Ausgabe, Abschnitt und ob die Aussage anhand des Originaltextes geprüft wurde."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Welche Quelle beschreibt die Installationsbewilligungspflicht wesentlich?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/4.06-A.svg"},{"id":"4.06-B","year":4,"title":"NIN-Systematik und gezielte Normrecherche","goals":["Leiterwahl, Fehler-/Brandschutz, Schutz vor Überspannung","Besondere Räume und PV/EV-Anwendungsfälle"],"parts":[{"heading":"Dein Dozent erklärt: NIN-Systematik und gezielte Normrecherche","text":"Heute geht es um nin-systematik und gezielte normrecherche. Die NIN ist nach Grundprinzipien, Schutz, Auswahl und Errichtung, Prüfungen und besonderen Anwendungsfällen gegliedert. Für eine konkrete Aufgabe kann eine besondere Regel aus Teil 7 zusätzlich zu allgemeinen Regeln aus anderen Teilen relevant sein. Ohne Zugriff auf die Originalnorm kann der Lernpfad nur die Fundstellen orientierend nennen und die technische Schlussfolgerung als prüfpflichtig markieren. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Suche in einem rechtmässig verfügbaren Normenexemplar nach einem Beispiel zur Leiterwahl und einem zu Photovoltaik. Notiere in einer eigenen Tabelle Kapitel, konkrete Fragestellung, Ausgabe und die zutreffenden Bedingungen. Übernehme keine längeren Normtexte wörtlich in die Lernplattform. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Eine spezielle Anforderung ergänzt oft allgemeine Regeln. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Leiterwahl, Fehler-/Brandschutz, Schutz vor Überspannung; Besondere Räume und PV/EV-Anwendungsfälle. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: ElG SR 734.0; NIV SR 734.27; NIN SN 411000:2025; ESTI. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Hierarchie und Geltungsbereich von Regeln","bridge":"Ein Gesetz, eine Verordnung, eine Norm und eine Herstelleranweisung sind unterschiedliche Quellen. Ihre Rolle und Verbindlichkeit hängen von der konkreten Anwendung ab. Ein Normzitat muss Ausgabe und Abschnitt nennen; ohne Originaltext darf aus einer Kapitelüberschrift kein detaillierter Grenzwert abgeleitet werden.","exercise":"25 geschlossene Fallkarten mit jeweils gesuchter Normstelle und Entscheidung erstellen. Halte zusätzlich die Antwort auf die Frage «Wo sind in der NIN besondere Räume und Anlagen typischerweise behandelt?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Wähle drei fachliche Aussagen und dokumentiere jeweils: Quelle, Ausgabe, Abschnitt und ob die Aussage anhand des Originaltextes geprüft wurde.","solution":"Eine spezielle Anforderung ergänzt oft allgemeine Regeln. Der Merksatz lautet: Eine spezielle Anforderung ergänzt oft allgemeine Regeln. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Wo sind in der NIN besondere Räume und Anlagen typischerweise behandelt?","options":["Im besonderen Anlagenteil 7","Nur in den Kapiteln zur Büroorganisation","Ausschliesslich im Inhaltsverzeichnis eines Kaufvertrags"],"c":0,"why":"Eine spezielle Anforderung ergänzt oft allgemeine Regeln.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Eine spezielle Anforderung ergänzt oft allgemeine Regeln."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Nur in den Kapiteln zur Büroorganisation","Eine spezielle Anforderung ergänzt oft allgemeine Regeln.","Ausschliesslich im Inhaltsverzeichnis eines Kaufvertrags"],"c":1,"why":"Der Merksatz lautet: Eine spezielle Anforderung ergänzt oft allgemeine Regeln.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Eine spezielle Anforderung ergänzt oft allgemeine Regeln."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["4.3.1b–4.3.7b","Norm-/Regelwerk: ElG SR 734.0; NIV SR 734.27; NIN SN 411000:2025; ESTI","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Leiterwahl, Fehler-/Brandschutz, Schutz vor Überspannung"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: NIN-Systematik und gezielte Normrecherche» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: NIN-Systematik und gezielte Normrecherche» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"25 geschlossene Fallkarten mit jeweils gesuchter Normstelle und Entscheidung erstellen. Halte zusätzlich die Antwort auf die Frage «Wo sind in der NIN besondere Räume und Anlagen typischerweise behandelt?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Wähle drei fachliche Aussagen und dokumentiere jeweils: Quelle, Ausgabe, Abschnitt und ob die Aussage anhand des Originaltextes geprüft wurde."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Wo sind in der NIN besondere Räume und Anlagen typischerweise behandelt?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/4.06-B.svg"},{"id":"4.06-C","year":4,"title":"Rechts- und Normfälle im Fachgespräch","goals":["Kontrollen, Verantwortlichkeiten, Dokumentation","Richtiges Zitieren: Ausgabe, Kapitel, Sachverhalt"],"parts":[{"heading":"Dein Dozent erklärt: Rechts- und Normfälle im Fachgespräch","text":"Heute geht es um rechts- und normfälle im fachgespräch. Die Fähigkeit zur Normrecherche zeigt sich, wenn ein unvollständiger Sachverhalt erkannt wird. Ein Prüfer kann beispielsweise nach Badezimmerinstallation, Schutzmassnahme oder PV-Übergabepunkt fragen. Eine seriöse Antwort nennt den rechtlichen Rahmen, notwendige Zusatzangaben und die relevante technische Fundstelle. Präzision ist wichtiger als schnell erfundene Grenzwerte. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Erstelle zehn Fallkarten mit kurzer Situation, fehlenden Angaben, mutmasslich relevanter Normstelle und einer Frage an die fachkundige Person. Nimm Deine privaten PV-Projekte als anonymisierte Übungsbeispiele, aber keine konkreten eigenen Installationen in Betrieb. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: «Ich muss diese Bedingung zuerst prüfen» ist eine fachlich richtige Antwort. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Kontrollen, Verantwortlichkeiten, Dokumentation; Richtiges Zitieren: Ausgabe, Kapitel, Sachverhalt. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: ElG SR 734.0; NIV SR 734.27; NIN SN 411000:2025; ESTI. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Hierarchie und Geltungsbereich von Regeln","bridge":"Ein Gesetz, eine Verordnung, eine Norm und eine Herstelleranweisung sind unterschiedliche Quellen. Ihre Rolle und Verbindlichkeit hängen von der konkreten Anwendung ab. Ein Normzitat muss Ausgabe und Abschnitt nennen; ohne Originaltext darf aus einer Kapitelüberschrift kein detaillierter Grenzwert abgeleitet werden.","exercise":"25 geschlossene Fallkarten mit jeweils gesuchter Normstelle und Entscheidung erstellen. Halte zusätzlich die Antwort auf die Frage «Was ist bei fehlenden Normbedingungen sinnvoll?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Wähle drei fachliche Aussagen und dokumentiere jeweils: Quelle, Ausgabe, Abschnitt und ob die Aussage anhand des Originaltextes geprüft wurde.","solution":"«Ich muss diese Bedingung zuerst prüfen» ist eine fachlich richtige Antwort. Der Merksatz lautet: «Ich muss diese Bedingung zuerst prüfen» ist eine fachlich richtige Antwort. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was ist bei fehlenden Normbedingungen sinnvoll?","options":["Grenzwert schätzen","Fehlende Angaben klären und Originalnorm nachschlagen","Ohne Prüfung montieren"],"c":1,"why":"«Ich muss diese Bedingung zuerst prüfen» ist eine fachlich richtige Antwort.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: «Ich muss diese Bedingung zuerst prüfen» ist eine fachlich richtige Antwort."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Ohne Prüfung montieren","«Ich muss diese Bedingung zuerst prüfen» ist eine fachlich richtige Antwort.","Grenzwert schätzen"],"c":1,"why":"Der Merksatz lautet: «Ich muss diese Bedingung zuerst prüfen» ist eine fachlich richtige Antwort.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: «Ich muss diese Bedingung zuerst prüfen» ist eine fachlich richtige Antwort."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["4.3.1b–4.3.7b","Norm-/Regelwerk: ElG SR 734.0; NIV SR 734.27; NIN SN 411000:2025; ESTI","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Kontrollen, Verantwortlichkeiten, Dokumentation"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Rechts- und Normfälle im Fachgespräch» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Rechts- und Normfälle im Fachgespräch» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"25 geschlossene Fallkarten mit jeweils gesuchter Normstelle und Entscheidung erstellen. Halte zusätzlich die Antwort auf die Frage «Was ist bei fehlenden Normbedingungen sinnvoll?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Wähle drei fachliche Aussagen und dokumentiere jeweils: Quelle, Ausgabe, Abschnitt und ob die Aussage anhand des Originaltextes geprüft wurde."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Was ist bei fehlenden Normbedingungen sinnvoll?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/4.06-C.svg"},{"id":"4.07-A","year":4,"title":"Auftrag, Arbeitsvorbereitung und Schnittstellen","goals":["Auftrag erfassen, Leistung abgrenzen, Zuständigkeiten klären","Ausführungsplan, Arbeitsablauf und Materialbestellung"],"parts":[{"heading":"Dein Dozent erklärt: Auftrag, Arbeitsvorbereitung und Schnittstellen","text":"Heute geht es um auftrag, arbeitsvorbereitung und schnittstellen. Ein Elektroauftrag beginnt mit einer klaren Leistungsbeschreibung, dem zulässigen Bewilligungsumfang und der Festlegung von Verantwortlichkeiten. Arbeitsvorbereitung umfasst Material, Werkzeug, Sicherheitsmassnahmen, Terminfolge und Schnittstellen zu anderen Gewerken. Bei komplexen Projekten helfen Meilensteine und ein Änderungsmanagement. Du kannst hier Deine Erfahrung aus dem Maschinenbau direkt übertragen. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Erstelle einen fiktiven Projektauftrag für eine Sanierung mit Licht und Kommunikation. Definiere Leistungsgrenzen, Bauherrschaft, Elektroinstallationsbetrieb, Planer und Prüfstelle. Füge eine Risiko- und Terminliste hinzu. Es geht um Projektorganisation, nicht um eine eigene Installation. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Vor Projektstart müssen Leistungsgrenzen und Fachverantwortung klar sein. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Auftrag erfassen, Leistung abgrenzen, Zuständigkeiten klären; Ausführungsplan, Arbeitsablauf und Materialbestellung. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: Lehrplan 1.1–1.3/4.1–4.2; NIV Art. 24, 37. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Projektabwicklung und Nachvollziehbarkeit","bridge":"Ein technischer Auftrag braucht klare Schnittstellen, Termine, Prüfkriterien und Änderungsdokumentation. Ein Arbeitsrapport zeigt nicht nur verbrauchte Zeit, sondern auch Leistungen und Abweichungen. Revisionsunterlagen müssen zum endgültigen Zustand passen, damit späterer Betrieb und Wartung möglich sind.","exercise":"Dokumentenfall für einen fiktiven Mehrraum-Umbau; keine reale Installation. Halte zusätzlich die Antwort auf die Frage «Was gehört zu einem sauberen Elektroauftrag?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erstelle einen kurzen Projektänderungsrapport mit Auswirkung auf Material, Termin und Dokumentation.","solution":"Vor Projektstart müssen Leistungsgrenzen und Fachverantwortung klar sein. Der Merksatz lautet: Vor Projektstart müssen Leistungsgrenzen und Fachverantwortung klar sein. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was gehört zu einem sauberen Elektroauftrag?","options":["Leistungsumfang und Verantwortlichkeiten","Nur ein Raumfoto","Nur ein pauschaler Endpreis"],"c":0,"why":"Vor Projektstart müssen Leistungsgrenzen und Fachverantwortung klar sein.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Vor Projektstart müssen Leistungsgrenzen und Fachverantwortung klar sein."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Nur ein Raumfoto","Vor Projektstart müssen Leistungsgrenzen und Fachverantwortung klar sein.","Nur ein pauschaler Endpreis"],"c":1,"why":"Der Merksatz lautet: Vor Projektstart müssen Leistungsgrenzen und Fachverantwortung klar sein.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Vor Projektstart müssen Leistungsgrenzen und Fachverantwortung klar sein."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["1.1.1a–1.3.2a; 4.1.1a–4.2.6a","Norm-/Regelwerk: Lehrplan 1.1–1.3/4.1–4.2; NIV Art. 24, 37","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Auftrag erfassen, Leistung abgrenzen, Zuständigkeiten klären"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Auftrag, Arbeitsvorbereitung und Schnittstellen» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Auftrag, Arbeitsvorbereitung und Schnittstellen» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Dokumentenfall für einen fiktiven Mehrraum-Umbau; keine reale Installation. Halte zusätzlich die Antwort auf die Frage «Was gehört zu einem sauberen Elektroauftrag?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erstelle einen kurzen Projektänderungsrapport mit Auswirkung auf Material, Termin und Dokumentation."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Was gehört zu einem sauberen Elektroauftrag?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/4.07-A.svg"},{"id":"4.07-B","year":4,"title":"Material, Arbeitsrapport und Nachträge","goals":["Arbeitsrapport, Ausmass, Stückliste, Nachtrag","Revisionsplan, Bedienungs-/Wartungsanleitung"],"parts":[{"heading":"Dein Dozent erklärt: Material, Arbeitsrapport und Nachträge","text":"Heute geht es um material, arbeitsrapport und nachträge. Eine wirtschaftliche Projektabwicklung dokumentiert Materialmengen, Arbeitszeiten und Änderungen gegenüber dem Auftrag. Ein sauberer Arbeitsrapport trennt geplante und tatsächlich erbrachte Leistungen. Nachträge werden begründet und freigegeben, statt erst auf der Schlussrechnung aufzutauchen. Die technische Dokumentation muss dabei mit dem ausgeführten Stand übereinstimmen. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Berechne für ein fiktives Installationsprojekt Materialkosten und Arbeitsstunden. Erstelle einen Nachtrag für eine zusätzlich gewünschte Leuchte mit Auswirkung auf Planung, Material, Arbeit und Dokumentation. Kennzeichne notwendige Freigaben. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Transparenz bei Änderungen verhindert spätere technische und kaufmännische Unklarheit. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Arbeitsrapport, Ausmass, Stückliste, Nachtrag; Revisionsplan, Bedienungs-/Wartungsanleitung. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: Lehrplan 1.1–1.3/4.1–4.2; NIV Art. 24, 37. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Projektabwicklung und Nachvollziehbarkeit","bridge":"Ein technischer Auftrag braucht klare Schnittstellen, Termine, Prüfkriterien und Änderungsdokumentation. Ein Arbeitsrapport zeigt nicht nur verbrauchte Zeit, sondern auch Leistungen und Abweichungen. Revisionsunterlagen müssen zum endgültigen Zustand passen, damit späterer Betrieb und Wartung möglich sind.","exercise":"Dokumentenfall für einen fiktiven Mehrraum-Umbau; keine reale Installation. Halte zusätzlich die Antwort auf die Frage «Was muss ein fachlicher Nachtrag enthalten?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erstelle einen kurzen Projektänderungsrapport mit Auswirkung auf Material, Termin und Dokumentation.","solution":"Transparenz bei Änderungen verhindert spätere technische und kaufmännische Unklarheit. Der Merksatz lautet: Transparenz bei Änderungen verhindert spätere technische und kaufmännische Unklarheit. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was muss ein fachlicher Nachtrag enthalten?","options":["Nur ein neues Datum","Begründung, Leistung und Freigabe","Nur eine höhere Gesamtsumme"],"c":1,"why":"Transparenz bei Änderungen verhindert spätere technische und kaufmännische Unklarheit.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Transparenz bei Änderungen verhindert spätere technische und kaufmännische Unklarheit."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Nur eine höhere Gesamtsumme","Transparenz bei Änderungen verhindert spätere technische und kaufmännische Unklarheit.","Nur ein neues Datum"],"c":1,"why":"Der Merksatz lautet: Transparenz bei Änderungen verhindert spätere technische und kaufmännische Unklarheit.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Transparenz bei Änderungen verhindert spätere technische und kaufmännische Unklarheit."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["1.1.1a–1.3.2a; 4.1.1a–4.2.6a","Norm-/Regelwerk: Lehrplan 1.1–1.3/4.1–4.2; NIV Art. 24, 37","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Arbeitsrapport, Ausmass, Stückliste, Nachtrag"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Material, Arbeitsrapport und Nachträge» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Material, Arbeitsrapport und Nachträge» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Dokumentenfall für einen fiktiven Mehrraum-Umbau; keine reale Installation. Halte zusätzlich die Antwort auf die Frage «Was muss ein fachlicher Nachtrag enthalten?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erstelle einen kurzen Projektänderungsrapport mit Auswirkung auf Material, Termin und Dokumentation."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Was muss ein fachlicher Nachtrag enthalten?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/4.07-B.svg"},{"id":"4.07-C","year":4,"title":"Revisionsunterlagen und Kundeninstruktion","goals":["Abnahmeprotokoll, Anlagenübergabe","Kundeninstruktion mit Energieeffizienz und Sicherheit"],"parts":[{"heading":"Dein Dozent erklärt: Revisionsunterlagen und Kundeninstruktion","text":"Heute geht es um revisionsunterlagen und kundeninstruktion. Bei Übergabe müssen die Unterlagen den tatsächlich realisierten Anlagenstand beschreiben. Dazu gehören passende Pläne, Prüf- und Kontrolldokumente, Gerätehinweise und gegebenenfalls Wartungsanforderungen. Kunden benötigen ausserdem verständliche Informationen zur sicheren Bedienung und zu Grenzen eigener Eingriffe. Die Dokumentation gehört zum Gesamtprodukt der Installation. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Erstelle für eine fiktive Wohnung eine Revisionsliste und eine Bedienungsanleitung für Lichtsteuerung und PV-Monitoring. Ergänze Sicherheits- und Störungsinformationen sowie die Kontaktdaten des zuständigen Betriebs. Nutze keine realen SiNa-Formulare als angeblich gültige Nachweise. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Die Dokumentation bei Übergabe muss den Ist-Zustand zeigen. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Abnahmeprotokoll, Anlagenübergabe; Kundeninstruktion mit Energieeffizienz und Sicherheit. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: Lehrplan 1.1–1.3/4.1–4.2; NIV Art. 24, 37. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Projektabwicklung und Nachvollziehbarkeit","bridge":"Ein technischer Auftrag braucht klare Schnittstellen, Termine, Prüfkriterien und Änderungsdokumentation. Ein Arbeitsrapport zeigt nicht nur verbrauchte Zeit, sondern auch Leistungen und Abweichungen. Revisionsunterlagen müssen zum endgültigen Zustand passen, damit späterer Betrieb und Wartung möglich sind.","exercise":"Dokumentenfall für einen fiktiven Mehrraum-Umbau; keine reale Installation. Halte zusätzlich die Antwort auf die Frage «Welche Unterlage braucht der Kunde zur sicheren Nutzung?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erstelle einen kurzen Projektänderungsrapport mit Auswirkung auf Material, Termin und Dokumentation.","solution":"Die Dokumentation bei Übergabe muss den Ist-Zustand zeigen. Der Merksatz lautet: Die Dokumentation bei Übergabe muss den Ist-Zustand zeigen. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Welche Unterlage braucht der Kunde zur sicheren Nutzung?","options":["Nur einen Werbeflyer","Nur den Lieferschein der Lampen","Aktuelle Revisions- und Bedienungsdokumentation"],"c":2,"why":"Die Dokumentation bei Übergabe muss den Ist-Zustand zeigen.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Die Dokumentation bei Übergabe muss den Ist-Zustand zeigen."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Nur einen Werbeflyer","Die Dokumentation bei Übergabe muss den Ist-Zustand zeigen.","Nur den Lieferschein der Lampen"],"c":1,"why":"Der Merksatz lautet: Die Dokumentation bei Übergabe muss den Ist-Zustand zeigen.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Die Dokumentation bei Übergabe muss den Ist-Zustand zeigen."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Dein Dozent erklärt: Revisionsunterlagen und Kundeninstruktion»: Kunden benötigen ausserdem verständliche Informationen zur sicheren Bedienung und zu Grenzen eigener Eingriffe."}],"refs":["1.1.1a–1.3.2a; 4.1.1a–4.2.6a","Norm-/Regelwerk: Lehrplan 1.1–1.3/4.1–4.2; NIV Art. 24, 37","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Abnahmeprotokoll, Anlagenübergabe"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Revisionsunterlagen und Kundeninstruktion» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Revisionsunterlagen und Kundeninstruktion» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Dokumentenfall für einen fiktiven Mehrraum-Umbau; keine reale Installation. Halte zusätzlich die Antwort auf die Frage «Welche Unterlage braucht der Kunde zur sicheren Nutzung?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erstelle einen kurzen Projektänderungsrapport mit Auswirkung auf Material, Termin und Dokumentation."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Welche Unterlage braucht der Kunde zur sicheren Nutzung?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/4.07-C.svg"},{"id":"4.08-A","year":4,"title":"PV-Dossier: Modul- und Stringdaten überprüfen","goals":["PV-DC-Stringdaten und temperaturbedingte Maximalspannung","Schutz gegen elektrischen Schlag und thermische Risiken"],"parts":[{"heading":"Dein Dozent erklärt: PV-Dossier: Modul- und Stringdaten überprüfen","text":"Heute geht es um pv-dossier: modul- und stringdaten überprüfen. Eine PV-Dokumentation beginnt mit nachvollziehbaren Modul- und Wechselrichterdaten. Für die Stringplanung müssen Spannungsfenster, maximale DC-Spannung, Ströme und Temperaturbedingungen geprüft werden. Die Beurteilung ist anhand der Gerätespezifikationen und der einschlägigen NIN-Anforderungen durchzuführen. Ein plausibler Leistungswert allein weist keine sichere Auslegung nach. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Ein fiktiver String enthält zehn Module mit 42 Volt Leerlaufspannung unter Referenzbedingungen. Das ergibt zunächst 420 Volt. Ergänze den fehlenden Temperaturnachweis und die zulässige Gerätegrenze als offene Prüfpunkte. Entscheide nicht anhand der 420 Volt allein über die Zulässigkeit. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: PV-Nennwerte müssen auf ungünstige Betriebsbedingungen umgerechnet werden. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: PV-DC-Stringdaten und temperaturbedingte Maximalspannung; Schutz gegen elektrischen Schlag und thermische Risiken. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIN 7.12; ESTI 220; SN EN 62446-1; Swissolar. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"PV-Dossier vor Freigabe kritisch prüfen","bridge":"Eine PV-Dokumentation sollte die identifizierbaren Komponenten, Herstellerdaten, Auslegungsannahmen und sicherheitsrelevanten Nachweise schlüssig verbinden. Fehlende DC-Kennwerte, unklare Stecksysteme oder eine nicht nachvollziehbare Stringzuordnung sind offene Fachfragen. Das Unterrichtsdossier ersetzt weder Erstprüfung noch normgerechte Freigabe.","exercise":"Anonymisiertes, vorhandenes PV-Projekt nur auf Papier auditieren; keine Änderungen an Bestandsanlage. Halte zusätzlich die Antwort auf die Frage «Was fehlt bei einer Stringprüfung mit reiner STC-Spannung?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Vergleiche ein fiktives Modulblatt mit einer Stringliste und kennzeichne fehlende Angaben, ohne ein reales System in Betrieb zu nehmen.","solution":"PV-Nennwerte müssen auf ungünstige Betriebsbedingungen umgerechnet werden. Der Merksatz lautet: PV-Nennwerte müssen auf ungünstige Betriebsbedingungen umgerechnet werden. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was fehlt bei einer Stringprüfung mit reiner STC-Spannung?","options":["Nur die Dachziegelfarbe","Temperaturabhängige Maximalspannung","Nur der Wechselrichtername"],"c":1,"why":"PV-Nennwerte müssen auf ungünstige Betriebsbedingungen umgerechnet werden.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: PV-Nennwerte müssen auf ungünstige Betriebsbedingungen umgerechnet werden."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Nur der Wechselrichtername","PV-Nennwerte müssen auf ungünstige Betriebsbedingungen umgerechnet werden.","Nur die Dachziegelfarbe"],"c":1,"why":"Der Merksatz lautet: PV-Nennwerte müssen auf ungünstige Betriebsbedingungen umgerechnet werden.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: PV-Nennwerte müssen auf ungünstige Betriebsbedingungen umgerechnet werden."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["5.2.8a–c; 4.3.6b","Norm-/Regelwerk: NIN 7.12; ESTI 220; SN EN 62446-1; Swissolar","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: PV-DC-Stringdaten und temperaturbedingte Maximalspannung"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: PV-Dossier: Modul- und Stringdaten überprüfen» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: PV-Dossier: Modul- und Stringdaten überprüfen» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Anonymisiertes, vorhandenes PV-Projekt nur auf Papier auditieren; keine Änderungen an Bestandsanlage. Halte zusätzlich die Antwort auf die Frage «Was fehlt bei einer Stringprüfung mit reiner STC-Spannung?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Vergleiche ein fiktives Modulblatt mit einer Stringliste und kennzeichne fehlende Angaben, ohne ein reales System in Betrieb zu nehmen."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Was fehlt bei einer Stringprüfung mit reiner STC-Spannung?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/4.08-A.svg"},{"id":"4.08-B","year":4,"title":"Sicherheits-, Kennzeichnungs- und Prüfunterlagen","goals":["Wechselrichter, DC/AC-Trennstelle, Kennzeichnungen","Prüfprotokoll, Sichtprüfung und Dokumentationsnachweis"],"parts":[{"heading":"Dein Dozent erklärt: Sicherheits-, Kennzeichnungs- und Prüfunterlagen","text":"Heute geht es um sicherheits-, kennzeichnungs- und prüfunterlagen. PV-Anlagen besitzen besondere DC- und AC-Gefährdungen. Fachlich zu prüfen sind unter anderem die eindeutige Kennzeichnung, das Trennstellenkonzept, die Leitungsführung, das Zusammenspiel der Schutzmassnahmen und die korrekte Prüf- und Übergabedokumentation. Die Abgrenzung zwischen einem Art.-14-Betrieb und einer allgemein bewilligten Installation ist gesondert zu dokumentieren. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Prüfe ein anonymisiertes fiktives PV-Dossier auf Vollständigkeit: Stringplan, Geräteauslegung, Kennzeichnung, Wechselrichterunterlagen, Mess- und Prüfbericht, Abnahme und Netzbetreiberfreigaben. Lege eine Mängelliste mit Zuständigkeit und Nachweisbedarf an. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Eine laufende PV-Anlage ist nicht automatisch eine nachgewiesen sichere PV-Anlage. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Wechselrichter, DC/AC-Trennstelle, Kennzeichnungen; Prüfprotokoll, Sichtprüfung und Dokumentationsnachweis. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIN 7.12; ESTI 220; SN EN 62446-1; Swissolar. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"PV-Dossier vor Freigabe kritisch prüfen","bridge":"Eine PV-Dokumentation sollte die identifizierbaren Komponenten, Herstellerdaten, Auslegungsannahmen und sicherheitsrelevanten Nachweise schlüssig verbinden. Fehlende DC-Kennwerte, unklare Stecksysteme oder eine nicht nachvollziehbare Stringzuordnung sind offene Fachfragen. Das Unterrichtsdossier ersetzt weder Erstprüfung noch normgerechte Freigabe.","exercise":"Anonymisiertes, vorhandenes PV-Projekt nur auf Papier auditieren; keine Änderungen an Bestandsanlage. Halte zusätzlich die Antwort auf die Frage «Was gehört in die Sicherheitsdokumentation einer PV-Anlage?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Vergleiche ein fiktives Modulblatt mit einer Stringliste und kennzeichne fehlende Angaben, ohne ein reales System in Betrieb zu nehmen.","solution":"Eine laufende PV-Anlage ist nicht automatisch eine nachgewiesen sichere PV-Anlage. Der Merksatz lautet: Eine laufende PV-Anlage ist nicht automatisch eine nachgewiesen sichere PV-Anlage. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was gehört in die Sicherheitsdokumentation einer PV-Anlage?","options":["Nur die Dachansicht","Nur die App-Screenshot-Ertragskurve","Schutzkonzept, Prüfunterlagen und klare Zuständigkeiten"],"c":2,"why":"Eine laufende PV-Anlage ist nicht automatisch eine nachgewiesen sichere PV-Anlage.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Eine laufende PV-Anlage ist nicht automatisch eine nachgewiesen sichere PV-Anlage."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Nur die Dachansicht","Eine laufende PV-Anlage ist nicht automatisch eine nachgewiesen sichere PV-Anlage.","Nur die App-Screenshot-Ertragskurve"],"c":1,"why":"Der Merksatz lautet: Eine laufende PV-Anlage ist nicht automatisch eine nachgewiesen sichere PV-Anlage.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Eine laufende PV-Anlage ist nicht automatisch eine nachgewiesen sichere PV-Anlage."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["5.2.8a–c; 4.3.6b","Norm-/Regelwerk: NIN 7.12; ESTI 220; SN EN 62446-1; Swissolar","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Wechselrichter, DC/AC-Trennstelle, Kennzeichnungen"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Sicherheits-, Kennzeichnungs- und Prüfunterlagen» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Sicherheits-, Kennzeichnungs- und Prüfunterlagen» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Anonymisiertes, vorhandenes PV-Projekt nur auf Papier auditieren; keine Änderungen an Bestandsanlage. Halte zusätzlich die Antwort auf die Frage «Was gehört in die Sicherheitsdokumentation einer PV-Anlage?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Vergleiche ein fiktives Modulblatt mit einer Stringliste und kennzeichne fehlende Angaben, ohne ein reales System in Betrieb zu nehmen."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Was gehört in die Sicherheitsdokumentation einer PV-Anlage?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/4.08-B.svg"},{"id":"4.08-C","year":4,"title":"PV-Abschlussgespräch und Mängelmanagement","goals":["Schnittstelle NIV14/allgemeine Installationsbewilligung","Übergabe, Netzbetreiber, Abnahme und Wartung"],"parts":[{"heading":"Dein Dozent erklärt: PV-Abschlussgespräch und Mängelmanagement","text":"Heute geht es um pv-abschlussgespräch und mängelmanagement. Im PV-Fachgespräch müssen Planung, Schutzkonzept, Zuständigkeitsgrenzen, Netzintegration und Dokumentation zusammenhängend erklärt werden. Offene Punkte werden als Mängel oder Prüfaufträge mit Verantwortlichen und Fristen erfasst. Eine reale Anlagenabnahme ist nicht Gegenstand eines privaten Selbstlernprogramms. Die Aufgabe besteht darin, fachlich richtige Fragen zu stellen. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Bereite ein zehnminütiges Fachgespräch zur fiktiven Anlage vor: Warum diese Stringauslegung, welche Netzanschlussbedingungen, welche Kontrollnachweise und wie wird der Kunde instruiert? Stelle eine Tabelle offener Punkte mit Verantwortlichen und Abklärungsstatus zusammen. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Fachliche Übergabe bedeutet nachvollziehbare Antworten statt bloss laufendem Betrieb. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Schnittstelle NIV14/allgemeine Installationsbewilligung; Übergabe, Netzbetreiber, Abnahme und Wartung. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIN 7.12; ESTI 220; SN EN 62446-1; Swissolar. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"PV-Dossier vor Freigabe kritisch prüfen","bridge":"Eine PV-Dokumentation sollte die identifizierbaren Komponenten, Herstellerdaten, Auslegungsannahmen und sicherheitsrelevanten Nachweise schlüssig verbinden. Fehlende DC-Kennwerte, unklare Stecksysteme oder eine nicht nachvollziehbare Stringzuordnung sind offene Fachfragen. Das Unterrichtsdossier ersetzt weder Erstprüfung noch normgerechte Freigabe.","exercise":"Anonymisiertes, vorhandenes PV-Projekt nur auf Papier auditieren; keine Änderungen an Bestandsanlage. Halte zusätzlich die Antwort auf die Frage «Was ist bei einem nicht geklärten PV-Mangel sinnvoll?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Vergleiche ein fiktives Modulblatt mit einer Stringliste und kennzeichne fehlende Angaben, ohne ein reales System in Betrieb zu nehmen.","solution":"Fachliche Übergabe bedeutet nachvollziehbare Antworten statt bloss laufendem Betrieb. Der Merksatz lautet: Fachliche Übergabe bedeutet nachvollziehbare Antworten statt bloss laufendem Betrieb. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was ist bei einem nicht geklärten PV-Mangel sinnvoll?","options":["Dokumentieren, zuständige Fachperson zuweisen und klären","Die Anlage nach Gefühl umbauen","Ignorieren, solange Ertrag sichtbar ist"],"c":0,"why":"Fachliche Übergabe bedeutet nachvollziehbare Antworten statt bloss laufendem Betrieb.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Fachliche Übergabe bedeutet nachvollziehbare Antworten statt bloss laufendem Betrieb."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Die Anlage nach Gefühl umbauen","Fachliche Übergabe bedeutet nachvollziehbare Antworten statt bloss laufendem Betrieb.","Ignorieren, solange Ertrag sichtbar ist"],"c":1,"why":"Der Merksatz lautet: Fachliche Übergabe bedeutet nachvollziehbare Antworten statt bloss laufendem Betrieb.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Fachliche Übergabe bedeutet nachvollziehbare Antworten statt bloss laufendem Betrieb."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder ein ein Dozent erklärt: Übertragungsstrecken und Linkmessungen","text":"Heute geht es um übertragungsstrecken und linkmessungen. Strukturierte Gebäudeverkabelung wird anhand festgelegter Übertragungseigenschaften beurteilt. Dazu können Einfügedämpfung, Nebensprechen, Rückflussdämpfung und Leitungslänge gehören. Die passende Anforderung hängt von Kategorie, Klasse und Messkonfiguration ab. Eine einfache Durchgangsprüfung erfasst nicht alle Hochfrequenzeigenschaften. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Du erhältst einen fiktiven Messreport einer Datenstrecke. Markiere Länge, Einfügedämpfung und Nebensprechwerte. Notiere, welcher Grenzwert zu welcher Klasse gehört, sofern ein zugelassenes Fachlehrmittel vorhanden ist. Erfinde keine Pass/Fail-Kriterien. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Eine korrekt verbundene Datenleitung muss nicht jede Übertragungsklasse erfüllen. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Strukturierte Gebäudeverkabelung und Schnittstellen; Dämpfung, NEXT und Messklasse als Konzept. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: Lehrplan 6; ISO/IEC 11801; RIT-Hinweise des Verbandes. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Kommunikationsstrecken anhand von Kriterien prüfen","bridge":"Für die Diagnose einer Datenverbindung werden physikalischer Link, Streckenleistung, Geräteparameter und Anwendung getrennt betrachtet. Eine erfolgreiche LED-Anzeige sagt wenig über tatsächliche Übertragungsqualität. Messmethoden und Grenzwerte müssen zur Strecke und zur eingesetzten Norm passen.","exercise":"Datenkabel an Schulungsmodellen prüfen und Messberichte interpretieren. Halte zusätzlich die Antwort auf die Frage «Welche Eigenschaft beschreibt NEXT?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erstelle zu drei Diagnosefällen jeweils zwei Hypothesen und eine sichere Prüfungsmethode.","solution":"Eine korrekt verbundene Datenleitung muss nicht jede Übertragungsklasse erfüllen. Der Merksatz lautet: Eine korrekt verbundene Datenleitung muss nicht jede Übertragungsklasse erfüllen. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Welche Eigenschaft beschreibt NEXT?","options":["Schlupf eines Motors","Spannungsfall eines Stromkreises","Nahnebensprechen zwischen Leiterpaaren"],"c":2,"why":"Eine korrekt verbundene Datenleitung muss nicht jede Übertragungsklasse erfüllen.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Eine korrekt verbundene Datenleitung muss nicht jede Übertragungsklasse erfüllen."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Schlupf eines Motors","Eine korrekt verbundene Datenleitung muss nicht jede Übertragungsklasse erfüllen.","Spannungsfall eines S rt auf die Frage «Welche Eigenschaft beschreibt NEXT?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erstelle zu drei Diagnosefällen jeweils zwei Hypothesen und eine sichere Prüfungsmethode."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Welche Eigenschaft beschreibt NEXT?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/4.09-A.svg"},{"id":"4.09-B","year":4,"title":"Koaxialtechnik und Fehlersuche","goals":["Koaxial-Pegel, Dämpfungsbudget, Rückkanal","Router, Switch, Endgeräte, All-IP"],"parts":[{"heading":"Dein Dozent erklärt: Koaxialtechnik und Fehlersuche","text":"Heute geht es um koaxialtechnik und fehlersuche. Bei koaxialen Anlagen beeinflussen Frequenz, Kabeldämpfung, Steckverbinder und Verteilnetz den Signalpegel. Fehler können als zu geringe Pegel, Einstrahlung oder intermittierende Kontakte sichtbar werden. Ein Messprotokoll muss die verwendete Bezugsgrösse und den Frequenzbereich nennen. Auch All-IP- und Ethernet-Teile im Gebäude werden in der Diagnose sauber getrennt. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Ein fiktiver Koaxialweg hat 15 Dezibel Dämpfung und einen Eingangspegel von 70 dBµV. Der idealisierte Ausgangspegel beträgt 55 dBµV. Erkläre, warum daraus ohne Empfängeranforderungen noch keine abschliessende Aussage zur Nutzbarkeit folgt. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Pegel und Dämpfung müssen mit korrekten Bezugsgrössen behandelt werden. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Koaxial-Pegel, Dämpfungsbudget, Rückkanal; Router, Switch, Endgeräte, All-IP. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: Lehrplan 6; ISO/IEC 11801; RIT-Hinweise des Verbandes. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Kommunikationsstrecken anhand von Kriterien prüfen","bridge":"Für die Diagnose einer Datenverbindung werden physikalischer Link, Streckenleistung, Geräteparameter und Anwendung getrennt betrachtet. Eine erfolgreiche LED-Anzeige sagt wenig über tatsächliche Übertragungsqualität. Messmethoden und Grenzwerte müssen zur Strecke und zur eingesetzten Norm passen.","exercise":"Datenkabel an Schulungsmodellen prüfen und Messberichte interpretieren. Halte zusätzlich die Antwort auf die Frage «Wie verändert eine Dämpfung von 15 dB einen Pegel von 70 dBµV?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erstelle zu drei Diagnosefällen jeweils zwei Hypothesen und eine sichere Prüfungsmethode.","solution":"Pegel und Dämpfung müssen mit korrekten Bezugsgrössen behandelt werden. Der Merksatz lautet: Pegel u ückkanal"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Koaxialtechnik und Fehlersuche» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Koaxialtechnik und Fehlersuche» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Datenkabel an Schulungsmodellen prüfen und Messberichte interpretieren. Halte zusätzlich die Antwort auf die Frage «Wie verändert eine Dämpfung von 15 dB einen Pegel von 70 dBµV?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erstelle zu drei Diagnosefällen jeweils zwei Hypothesen und eine sichere Prüfungsmethode."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Wie verändert eine Dämpfung von 15 dB einen Pegel von 70 dBµV?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/4.09-B.svg"},{"id":"4.09-C","year":4,"title":"Systematische Netzwerkdiagnose und Dokumentationsreview","goals":["Fachbegriffe und Kurzfragen mündlich beantworten","Verdrahtungs- und Dokumentationsfehler identifizieren"],"parts":[{"heading":"Dein Dozent erklärt: Systematische Netzwerkdiagnose und Dokumentationsreview","text":"Heute geht es um systematische netzwerkdiagnose und dokumentationsreview. Bei der Kommunikationstechnik ist zwischen physischem Link, Datenübertragung, Adressierung und Anwendung zu unterscheiden. Jede Schicht hat andere Fehlerbilder. Eine nachvollziehbare Portliste und ein ordentlicher Messreport erleichtern die Eingrenzung. Die Prüfungsvorbereitung verlangt, dass Du technische Begriffe sowohl rechnen als auch verständlich erklären kannst. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Eine fiktive Netzwerkdose hat Link, aber keine Verbindung zum Server. Ordne Prüfschritte Verkabelung, Switch, IP-Konfiguration und Serverdienst zu. Erstelle anschliessend eine Port- und Gerätedokumentation, mit der ein zweiter Techniker dieselbe Fehlersuche nachvollziehen kann. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Ein erfolgreicher Linktest beweist nicht die Erreichbarkeit aller Dienste. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Fachbegriffe und Kurzfragen mündlich beantworten; Verdrahtungs- und Dokumentationsfehler identifizieren. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: Lehrplan 6; ISO/IEC 11801; RIT-Hinweise des Verbandes. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Kommunikationsstrecken anhand von Kriterien prüfen","bridge":"Für die Diagnose einer Datenverbindung werden physikalischer Link, Streckenleistung, Geräteparameter und Anwendung getrennt betrachtet. Eine erfolgreiche LED-Anzeige sagt wenig über tatsächliche Übertragungsqualität. Messmethoden und Grenzwerte müssen zur Strecke und zur eingesetzten Norm passen.","exercise":"Datenkabel an Schulungsmodellen prüfen und Messberichte interpretieren. Halte zusätzlich die Antwort auf die Frage «Was prüfst Du bei Link vorhanden, Server nicht erreichbar als Nächstes?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erstelle zu drei Diagnosefällen jeweils zwei Hypothesen und eine sichere Prüfungsmethode.","solution":"Ein erfolgreicher Linktest beweist nicht die Erreichbarkeit aller Dienste. Der Merksatz lautet: Ein erfolgreicher Linktest beweist nicht die Erreichbarkeit aller Dienste. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was prüfst Du bei Link vorhanden, Server nicht erreichbar als Nächstes?","options":["Sofort die Hauseinspeisung umbauen","IP-Konfiguration und übergeordnete Netzpfade","Nur den Raum neu streichen"],"c":1,"why":"Ein erfolgreicher Linktest beweist nicht die Erreichbarkeit aller Dienste.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Ein erfolgreicher Linktest beweist nicht die Erreichbarkeit aller Dienste."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Nur den Raum neu streichen","Ein erfolgreicher Linktest beweist nicht die Erreichbarkeit aller Dienste.","Sofort die Hauseinspeisung umbauen"],"c":1,"why":"Der Merksatz lautet: Ein erfolgreicher Linktest beweist nicht die Erreichbarkeit aller Dienste.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Ein erfolgreicher Linktest beweist nicht die Erreichbarkeit aller oder Berechnung dazu. Die dazugehörigen Lernziele sind: Sicherheitskultur und Werkstoffe; Regeln der Technik mit Quellenangaben. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: BiVo2015 Wegleitung QV BK Pos. 1,2,6; EIT Musterserien. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Ein Fachgespräch prüft Begründungskompetenz","bridge":"Wer eine technische Lösung erklären kann, benennt Annahmen, relevante Regeln, Prüfschritte und Alternativen. Auswendig gelernte Formeln genügen nicht, wenn wesentliche Randbedingungen fehlen. Gute Antworten unterscheiden sichere Beobachtungen von Vermutungen und geben offen an, wann fachliche Freigabe erforderlich ist.","exercise":"Mindestens vier simulierte mündliche Prüfungsgespräche; 20 Minuten je Session mit fachkundiger Person. Halte zusätzlich die Antwort auf die Frage «Welcher Antwortstil passt zum Fachgespräch?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erkläre ein gewähltes Schaltbild in zwei Minuten und beantworte danach drei Rückfragen zu Annahmen, Sicherheitsgrenzen und Nachweisen.","solution":"Fachlich gute Antworten erklären das Warum, nicht nur den Begriff. Der Merksatz lautet: Fachlich gute Antworten erklären das Warum, nicht nur den Begriff. Modell, Theorie und echte be
