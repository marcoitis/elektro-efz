ction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/2.06-C.svg"},{"id":"2.07-A","year":2,"title":"Lichtschaltungen im Funktionsschema","goals":["Wechsel-/Kreuz-/Taster-/Stromstossschaltung im Schema","Ausführungssymbole nach IEC, Klemmen- und Aderlisten"],"parts":[{"heading":"Dein Dozent erklärt: Lichtschaltungen im Funktionsschema","text":"Heute geht es um lichtschaltungen im funktionsschema. Ausschaltung, Wechselschaltung, Kreuzschaltung und Tasterschaltungen lösen unterschiedliche Bedienaufgaben. Ein Stromlaufplan zeigt, welche Kontakte in welchen Zuständen leitend sind. Entscheidend sind Verständlichkeit und die korrekte Zuordnung der Kontakte, nicht das Auswendiglernen einer Kabelfarbe. Selbstlerner nutzen dafür ausschliesslich Zeichnungen oder Kleinspannungsmodelle. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Skizziere für einen fiktiven Flur eine Leuchte mit zwei Bedienstellen. Erstelle eine Wahrheitstabelle und kontrolliere die Leuchtenzustände. Erkläre danach, welche zusätzliche Dokumentation ein Betrieb für eine reale 230-Volt-Ausführung benötigen würde. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Erst die logische Funktion klären, dann das passende Schaltprinzip wählen. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Wechsel-/Kreuz-/Taster-/Stromstossschaltung im Schema; Ausführungssymbole nach IEC, Klemmen- und Aderlisten. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIN Teile 4/5; IEC 60617 (Zeichen). Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Von der Raumplanung zur Klemmenliste","bridge":"Ein Installationsplan zeigt, wo Verbraucher und Betriebsmittel vorgesehen sind. Der Stromlaufplan erläutert ihre elektrische Funktion. Materialliste, Aderverzeichnis und Zeitkalkulation entstehen aus dieser Grundlage, dürfen aber nicht ohne Prüfung als Ausführungsstand verstanden werden. Änderungen müssen in allen betroffenen Unterlagen nachgeführt werden.","exercise":"Kompletter Plan eines fiktiven 3-Zimmer-Grundrisses, keine reale Installation. Halte zusätzlich die Antwort auf die Frage «Welche Schaltung ist klassisch für zwei unabhängige Bedienstellen einer Leuchte vorgesehen?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erstelle für einen simulierten Raum eine Raumliste, eine Funktionsskizze, eine Materialliste und markiere den Revisionsstand.","solution":"Erst die logische Funktion klären, dann das passende Schaltprinzip wählen. Der Merksatz lautet: Erst die logische Funktion klären, dann das passende Schaltprinzip wählen. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Welche Schaltung ist klassisch für zwei unabhängige Bedienstellen einer Leuchte vorgesehen?","options":["Nur ein einfacher Serienschalter","Wechselschaltung","Ein Transformator ohne Schalter"],"c":1,"why":"Erst die logische Funktion klären, dann das passende Schaltprinzip wählen.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Erst die logische Funktion klären, dann das passende Schaltprinzip wählen."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Ein Transformator ohne Schalter","Erst die logische Funktion klären, dann das passende Schaltprinzip wählen.","Nur ein einfacher Serienschalter"],"c":1,"why":"Der Merksatz lautet: Erst die logische Funktion klären, dann das passende Schaltprinzip wählen.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Erst die logische Funktion klären, dann das passende Schaltprinzip wählen."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["4.1.1b–4.1.3b; 4.2.1b–4.2.4b","Norm-/Regelwerk: NIN Teile 4/5; IEC 60617 (Zeichen)","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Wechsel-/Kreuz-/Taster-/Stromstossschaltung im Schema"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Lichtschaltungen im Funktionsschema» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Lichtschaltungen im Funktionsschema» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Kompletter Plan eines fiktiven 3-Zimmer-Grundrisses, keine reale Installation. Halte zusätzlich die Antwort auf die Frage «Welche Schaltung ist klassisch für zwei unabhängige Bedienstellen einer Leuchte vorgesehen?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erstelle für einen simulierten Raum eine Raumliste, eine Funktionsskizze, eine Materialliste und markiere den Revisionsstand."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Welche Schaltung ist klassisch für zwei unabhängige Bedienstellen einer Leuchte vorgesehen?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/2.07-A.svg"},{"id":"2.07-B","year":2,"title":"Anschlussplan, Aderliste und Betriebsmittelkennzeichen","goals":["Wohnungsgrundriss mit Licht und Steckdosen","Trasse, Leitungswege, Befestigungen, Verteilerplatz"],"parts":[{"heading":"Dein Dozent erklärt: Anschlussplan, Aderliste und Betriebsmittelkennzeichen","text":"Heute geht es um anschlussplan, aderliste und betriebsmittelkennzeichen. Sobald mehrere Leitungen und Klemmen vorkommen, muss der Plan exakt benennen, welches Gerät mit welchem Anschluss verbunden ist. Ader- und Kabellisten unterstützen Materialplanung, Montage und spätere Fehlersuche. Eine unvollständige Dokumentation ist häufig Ursache von Fehlanschlüssen. Gegenüber einer rein mechanischen Stückliste ergänzt die Elektrodokumentation die elektrische Funktion und Schutzbezüge. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Verwende für ein 12-Volt-Relaismodell fünf Bauteile und erstelle zu jeder Verbindung eine Aderlistenzeile mit Startklemme, Zielklemme und Kennzeichen. Überprüfe, dass keine Klemme doppelt widersprüchlich zugeordnet wurde. Ergänze eine geänderte Version mit Revisionsstand. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Eine Verbindung ist erst nachvollziehbar, wenn Anfang und Ende eindeutig sind. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Wohnungsgrundriss mit Licht und Steckdosen; Trasse, Leitungswege, Befestigungen, Verteilerplatz. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIN Teile 4/5; IEC 60617 (Zeichen). Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Von der Raumplanung zur Klemmenliste","bridge":"Ein Installationsplan zeigt, wo Verbraucher und Betriebsmittel vorgesehen sind. Der Stromlaufplan erläutert ihre elektrische Funktion. Materialliste, Aderverzeichnis und Zeitkalkulation entstehen aus dieser Grundlage, dürfen aber nicht ohne Prüfung als Ausführungsstand verstanden werden. Änderungen müssen in allen betroffenen Unterlagen nachgeführt werden.","exercise":"Kompletter Plan eines fiktiven 3-Zimmer-Grundrisses, keine reale Installation. Halte zusätzlich die Antwort auf die Frage «Was gehört in eine Aderliste?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erstelle für einen simulierten Raum eine Raumliste, eine Funktionsskizze, eine Materialliste und markiere den Revisionsstand.","solution":"Eine Verbindung ist erst nachvollziehbar, wenn Anfang und Ende eindeutig sind. Der Merksatz lautet: Eine Verbindung ist erst nachvollziehbar, wenn Anfang und Ende eindeutig sind. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was gehört in eine Aderliste?","options":["Nur die Raumhöhe","Nur das Herstellungsjahr","Start- und Zielanschluss"],"c":2,"why":"Eine Verbindung ist erst nachvollziehbar, wenn Anfang und Ende eindeutig sind.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Eine Verbindung ist erst nachvollziehbar, wenn Anfang und Ende eindeutig sind."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Nur die Raumhöhe","Eine Verbindung ist erst nachvollziehbar, wenn Anfang und Ende eindeutig sind.","Nur das Herstellungsjahr"],"c":1,"why":"Der Merksatz lautet: Eine Verbindung ist erst nachvollziehbar, wenn Anfang und Ende eindeutig sind.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Eine Verbindung ist erst nachvollziehbar, wenn Anfang und Ende eindeutig sind."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["4.1.1b–4.1.3b; 4.2.1b–4.2.4b","Norm-/Regelwerk: NIN Teile 4/5; IEC 60617 (Zeichen)","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Wohnungsgrundriss mit Licht und Steckdosen"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Anschlussplan, Aderliste und Betriebsmittelkennzeichen» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Anschlussplan, Aderliste und Betriebsmittelkennzeichen» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Kompletter Plan eines fiktiven 3-Zimmer-Grundrisses, keine reale Installation. Halte zusätzlich die Antwort auf die Frage «Was gehört in eine Aderliste?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erstelle für einen simulierten Raum eine Raumliste, eine Funktionsskizze, eine Materialliste und markiere den Revisionsstand."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Was gehört in eine Aderliste?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/2.07-B.svg"},{"id":"2.07-C","year":2,"title":"Material- und Zeitkalkulation eines fiktiven Grundrisses","goals":["Stückliste und Material-/Zeitkalkulation","Revisionsstand und Planvergleich zur Baustelle"],"parts":[{"heading":"Dein Dozent erklärt: Material- und Zeitkalkulation eines fiktiven Grundrisses","text":"Heute geht es um material- und zeitkalkulation eines fiktiven grundrisses. Ein Ausführungsplan wird erst als Projekt belastbar, wenn Mengen, Materialkosten, Montageaufwand und Unsicherheiten erfasst sind. Leitungslängen erhalten zweckmässige Zuschläge für Wege und Anschlüsse. Die Arbeitszeit hängt nicht nur von Quadratmetern, sondern von Bauweise, Zugänglichkeit und Koordination ab. Eine nachvollziehbare Kalkulation dokumentiert ihre Annahmen. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Ein Grundriss enthält zwölf Steckdosen und vier Leuchten. Erstelle eine Stückliste für fiktive Einbauorte, Leitungswege, Befestigung und Kennzeichnung. Gib keine reale normkonforme Dimensionierung vor, solange die notwendigen NIN-Daten und der Anlagenkontext fehlen. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Kalkulation ist eine dokumentierte Schätzung, keine reine Stückzählung. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Stückliste und Material-/Zeitkalkulation; Revisionsstand und Planvergleich zur Baustelle. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIN Teile 4/5; IEC 60617 (Zeichen). Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Von der Raumplanung zur Klemmenliste","bridge":"Ein Installationsplan zeigt, wo Verbraucher und Betriebsmittel vorgesehen sind. Der Stromlaufplan erläutert ihre elektrische Funktion. Materialliste, Aderverzeichnis und Zeitkalkulation entstehen aus dieser Grundlage, dürfen aber nicht ohne Prüfung als Ausführungsstand verstanden werden. Änderungen müssen in allen betroffenen Unterlagen nachgeführt werden.","exercise":"Kompletter Plan eines fiktiven 3-Zimmer-Grundrisses, keine reale Installation. Halte zusätzlich die Antwort auf die Frage «Was sollte eine seriöse Materialkalkulation enthalten?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erstelle für einen simulierten Raum eine Raumliste, eine Funktionsskizze, eine Materialliste und markiere den Revisionsstand.","solution":"Kalkulation ist eine dokumentierte Schätzung, keine reine Stückzählung. Der Merksatz lautet: Kalkulation ist eine dokumentierte Schätzung, keine reine Stückzählung. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was sollte eine seriöse Materialkalkulation enthalten?","options":["Mengen, Annahmen und Reserven","Nur die Farbe der Dose","Nur pauschale Gesamtkosten ohne Inhalt"],"c":0,"why":"Kalkulation ist eine dokumentierte Schätzung, keine reine Stückzählung.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Kalkulation ist eine dokumentierte Schätzung, keine reine Stückzählung."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Nur die Farbe der Dose","Kalkulation ist eine dokumentierte Schätzung, keine reine Stückzählung.","Nur pauschale Gesamtkosten ohne Inhalt"],"c":1,"why":"Der Merksatz lautet: Kalkulation ist eine dokumentierte Schätzung, keine reine Stückzählung.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Kalkulation ist eine dokumentierte Schätzung, keine reine Stückzählung."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["4.1.1b–4.1.3b; 4.2.1b–4.2.4b","Norm-/Regelwerk: NIN Teile 4/5; IEC 60617 (Zeichen)","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Stückliste und Material-/Zeitkalkulation"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Material- und Zeitkalkulation eines fiktiven Grundrisses» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Material- und Zeitkalkulation eines fiktiven Grundrisses» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Kompletter Plan eines fiktiven 3-Zimmer-Grundrisses, keine reale Installation. Halte zusätzlich die Antwort auf die Frage «Was sollte eine seriöse Materialkalkulation enthalten?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Erstelle für einen simulierten Raum eine Raumliste, eine Funktionsskizze, eine Materialliste und markiere den Revisionsstand."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Was sollte eine seriöse Materialkalkulation enthalten?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/2.07-C.svg"},{"id":"2.08-A","year":2,"title":"Lichtstrom, Beleuchtungsstärke und Lichtstärke","goals":["Lichtstrom (lm), Beleuchtungsstärke (lx), Lichtstärke (cd)","LED, Vorschaltgerät/Treiber, Effizienz"],"parts":[{"heading":"Dein Dozent erklärt: Lichtstrom, Beleuchtungsstärke und Lichtstärke","text":"Heute geht es um lichtstrom, beleuchtungsstärke und lichtstärke. Lichttechnik beschreibt verschiedene Grössen. Der Lichtstrom in Lumen charakterisiert abgegebenes Licht, die Beleuchtungsstärke in Lux den auftreffenden Lichtstrom pro Fläche, und die Lichtstärke in Candela die Richtungsverteilung. Die einfache Formel E = Φ/A gilt nur für idealisierte gleichmässige Beleuchtung. Reale Räume benötigen Angaben zu Geometrie, Reflexion und Leuchtenverteilung. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Für einen gedachten Lichtstrom von 1000 Lumen, der ideal vollständig gleichmässig auf fünf Quadratmeter fällt, ergibt sich eine Beleuchtungsstärke von 200 Lux. Erkläre, warum diese Rechnung keine fertige Raumlichtplanung ersetzt. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Lumen, Lux und Candela sind nicht austauschbar. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Lichtstrom (lm), Beleuchtungsstärke (lx), Lichtstärke (cd); LED, Vorschaltgerät/Treiber, Effizienz. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIN Teile 4/5; SN EN 12464-1 (Arbeitsstätten – Überblick). Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Lichttechnik setzt Geometrie voraus","bridge":"Lichtstrom bezeichnet die abgegebene Lichtmenge, Beleuchtungsstärke den auf eine Fläche bezogenen Anteil. Die einfache Beziehung E = Φ/A ist nur für ein ideal gleichmässig beleuchtetes Modell geeignet. Für reale Räume sind Leuchtenverteilung, Reflexionen, Raumgeometrie und Wartung zu berücksichtigen. LED-Treiber und Steuerung beeinflussen zusätzlich Energiebedarf und Qualität.","exercise":"Lichtplanung mit Herstellerdaten und Software; optional 12-V-LED-Lernmodell. Halte zusätzlich die Antwort auf die Frage «Was ist die Einheit der Beleuchtungsstärke?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Berechne im idealisierten Modell den benötigten Lichtstrom für 20 m² bei 300 lx; nenne mindestens drei Grenzen der Rechnung.","solution":"Lumen, Lux und Candela sind nicht austauschbar. Der Merksatz lautet: Lumen, Lux und Candela sind nicht austauschbar. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was ist die Einheit der Beleuchtungsstärke?","options":["Ohm","Watt","Lux"],"c":2,"why":"Lumen, Lux und Candela sind nicht austauschbar.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Lumen, Lux und Candela sind nicht austauschbar."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Ohm","Lumen, Lux und Candela sind nicht austauschbar.","Watt"],"c":1,"why":"Der Merksatz lautet: Lumen, Lux und Candela sind nicht austauschbar.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Lumen, Lux und Candela sind nicht austauschbar."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte wegung erkannt, Leuchte ein, Nachlaufzeit aktiv, zurück zu aus. Ergänze eine Bedingung für Tageslicht. Prüfe in einer Simulation, ob unerwünschtes Flackern oder sehr kurze Einschaltphasen auftreten können. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Eine Steuerung braucht ein klares Verhalten in jeder Eingangssituation. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Präsenzmelder, Dämmerungsschalter, Zeitschaltuhr; Anwendungsfälle Treppenhaus, Aussenbereich, Arbeitsraum. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIN Teile 4/5; SN EN 12464-1 (Arbeitsstätten – Überblick). Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Lichttechnik setzt Geometrie voraus","bridge":"Lichtstrom bezeichnet die abgegebene Lichtmenge, Beleuchtungsstärke den auf eine Fläche bezogenen Anteil. Die einfache Beziehung E = Φ/A ist nur für ein ideal gleichmässig beleuchtetes Modell geeignet. Für reale Räume sind Leuchtenverteilung, Reflexionen, Raumgeometrie und Wartung zu berücksichtigen. LED-Treiber und Steuerung beeinflussen zusätzlich Energiebedarf und Qualität.","exercise":"Lichtplanung mit Herstellerdaten und Software; optional 12-V-LED-Lernmodell. Halte zusätzlich die Antwort auf die Frage «Welche Aufgabe hat ein Nachlaufzeitglied typischerweise?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Berechne im idealisierten Modell den benötigten Lichtstrom für 20 m² bei 300 lx; nenne mindestens drei Grenzen der Rechnung.","solution":"Eine Steuerung braucht ein klares Verhalten in jeder Eingangssituation. Der Merksatz lautet: Eine Steuerung braucht ein klares Verhalten in jeder Eingangssituation. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Welche Aufgabe hat ein Nachlaufzeitglied typischerweise?","options":["Erhöhung der Netzfrequenz","Verzögertes Ausschalten nach einem Ereignis","Schutzleiterprüfung"],"c":1,"why":"Eine Steuerung braucht ein klares Verhalten in jeder Eingangssituation.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Eine Steuerung braucht ein klares Verhalten in jeder Eingangssituation."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Schutzleiterprüfung","Eine Steuerung braucht ein klares Verhalten in jeder Eingangssituation.","Erhöhung der Netzfrequenz"],"c":1,"why":"Der Merksatz lautet: Eine Steuerung braucht ein klares Verhalten in jeder Eingangssituation.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Eine Steuerung braucht ein klares Verhalten in jeder Eingangssituation."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["3.5.1b; 5.2.1b–5.2.3b","Norm-/Regelwerk: NIN Teile 4/5; SN EN 12464-1 (Arbeitsstätten – Überblick)","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Präsenzmelder, Dämmerungsschalter, Zeitschaltuhr"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Lichtsteuerung und Präsenzanwendungen» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Lichtsteuerung und Präsenzanwendungen» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall vollständig?"},{"title":"Praxisfall lösen","minutes":7,"instruction":"Lichtplanung mit Herstellerdaten und Software; optional 12-V-LED-Lernmodell. Halte zusätzlich die Antwort auf die Frage «Welche Aufgabe hat ein Nachlaufzeitglied typischerweise?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Berechne im idealisierten Modell den benötigten Lichtstrom für 20 m² bei 300 lx; nenne mindestens drei Grenzen der Rechnung."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Welche Aufgabe hat ein Nachlaufzeitglied typischerweise?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/2.08-C.svg"},{"id":"2.09-A","year":2,"title":"Elektrische Wärme und Wärmemenge","goals":["Ohmsche und induktive Wärmeverbraucher","Heizleistung und thermische Energie; Wärmekapazität"],"parts":[{"heading":"Dein Dozent erklärt: Elektrische Wärme und Wärmemenge","text":"Heute geht es um elektrische wärme und wärmemenge. Elektrische Widerstandsheizung wandelt elektrische Energie in Wärme um. Für vereinfachte Aufgaben können Energie aus Leistung und Zeit sowie Wärme aus Masse, Wärmekapazität und Temperaturänderung berechnet werden. Dabei sind Verluste an die Umgebung zu beachten. Thermostate beeinflussen den zeitlichen Energieverbrauch und die Temperaturregelung, nicht die physikalische Grundgleichung. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Ein Heizgerät mit 500 Watt läuft idealisiert eine halbe Stunde bei voller Leistung. Es verbraucht 0,25 Kilowattstunden elektrische Energie. Überlege, warum die tatsächliche Temperaturerhöhung eines Raums nicht allein aus dieser Zahl bestimmt werden kann. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Energieaufnahme ist nicht gleich Temperaturerhöhung eines gesamten Systems. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Ohmsche und induktive Wärmeverbraucher; Heizleistung und thermische Energie; Wärmekapazität. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: Lehrplan 3.5/5.2; NEV; NIN Teil 5. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Wärme und elektrische Energie getrennt bilanzieren","bridge":"Elektrische Energie wird aus Leistung und Betriebszeit berechnet. Bei Wärmesystemen muss zwischen elektrischer Eingangsenergie, nutzbarer Wärme und möglichen Verlusten unterschieden werden. Nennleistung ist nicht immer identisch mit tatsächlicher Leistungsaufnahme im Tagesprofil. Kostenvergleiche benötigen Tarif, zeitlichen Verlauf und gegebenenfalls Regelstrategie.","exercise":"Rechenfälle einer Küche, einer Wärmepumpe und eines elektrischen Heizregisters; nur Planung. Halte zusätzlich die Antwort auf die Frage «Wie viel Energie verbrauchen 500 W in 0,5 h?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Vergleiche bei einem angenommenen Tarif die Energiekosten zweier unterschiedlicher Nutzungsprofile und notiere, welche Annahmen offen sind.","solution":"Energieaufnahme ist nicht gleich Temperaturerhöhung eines gesamten Systems. Der Merksatz lautet: Energieaufnahme ist nicht gleich Temperaturerhöhung eines gesamten Systems. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Wie viel Energie verbrauchen 500 W in 0,5 h?","options":["0,25 kWh","250 kWh","1 kWh"],"c":0,"why":"Energieaufnahme ist nicht gleich Temperaturerhöhung eines gesamten Systems.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Energieaufnahme ist nicht gleich Temperaturerhöhung eines gesamten Systems."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["250 kWh","Energieaufnahme ist nicht gleich Temperaturerhöhung eines gesamten Systems.","1 kWh"],"c":1,"why":"Der Merksatz lautet: Energieaufnahme ist nicht gleich Temperaturerhöhung eines gesamten Systems.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Energieaufnahme ist nicht gleich Temperaturerhöhung eines gesamten Systems."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation."}],"refs":["3.5.2b–3.5.8b; 5.2.3b–5.2.7b","Norm-/Regelwerk: Lehrplan 3.5/5.2; NEV; NIN Teil 5","NIN-Detailstellen erst nach Einsicht in Originalausgabe fachlich bestätigen"],"steps":[{"title":"Einstieg und Vorwissen","minutes":3,"instruction":"Formuliere ohne Nachschlagen eine erste Antwort auf das Lernziel: Ohmsche und induktive Wärmeverbraucher"},{"title":"Fachliche Erklärung erarbeiten","minutes":6,"instruction":"Lies die Abschnitte «Dein Dozent erklärt: Elektrische Wärme und Wärmemenge» und «Gemeinsam durch ein Fachbeispiel». Notiere die entscheidende Ursache-Wirkungs-Beziehung in eigenen Worten."},{"title":"Lernlogik-Grafik auswerten","minutes":3,"instruction":"Erkläre anhand der Grafik den Übergang zwischen «Dein Dozent erklärt: Elektrische Wärme und Wärmemenge» und «Das musst Du behalten». Ist der dargestellte Ablauf für Deinen Fall stimme, welche Informationen ein autorisierter Installationsbetrieb zusätzlich für eine tatsächliche Installation benötigt. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Typenschild und Installationsanleitung sind technische Pflichtlektüre. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Motorische Lasten, Anlaufstrom (Grundlagen); Energieverbrauch und Effizienzangaben. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: Lehrplan 3.5/5.2; NEV; NIN Teil 5. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Wärme und elektrische Energie getrennt bilanzieren","bridge":"Elektrische Energie wird aus Leistung und Betriebszeit berechnet. Bei Wärmesystemen muss zwischen elektrischer Eingangsenergie, nutzbarer Wärme und möglichen Verlusten unterschieden werden. Nennleistung ist nicht immer identisch mit tatsächlicher Leistungsaufnahme im Tagesprofil. Kostenvergleiche benötigen Tarif, zeitlichen Verlauf und gegebenenfalls Regelstrategie.","exercise":"Rechenfälle einer Küche, einer Wärmepumpe und Verbraucherwahl aus Nutzungsprofil und Schutzkonzept"],"parts":[{"heading":"Dein Dozent erklärt: Energieeffizienz und Kostenvergleich","text":"Heute geht es um energieeffizienz und kostenvergleich. Wirkungsgrad, Nutzungsdauer und Lastprofil helfen beim Vergleich elektrischer Verbraucher. Die Jahresenergie in Kilowattstunden ist das Integral beziehungsweise die Summe aus Leistung mal Zeit. Für wirtschaftliche Beurteilungen kommen Energiepreis, Anschaffung, Wartung und unterschiedliche Betriebsbedingungen hinzu. Energieeinsparung muss zur gleichen erbrachten Nutzfunktion verglichen werden. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Eine 20-Watt-Leuchte ist an 1000 Stunden pro Jahr eingeschaltet und verbraucht damit 20 Kilowattstunden. Eine 8-Watt-Alternative braucht bei gleicher Laufzeit 8 Kilowattstunden. Der rechnerische Unterschied beträgt 12 Kilowattstunden pro Jahr; gleiche Lichtqualität ist separat nachzuweisen. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Fair vergleichen heisst gleiche Funktion und gleiche Randbedingungen ansetzen. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Herstelleranschlussbilder lesen; Verbraucherwahl aus Nutzungsprofil und Schutzkonzept. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: Lehrplan 3.5/5.2; NEV; NIN Teil 5. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Wärme und elektrische Energie getrennt bilanzieren","bridge":"Elektrische Energie wird aus Leistung und Betriebszeit berechnet. Bei Wärmesystemen muss zwischen elektrischer Eingangsenergie, nutzbarer Wärme und möglichen Verlusten unterschieden werden. Nennleistung ist nicht immer identisch mit tatsächlicher Leistungsaufnahme im Tagesprofil. Kostenvergleiche benötigen Tarif, zeitlichen Verlauf und gegebenenfalls Regelstrategie.","exercise":"Rechenfälle einer Küche, einer Wärmepumpe und eines elektrischen Heizregisters; nur Planung. Halte zusätzlich die Antwort auf die Frage «Wie viel spart 20 W gegenüber 8 W bei 1000 Stunden?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Vergleiche bei einem angenommenen Tarif die Energiekosten zweier unterschiedlicher Nutzungsprofile und notiere, welche Annahmen offen sind.","solution":"Fair vergleichen heisst gleiche Funktion und gleiche Randbedingungen ansetzen. Der Merksatz lautet: Fair vergleichen heisst gleiche Funktion und gleiche Randbedingungen ansetzen. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Wie viel spart 20 W gegenüber 8 W bei 1000 Stunden?","options":["0,012 kWh","120 kWh","12 kWh"],"c":2,"why":"Fair vergleichen heisst gleiche Funktion und gleiche Randbedingungen ansetzen.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Fair vergleichen heisst gleiche Funktion und gleich xisfall lösen","minutes":7,"instruction":"Rechenfälle einer Küche, einer Wärmepumpe und eines elektrischen Heizregisters; nur Planung. Halte zusätzlich die Antwort auf die Frage «Wie viel spart 20 W gegenüber 8 W bei 1000 Stunden?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Vergleiche bei einem angenommenen Tarif die Energiekosten zweier unterschiedlicher Nutzungsprofile und notiere, welche Annahmen offen sind."},{"title":"Kontrollfragen lösen","minutes":4,"instruction":"Beantworte zunächst ohne Lösungshilfe: Wie viel spart 20 W gegenüber 8 W bei 1000 Stunden?"},{"title":"Reflexion und offene Normen","minutes":2,"instruction":"Halte eine Unsicherheit und eine relevante Fachquelle fest. Beurteile, was Du selbst berechnen kannst und was eine berechtigte Fachperson prüfen muss."}],"visual":"visuals/2.09-C.svg"},{"id":"2.10-A","year":2,"title":"Datenübertragung und Netzwerktopologien","goals":["Analoge und digitale Übertragung, Bandbreite","Strukturierte Verkabelung, Sternstruktur und Patchfelder"],"parts":[{"heading":"Dein Dozent erklärt: Datenübertragung und Netzwerktopologien","text":"Heute geht es um datenübertragung und netzwerktopologien. Digitale Kommunikation überträgt Information in definierten Signalen und Protokollen. Bandbreite, Datenrate, Verzögerung und Übertragungsqualität sind unterschiedliche Eigenschaften. In der strukturierten Gebäudeverkabelung ist eine Sternstruktur mit zentralem Verteiler häufig. Passive Verkabelung und aktive Netzwerktechnik dürfen in Plänen nicht vermischt werden. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Zeichne ein einfaches Heimnetz mit Router, Switch, Patchfeld und drei Netzwerkdosen. Trenne die feste Verkabelung von Patchkabeln und aktiven Geräten. Dokumentiere Portnummern und die Funktion des zentralen Verteilers. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Topologie und Portdokumentation machen Fehler auffindbar. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Analoge und digitale Übertragung, Bandbreite; Strukturierte Verkabelung, Sternstruktur und Patchfelder. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: Lehrplan 3.4/6.1; ISO/IEC 11801 (Gebäudeverkabelung – Überblick). Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Kommunikation benötigt Schichten und Topologie","bridge":"Ein physisch angeschlossenes Kabel garantiert noch keine funktionierende Datenverbindung. Physikalische Übertragungsstrecke, Adressierung und Anwendungsebene sind unterschiedliche Diagnoseebenen. Twisted Pair, Glasfaser und Funk haben eigene Eigenschaften und Einschränkungen. Eine systematische Fehlersuche beginnt daher mit einer eindeutigen Netzskizze.","exercise":"Ethernet-Patchkabel an Lernmaterial herstellen und mittels einfacher Prüfgeräte prüfen. Halte zusätzlich die Antwort auf die Frage «Welche Topologie ist für strukturierte Gebäudeverkabelung verbreitet?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Zeichne ein kleines Heimnetz mit Router, Switch und zwei Geräten. Notiere je ein mögliches Problem auf physikalischer und IP-Ebene.","solution":"Topologie und Portdokumentation machen Fehler auffindbar. Der Merksatz lautet: Topologie und Portdokumentation machen Fehler auffindbar. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Welche Topologie ist für strukturierte Gebäudeverkabelung verbreitet?","options":["Zufälliger Ring ohne Dokumentation","Sternstruktur","Nur eine Busleitung für jeden Dienst"],"c":1,"why":"Topologie und Portdokumentation machen Fehler auffindbar.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Topologie und Portdokumentation machen Fehler auffindbar."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Nur eine Busleitung für jeden Dienst","Topologie und Portdokumentation machen Fehler auffindbar.","Zufälliger Ring ohne Dokumentation"],"c":1,"why":"Der Merksatz lautet: Topologie und Portdokumentation machen Fehler auffindbar.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Topologie und Portdokumentation machen Fehler auffindbar."},{"q":"Wie lässt sich dieses Thema im Selbststudium verantwortbar vertiefen?","options":["Ohne Kontroll- oder Bewilligungsprüfung gleich an einer bestehenden Netzinstallation arbeiten","Mit einer dokumentierten Berechnung, einem Plan, Datenblättern oder einer sicheren Simulation und anschliessender Fachprüfung","Die geltenden Normen durch Erfahrungswerte ersetzen"],"c":1,"why":"Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.\n\nBezug zum Unterrichtsteil «Sicherheit, Normen und Praxistransfer»: Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder r elektrischen Messungen","text":"Heute geht es um sichtprüfung vor elektrischen messungen. Die baubegleitende Erstprüfung beginnt nicht einfach mit dem Druck auf eine Messtaste. Sichtprüfung klärt, ob die Anlage ihrer Planung entspricht, geeignete Betriebsmittel verwendet und Schutz- sowie Kennzeichnungsanforderungen beachtet wurden. Prüfungen müssen geplant, dokumentiert und von dazu befähigten Personen durchgeführt werden. Der folgende Unterricht beschreibt die Logik, nicht die Erlaubnis zur Messung an Hausinstallationen. Wir arbeiten dabei bewusst mit einem technischen Modell, damit wir Wirkung, Voraussetzungen und Grenzen sauber voneinander unterscheiden können.","formula":""},{"heading":"Gemeinsam durch ein Fachbeispiel","text":"Wir betrachten folgenden Fall. Erstelle anhand eines fiktiven Fotos einer Verteileranlage eine Sichtprüfliste: Dokumentation, Beschriftung, Schutzleiterkonzept, Leitungseinführungen und Zugänglichkeit. Ergänze, welche Informationen erst durch geeignete fachkundige Messung ermittelt werden können. Überlege zum Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Sichtprüfung und Messtechnik ergänzen einander. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: Sichtprüfung, Schutzleiter-/Potenzialausgleichsprüfung; Isolationsmessung, Schleifenimpedanz/Kurzschlussstrom. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIN Teil 6; NIV Art. 24; ESTI zu Erstprüfungen. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Prüfen ist eine begründete Reihenfolge","bridge":"Eine Erstprüfung verbindet Sichtprüfung, geeignete Messverfahren und dokumentierte Bewertung. Der Prüfende muss wissen, welche Eigenschaft der Anlage untersucht wird und welche Aussage ein bestimmtes Messresultat erlaubt. Für reale Prüfverfahren und Grenzwerte gelten die aktuelle Norm und die erforderliche Qualifikation. Im Selbststudium werden Messberichte interpretiert, nicht Netzprüfungen ausgeführt.","exercise":"Theoretische Messprotokolle auswerten; reale Installationsmessungen nur im beaufsichtigten Ausbildungslabor. Halte zusätzlich die Antwort auf die Frage «Was kommt vor einer begründeten Messstrategie?» schriftlich fest und erkläre Deinen Lösungsweg. Keine eigenmächtigen Netzarbeiten. Entwirf ein Musterprüfprotokoll mit Prüfschritt, Zweck, Messwert, Bewertung und fehlender Grundlage für einen fiktiven Fall.","solution":"Sichtprüfung und Messtechnik ergänzen einander. Der Merksatz lautet: Sichtprüfung und Messtechnik ergänzen einander. Modell, Theorie und echte berechtigte Installation sind unterschiedliche Ebenen.","quiz":[{"q":"Was kommt vor einer begründeten Messstrategie?","options":["Überbrücken von Schutzeinrichtungen","Blindes Einschalten","Sichtprüfung und Prüfplanung"],"c":2,"why":"Sichtprüfung und Messtechnik ergänzen einander.\n\nBezug zum Unterrichtsteil «Das musst Du behalten»: Der Kern dieser Lektion lautet: Sichtprüfung und Messtechnik ergänzen einander."},{"q":"Welche Aussage ist als fachlicher Merksatz richtig?","options":["Überbrücken von Schutzeinrich  Schluss: Welche Angaben sind sicher bekannt, welche Annahmen wurden getroffen und welcher Nachweis fehlt für einen realen Anwendungsfall?","formula":""},{"heading":"Das musst Du behalten","text":"Der Kern dieser Lektion lautet: Unterschiedliche Schutzmerkmale verlangen unterschiedliche Prüfverfahren. Beschreibe den Zusammenhang mit eigenen Worten und lege eine passende Zeichnung oder Berechnung dazu. Die dazugehörigen Lernziele sind: RCD-Prüfung und Abschaltbedingungen; Polaritäts- und Funktionsprüfung. Ein auswendig gelernter Merksatz allein genügt noch nicht, wenn sich die Rahmenbedingungen verändern.","formula":""},{"heading":"Sicherheit, Normen und Praxistransfer","text":"Die praktische Umsetzung an 230/400-Volt-Installationen sowie Arbeiten an spannungsführenden PV-Strings ist keine private Selbstlernübung. Je nach Tätigkeit braucht es den entsprechend berechtigten Betrieb, fachkundige Anleitung und die vorgeschriebenen Prüfungen. Als thematische Recherche ist im Arbeitsplan vermerkt: Norm-/Regelwerk: NIN Teil 6; NIV Art. 24; ESTI zu Erstprüfungen. Diese Angaben sind Orientierungsstellen; genaue Grenzwerte, Vorschriftentexte und eventuelle Ausnahmen müssen in der gültigen Originalnorm oder beim ESTI überprüft werden. Als sichere Vertiefung bearbeitest Du einen Plan, ein Datenblatt, eine Berechnung oder eine Simulation.","formula":""}],"bridgeTitle":"Prüfen ist eine begründete Reihenfolge","bridge":"Eine Erstprüfung verbindet Sichtprüfung, geeignete Messverfahren und dokumentierte Bewertung. Der Prüfende muss wissen, welche Eigenschaft der Anlage untersucht wird und welche Aussage ein bestimmtes Messresultat erlaubt. Für reale Prüfverfahren und Grenzwerte gelten die aktuelle Norm und die erforderliche Qualifikation. Im Selbststudium werden Messberichte interpretiert, nicht Netzprüfungen ausgeführt.","exercise":"Theoretische Messprotokolle auswerten; reale Installationsmessungen nur im beaufsichtigten Ausbildungslabor. Halte zusätzlich die Antwort auf die Frage
