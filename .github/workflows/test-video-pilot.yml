name: Test audiovisuelle Pilotlektion 1.03-B (v0.12.0)

on:
  push:
    branches: [feature/video-pilot-ohms-103b-20261119]
    paths: [.github/workflows/test-video-pilot.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  video-pilot:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Quellstand holen
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript und Unterricht prüfen
        run: |
          node --check video-pilot.js
          node --check app.js
          node --check offline.js
          node tools/test_video_pilot.js
          node tools/test_sw_routes.js
          node tools/test_audio_zip_import.js
          node tools/test_ios_audio_retry.js
          python tools/quality_check.py
          python tools/quality_check_multimedia.py
          python tools/validate_v0118.py
          python tools/check_github_release.py
      - name: Offline-PWA mit Pilot aufbauen
        run: |
          python tools/build_site.py --mode remote
          python tools/verify_pages_package.py --site dist
          python - <<'PY'
          import json
          from pathlib import Path
          d=Path('dist')
          assert (d/'video-pilot.js').stat().st_size>15000
          assert (d/'video-pilot.css').stat().st_size>5000
          assert json.loads((d/'version.json').read_text())['version']=='0.12.0'
          assert len(json.loads((d/'audio-manifest.json').read_text())['tracks'])==178
          print('PASS 178 audio files retained; pilot and version metadata in build')
          PY
      - name: Chromium installieren
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Echter Chrome-Test auf iPhone-Grösse mit Thorsten-High-MP3
        run: |
          python -m http.server 8787 --bind 127.0.0.1 --directory dist >/tmp/efz-serve.log 2>&1 &
          sleep 2
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--autoplay-policy=no-user-gesture-required']});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:2});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:8787/?lesson=1.03-B&tab=video',{waitUntil:'domcontentloaded'});
            await page.locator('#video-pilot').waitFor({state:'visible',timeout:25000});
            const titles=await page.locator('#vp-chapters [data-vp-chapter]').count();
            if(titles!==19)throw Error('Expected 19 scene selectors, got '+titles);
            await page.waitForFunction(()=>window.ElektroAudio?.getState().loaded===true,{timeout:35000});
            await page.waitForFunction(()=>window.ElektroAudio?.getState().duration>300,{timeout:35000});
            const duration=await page.evaluate(()=>window.ElektroAudio.getState().duration);
            await page.locator('[data-vp-chapter="8"]').click();
            await page.waitForTimeout(500);
            console.log('AFTER CHAPTER CLICK',JSON.stringify(await page.evaluate(()=>({url:location.href,stage:document.querySelector('#vp-stage')?.innerHTML.slice(0,600)||null,pilotPresent:!!document.querySelector('#video-pilot'),view:document.querySelector('#main')?.textContent.slice(0,150)||null,audio:window.ElektroAudio?.getState()}))),JSON.stringify(errors));
            const chapter=await page.locator('#vp-stage h3').textContent({timeout:5000});
            if(!chapter.includes('U-I-Kennlinie'))throw Error('Chapter/audio seek misaligned: '+chapter);
            await page.locator('#vp-play').click();
            await page.waitForTimeout(1200);
            let playing=await page.evaluate(()=>window.ElektroAudio.getState());
            if(!playing.playing)throw Error('Play failed: '+JSON.stringify(playing));
            await page.locator('#vp-play').click();
            await page.locator('#vp-speed').selectOption('1.3');
            const rate=await page.locator('#vp-speed').inputValue();
            if(rate!=='1.3')throw Error('Rate selector failed');
            const overflow=await page.evaluate(()=>({
               scrollWidth:document.documentElement.scrollWidth,
               innerWidth:window.innerWidth
            }));
            if(overflow.scrollWidth>overflow.innerWidth+2)throw Error('Horizontal overflow on iPhone viewport: '+JSON.stringify(overflow));
            if(errors.length)throw Error('Runtime errors: '+errors.join(' | '));
            console.log('BROWSER PASS: 19 interactive scenes, Thorsten High duration '+duration.toFixed(1)+'s, chapter seeking, play/pause, 1.3x speed, 390px responsive');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

# Regression: pilot controls must not trigger global data-lesson navigation.
