name: Elektro EFZ – Pull Request Prüfung
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: efz-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 1.01-B Branch für sequenzielle Vertonung auschecken
        if: github.event.pull_request.head.ref == 'feature/masterclass-101b-production' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Piper Thorsten High und FFmpeg installieren
        if: github.event.pull_request.head.ref == 'feature/masterclass-101b-production' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          python -m pip install --disable-pip-version-check 'piper-tts==1.2.0'
          sudo apt-get update -qq
          sudo apt-get install -qq -y ffmpeg
          mkdir -p .voice-cache
          curl -fL --retry 5 --retry-delay 4 --connect-timeout 30 -o .voice-cache/de_DE-thorsten-high.onnx 'https://huggingface.co/rhasspy/piper-voices/resolve/main/de/de_DE/thorsten/high/de_DE-thorsten-high.onnx'
          curl -fL --retry 5 --retry-delay 4 --connect-timeout 30 -o .voice-cache/de_DE-thorsten-high.onnx.json 'https://huggingface.co/rhasspy/piper-voices/resolve/main/de/de_DE/thorsten/high/de_DE-thorsten-high.onnx.json'
          echo '9df1c43c61149ef9b39e618e2b861fbe41e1fcea9390b2dac62e8761573ea4f1  .voice-cache/de_DE-thorsten-high.onnx' | sha256sum -c -

      - name: Nächste Lektion 1.01-B rendern – nur diese Lektion
        if: github.event.pull_request.head.ref == 'feature/masterclass-101b-production' && github.event.pull_request.head.repo.full_name == github.repository
        run: python tools/render_masterclass_sequential.py --lesson 1.01-B

      - name: 1.01-B Audio-, Quellen-, PCM- und Szenenprüfung
        if: github.event.pull_request.head.ref == 'feature/masterclass-101b-production' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          python tools/check_sequential_master.py --lesson 1.01-B
          python tools/check_masterclass_101b_draft.py
          node --check masterclasses/1.01-B/visuals.js
          node --check masterclasses/player.js

      - name: Playwright und Browser-Engines installieren
        if: github.event.pull_request.head.ref == 'feature/masterclass-101b-production' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps webkit chromium

      - name: iPhone-WebKit und Desktop-Chromium – 24 Szenen, Audio-Synchronität und Lernkontrolle
        if: github.event.pull_request.head.ref == 'feature/masterclass-101b-production' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          python tools/range_http_server.py --root . --port 8787 >/tmp/efz-101b-range.log 2>&1 &
          sleep 2
          mkdir -p screenshots
          node <<'JS'
          const {webkit,chromium}=require('playwright');
          (async()=>{
            for(const [engine,name] of [[webkit,'webkit'],[chromium,'chromium']]){
              for(const width of [390,1280]){
                const tag=name+'-'+width;
                const browser=await engine.launch({headless:true,args:name==='chromium'?['--autoplay-policy=no-user-gesture-required']:[]});
                const page=await browser.newPage({viewport:{width,height:width===390?844:820},isMobile:width===390,hasTouch:width===390});
                const errors=[];
                page.on('pageerror',e=>errors.push(e.message));
                await page.goto('http://127.0.0.1:8787/masterclass.html?lesson=1.01-B',{waitUntil:'domcontentloaded'});
                await page.waitForFunction(()=>window.ElektroMaster?.getTimeline()?.beats?.length===24,null,{timeout:20000});
                await page.waitForFunction(()=>document.querySelector('#mc-audio').duration>200,null,{timeout:30000});
                const data=await page.evaluate(()=>{
                  const t=window.ElektroMaster.getTimeline();
                  return {duration:document.querySelector('#mc-audio').duration,expected:t.duration_seconds,
                    sampleRate:t.sample_rate,durationSamples:t.duration_samples,beats:t.beats};
                });
                if(Math.abs(data.duration-data.expected)>.4)throw Error(tag+' MP3/timeline duration mismatch');
                if(data.durationSamples!==data.beats.at(-1).end_sample)throw Error(tag+' PCM total sample mismatch');
                // Seek while paused and wait for the browser's actual seeked event.
                // A fixed waitForFunction on a stale activeBeat can time out in WebKit.
                await page.evaluate(()=>document.querySelector('#mc-audio').pause());
                for(let i=0;i<data.beats.length;i++){
                  const b=data.beats[i];
                  if(b.start_sample+b.duration_samples!==b.end_sample)throw Error(tag+' bad PCM beat '+i);
                  if(i&&data.beats[i-1].end_sample!==b.start_sample)throw Error(tag+' PCM gap/overlap '+i);
                  if(Math.abs(b.start-b.start_sample/data.sampleRate)>1e-7)throw Error(tag+' non-sample-derived start '+i);
                  await page.evaluate(async t=>{
                    const a=document.querySelector('#mc-audio');
                    await new Promise((resolve,reject)=>{
                      const timer=setTimeout(()=>reject(Error('seeked timeout')),5000);
                      a.addEventListener('seeked',()=>{clearTimeout(timer);resolve();},{once:true});
                      a.currentTime=t;
                    });
                  },b.start+.02);
                  await page.waitForFunction(i=>window.ElektroMaster.getActiveBeat()===i,i,{timeout:3000});
                  const scene=await page.evaluate(()=>({
                    svg:!!document.querySelector('#mc-stage svg'),
                    label:document.querySelector('#mc-stage svg')?.getAttribute('aria-label')||'',
                    overflow:document.documentElement.scrollWidth-innerWidth
                  }));
                  if(!scene.svg||!scene.label)throw Error(tag+' scene missing at beat '+i);
                  if(scene.overflow>3)throw Error(tag+' horizontal overflow at beat '+i);
                }
                const q=data.beats.at(-2);
                await page.locator('#mc-play').click();
                await page.waitForTimeout(500);
                if(await page.evaluate(()=>document.querySelector('#mc-audio').paused))throw Error(tag+' audio did not play');
                await page.locator('#mc-play').click();
                const sceneChecks=[
                  ['shock','KÖRPERDURCHSTRÖMUNG'],
                  ['arc','LICHTBOGEN'],
                  ['heat','THERMISCHE ÜBERLASTUNG'],
                  ['timeenergy','ENERGIE STEIGT MIT ZEIT'],
                  ['pv','PV: DC-QUELLE BLEIBT']
                ];
                for(const [visual,expected] of sceneChecks){
                  const beat=data.beats.find(x=>x.visual===visual);
                  await page.evaluate(async t=>{
                    const a=document.querySelector('#mc-audio');
                    await new Promise((resolve,reject)=>{
                      const timer=setTimeout(()=>reject(Error('seeked timeout')),5000);
                      a.addEventListener('seeked',()=>{clearTimeout(timer);resolve();},{once:true});
                      a.currentTime=t;
                    });
                  },beat.start+.02);
                  await page.waitForFunction(()=>!!document.querySelector('#mc-stage svg[aria-label]'),null,{timeout:3000});
                  const label=await page.locator('#mc-stage svg').getAttribute('aria-label');
                  if(!label.includes(expected))throw Error(tag+' wrong scene '+visual+': '+label);
                }
                await page.evaluate(async t=>{
                  const a=document.querySelector('#mc-audio');
                  await new Promise((resolve,reject)=>{
                    const timer=setTimeout(()=>reject(Error('seeked timeout')),5000);
                    a.addEventListener('seeked',()=>{clearTimeout(timer);resolve();},{once:true});
                    a.currentTime=t;
                  });
                },q.end+.02);
                await page.waitForFunction(()=>!document.querySelector('#mc-answer').hidden,null,{timeout:10000});
                if(!await page.evaluate(()=>document.querySelector('#mc-audio').paused))throw Error(tag+' quiz did not pause before answer');
                await page.screenshot({path:'screenshots/'+tag+'-quiz.png'});
                await page.locator('#mc-answer').click();
                await page.waitForTimeout(550);
                if(!(await page.locator('#mc-stage svg').getAttribute('aria-label')).includes('NEIN'))throw Error(tag+' answer scene missing');
                if(errors.length)throw Error(tag+' JavaScript errors: '+errors.join(' | '));
                console.log('PASS '+tag+': 24 beats; '+data.duration.toFixed(2)+'s; PCM sample indices; five animated scene types; pause-before-answer');
                await browser.close();
              }
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Allgemeine Kurs-, PWA- und Multimedia-Prüfung
        run: |
          python tools/quality_check.py
          python tools/quality_check_multimedia.py
          python tools/validate_v0118.py
          python tools/check_github_release.py
          node tools/test_sw_routes.js
          python tools/build_site.py --mode text
          python tools/verify_pages_package.py --site dist

      - name: 1.01-B Audio- und Browser-Nachweise sichern
        if: always() && github.event.pull_request.head.ref == 'feature/masterclass-101b-production'
        uses: actions/upload-artifact@v4
        with:
          name: masterclass-101b-browser-evidence
          path: |
            screenshots/*.png
            masterclasses/1.01-B/audio/masterclass.mp3
            masterclasses/1.01-B/audio/timeline.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Geprüfte Audio- und PCM-Dateien auf den Draft-Branch zurückschreiben
        if: success() && github.event.pull_request.head.ref == 'feature/masterclass-101b-production' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f masterclasses/1.01-B/audio/masterclass.mp3
          git add masterclasses/1.01-B/audio/timeline.json
          if ! git diff --cached --quiet; then
            git commit -m 'Render 1.01-B Thorsten High with exact PCM sample indices (draft)'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
