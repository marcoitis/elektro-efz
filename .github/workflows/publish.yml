name: Elektro EFZ – Qualitätssicherung (Text, Folien, PWA)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elektro-efz-quality
  cancel-in-progress: false

jobs:
  validate-pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
      - name: Python bereitstellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Node bereitstellen
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lektionsdaten und Offline-Funktionen prüfen
        run: |
          python tools/quality_check.py
          python tools/quality_check_multimedia.py
          python tools/validate_v0118.py
          python tools/validate_v093.py
          python tools/check_github_release.py
          node tools/test_sw_routes.js
          node tools/test_audio_zip_import.js
          for file in app.js audio-engine.js audio-zip-import.js offline.js sw.js; do node --check "$file"; done
      - name: PWA mit 178 Online-Audios und Update-Prüfung bauen
        run: |
          python tools/build_site.py --mode remote
          python tools/verify_pages_package.py --site dist
      - name: Prüfung abschliessen
        run: |
          echo 'Qualitätsprüfung erfolgreich. GitHub Pages veröffentlicht separat über den nativen Pages-Workflow.'
