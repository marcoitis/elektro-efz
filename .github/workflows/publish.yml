name: Elektro EFZ – Qualitätssicherung (Text, Folien, PWA)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elektro-efz-quality
  cancel-in-progress: false

jobs:
  validate-pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
      - name: Python bereitstellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Node bereitstellen
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lektionsdaten und Offline-Funktionen prüfen
        run: |
          python tools/quality_check.py
          python tools/quality_check_multimedia.py
          python tools/validate_v0118.py
          python tools/validate_v093.py
          python tools/check_github_release.py
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          items=json.loads(Path('masterclasses/catalog.json').read_text())['lessons']
          assert len(items)==len(set(x['id'] for x in items))==178
          for lesson in items:
           if lesson['status']=='ready' and lesson['id']!='1.03-B':
            lid=lesson['id']
            subprocess.run(['python','tools/check_sequential_master.py','--lesson',lid],check=True)
            subprocess.run(['node','--check',str(Path('masterclasses')/lid/'visuals.js')],check=True)
          print('PASS: Every ready masterclass checked against its edited script, MP3 and exact timeline')
          PY
          node --check masterclasses/player.js
          node tools/test_sw_routes.js
          node tools/test_audio_zip_import.js
          for file in app.js audio-engine.js audio-zip-import.js offline.js sw.js; do node --check "$file"; done
      - name: PWA mit 178 Online-Audios und Update-Prüfung bauen
        run: |
          python tools/build_site.py --mode remote
          python tools/verify_pages_package.py --site dist
      - name: Prüfung abschliessen
        run: |
          echo 'Qualitätsprüfung erfolgreich. GitHub Pages veröffentlicht separat über den nativen Pages-Workflow.'
