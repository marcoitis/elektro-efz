name: Elektro EFZ – GitHub Pages (Text, Folien, PWA)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: elektro-efz-pages
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
      - name: Python bereitstellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Node bereitstellen
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lektionsdaten und Offline-Funktionen prüfen
        run: |
          python tools/quality_check.py
          python tools/quality_check_multimedia.py
          python tools/validate_v0118.py
          python tools/validate_v093.py
          python tools/check_github_release.py
          node tools/test_sw_routes.js
          node tools/test_audio_zip_import.js
          for file in app.js audio-engine.js audio-zip-import.js offline.js sw.js; do node --check "$file"; done
      - name: PWA mit 178 Online-Audios und Update-Prüfung bauen
        run: |
          python tools/build_site.py --mode remote
          python tools/verify_pages_package.py --site dist
      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5
      - name: Statische App hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Öffentliche Seitenversion und Audio-Manifest nach Deployment kontrollieren
        run: |
          ROOT="https://marcoitis.github.io/elektro-efz"
          PASSED=0
          for CHECK in $(seq 1 15); do
            if curl -fsSL --max-time 12 --retry 2 --header 'Cache-Control: no-cache' "$ROOT/version.json?commit=$GITHUB_SHA" -o /tmp/live-version.json &&
               curl -fsSL --max-time 12 --retry 2 --header 'Cache-Control: no-cache' "$ROOT/audio-manifest.json?commit=$GITHUB_SHA" -o /tmp/live-audio.json &&
               python - <<'PY'
          import json
          v=json.load(open('/tmp/live-version.json'))
          a=json.load(open('/tmp/live-audio.json'))
          expected=json.load(open('version.json'))['build']
          assert v['build']==expected,(v,expected)
          assert len(a['tracks'])==178 and a['generated']==178,(a.get('generated'),len(a['tracks']))
          print('LIVE PASS',v['version'],'MP3:',len(a['tracks']))
          PY
            then
              PASSED=1
              break
            fi
            echo "Warte auf aktive Veröffentlichung, Versuch $CHECK von 15"
            sleep 5
          done
          if [ "$PASSED" -ne 1 ]; then echo "Live-Version oder Audio-Manifest nicht aktuell" >&2; exit 1; fi
