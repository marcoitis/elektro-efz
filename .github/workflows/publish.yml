name: Elektro EFZ – GitHub Pages (Text, Folien, PWA)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: elektro-efz-pages
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
      - name: Python bereitstellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Node bereitstellen
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lektionsdaten und Offline-Funktionen prüfen
        run: |
          python tools/quality_check.py
          python tools/quality_check_multimedia.py
          python tools/validate_v0118.py
          python tools/validate_v093.py
          python tools/check_github_release.py
          node tools/test_sw_routes.js
      - name: Textbasierte PWA bauen (keine automatische MP3-Erzeugung)
        run: |
          python tools/build_site.py --mode text
          python tools/verify_pages_package.py --site dist
      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5
      - name: Statische App hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
