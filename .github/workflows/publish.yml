name: Elektro EFZ – kostenlose MP3-Erzeugung und GitHub Pages

on:
  workflow_dispatch:
    inputs:
      audio_mode:
        description: "Audio-Umfang (normalerweise alle Unterrichtslektionen)"
        required: true
        default: all
        type: choice
        options:
          - all
          - probe
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - '*.webmanifest'
      - '*.png'
      - 'tts_scripts/**'
      - 'tools/**'
      - '.github/workflows/publish.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: elektro-efz-github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Dateien laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sprach- und Audio-Werkzeuge installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          python -m pip install piper-tts==1.2.0

      - name: Vorhandene Aufnahmen und Stimmenmodell wiederverwenden
        uses: actions/cache@v4
        with:
          path: |
            .audio-cache
            .voice-cache
          key: elektro-audio-v080-${{ hashFiles('tts_scripts/*.txt') }}
          restore-keys: |
            elektro-audio-v080-

      - name: Kostenlose männliche Stimme (Thorsten High) bereitstellen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .voice-cache
          MODEL=".voice-cache/de_DE-thorsten-high.onnx"
          CONFIG="${MODEL}.json"
          BASE="https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/de/de_DE/thorsten/high"
          EXPECTED_SHA256="9df1c43c61149ef9b39e618e2b861fbe41e1fcea9390b2dac62e8761573ea4f1"
          if [ ! -s "$MODEL" ] || ! echo "$EXPECTED_SHA256  $MODEL" | sha256sum --check --status; then
            echo "Lade offizielles Piper-Sprachmodell Thorsten High herunter ..."
            curl --fail --location --show-error --silent --retry 5 --retry-all-errors \
              --connect-timeout 30 --max-time 900 \
              "$BASE/de_DE-thorsten-high.onnx" --output "${MODEL}.download"
            echo "$EXPECTED_SHA256  ${MODEL}.download" | sha256sum --check
            mv "${MODEL}.download" "$MODEL"
          fi
          if [ ! -s "$CONFIG" ]; then
            echo "Lade Sprachmodell-Konfiguration herunter ..."
            curl --fail --location --show-error --silent --retry 5 --retry-all-errors \
              --connect-timeout 30 --max-time 120 \
              "$BASE/de_DE-thorsten-high.onnx.json" --output "${CONFIG}.download"
            python -m json.tool "${CONFIG}.download" >/dev/null
            mv "${CONFIG}.download" "$CONFIG"
          fi
          python -m json.tool "$CONFIG" >/dev/null
          echo "Stimme Thorsten High ist vollständig vorhanden und überprüft."

      - name: Unterrichtsaufnahmen kostenlos erstellen
        env:
          AUDIO_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.audio_mode || 'all' }}
        run: |
          python tools/generate_audio.py --model .voice-cache/de_DE-thorsten-high.onnx --config .voice-cache/de_DE-thorsten-high.onnx.json --mode "$AUDIO_MODE"
          python tools/build_site.py --mode "$AUDIO_MODE"

      - name: GitHub Pages einrichten
        uses: actions/configure-pages@v5

      - name: Webseite mit MP3-Dateien paketieren
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Elektro-EFZ-Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
