 text-anchor="start">Aktor / Ausgang</text><rect x="47" y="435" width="1100" height="142" rx="12" fill="#FFFFFF" stroke="#CBDCE4" stroke-width="2" /><text x="69" y="475" fill="#18364C" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start">Beispiel: Taster sendet → Leuchte bleibt aus</text><text x="69" y="517" fill="#C54B4B" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Telegramm beobachtet  ≠  Empfängerfunktion bestätigt  ≠  Last geprüft</text><text x="69" y="548" fill="#29485A" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">ETS-Projektstand und sichere Nachweise für jede Ebene protokollieren.</text><rect x="30" y="626" width="1140" height="51" rx="8" fill="#E8F3F7" stroke="none" stroke-width="0" /><text x="50" y="659" fill="#29485A" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">Didaktisches Lernschema – keine normativ oder fachlich freigegebene Installation</text></svg>