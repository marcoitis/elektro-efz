<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="3.06-C Diagnose, Fernzugriff und Dokumentation"><title>3.06-C: Diagnose, Fernzugriff und Dokumentation</title><desc>Individuelle didaktische Fachgrafik: kein freigegebener Installationsplan. Sicherheits- und Normenvorgaben gesondert prüfen.</desc><rect x="0" y="0" width="1200" height="700" rx="0" fill="#F3F7FA" stroke="none" stroke-width="0" /><rect x="0" y="0" width="1200" height="94" rx="0" fill="#18364C" stroke="none" stroke-width="0" /><text x="35" y="59" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="start">3.06-C · Diagnose, Fernzugriff und Dokumentation</text><text x="42" y="140" fill="#18364C" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start">Vier Diagnoseebenen – bestätigte Beobachtung je Schritt</text><rect x="45" y="226" width="253" height="148" rx="12" fill="#FFFFFF" stroke="#CBDCE4" stroke-width="2" /><rect x="45" y="226" width="7" height="148" rx="0" fill="#197CA1" stroke="#197CA1" stroke-width="0" /><text x="64" y="260" fill="#18364C" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">1. Bus</text><text x="64" y="294" fill="#667B8A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">Versorgung / Linie</text><line x1="300" y1="302" x2="335" y2="302" stroke="#667B8A" stroke-width="4" stroke-linecap="round" /><line x1="335" y1="302" x2="322.58207108109" y2="308.46490845758075" stroke="#667B8A" stroke-width="3" stroke-linecap="round" /><line x1="335" y1="302" x2="322.58207108109" y2="295.53509154241925" stroke="#667B8A" stroke-width="3" stroke-linecap="round" /><rect x="340" y="226" width="253" height="148" rx="12" fill="#FFFFFF" stroke="#CBDCE4" stroke-width="2" /><rect x="340" y="226" width="7" height="148" rx="0" fill="#178773" stroke="#178773" stroke-width="0" /><text x="359" y