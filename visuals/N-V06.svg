<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img"><title>Bauartnachweis und Stücknachweis</title><desc>Individuelles didaktisches Fachmodell für N-V06; keine freigegebene Installationszeichnung.</desc><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f4f8fb" stroke="#f4f8fb" stroke-width="0"/><rect x="0" y="0" width="1280" height="96" rx="0" fill="#18384D" stroke="#18384D" stroke-width="0"/><text x="39" y="61" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="36" fill="#ffffff" text-anchor="start">N-V06  |  Bauartnachweis und Stücknachweis</text><rect x="40" y="116" width="1200" height="515" rx="17" fill="#ffffff" stroke="#d2e1e9" stroke-width="2"/><rect x="82" y="190" width="518" height="331" rx="14" fill="#eaf4f8" stroke="#247DA0" stroke-width="3"/><rect x="676" y="190" width="518" height="331" rx="14" fill="#e8f5ed" stroke="#258365" stroke-width="3"/><text x="341" y="240" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="34" fill="#18384D" text-anchor="middle">BAUARTNACHWEIS</text><text x="934" y="240" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="34" fill="#18384D" text-anchor="middle">STÜCKNACHWEIS</text><text x="123" y="308" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="25" fill="#18384D" text-anchor="start">• Konstruktion / System</text><text x="123" y="354" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="25" fill="#18384D" text-anchor="start">• Einsatzgrenzen</text><text x="123" y="400" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="25" fill="#18384D" text-anchor="start">• thermische Eignung</text><text x="123" y="446" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="25" fill="#18384D" text-anchor="start">• Kurzschlussfestigkeit</text><text x="711" y="308" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="25" fill="#18384D" text-anchor="start">• konkretes Exemplar</text><text x="711" y="354" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="25" fill="#18384D" text-anchor="start">• korrekte Verdrahtung</text><text x="711" y="400" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="25" fill="#18384D" text-anchor="start">• Funktion / Prüfung</text><text x="711" y="446" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="25" fill="#18384D" text-anchor="start">• Seriennummer + Freigabe</text><text x="640" y="572" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="26" fill="#A95154" text-anchor="middle">Zwei Nachweise mit verschiedenem Gegenstand</text><rect x="52" y="654" width="1176" height="43" rx="8" fill="#e0eef4" stroke="#d2e3ed" stroke-width="1"/><text x="70" y="681" font-family="Arial,Helvetica,sans-serif" font-weight="normal" font-size="20" fill="#18384D" text-anchor="start">Didaktisches Schaubild – keine freigegebene Installations- oder Messanleitung</text></svg>