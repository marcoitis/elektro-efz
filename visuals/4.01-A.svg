<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="4.01-A Komplexe Impedanz und Wechselstromnetze"><title>4.01-A: Komplexe Impedanz und Wechselstromnetze</title><desc>Didaktische individuelle Modellgrafik, keine fachlich oder normativ freigegebene Installationsanleitung.</desc><rect x="0" y="0" width="1200" height="700" rx="0" fill="#f3f7fa" stroke="none" stroke-width="0" /><rect x="0" y="0" width="1200" height="92" rx="0" fill="#17354b" stroke="none" stroke-width="0" /><text x="33" y="60" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="start">4.01-A · Komplexe Impedanz und Wechselstromnetze</text><text x="49" y="139" fill="#17354b" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Impedanzdreieck R + jX-L</text><line x1="140" y1="488" x2="365" y2="488" stroke="#187da4" stroke-width="5" stroke-dasharray="none" stroke-linecap="round" /><line x1="365" y1="488" x2="365" y2="188" stroke="#d28f37" stroke-width="5" stroke-dasharray="none" stroke-linecap="round" /><line x1="140" y1="488" x2="365" y2="188" stroke="#21866c" stroke-width="5" stroke-dasharray="none" stroke-linecap="round" /><text x="256" y="520" fill="#187da4" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle">R = 30 Ω</text><text x="382" y="342" fill="#d28f37" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">X-L = 40 Ω</text><text x="170" y="313" fill="#21866c" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start">|Z| = 50 Ω</text><path d="M 235 488 A 95 95 0 0 0 198 413" fill="none" stroke="#627b8b" stroke-width="3" /><text x="231" y="456" fill="#627b8b" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">φ</text><rect x="663" y="206" width="479" height="293" rx="10" fill="#ffffff" stroke="#c9d9e3" stroke-width="2" /><text x="688" y="252" fill="#17354b" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start">Z = 30 + j40 Ω</text><text x="688" y="304" fill="#187da4" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start">|Z| = √(30² + 40²) = 50 Ω</text><text x="688" y="356" fill="#d28f37" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start">φ ≈ +53,1° (induktiv)</text><text x="688" y="408" fill="#21866c" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start">100 V / 50 Ω = 2 A</text><text x="688" y="456" fill="#25475a" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">P = 120 W · Q = 160 var</text><rect x="33" y="627" width="1134" height="51" rx="8" fill="#e7f2f8" stroke="none" stroke-width="0" /><text x="48" y="659" fill="#25475a" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">Didaktisches Modell – konkrete Fach- und Normenfreigabe für reale Anlagen ausstehend</text></svg>