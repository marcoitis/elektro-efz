<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650"><title>1.11-B – Didaktische Fachtafel</title><rect width="1100" height="650" fill="#f6fafc"/><g font-family="Arial,sans-serif" fill="#17334b"><text x="35" y="50" font-size="30" font-weight="bold">1.11-B · Basisschutz, Fehlerschutz und Zusatzschutz differenzieren</text><text x="35" y="82" font-size="17">Didaktisches Funktionsmodell · keine Installations- oder Freigabeanweisung</text></g><defs><marker id="tip" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3 z" fill="#2b788d"/></marker></defs><rect x="35" y="165" width="322" height="140" rx="16" fill="#e4f0f5" stroke="#52748a" stroke-width="2"/><text x="196.0" y="207" font-size="23" text-anchor="middle" fill="#17334b" font-family="Arial" font-weight="bold">Basisschutz</text><text x="196.0" y="245" font-size="16" text-anchor="middle" fill="#17334b" font-family="Arial">Berührung im Normalbetrieb</text><rect x="389" y="165" width="322" height="140" rx="16" fill="#e4f0f5" stroke="#52748a" stroke-width="2"/><text x="550.0" y="207" font-size="23" text-anchor="middle" fill="#17334b" font-family="Arial" font-weight="bold">Fehlerschutz</text><text x="550.0" y="245" font-size="16" text-anchor="middle" fill="#17334b" font-family="Arial">Bestimmte Fehlerzustände</text><rect x="743" y="165" width="322" height="140" rx="16" fill="#e4f0f5" stroke="#52748a" stroke-width="2"/><text x="904.0" y="207" font-size="23" text-anchor="middle" fill="#17334b" font-family="Arial" font-weight="bold">Zusatzschutz</text><text x="904.0" y="245" font-size="16" text-anchor="middle" fill="#17334b" font-family="Arial">Weitere Risikominderung</text><rect x="120" y="390" width="860" height="115" rx="16" fill="#fff1db" stroke="#52748a" stroke-width="2"/><text x="550.0" y="432" font-size="23" text-anchor="middle" fill="#17334b" font-family="Arial" font-weight="bold">Gesamtkonzept statt Einzelgerät</text><text x="550.0" y="470" font-size="16" text-anchor="middle" fill="#17334b" font-family="Arial">RCD ≠ Überstromschutz · Schutzklasse ≠ improvisierte Verdrahtung</text><path d="M196 307 L196 380" stroke="#2b788d" stroke-width="5" fill="none" marker-end="url(#tip)"/><path d="M550 307 L550 380" stroke="#2b788d" stroke-width="5" fill="none" marker-end="url(#tip)"/><path d="M904 307 L904 380" stroke="#2b788d" stroke-width="5" fill="none" marker-end="url(#tip)"/><text x="40" y="605" font-family="Arial" font-size="17" fill="#496578">Theoretische Schulung: Arbeiten an realen elektrischen Installationen nur mit geeigneter Befähigung/Berechtigung.</text></svg>