<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="3.04-A Drehstrom-Asynchronmotor und Schlupf"><title>3.04-A – Drehstrom-Asynchronmotor und Schlupf</title><desc>Individuelle didaktische Fachgrafik – keine Installationsplanung. Schema und Rechenwerte sind Modelle, kein freigegebener Installationsplan.</desc><rect x="0" y="0" width="1200" height="700" rx="0" fill="#F4F8FB" stroke="none" stroke-width="0" /><rect x="0" y="0" width="1200" height="92" rx="0" fill="#18364C" stroke="none" stroke-width="0" /><text x="35" y="56" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start">3.04-A · Drehstrom-Asynchronmotor und Schlupf</text><text x="47" y="141" fill="#18364C" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start">Vierpoliger Asynchronmotor · 50 Hz · 1440 min⁻¹ Rotor</text><text x="70" y="216" fill="#18364C" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Drehfeld: ns = 1500 min⁻¹</text><rect x="70" y="248" width="950" height="35" rx="8" fill="#E7F1F7" stroke="none" stroke-width="2" /><rect x="70" y="248" width="950" height="35" rx="8" fill="#177FA5" stroke="none" stroke-width="2" /><text x="70" y="333" fill="#18364C" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Rotor: n = 1440 min⁻¹</text><rect x="70" y="365" width="950" height="35" rx="8" fill="#E7F1F7" stroke="none" stroke-width="2" /><rect x="70" y="365" width="912" height="35" rx="8" fill="#23826D" stroke="none" stroke-width="2" /><line x1="1020" y1="237" x2="1020" y2="413" stroke="#D59433" stroke-width="3" stroke-linecap="round" stroke-dasharray="6,8" /><text x="1050" y="303" fill="#D59433" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start">60/min</text><rect x="62" y="469" width="1090" height="123" rx="12" fill="#FFFFFF" stroke="#C8D7E2" stroke-width="2" /><text x="88" y="514" fill="#177FA5" font-family="Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start">s = (1500 − 1440) / 1500 = 0,04 = 4 %</text><text x="88" y="559" fill="#254254" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Schlupf ist Voraussetzung für das Induktions-Drehmoment im Motorbetrieb.</text><rect x="28" y="625" width="1144" height="52" rx="8" fill="#E7F1F7" stroke="none" stroke-width="2" /><text x="47" y="657" fill="#254254" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Lernschema • Modellannahmen beachten • keine normativ freigegebene Installationszeichnung</text></svg>