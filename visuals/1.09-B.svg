<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-label="1.09-B · Spule, Induktion und Energie"><title>1.09-B · Spule, Induktion und Energie</title><desc>Sechswindungs-Spulensymbol und ein ideales Induktionsbeispiel mit L 0,2 Henry, Stromänderung 0,5 Ampere in 0,01 Sekunden; induktive Spannung 10 Volt; Energiebeispiel 12,5 Millijoule.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#173042}.title{font-size:22px;font-weight:700}.sub{font-size:13px;fill:#486478}.lab{font-size:15px;font-weight:600}.tiny{font-size:12px;fill:#456278}.line{stroke:#176d85;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none}.thin{stroke:#789aa9;stroke-width:1.4;fill:none}.accent{stroke:#df8732;stroke-width:3;fill:none}.dashed{stroke:#df8732;stroke-width:2;stroke-dasharray:7 5;fill:none}.panel{fill:#fff;stroke:#d5e4eb;stroke-width:1.5}.formula{font-size:20px;font-weight:700;fill:#bd691e}</style><rect width="960" height="460" rx="16" fill="#f3f8fb"/><text x="28" y="38" class="title">1.09-B · Spule, Induktion und Energie</text><text x="28" y="61" class="sub">Didaktisches Physikmodell – nur Simulation oder geeignete Kleinspannung, keine Installationsplanung</text><rect x="35" y="95" width="545" height="300" rx="9" class="panel"/><text x="307" y="123" class="lab" text-anchor="middle">Spule: Änderung des Stromes erzeugt Spannung</text><path d="M85 230 L145 230" class="line"/><path d="M430 230 L505 230" class="line"/><path d="M145 230 C152 186,185 186,192 230" class="line"/><path d="M192 230 C199 186,232 186,239 230" class="line"/><path d="M239 230 C246 186,279 186,286 230" class="line"/><path d="M286 230 C293 186,326 186,333 230" class="line"/><path d="M333 230 C340 186,373 186,380 230" class="line"/><path d="M380 230 C387 186,420 186,427 230" class="line"/><path d="M210 168 l30 0 l-8 -6 m8 6 l-8 6" class="accent"/><text x="306" y="165" class="tiny" text-anchor="middle">magnetische Flussrichtung (schematisch)</text><text x="300" y="289" class="formula" text-anchor="middle">uL = L · ΔI / Δt</text><text x="300" y="323" class="tiny" text-anchor="middle">L = 0,20 H · ΔI = 0,50 A · Δt = 0,010 s</text><text x="300" y="355" class="formula" text-anchor="middle">uL = 10 V</text><rect x="610" y="95" width="315" height="300" rx="9" class="panel"/><text x="767" y="130" class="lab" text-anchor="middle">Magnetische Energie</text><text x="765" y="175" class="formula" text-anchor="middle">W = ½ · L · I²</text><text x="765" y="214" class="tiny" text-anchor="middle">L = 0,10 H</text><text x="765" y="240" class="tiny" text-anchor="middle">I = 0,50 A</text><text x="765" y="287" class="formula" text-anchor="middle">W = 0,0125 J</text><text x="765" y="327" class="tiny" text-anchor="middle">Abschalten: Energieabbau beachten</text><text x="28" y="443" class="tiny">Modellannahmen gelten nur unter den genannten idealisierten Bedingungen.</text></svg>