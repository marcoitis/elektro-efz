<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="3.05-B Zeitglieder, Signalfluss und Funktionsablauf"><title>3.05-B – Zeitglieder, Signalfluss und Funktionsablauf</title><desc>Individuelle didaktische Fachgrafik – keine Installationsplanung. Schema und Rechenwerte sind Modelle, kein freigegebener Installationsplan.</desc><rect x="0" y="0" width="1200" height="700" rx="0" fill="#F4F8FB" stroke="none" stroke-width="0" /><rect x="0" y="0" width="1200" height="92" rx="0" fill="#18364C" stroke="none" stroke-width="0" /><text x="35" y="56" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start">3.05-B · Zeitglieder, Signalfluss und Funktionsablauf</text><text x="45" y="140" fill="#18364C" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">Einschaltverzögerung TON mit 3 Sekunden</text><rect x="48" y="178" width="1097" height="369" rx="12" fill="#FFFFFF" stroke="#C8D7E2" stroke-width="2" /><text x="67" y="236" fill="#18364C" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start">Eingang</text><text x="67" y="401" fill="#18364C" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start">Ausgang</text><line x1="280" y1="258" x2="280" y2="477" stroke="#C8D7E2" stroke-width="2" stroke-linecap="round" stroke-dasharray="5,5" /><text x="280" y="507" fill="#6B8190" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">0 s</text><line x1="453" y1="258" x2="453" y2="477" stroke="#C8D7E2" stroke-width="2" stroke-linecap="round" stroke-dasharray="5,5" /><text x="453" y="507" fill="#6B8190" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">2 s</text><line x1="540" y1="258" x2="540" y2="477" stroke="#C8D7E2" stroke-width="2" stroke-linecap="round" stroke-dasharray="5,5" /><text x="540" y="507" fill="#6B8190" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">3 s</text><line x1="715" y1="258" x2="715" y2="477" stroke="#C8D7E2" stroke-width="2" stroke-linecap="round" stroke-dasharray="5,5" /><text x="715" y="507" fill="#6B8190" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">5 s</text><line x1="974" y1="258" x2="974" y2="477" stroke="#C8D7E2" stroke-width="2" stroke-linecap="round" stroke-dasharray="5,5" /><text x="974" y="507" fill="#6B8190" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">8 s</text><polyline points="280,333 280,275 453,275 453,333 540,333 540,275 974,275 974,333" fill="none" stroke="#177FA5" stroke-width="6" stroke-linejoin="round" /><polyline points="280,448 800,448 800,389 974,389" fill="none" stroke="#23826D" stroke-width="6" stroke-linejoin="round" /><text x="91" y="563" fill="#C65342" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start">Erster Impuls: 2 s → zu kurz. Zweiter Impuls: Einschalten nach 3 s.</text><rect x="28" y="625" width="1144" height="52" rx="8" fill="#E7F1F7" stroke="none" stroke-width="2" /><text x="47" y="657" fill="#254254" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Lernschema • Modellannahmen beachten • keine normativ freigegebene Installationszeichnung</text></svg>