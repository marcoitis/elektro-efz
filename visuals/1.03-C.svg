<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-label="1.03-C · Leistung und Energie"><title>1.03-C · Leistung und Energie</title><desc>12-Volt-Modell mit 24-Ohm-Last, Strom 0,5 Ampere, Leistung 6 Watt, Energie 1 Wattstunde in 10 Minuten.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#173042} .title{font-size:22px;font-weight:700} .sub{font-size:13px;fill:#486478} .lab{font-size:14px;font-weight:600} .tiny{font-size:12px;fill:#456278} .wire{stroke:#176d85;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none} .component{stroke:#176d85;stroke-width:3;fill:#fff;stroke-linejoin:round} .accent{stroke:#e28a32;stroke-width:2.5;fill:none} .node{fill:#176d85} .panel{fill:white;stroke:#d5e4eb;stroke-width:1.5} .formula{font-size:17px;font-weight:bold;fill:#c1681a}</style><rect x="0" y="0" width="960" height="440" rx="16" fill="#f3f8fb"/><text x="28" y="38" class="title">1.03-C · Leistung und Energie</text><text x="28" y="60" class="sub">Didaktisches Ersatzschaltbild · idealisierte Gleichstrommodelle · keine Installationsplanung</text><circle cx="92" cy="194" r="23" class="component"/><text x="92" y="189" class="lab" text-anchor="middle">+</text><text x="92" y="211" class="lab" text-anchor="middle">−</text><text x="54" y="234" class="tiny" text-anchor="middle">12 V</text><path class="wire" d="M92 85 L92 171"/><path class="wire" d="M92 217 L92 305"/><path class="wire" d="M92 85 L320 85"/><path class="wire" d="M320 85 L329 85"/><rect class="component" x="329" y="73" width="97" height="24" rx="1"/><path class="wire" d="M426 85 L435 85"/><text x="377.5" y="61" class="lab" text-anchor="middle">R = 24 Ω</text><path class="wire" d="M435 85 L602 85"/><path class="wire" d="M602 85 L602 305"/><path class="wire" d="M602 305 L92 305"/><text x="230" y="74" class="lab" text-anchor="middle">I = 0,5 A →</text><text x="700" y="125" class="lab" text-anchor="start">Leistung:</text><text x="700" y="150" class="formula" text-anchor="start">P = U · I</text><text x="700" y="180" class="tiny" text-anchor="start">P = 12 V · 0,5 A = 6 W</text><text x="700" y="228" class="lab" text-anchor="start">Energie in 10 min:</text><text x="700" y="252" class="tiny" text-anchor="start">E = 6 W · 1/6 h</text><rect x="680" y="268" width="230" height="35" rx="9" fill="#fff2e4" stroke="#edc399"/><text x="795.0" y="291" class="formula" text-anchor="middle">E = 1 Wh</text><text x="365" y="335" class="lab" text-anchor="middle">Bei gleichem R gilt P ∝ I²</text><text x="365" y="357" class="tiny" text-anchor="middle">Doppelter Strom → vierfache Verlustleistung</text><text x="28" y="423" class="tiny">Nur für Rechen- und Verständnisübungen an sicheren, strombegrenzten Kleinspannungsmodellen.</text></svg>