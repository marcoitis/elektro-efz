<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-label="1.06-B · Klemmen, Querverweise und Symbole"><title>1.06-B · Klemmen, Querverweise und Symbole</title><desc>Didaktisches Spulen-Kontakt-Modell mit Querverweis über zwei Blattorte, und fiktive Klemmenliste einer Kleinspannungsleuchte. Kennungen nicht normativ, nicht zur Ausführung.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#18364b}.title{font-size:24px;font-weight:700}.sub{font-size:12px;fill:#527083}.lab{font-size:15px;font-weight:600}.tiny{font-size:12px;fill:#4d6677}.formula{font-size:19px;fill:#b86b19;font-weight:700}.small{font-size:14px}.wire{stroke:#11718e;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:#8da7b6;stroke-width:1.5;fill:none;stroke-linecap:round}.dash{stroke:#db8928;stroke-width:2;stroke-dasharray:6 5;fill:none}.box{fill:white;stroke:#d7e5eb;stroke-width:1.8}</style><rect x="0" y="0" width="1100" height="560" rx="20" fill="#f2f7fa"/><text x="30" y="40" text-anchor="start" class="title">1.06-B · Klemmen, Querverweise und Symbole</text><text x="30" y="62" text-anchor="start" class="sub">Didaktisches Fachmodell · keine Installationsplanung · keine Ausführungsplanung · Schweizer Normenprüfung offen</text><rect x="26" y="89" width="640" height="414" rx="10" fill="white" stroke="#b9d0dc" stroke-width="1.5"/><rect x="694" y="89" width="380" height="414" rx="10" fill="white" stroke="#b9d0dc" stroke-width="1.5"/><text x="343" y="127" text-anchor="middle" class="lab">Eine Funktion, zwei Darstellungsorte</text><text x="200" y="172" text-anchor="middle" class="small">Blatt 1 · Steuerung</text><text x="515" y="172" text-anchor="middle" class="small">Blatt 2 · Anzeige</text><path d="M72 288 L138 288" class="wire"/><path d="M262 288 L312 288" class="wire"/><path d="M421 288 L435 288" class="wire"/><path d="M535 288 L609 288" class="wire"/><circle cx="200" cy="288" r="61" fill="#f2f7fa" stroke="#19728e" stroke-width="3"/><text x="200" y="284" text-anchor="middle" class="small">K-MODELL</text><text x="200" y="305" text-anchor="middle" class="tiny">Spule</text><rect x="435" y="263" width="100" height="52" rx="4" fill="#e7f0f4" stroke="#39748a" stroke-width="1.5"/><text x="485" y="284" text-anchor="middle" class="small">Kontakt</text><text x="485" y="306" text-anchor="middle" class="tiny">(Modell)</text><path d="M289 216 L440 216" class="dash"/><text x="366" y="204" text-anchor="middle" class="tiny">gleiche Gerätekennung</text><text x="340" y="350" text-anchor="middle" class="tiny">Zwischen Blättern kein durchgehender Leiter</text><text x="341" y="379" text-anchor="middle" class="small">Zusammenhang per Kennung / Querverweis</text><text x="341" y="424" text-anchor="middle" class="tiny">Kein Netzanschluss; Schema nicht IEC-validiert</text><text x="886" y="134" text-anchor="middle" class="lab">Klemmenliste (Übung)</text><rect x="733" y="157" width="305" height="35" rx="5" fill="#eef4f7" stroke="#c6d9e4" stroke-width="1.5"/><text x="885" y="179" text-anchor="middle" class="small">Q1:+  → S1:1</text><rect x="733" y="200" width="305" height="35" rx="5" fill="#eef4f7" stroke="#c6d9e4" stroke-width="1.5"/><text x="885" y="222" text-anchor="middle" class="small">S1:2  → X1:1</text><rect x="733" y="243" width="305" height="35" rx="5" fill="#eef4f7" stroke="#c6d9e4" stroke-width="1.5"/><text x="885" y="265" text-anchor="middle" class="small">X1:1  → L1:+</text><rect x="733" y="286" width="305" height="35" rx="5" fill="#eef4f7" stroke="#c6d9e4" stroke-width="1.5"/><text x="885" y="308" text-anchor="middle" class="small">L1:−  → Q1:−</text><text x="883" y="397" text-anchor="middle" class="tiny">Kennungen frei erfunden</text><text x="883" y="423" text-anchor="middle" class="tiny">Anschlussidentität ≠ Spannungsfreiheit</text><text x="30" y="540" text-anchor="start" class="sub">Bezeichnungen und Modellwerte nur für Unterricht; Produkte, Normen und Installation gesondert prüfen.</text></svg>