<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-label="1.05-C · Schutzarten und Umwelteinflüsse"><title>1.05-C · Schutzarten und Umwelteinflüsse</title><desc>Erläuterung IP 65 mit erster Kennziffer für Staub, zweiter Kennziffer für Wasserprüfung. UV, Temperatur, Kondensat, Chemikalien, Stösse, Kabelverschraubung und Dichtungen brauchen gesonderte Nachweise.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#18364b}.title{font-size:24px;font-weight:700}.sub{font-size:12px;fill:#527083}.lab{font-size:15px;font-weight:600}.tiny{font-size:12px;fill:#4d6677}.formula{font-size:19px;fill:#b86b19;font-weight:700}.small{font-size:14px}.wire{stroke:#11718e;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:#8da7b6;stroke-width:1.5;fill:none;stroke-linecap:round}.dash{stroke:#db8928;stroke-width:2;stroke-dasharray:6 5;fill:none}.box{fill:white;stroke:#d7e5eb;stroke-width:1.8}</style><rect x="0" y="0" width="1100" height="560" rx="20" fill="#f2f7fa"/><text x="30" y="40" text-anchor="start" class="title">1.05-C · Schutzarten und Umwelteinflüsse</text><text x="30" y="62" text-anchor="start" class="sub">Didaktisches Fachmodell · keine Installationsplanung · keine Ausführungsplanung · Schweizer Normenprüfung offen</text><rect x="28" y="90" width="580" height="415" rx="10" fill="white" stroke="#b9d0dc" stroke-width="1.5"/><rect x="635" y="90" width="435" height="415" rx="10" fill="white" stroke="#b9d0dc" stroke-width="1.5"/><text x="310" y="129" text-anchor="middle" class="lab">Beispiel: IP65 ist keine Allzweck-Freigabe</text><rect x="88" y="178" width="114" height="95" rx="10" fill="#e1edf3" stroke="#91adbf" stroke-width="2"/><text x="145" y="240" text-anchor="middle" class="title">IP</text><text x="145" y="300" text-anchor="middle" class="tiny">Bezeichnung</text><rect x="213" y="178" width="114" height="95" rx="10" fill="#e1edf3" stroke="#91adbf" stroke-width="2"/><text x="270" y="240" text-anchor="middle" class="title">6</text><text x="270" y="300" text-anchor="middle" class="tiny">Fremdkörper / Staub</text><rect x="347" y="178" width="114" height="95" rx="10" fill="#e1edf3" stroke="#91adbf" stroke-width="2"/><text x="404" y="240" text-anchor="middle" class="title">5</text><text x="404" y="300" text-anchor="middle" class="tiny">Wasserstrahl-Prüfung</text><text x="310" y="347" text-anchor="middle" class="small">Ziffern beschreiben definierte Prüfbedingungen</text><text x="310" y="391" text-anchor="middle" class="small">X bedeutet: Kennziffer hier nicht angegeben</text><text x="310" y="436" text-anchor="middle" class="small">Nicht jede höhere Ziffer ersetzt andere Prüfarten</text><text x="852" y="130" text-anchor="middle" class="lab">Zusätzliche Umweltfragen</text><circle cx="665" cy="166" r="5" fill="#d88d32" stroke="#d88d32" stroke-width="2"/><text x="685" y="171" text-anchor="start" class="small">UV / Sonne</text><text x="685" y="190" text-anchor="start" class="tiny">Produktnachweis erforderlich</text><circle cx="665" cy="227" r="5" fill="#d88d32" stroke="#d88d32" stroke-width="2"/><text x="685" y="232" text-anchor="start" class="small">Temperatur / Kondensat</text><text x="685" y="251" text-anchor="start" class="tiny">Einbausituation prüfen</text><circle cx="665" cy="288" r="5" fill="#d88d32" stroke="#d88d32" stroke-width="2"/><text x="685" y="293" text-anchor="start" class="small">Chemikalien / Salz</text><text x="685" y="312" text-anchor="start" class="tiny">Werkstoffverträglichkeit</text><circle cx="665" cy="349" r="5" fill="#d88d32" stroke="#d88d32" stroke-width="2"/><text x="685" y="354" text-anchor="start" class="small">Schlag / Vibration</text><text x="685" y="373" text-anchor="start" class="tiny">mechanischen Nachweis prüfen</text><circle cx="665" cy="410" r="5" fill="#d88d32" stroke="#d88d32" stroke-width="2"/><text x="685" y="415" text-anchor="start" class="small">Verschraubung / Dichtung</text><text x="685" y="434" text-anchor="start" class="tiny">Gesamtsystem beurteilen</text><text x="30" y="540" text-anchor="start" class="sub">Bezeichnungen und Modellwerte nur für Unterricht; Produkte, Normen und Installation gesondert prüfen.</text></svg>