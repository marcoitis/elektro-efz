<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-label="1.04-A · Serie und Parallel"><title>1.04-A · Serie und Parallel</title><desc>Links 100 und 200 Ohm in Reihe an 9 Volt, Ersatzwiderstand 300 Ohm. Rechts 100 und 200 Ohm parallel an 9 Volt, Ersatzwiderstand rund 66,7 Ohm.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#173042} .title{font-size:22px;font-weight:700} .sub{font-size:13px;fill:#486478} .lab{font-size:14px;font-weight:600} .tiny{font-size:12px;fill:#456278} .wire{stroke:#176d85;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none} .component{stroke:#176d85;stroke-width:3;fill:#fff;stroke-linejoin:round} .accent{stroke:#e28a32;stroke-width:2.5;fill:none} .node{fill:#176d85} .panel{fill:white;stroke:#d5e4eb;stroke-width:1.5} .formula{font-size:17px;font-weight:bold;fill:#c1681a}</style><rect x="0" y="0" width="960" height="440" rx="16" fill="#f3f8fb"/><text x="28" y="38" class="title">1.04-A · Serie und Parallel</text><text x="28" y="60" class="sub">Didaktisches Ersatzschaltbild · idealisierte Gleichstrommodelle · keine Installationsplanung</text><rect class="panel" x="25" y="83" width="433" height="295" rx="14"/><rect class="panel" x="482" y="83" width="452" height="295" rx="14"/><text x="242" y="113" class="lab" text-anchor="middle">Serie: gleicher Strom</text><text x="709" y="113" class="lab" text-anchor="middle">Parallel: gleiche Spannung</text><circle cx="77" cy="236" r="23" class="component"/><text x="77" y="231" class="lab" text-anchor="middle">+</text><text x="77" y="253" class="lab" text-anchor="middle">−</text><text x="39" y="276" class="tiny" text-anchor="middle">9 V</text><path class="wire" d="M77 161 L77 213"/><path class="wire" d="M77 259 L77 326"/><path class="wire" d="M77 161 L141 161"/><path class="wire" d="M141 161 L150 161"/><rect class="component" x="150" y="149" width="78" height="24" rx="1"/><path class="wire" d="M228 161 L237 161"/><text x="189.0" y="137" class="lab" tex