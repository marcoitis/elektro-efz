<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-label="1.04-C · Widerstand und Leitungsweg"><title>1.04-C · Widerstand und Leitungsweg</title><desc>Zweiaderiger Stromkreis mit Hin- und Rückleiter je zehn Meter. Bei 1,5 Quadratmillimeter Kupfer-Modellwert, Strom 2 Ampere, Schleifenwiderstand etwa 0,237 Ohm und Spannungsabfall rund 0,475 Volt.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#173042} .title{font-size:22px;font-weight:700} .sub{font-size:13px;fill:#486478} .lab{font-size:14px;font-weight:600} .tiny{font-size:12px;fill:#456278} .wire{stroke:#176d85;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none} .component{stroke:#176d85;stroke-width:3;fill:#fff;stroke-linejoin:round} .accent{stroke:#e28a32;stroke-width:2.5;fill:none} .node{fill:#176d85} .panel{fill:white;stroke:#d5e4eb;stroke-width:1.5} .formula{font-size:17px;font-weight:bold;fill:#c1681a}</style><rect x="0" y="0" width="960" height="440" rx="16" fill="#f3f8fb"/><text x="28" y="38" class="title">1.04-C · Widerstand und Leitungsweg</text><text x="28" y="60" class="sub">Didaktisches Ersatzschaltbild · idealisierte Gleichstrommodelle · keine Installationsplanung</text><circle cx="87" cy="219" r="23" class="component"/><text x="87" y="214" class="lab" text-anchor="middle">+</text><text x="87" y="236" class="lab" text-anchor="middle">−</text><text x="49" y="259" class="tiny" text-anchor="middle">Quelle</text><path class="wire" d="M87 116 L87 196"/><path class="wire" d="M87 242 L87 314"/><path class="wire" d="M87 116 L270 116"/><path class="wire" d="M270 116 L279 116"/><rect class="component" x="279" y="104" width="99" height="24" rx="1"/><path class="wire" d="M378 116 L387 116"/><text x="328.5" y="92" class="lab" text-anchor="middle">Hinleiter 10 m</text><path class="wire" d="M387 116 L581 116"/><path class="wire" d="M581 116 L581 164"/><path class="wire" d="M581 164 L581 170"/><rect class="component" x="569" y="170" width="24" height="85" rx="1"/><path class="wire" d="M581 255 L581 261"/><text x="616" y="216.5" class="tiny" text-anchor="start">Modelllast</text><path class="wire" d="M581 261 L581 314"/><path class="wire" d="M581 314 L387 314"/><path class="wire" d="M270 314 L279 314"/><rect class="component" x="279" y="302" width="99" height="24" rx="1"/><path class="wire" d="M378 314 L387 314"/><text x="328.5" y="290" class="lab" text-anchor="middle">Rückleiter 10 m</text><path class="wire" d="M270 314 L87 314"/><text x="240" y="102" class="lab" text-anchor="middle">I = 2 A →</text><text x="708" y="143" class="tiny" text-anchor="start">ρ Cu (Modell): 0,0178 Ω·mm²/m</text><text x="708" y="172" class="tiny" text-anchor="start">l hin + l rück = 20 m</text><text x="708" y="201" class="tiny" text-anchor="start">A = 1,5 mm²</text><text x="708" y="244" class="lab" text-anchor="start">R Leitung ≈ 0,237 Ω</text><text x="708" y="270" class="lab" text-anchor="start">ΔU ≈ 0,475 V</text><rect x="673" y="312" width="245" height="35" rx="9" fill="#fff2e4" stroke="#edc399"/><text x="795.5" y="335" class="formula" text-anchor="middle">P Verlust ≈ 0,95 W</text><text x="28" y="423" class="tiny">Nur für Rechen- und Verständnisübungen an sicheren, strombegrenzten Kleinspannungsmodellen.</text></svg>