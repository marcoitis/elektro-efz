51" rx="12" fill="#FFFFFF" stroke="#CBDCE4" stroke-width="2" /><rect x="805" y="203" width="7" height="151" rx="0" fill="#178773" stroke="#178773" stroke-width="0" /><text x="824" y="237" fill="#18364C" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">Stall</text><text x="824" y="271" fill="#667B8A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">Feuchte / Korrosion</text><rect x="56" y="425" width="1088" height="161" rx="12" fill="#FFFFFF" stroke="#CBDCE4" stroke-width="2" /><text x="78" y="470" fill="#197CA1" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="start">ΔU ≈ 2 · L · I · ρ / A</text><text x="78" y="512" fill="#18364C" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start">2 × 50 m × 10 A × 0,0175 Ω mm²/m ÷ 2,5 mm² ≈ 7 V</text><text x="78" y="556" fill="#C54B4B" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">Spannungsfall ≠ vollständiger Schutz- und Eignungsnachweis</text><rect x="30" y="626" width="1140" height="51" rx="8" fill="#E8F3F7" stroke="none" stroke-width="0" /><text x="50" y="659" fill="#29485A" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">Didaktisches Lernschema – keine normativ oder fachlich freigegebene Installation</text></svg>