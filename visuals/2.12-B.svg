<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Schutz- und Leitungsentwurf im Planungsfall"><title>2.12-B · Schutz- und Leitungsentwurf im Planungsfall</title><desc>Eigene thematische Lernzeichnung – schematisch, nicht vermasst, keine Installationsplanung; nicht für reale Installation freigegeben.</desc><rect x="0" y="0" width="1200" height="700" rx="0" fill="#F5F8FB" /><rect x="0" y="0" width="1200" height="86" rx="0" fill="#17324A" /><text x="36" y="55" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="start">2.12-B   Schutz- und Leitungsentwurf im Planungsfall</text><text x="40" y="126" fill="#17324A" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="start">Schematische Varianten – Leitungslänge beeinflusst Spannungsfall</text><rect x="44" y="170" width="495" height="330" rx="12" fill="#FFFFFF" stroke="#D3DFE9" stroke-width="2" /><rect x="580" y="170" width="560" height="330" rx="12" fill="#FFFFFF" stroke="#D3DFE9" stroke-width="2" /><text x="67" y="203" fill="#18789B" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="start">Variante A · 12 m</text><text x="603" y="203" fill="#CF8A2B" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="start">Variante B · 24 m</text><rect x="130" y="257" width="112" height="88" rx="10" fill="#EAF2F7" stroke="#D3DFE9" stroke-width="2" /><text x="142" y="301" fill="#203B4F" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="start">UV</text><rect x="395" y="257" width="112" height="88" rx="10" fill="#FFF2E0" stroke="#D3DFE9" stroke-width="2" /><text x="413" y="301" fill="#203B4F" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="start">Last</text><rect x="666" y="257" width="112" height="88" rx="10" fill="#EAF2F7" stroke="#D3DFE9" stroke-width="2" /><text x="678" y="301" fill="#203B4F" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="start">UV</text><rect x="931" y="257" width="112" height="88" rx="10" fill="#FFF2E0" stroke="#D3DFE9" stroke-width="2" /><text x="949" y="301" fill="#203B4F" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="start">Last</text><line x1="242" y1="298" x2="395" y2="298" stroke="#18789B" stroke-width="6" stroke-linecap="round" /><line x1="778" y1="298" x2="931" y2="298" stroke="#CF8A2B" stroke-width="6" stroke-linecap="round" stroke-dasharray="18,10" /><text x="70" y="393" fill="#18789B" font-family="Arial, sans-serif" font-size="25" font-weight="bold" text-anchor="start">ΔU ≈ 1,37 V</text><text x="603" y="393" fill="#CF8A2B" font-family="Arial, sans-serif" font-size="25" font-weight="bold" text-anchor="start">ΔU ≈ 2,73 V</text><text x="70" y="443" fill="#203B4F" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start">230 V · 8 A · 2,5 mm² Cu</text><text x="603" y="443" fill="#203B4F" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start">gleiche Annahmen · doppelte Länge</text><text x="50" y="556" fill="#C85145" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="start">Fehlen: Verlegeart, Thermik, Netzsystem, Schutzgeräte und Normenabgleich.</text><rect x="24" y="628" width="1152" height="53" rx="8" fill="#EAF2F7" /><text x="42" y="650" fill="#203B4F" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start">Fachliches Lernmodell · keine Ausführungszeichnung · Normenfreigabe offen</text><text x="42" y="672" fill="#657B8C" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start">Zahlen und Zuordnungen sind ausschliesslich didaktische Annahmen.</text></svg>