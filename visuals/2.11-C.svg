<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="RCD-Prüfung, Schleifenimpedanz und Messprotokoll"><title>2.11-C · RCD-Prüfung, Schleifenimpedanz und Messprotokoll</title><desc>Eigene thematische Lernzeichnung – schematisch, nicht vermasst, keine Installationsplanung; nicht für reale Installation freigegeben.</desc><rect x="0" y="0" width="1200" height="700" rx="0" fill="#F5F8FB" /><rect x="0" y="0" width="1200" height="86" rx="0" fill="#17324A" /><text x="36" y="55" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="start">2.11-C   RCD-Prüfung, Schleifenimpedanz und Messprotokoll</text><text x="40" y="128" fill="#17324A" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="start">Drei unabhängige Nachweise</text><rect x="45" y="158" width="510" height="97" rx="12" fill="#FFFFFF" stroke="#D3DFE9" stroke-width="2" /><rect x="45" y="158" width="6" height="97" rx="0" fill="#18789B" /><text x="65" y="190" fill="#17324A" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">1 · RCD-Funktion</text><text x="65" y="220" fill="#657B8C" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="start">Differenzstrom und Gerätetyp</text><rect x="45" y="278" width="510" height="97" rx="12" fill="#FFFFFF" stroke="#D3DFE9" stroke-width="2" /><rect x="45" y="278" width="6" height="97" rx="0" fill="#CF8A2B" /><text x="65" y="310" fill="#17324A" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">2 · Fehlerschleife</text><text x="65" y="340" fill="#657B8C" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="start">Zs → Ik (vereinfachtes Modell)</text><rect x="45" y="398" width="510" height="97" rx="12" fill="#FFFFFF" stroke="#D3DFE9" stroke-width="2" /><rect x="45" y="398" width="6" height="97" rx="0" fill="#327F66" /><text x="65" y="430" fill="#17324A" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">3 · Prüfprotokoll</text><text x="65" y="460" fill="#657B8C" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="start">Soll · Ist · Methode · Urteil</text><line x1="295" y1="256" x2="295" y2="278" stroke="#657B8C" stroke-width="3" stroke-linecap="round" /><line x1="295" y1="376" x2="295" y2="398" stroke="#657B8C" stroke-width="3" stroke-linecap="round" /><rect x="605" y="157" width="535" height="353" rx="14" fill="#FFFFFF" stroke="#D3DFE9" stroke-width="2" /><text x="628" y="194" fill="#17324A" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Modellrechnung (kein Grenzwert)</text><text x="628" y="242" fill="#203B4F" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="start">U₀ = 230 V</text><text x="628" y="281" fill="#203B4F" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="start">Zs = 0,80 Ω</text><text x="628" y="332" fill="#18789B" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="start">Ik ≈ U₀ / Zs = 287,5 A</text><line x1="630" y1="356" x2="1110" y2="356" stroke="#D3DFE9" stroke-width="2" stroke-linecap="round" /><text x="628" y="393" fill="#203B4F" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Der Zahlenwert allein belegt</text><text x="628" y="422" fill="#203B4F" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">keine zulässige Abschaltbedingung.</text><text x="628" y="466" fill="#C85145" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="start">Gerät · Netzsystem · Norm · Messung</text><text x="55" y="564" fill="#17324A" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="start">Unterschiede im Urteil: Beobachtung ≠ Berechnung ≠ Freigabe</text><rect x="24" y="628" width="1152" height="53" rx="8" fill="#EAF2F7" /><text x="42" y="650" fill="#203B4F" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start">Fachliches Lernmodell · keine Ausführungszeichnung · Normenfreigabe offen</text><text x="42" y="672" fill="#657B8C" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start">Zahlen und Zuordnungen sind ausschliesslich didaktische Annahmen.</text></svg>