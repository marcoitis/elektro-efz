<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="3.03-B Schutzleiter, Isolation und Polarisierung"><title>3.03-B – Schutzleiter, Isolation und Polarisierung</title><desc>Individuelle didaktische Fachgrafik – keine Installationsplanung. Schema und Rechenwerte sind Modelle, kein freigegebener Installationsplan.</desc><rect x="0" y="0" width="1200" height="700" rx="0" fill="#F4F8FB" stroke="none" stroke-width="0" /><rect x="0" y="0" width="1200" height="92" rx="0" fill="#18364C" stroke="none" stroke-width="0" /><text x="35" y="56" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start">3.03-B · Schutzleiter, Isolation und Polarisierung</text><text x="46" y="138" fill="#18364C" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">Drei Prüfziele – drei verschiedene Fragen</text><rect x="45" y="196" width="345" height="221" rx="12" fill="#FFFFFF" stroke="#C8D7E2" stroke-width="2" /><rect x="45" y="196" width="7" height="221" rx="0" fill="#23826D" stroke="#23826D" stroke-width="0" /><text x="64" y="231" fill="#18364C" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start">Schutzleiter</text><text x="64" y="266" fill="#6B8190" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Verbindung wirksam?</text><text x="70" y="330" fill="#23826D" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start">R≈0,14 Ω*</text><text x="70" y="376" fill="#6B8190" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">eigenständiger Nachweis</text><rect x="433" y="196" width="345" height="221" rx="12" fill="#FFFFFF" stroke="#C8D7E2" stroke-width="2" /><rect x="433" y="196" width="7" height="221" rx="0" fill="#177FA5" stroke="#177FA5" stroke-width="0" /><text x="452" y="231" fill="#18364C" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start">Isolation</text><text x="452" y="266" fill="#6B8190" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">unerwünschter Pfad?</text><text x="458" y="330" fill="#177FA5" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start">R in MΩ</text><text x="458" y="376" fill="#6B8190" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">eigenständiger Nachweis</text><rect x="820" y="196" width="345" height="221" rx="12" fill="#FFFFFF" stroke="#C8D7E2" stroke-width="2" /><rect x="820" y="196" width="7" height="221" rx="0" fill="#D59433" stroke="#D59433" stroke-width="0" /><text x="839" y="231" fill="#18364C" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start">Zuordnung</text><text x="839" y="266" fill="#6B8190" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">richtiger Leiter?</text><text x="845" y="330" fill="#D59433" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start">L / N / PE</text><text x="845" y="376" fill="#6B8190" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">eigenständiger Nachweis</text><rect x="46" y="472" width="1108" height="115" rx="12" fill="#FFFFFF" stroke="#C8D7E2" stroke-width="2" /><text x="69" y="514" fill="#254254" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">* Einzelner Cu-Leiter: 20 m · 0,0175 Ω mm²/m ÷ 2,5 mm² = 0,14 Ω</text><text x="69" y="557" fill="#C65342" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Modellrechnung. Keine Grenzwertaussage oder Messanleitung.</text><rect x="28" y="625" width="1144" height="52" rx="8" fill="#E7F1F7" stroke="none" stroke-width="2" /><text x="47" y="657" fill="#254254" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Lernschema • Modellannahmen beachten • keine normativ freigegebene Installationszeichnung</text></svg>