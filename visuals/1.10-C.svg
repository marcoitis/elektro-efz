<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-label="1.10-C · Lastprofil und Energie"><title>1.10-C · Lastprofil und Energie</title><desc>Fiktives Lastprofil mit vier sechs Stunden langen Abschnitten: 2, 8, 6 und 3 Kilowatt. Tagesenergie 114 Kilowattstunden, Tagesmittel 4,75 Kilowatt.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#173042}.title{font-size:22px;font-weight:700}.sub{font-size:13px;fill:#486478}.lab{font-size:15px;font-weight:600}.tiny{font-size:12px;fill:#456278}.line{stroke:#176d85;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none}.thin{stroke:#789aa9;stroke-width:1.4;fill:none}.accent{stroke:#df8732;stroke-width:3;fill:none}.dashed{stroke:#df8732;stroke-width:2;stroke-dasharray:7 5;fill:none}.panel{fill:#fff;stroke:#d5e4eb;stroke-width:1.5}.formula{font-size:20px;font-weight:700;fill:#bd691e}</style><rect width="960" height="460" rx="16" fill="#f3f8fb"/><text x="28" y="38" class="title">1.10-C · Lastprofil und Energie</text><text x="28" y="61" class="sub">Didaktisches Physikmodell – nur Simulation oder geeignete Kleinspannung, keine Installationsplanung</text><rect x="35" y="95" width="595" height="313" rx="9" class="panel"/><text x="326" y="126" class="lab" text-anchor="middle">Fiktiver 24-Stunden-Lastgang (6-h-Mittelwerte)</text><path d="M95 346 L580 346" class="thin"/><path d="M95 180 L95 346" class="thin"/><rect x="95.0" y="309.1" width="121.2" height="36.9" fill="#bcdfe7" stroke="#176d85" stroke-width="1.4"/><text x="156" y="300" class="tiny" text-anchor="middle">2 kW</text><rect x="216.2" y="198.4" width="121.2" height="147.6" fill="#bcdfe7" stroke="#176d85" stroke-width="1.4"/><text x="277" y="189" class="tiny" text-anchor="middle">8 kW</text><rect x="337.5" y="235.3" width="121.2" height="110.7" fill="#bcdfe7" stroke="#176d85" stroke-width="1.4"/><text x="398" y="226" class="tiny" text-anchor="middle">6 kW</text><rect x="458.8" y="290.7" width="121.2" height="55.3" fill="#bcdfe7" stroke="#176d85" stroke-width="1.4"/><text x="519" y="282" class="tiny" text-anchor="middle">3 kW</text><text x="95" y="366" class="tiny" text-anchor="middle">0 h</text><text x="216" y="366" class="tiny" text-anchor="middle">6 h</text><text x="338" y="366" class="tiny" text-anchor="middle">12 h</text><text x="459" y="366" class="tiny" text-anchor="middle">18 h</text><text x="580" y="366" class="tiny" text-anchor="middle">24 h</text><rect x="665" y="95" width="260" height="313" rx="9" class="panel"/><text x="795" y="142" class="lab" text-anchor="middle">Tagesenergie</text><text x="795" y="184" class="formula" text-anchor="middle">E = Σ (P · Δt)</text><text x="795" y="221" class="tiny" text-anchor="middle">6 h · (2 + 8 + 6 + 3)</text><text x="795" y="260" class="formula" text-anchor="middle">E = 114 kWh</text><text x="795" y="303" class="tiny" text-anchor="middle">mittlere Leistung:</text><text x="795" y="333" class="formula" text-anchor="middle">4,75 kW</text><text x="795" y="377" class="tiny" text-anchor="middle">6-h-Mittel, keine Spitzenmessung</text><text x="28" y="443" class="tiny">Modellannahmen gelten nur unter den genannten idealisierten Bedingungen.</text></svg>