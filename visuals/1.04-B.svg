<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-label="1.04-B · Spannungsteiler mit Last"><title>1.04-B · Spannungsteiler mit Last</title><desc>12 Volt Quelle, R1 zwei Kiloohm, R2 ein Kiloohm; unbelastet 4,0 V, mit 1-kOhm-Last parallel zu R2 sind es 2,4 V.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#173042} .title{font-size:22px;font-weight:700} .sub{font-size:13px;fill:#486478} .lab{font-size:14px;font-weight:600} .tiny{font-size:12px;fill:#456278} .wire{stroke:#176d85;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none} .component{stroke:#176d85;stroke-width:3;fill:#fff;stroke-linejoin:round} .accent{stroke:#e28a32;stroke-width:2.5;fill:none} .node{fill:#176d85} .panel{fill:white;stroke:#d5e4eb;stroke-width:1.5} .formula{font-size:17px;font-weight:bold;fill:#c1681a}</style><rect x="0" y="0" width="960" height="440" rx="16" fill="#f3f8fb"/><text x="28" y="38" class="title">1.04-B · Spannungsteiler mit Last</text><text x="28" y="60" class="sub">Didaktisches Ersatzschaltbild · idealisierte Gleichstrommodelle · keine Installationsplanung</text><rect class="panel" x="25" y="83" width="432" height="316" rx="14"/><rect class="panel" x="480" y="83" width="455" height="316" rx="14"/><text x="241" y="112" class="lab" text-anchor="middle">Unbelasteter Teiler</text><text x="704" y="112" class="lab" text-anchor="middle">Belasteter Teiler</text><circle cx="86" cy="232" r="23" class="component"/><text x="86" y="227" class="lab" text-anchor="middle">+</text><text x="86" y="249" class="lab" text-anchor="middle">−</text><text x="48" y="272" class="tiny" text-anchor="middle">12 V</text><path class="wire" d="M86 146 L86 209"/><path class="wire" d="M86 255 L86 328"/><path class="wire" d="M86 146 L312 146"/><path class="wire" d="M86 328 L312 328"/><path class="wire" d="M312 146 L312 169"/><path class="wire" d="M312 169 L312 175"/><rect class="component" x="300" y="175" width="24" height="36" rx="1"/><path class="wire" d="M312 211 L312 217"/><text x="347" y="197.0" class="tiny" text-anchor="start">R1 = 2 kΩ</text><path class="wire" d="M312 217 L312 241"/><path class="wire" d="M312 241 L312 247"/><rect class="component" x="300" y="247" width="24" height="45" rx="1"/><path class="wire" d="M312 292 L312 298"/><text x="347" y="273.5" class="tiny" text-anchor="start">R2 = 1 kΩ</text><path class="wire" d="M312 298 L312 328"/><circle cx="312" cy="228" r="4" class="node"/><path class="wire" d="M312 228 L406 228"/><text x="406" y="216" class="tiny" text-anchor="middle">U aus</text><rect x="135" y="350" width="288" height="35" rx="9" fill="#fff2e4" stroke="#edc399"/><text x="279.0" y="373" class="formula" text-anchor="middle">U aus = 4,0 V</text><circle cx="535" cy="232" r="23" class="component"/><text x="535" y="227" class="lab" text-anchor="middle">+</text><text x="535" y="249" class="lab" text-anchor="middle">−</text><text x="497" y="272" class="tiny" text-anchor="middle">12 V</text><path class="wire" d="M535 146 L535 209"/><path class="wire" d="M535 255 L535 327"/><path class="wire" d="M535 146 L752 146"/><path class="wire" d="M535 327 L864 327"/><path class="wire" d="M752 146 L752 169"/><path class="wire" d="M752 169 L752 175"/><rect class="component" x="740" y="175" width="24" height="36" rx="1"/><path class="wire" d="M752 211 L752 217"/><text x="787" y="197.0" class="tiny" text-anchor="start">R1 = 2 kΩ</text><path class="wire" d="M752 217 L752 242"/><path class="wire" d="M752 242 L752 248"/><rect class="component" x="740" y="248" width="24" height="44" rx="1"/><path class="wire" d="M752 292 L752 298"/><text x="787" y="274.0" class="tiny" text-anchor="start">R2 = 1 kΩ</text><path class="wire" d="M752 298 L752 327"/><circle cx="752" cy="229" r="4" class="node"/><path class="wire" d="M752 229 L861 229"/><path class="wire" d="M861 229 L861 245"/><path class="wire" d="M861 245 L861 251"/><rect class="component" x="849" y="251" width="24" height="42" rx="1"/><path class="wire" d="M861 293 L861 299"/><text x="896" y="276.0" class="tiny" text-anchor="start"></text><text x="860" y="212" class="tiny" text-anchor="middle">Last = 1 kΩ</text><path class="wire" d="M861 299 L861 327"/><rect x="559" y="351" width="277" height="35" rx="9" fill="#fff2e4" stroke="#edc399"/><text x="697.5" y="374" class="formula" text-anchor="middle">U aus = 2,4 V</text><text x="28" y="423" class="tiny">Nur für Rechen- und Verständnisübungen an sicheren, strombegrenzten Kleinspannungsmodellen.</text></svg>