<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img"><title>N-S04: Schweizer Recht und Betriebsnorm</title><desc>Individuelles didaktisches Fachschema zur Unterrichtslektion; keine freigegebene Installationszeichnung.</desc><rect width="1280" height="720" fill="#f3f7fa"/><rect width="1280" height="95" fill="#183b52"/><text x="36" y="37" font-family="Arial,sans-serif" font-size="19" fill="#cceaf5">Elektro EFZ · Fachtafel N-S04</text><text x="36" y="77" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="white">Schweizer Recht und Betriebsnorm</text><rect x="28" y="117" width="792" height="504" rx="18" fill="white" stroke="#c9dce8" stroke-width="2"/><rect x="843" y="117" width="409" height="504" rx="18" fill="white" stroke="#c9dce8" stroke-width="2"/><text x="867" y="159" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#183b52">Lernpunkte</text><rect x="28" y="647" width="1224" height="50" rx="12" fill="#e3eef5"/><text x="47" y="678" font-family="Arial,sans-serif" font-size="20" fill="#183b52">Didaktisches Modell – keine normative oder praktische Freigabe elektrischer Installationsarbeiten.</text><circle cx="880" cy="207" r="7" fill="#167e9d"/><text x="899" y="214" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#183b52">Recht bestimmt Bewilligung</text><circle cx="880" cy="293" r="7" fill="#167e9d"/><text x="899" y="300" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#183b52">Norm beschreibt technisches</text><text x="899" y="326" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#183b52">Vorgehen</text><circle cx="880" cy="379" r="7" fill="#167e9d"/><text x="899" y="386" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#183b52">Anlage und Produkt abgrenzen</text><circle cx="880" cy="465" r="7" fill="#167e9d"/><text x="899" y="472" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#183b52">Ausgabe und Geltung belegen</text><rect x="80" y="191" width="290" height="87" rx="12" fill="#edf4f8" stroke="#167e9d" stroke-width="3"/><text x="225.0" y="242.5" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#183b52" text-anchor="middle">Schweizer Recht</text><line x1="370" y1="235" x2="422" y2="235" stroke="#167e9d" stroke-width="4"/><polygon points="422,235 408.0,242.0 408.0,228.0" fill="#167e9d"/><rect x="422" y="191" width="332" height="87" rx="12" fill="#f8fafc" stroke="#167e9d" stroke-width="3"/><text x="588.0" y="241.5" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#183b52" text-anchor="middle">Wer darf handeln?</text><rect x="80" y="318" width="290" height="87" rx="12" fill="#edf4f8" stroke="#edb44d" stroke-width="3"/><text x="225.0" y="369.5" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#183b52" text-anchor="middle">Technische Norm</text><line x1="370" y1="362" x2="422" y2="362" stroke="#edb44d" stroke-width="4"/><polygon points="422,362 408.0,369.0 408.0,355.0" fill="#edb44d"/><rect x="422" y="318" width="332" height="87" rx="12" fill="#f8fafc" stroke="#edb44d" stroke-width="3"/><text x="588.0" y="368.5" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#183b52" text-anchor="middle">Wie ist vorzugehen?</text><rect x="80" y="445" width="290" height="87" rx="12" fill="#edf4f8" stroke="#398773" stroke-width="3"/><text x="225.0" y="496.5" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#183b52" text-anchor="middle">Projekt-/Prüfbeleg</text><line x1="370" y1="489" x2="422" y2="489" stroke="#398773" stroke-width="4"/><polygon points="422,489 408.0,496.0 408.0,482.0" fill="#398773"/><rect x="422" y="445" width="332" height="87" rx="12" fill="#f8fafc" stroke="#398773" stroke-width="3"/><text x="588.0" y="495.5" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#183b52" text-anchor="middle">Was ist nachgewiesen?</text></svg>