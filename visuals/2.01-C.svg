<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650"><desc>Didaktisches Modell, keine Installationsplanung.</desc><title>2.01-C – Didaktische Fachtafel</title><rect width="1100" height="650" fill="#f7fafc"/><g font-family="Arial,sans-serif" fill="#17334b"><text x="35" y="45" font-size="29" font-weight="bold">2.01-C · Wirk-, Blind- und Scheinleistung</text><text x="36" y="78" font-size="17">Sinusförmiger Einphasen-Modellfall: 100 V · 2 A · φ = +60°</text></g><g stroke="#a0b4c0" stroke-width="2"><path d="M605 515H1008 M605 515V130"/></g><path d="M605 515 L805 515 L805 169 Z" stroke="#206c84" stroke-width="3" fill="#dcebf3"/><path d="M605 515 L805 169" stroke="#bd7b28" stroke-width="6"/><g font-family="Arial" font-size="22" fill="#17334b"><text x="47" y="142">S = U · I = 200 VA</text><text x="47" y="195">P = U · I · cos(60°) = 100 W</text><text x="47" y="248">Q = U · I · sin(60°) ≈ 173,2 var</text><text x="47" y="301">λ = P / S = 0,50</text><text x="47" y="355">Rückprobe:</text><text x="47" y="392">√(100² + 173,2²) ≈ 200 VA</text><text x="47" y="470">Induktive Q-Vorzeichenkonvention:</text><text x="47" y="506">Q &gt; 0</text><text x="683" y="550">P = 100 W</text><text x="825" y="347">Q = 173,2 var</text><text x="690" y="257">S = 200 VA</text></g><text x="35" y="626" font-size="15" fill="#526b7a" font-family="Arial">Didaktisches Rechen- und Funktionsmodell – keine Installationsfreigabe</text></svg>