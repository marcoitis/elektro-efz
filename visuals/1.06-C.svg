<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-label="1.06-C · Revision, Massstab und Stückliste"><title>1.06-C · Revision, Massstab und Stückliste</title><desc>Änderungsfolgen einer zusätzlichen Kleinspannungsmodell-Leuchte: Grundriss, Stromlauf, Stückliste, Prüfrevision. Massstabsbeispiel 8,4 cm bei 1:50 bedeutet 4,2 Meter, Verkleinerung auf 70 Prozent ergibt 5,88 cm im Ausdruck.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#18364b}.title{font-size:24px;font-weight:700}.sub{font-size:12px;fill:#527083}.lab{font-size:15px;font-weight:600}.tiny{font-size:12px;fill:#4d6677}.formula{font-size:19px;fill:#b86b19;font-weight:700}.small{font-size:14px}.wire{stroke:#11718e;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:#8da7b6;stroke-width:1.5;fill:none;stroke-linecap:round}.dash{stroke:#db8928;stroke-width:2;stroke-dasharray:6 5;fill:none}.box{fill:white;stroke:#d7e5eb;stroke-width:1.8}</style><rect x="0" y="0" width="1100" height="560" rx="20" fill="#f2f7fa"/><text x="30" y="40" text-anchor="start" class="title">1.06-C · Revision, Massstab und Stückliste</text><text x="30" y="62" text-anchor="start" class="sub">Didaktisches Fachmodell · keine Installationsplanung · keine Ausführungsplanung · Schweizer Normenprüfung offen</text><rect x="25" y="88" width="624" height="420" rx="10" fill="white" stroke="#b9d0dc" stroke-width="1.5"/><rect x="675" y="88" width="398" height="420" rx="10" fill="white" stroke="#b9d0dc" stroke-width="1.5"/><text x="335" y="126" text-anchor="middle" class="lab">Änderungsfolgenanalyse · Modellbeleuchtung</text><rect x="88" y="169" width="205" height="58" rx="10" fill="#e3f1f6" stroke="#5f9fb6" stroke-width="1.5"/><text x="188" y="203" text-anchor="middle" class="lab">Revision A · 1 Leuchte</text><rect x="367" y="169" width="210" height="58" rx="10" fill="#faebd6" stroke="#c98d3d" stroke-width="1.5"/><text x="471" y="203" text-anchor="middle" class="lab">Revision B · 2 Leuchten</text><path d="M293 198 L367 198" class="thin"/><circle cx="104" cy="274" r="6" fill="#d18b37" stroke="#d18b37" stroke-width="2"/><text x="127" y="279" text-anchor="start" class="small">Grundriss · Position ergänzen</text><circle cx="104" cy="313" r="6" fill="#d18b37" stroke="#d18b37" stroke-width="2"/><text x="127" y="318" text-anchor="start" class="small">Stromlaufplan · Funktion ändern</text><circle cx="104" cy="352" r="6" fill="#d18b37" stroke="#d18b37" stroke-width="2"/><text x="127" y="357" text-anchor="start" class="small">Stückliste · Menge aktualisieren</text><circle cx="104" cy="391" r="6" fill="#d18b37" stroke="#d18b37" stroke-width="2"/><text x="127" y="396" text-anchor="start" class="small">Prüfblatt · Revisionsstand neu prüfen</text><text x="336" y="468" text-anchor="middle" class="tiny">Beide Fassungen müssen eindeutig zuordenbar sein</text><text x="875" y="126" text-anchor="middle" class="lab">Massstab nur im gültigen Ausgabeformat</text><text x="875" y="176" text-anchor="middle" class="small">8,4 cm im Plan · 1 : 50</text><text x="875" y="216" text-anchor="middle" class="formula">= 4,2 m real</text><text x="875" y="266" text-anchor="middle" class="small">Ausdruck auf 70 % verkleinert</text><text x="875" y="308" text-anchor="middle" class="formula">8,4 cm → 5,88 cm</text><text x="875" y="348" text-anchor="middle" class="small">Alte Skala wäre dann falsch</text><text x="875" y="420" text-anchor="middle" class="tiny">Massangaben sind sicherer als Abmessen</text><text x="30" y="540" text-anchor="start" class="sub">Bezeichnungen und Modellwerte nur für Unterricht; Produkte, Normen und Installation gesondert prüfen.</text></svg>