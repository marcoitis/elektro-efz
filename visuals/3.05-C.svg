idth="73" height="47" rx="12" fill="#E7F1F7" stroke="#C8D7E2" stroke-width="2" /><text x="410.5" y="330" fill="#18364C" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle">T</text><circle cx="491" cy="321" r="24" fill="#FFFFFF" stroke="#177FA5" /><text x="491" y="327" fill="#177FA5" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Y</text><text x="83" y="416" fill="#18364C" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">F UND NICHT S UND T → Y</text><text x="83" y="467" fill="#6B8190" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Schematische Funktionsdarstellung</text><rect x="655" y="269" width="160" height="105" rx="12" fill="#FFFFFF" stroke="#C8D7E2" stroke-width="2" /><rect x="655" y="269" width="7" height="105" rx="0" fill="#23826D" stroke="#23826D" stroke-width="0" /><text x="674" y="304" fill="#18364C" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start">UND</text><text x="674" y="339" fill="#6B8190" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">F / ¬S / T</text><line x1="819" y1="319" x2="899" y2="319" stroke="#177FA5" stroke-width="4" stroke-linecap="round" /><line x1="887" y1="310" x2="899" y2="319" stroke="#177FA5" stroke-width="3" stroke-linecap="round" /><line x1="887" y1="328" x2="899" y2="319" stroke="#177FA5" stroke-width="3" stroke-linecap="round" /><rect x="908" y="270" width="197" height="99" rx="12" fill="#FFFFFF" stroke="#C8D7E2" stroke-width="2" /><rect x="908" y="270" width="7" height="99" rx="0" fill="#177FA5" stroke="#177FA5" stroke-width="0" /><text x="927" y="305" fill="#18364C" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start">Y</text><text x="927" y="340" fill="#6B8190" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Ausgang</text><text x="643" y="441