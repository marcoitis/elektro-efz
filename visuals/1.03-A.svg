<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-label="1.03-A · Grundgrössen"><title>1.03-A · Grundgrössen</title><desc>5 Volt Gleichspannungsquelle und idealer 1-kOhm-Widerstand in einer geschlossenen Schleife, fünf Milliampere Strom und eine Zeitleistung der Ladung.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#173042} .title{font-size:22px;font-weight:700} .sub{font-size:13px;fill:#486478} .lab{font-size:14px;font-weight:600} .tiny{font-size:12px;fill:#456278} .wire{stroke:#176d85;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none} .component{stroke:#176d85;stroke-width:3;fill:#fff;stroke-linejoin:round} .accent{stroke:#e28a32;stroke-width:2.5;fill:none} .node{fill:#176d85} .panel{fill:white;stroke:#d5e4eb;stroke-width:1.5} .formula{font-size:17px;font-weight:bold;fill:#c1681a}</style><rect x="0" y="0" width="960" height="440" rx="16" fill="#f3f8fb"/><text x="28" y="38" class="title">1.03-A · Grundgrössen</text><text x="28" y="60" class="sub">Didaktisches Ersatzschaltbild · idealisierte Gleichstrommodelle · keine Installationsplanung</text><circle cx="92" cy="194" r="23" class="component"/><text x="92" y="189" class="lab" text-anchor="middle">+</text><text x="92" y="211" class="lab" text-anchor="middle">−</text><text x="54" y="234" class="tiny" text-anchor="middle">5 V</text><path class="wire" d="M92 85 L92 171"/><path class="wire" d="M92 217 L92 300"/><path class="wire" d="M92 85 L320 85"/><path class="wire" d="M320 85 L329 85"/><rect class="component" x="329" y="73" width="97" height="24" rx="1"/><path class="wire" d="M426 85 L435 85"/><text x="377.5" y="61" class="lab" text-anchor="middle">R = 1 kΩ</text><path class="wire" d="M435 85 L602 85"/><path class="wire" d="M602 85 L602 300"/><path class="wire" d="M602 300 L92 300"/><circle cx="302" cy="85" r="4" class="node"/><circle cx="456" cy="85" r="4" class="node"/><path class="accent" d="M302 86 L302 144 L456 144 L456 86"/><text x="380" y="165" class="lab" text-anchor="middle">U = 5 V</text><text x="240" y="74" class="lab" text-anchor="middle">I = 5 mA →</text><text x="695" y="170" class="lab" text-anchor="start">Ladung und Strom:</text><text x="695" y="199" class="formula" text-anchor="start">Q = I · t</text><text x="695" y="229" class="tiny" text-anchor="start">t = 20 s → Q = 0,1 C</text><rect x="665" y="275" width="245" height="35" rx="9" fill="#fff2e4" stroke="#edc399"/><text x="787.5" y="298" class="formula" text-anchor="middle">I = U / R = 5 mA</text><text x="28" y="423" class="tiny">Nur für Rechen- und Verständnisübungen an sicheren, strombegrenzten Kleinspannungsmodellen.</text></svg>