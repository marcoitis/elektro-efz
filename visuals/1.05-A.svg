<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-label="1.05-A · Leiterwerkstoffe und Widerstand"><title>1.05-A · Leiterwerkstoffe und Widerstand</title><desc>Kupfer mit 0,01724 und Aluminium mit 0,02826 Ohm Quadratmillimeter pro Meter, je 20 m und 2,5 mm²; Widerstände Kupfer 0,13792 Ohm und Aluminium 0,22608 Ohm. Vierzig Meter Hin- und Rückleiter aus Kupfer 0,27584 Ohm, bei vier Ampere 1,10 Volt Spannungsfall und 4,41 Watt Verlust.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#18364b}.title{font-size:24px;font-weight:700}.sub{font-size:12px;fill:#527083}.lab{font-size:15px;font-weight:600}.tiny{font-size:12px;fill:#4d6677}.formula{font-size:19px;fill:#b86b19;font-weight:700}.small{font-size:14px}.wire{stroke:#11718e;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:#8da7b6;stroke-width:1.5;fill:none;stroke-linecap:round}.dash{stroke:#db8928;stroke-width:2;stroke-dasharray:6 5;fill:none}.box{fill:white;stroke:#d7e5eb;stroke-width:1.8}</style><rect x="0" y="0" width="1100" height="560" rx="20" fill="#f2f7fa"/><text x="30" y="40" text-anchor="start" class="title">1.05-A · Leiterwerkstoffe und Widerstand</text><text x="30" y="62" text-anchor="start" class="sub">Didaktisches Fachmodell · keine Installationsplanung · keine Ausführungsplanung · Schweizer Normenprüfung offen</text><rect x="28" y="89" width="650" height="417" rx="10" fill="white" stroke="#b9d0dc" stroke-width="1.5"/><rect x="703" y="89" width="367" height="417" rx="10" fill="white" stroke="#b9d0dc" stroke-width="1.5"/><text x="353" y="124" text-anchor="middle" class="lab">Einzel-Leiter: l = 20 m, A = 2,5 mm²</text><rect x="130" y="164" width="410" height="25" rx="10" fill="#cb7c3d"/><text x="90" y="185" text-anchor="middle" class="small">Kupfer</text><text x="350" y="219" text-anchor="middle" class="small">ρ = 0.01724 Ω·mm²/m | R = 0.13792 Ω</text><rect x="130" y="254" width="410" height="25" rx="10" fill="#6c8daa"/><text x="90" y="275" text-anchor="middle" class="small">Aluminium</text><text x="350" y="309" text-anchor="middle" class="small">ρ = 0.02826 Ω·mm²/m | R = 0.22608 Ω</text><text x="353" y="353" text-anchor="middle" class="formula">Bei gleichen Abmessungen: Aluminium ≈ 1,64 × R(Cu)</text><path d="M144 395 L537 395" class="thin"/><text x="353" y="423" text-anchor="middle" class="small">Doppelte Länge → doppelter Widerstand</text><text x="353" y="450" text-anchor="middle" class="small">Doppelter Querschnitt → halber Widerstand</text><text x="882" y="127" text-anchor="middle" class="lab">Hin- und Rückweg, Modell</text><text x="882" y="170" text-anchor="middle" class="small">2 × 20 m Cu, 2,5 mm²</text><text x="882" y="215" text-anchor="middle" class="formula">R = 0,27584 Ω</text><text x="882" y="255" text-anchor="middle" class="small">I = 4 A</text><text x="882" y="298" text-anchor="middle" class="formula">ΔU ≈ 1,10 V</text><text x="882" y="338" text-anchor="middle" class="small">P = I² · R</text><text x="882" y="380" text-anchor="middle" class="formula">P ≈ 4,41 W</text><text x="882" y="444" text-anchor="middle" class="tiny">Kontakt- und Wärmefragen offen</text><text x="30" y="540" text-anchor="start" class="sub">Bezeichnungen und Modellwerte nur für Unterricht; Produkte, Normen und Installation gesondert prüfen.</text></svg>