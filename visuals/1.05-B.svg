<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-label="1.05-B · Kabelaufbau und Leiterfarben"><title>1.05-B · Kabelaufbau und Leiterfarben</title><desc>Vereinfachter dreiadriger Kabelquerschnitt mit Kupferkernen und brauner, blauer und grün-gelber Aderisolation. Farbkennzeichnung ist kein Beweis für Spannungsfreiheit, weitere Produktauswahl und NIN-Prüfung erforderlich.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#18364b}.title{font-size:24px;font-weight:700}.sub{font-size:12px;fill:#527083}.lab{font-size:15px;font-weight:600}.tiny{font-size:12px;fill:#4d6677}.formula{font-size:19px;fill:#b86b19;font-weight:700}.small{font-size:14px}.wire{stroke:#11718e;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:#8da7b6;stroke-width:1.5;fill:none;stroke-linecap:round}.dash{stroke:#db8928;stroke-width:2;stroke-dasharray:6 5;fill:none}.box{fill:white;stroke:#d7e5eb;stroke-width:1.8}</style><rect x="0" y="0" width="1100" height="560" rx="20" fill="#f2f7fa"/><text x="30" y="40" text-anchor="start" class="title">1.05-B · Kabelaufbau und Leiterfarben</text><text x="30" y="62" text-anchor="start" class="sub">Didaktisches Fachmodell · keine Installationsplanung · keine Ausführungsplanung · Schweizer Normenprüfung offen</text><rect x="28" y="90" width="632" height="418" rx="10" fill="white" stroke="#b9d0dc" stroke-width="1.5"/><rect x="688" y="90" width="382" height="418" rx="10" fill="white" stroke="#b9d0dc" stroke-width="1.5"/><text x="344" y="126" text-anchor="middle" class="lab">Schematischer Querschnitt einer 3-adrigen Leitung</text><circle cx="345" cy="300" r="158" fill="#eef3f6" stroke="#587e90" stroke-width="8"/><circle cx="345" cy="220" r="61" fill="#735033" stroke="#253d48" stroke-width="2"/><circle cx="345" cy="220" r="31" fill="#cf8c54" stroke="#815332" stroke-width="2"/><text x="345" y="296" text-anchor="middle" class="tiny">L / braun</text><circle cx="275" cy="360" r="61" fill="#386daa" stroke="#253d48" stroke-width="2"/><circle cx="275" cy="360" r="31" fill="#cf8c54" stroke="#815332" stroke-width="2"/><text x="275" y="436" text-anchor="middle" class="tiny">N / blau</text><circle cx="415" cy="360" r="61" fill="#5ba54b" stroke="#253d48" stroke-width="2"/><circle cx="415" cy="360" r="31" fill="#cf8c54" stroke="#815332" stroke-width="2"/><path d="M363 331 L467 389" stroke="#ecd23c" stroke-width="19"/><circle cx="415" cy="360" r="31" fill="#cf8c54" stroke="#815332" stroke-width="2"/><text x="415" y="436" text-anchor="middle" class="tiny">PE / grün-gelb</text><text x="345" y="470" text-anchor="middle" class="tiny">Mantel, Aderisolation und metallische Leiter getrennt bewerten</text><text x="878" y="130" text-anchor="middle" class="lab">Kennzeichnung ≠ Spannungsnachweis</text><text x="878" y="174" text-anchor="middle" class="small">N: Neutralleiter – blau</text><text x="878" y="212" text-anchor="middle" class="small">PE: Schutzleiter – grün/gelb</text><text x="878" y="251" text-anchor="middle" class="small">L: Aussenleiter (Beispiel)</text><rect x="724" y="292" width="310" height="140" rx="10" fill="#fff8ec" stroke="#e0b97b" stroke-width="1.5"/><text x="880" y="323" text-anchor="middle" class="lab">Zusätzliche Produktprüfung</text><text x="880" y="354" text-anchor="middle" class="tiny">Leiterklasse / Klemme / Material</text><text x="880" y="380" text-anchor="middle" class="tiny">Temperatur / UV / Anwendung</text><text x="880" y="408" text-anchor="middle" class="tiny">Herstellerdaten erforderlich</text><text x="30" y="540" text-anchor="start" class="sub">Bezeichnungen und Modellwerte nur für Unterricht; Produkte, Normen und Installation gesondert prüfen.</text></svg>