<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img"><title>Praktisches QV – Funktion und Prüfung</title><desc>Didaktische Modellskizze; keine Installationsanleitung und keine normative Freigabe.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#193950"/></marker></defs><rect x="0" y="0" width="1200" height="680" rx="0" fill="#f5f8fa" stroke="#f5f8fa" stroke-width="0"/><rect x="0" y="0" width="1200" height="98" rx="0" fill="#193950" stroke="#193950" stroke-width="0"/><text x="34" y="63" font-size="31" fill="#fff" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="start" font-weight="700">4.12-B · Praktisches QV – Funktion und Prüfung</text><rect x="76" y="200" width="252" height="120" rx="10" fill="#fff" stroke="#1885ae" stroke-width="2"/><text x="202.0" y="236" font-size="22" fill="#193950" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" font-weight="700">Eingang</text><text x="202.0" y="269" font-size="18" fill="#4f6a7a" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" font-weight="400">Start / Stop</text><rect x="468" y="200" width="255" height="120" rx="10" fill="#edf6f8" stroke="#1885ae" stroke-width="2"/><text x="595.5" y="236" font-size="22" fill="#193950" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" font-weight="700">Logik</text><text x="595.5" y="269" font-size="18" fill="#4f6a7a" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" font-weight="400">Selbsthaltung 12 V</text><rect x="850" y="200" width="260" height="120" rx="10" fill="#e5f3ee" stroke="#1885ae" stroke-width="2"/><text x="980.0" y="236" font-size="22" fill="#193950" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" font-weight="700">Ausgang</text><text x="980.0" y="269" font-size="18" fill="#4f6a7a" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" font-weight="400">Leuchte 12 V</text><path d="M328,260 L468,260" fill="none" stroke="#193950" stroke-width="3" marker-end="url(#arrow)" /><path d="M723,260 L850,260" fill="none" stroke="#193950" stroke-width="3" marker-end="url(#arrow)" /><rect x="246" y="441" width="710" height="90" rx="10" fill="#fff4e4" stroke="#1885ae" stroke-width="2"/><text x="601.0" y="477" font-size="22" fill="#193950" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" font-weight="700">Funktionsmatrix</text><text x="601.0" y="510" font-size="18" fill="#4f6a7a" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" font-weight="400">Ruhe → Start → Halten → Stop → Neustart</text><text x="601" y="568" font-size="24" fill="#c0555d" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" font-weight="700">Funktionstest ≠ elektrische Sicherheitsprüfung.</text><rect x="30" y="613" width="1140" height="42" rx="10" fill="#e1edf3" stroke="#e1edf3" stroke-width="2"/><text x="600" y="642" font-size="19" fill="#193950" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" font-weight="400">Lernmodell – Originalnorm, Herstellerdaten und fachliche Freigabe für reale Anlagen erforderlich.</text></svg>