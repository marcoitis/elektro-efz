<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 550" role="img" aria-label="1.08-A · Spannungsmessung am Modell"><title>1.08-A · Spannungsmessung am Modell</title><desc>Separater strombegrenzter Gleichspannungsstromkreis mit 12 Volt, 120 Ohm Last und parallel angeschlossenem symbolischen Voltmeter. Rechnerisch 100 Milliampere und 1,2 Watt.</desc><style>text{font-family:Arial,DejaVu Sans,sans-serif;fill:#173247}.t{font-size:24px;font-weight:700}.s{font-size:13px;fill:#547084}.h{font-size:17px;font-weight:600}.n{font-size:15px}.f{font-size:20px;font-weight:700;fill:#a15f1e}.wire{fill:none;stroke:#117394;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.soft{fill:#fff;stroke:#c5d9e4;stroke-width:1.5}.warn{fill:#fff7ea;stroke:#ddb77a;stroke-width:1.5}</style><rect width="1100" height="550" rx="18" fill="#f4f8fa"/><text class="t" text-anchor="start" x="29" y="41">1.08-A · Spannungsmessung am Modell</text><text class="s" text-anchor="start" x="29" y="63">Didaktisches Modell · keine Installationsplanung und keine normative Freigabe</text><rect class="soft" x="25" y="88" width="693" height="416" rx="10"/><rect class="soft" x="741" y="88" width="334" height="416" rx="10"/><text class="h" text-anchor="middle" x="376" y="122">Strombegrenztes 12-V-DC-Modell: Messpunkt M1–M0</text><path d="M139 193 L544 193" fill="none" stroke="#117394" stroke-width="3" /><path d="M544 193 L544 410" fill="none" stroke="#117394" stroke-width="3" /><path d="M544 410 L139 410" fill="none" stroke="#117394" stroke-width="3" /><path d="M139 410 L139 341" fill="none" stroke="#117394" stroke-width="3" /><path d="M139 262 L139 193" fill="none" stroke="#117394" stroke-width="3" /><circle cx="139" cy="303" r="38" fill="#fff6df" stroke="#c98a3a" stroke-width="2"/><text class="h" text-anchor="middle" x="139" y="309">12 V</text><path d="M544 193 L544 275" fill="none" stroke="#117394" stroke-width="3" /><path d="M544 328 L544 410" fill="none" stroke="#117394" stroke-width="3" /><rect x="530" y="275" width="28" height="53" fill="#d9ebf2" stroke="#117394" stroke-width="3"/><text class="h" text-anchor="start" x="605" y="306">120 Ω</text><path d="M544 247 L407 247" fill="none" stroke="#117394" stroke-width="3" /><path d="M407 247 L407 365" fill="none" stroke="#117394" stroke-width="3" /><path d="M407 365 L544 365" fill="none" stroke="#117394" stroke-width="3" /><circle cx="407" cy="305" r="26" fill="white" stroke="#b77530" stroke-width="2"/><text class="h" text-anchor="middle" x="407" y="313">V</text><text class="s" text-anchor="middle" x="376" y="452">Voltmeter parallel · Quelle mit geeigneter Strombegrenzung</text><text class="h" text-anchor="middle" x="903" y="130">Ideale Rechnungswerte</text><text class="n" text-anchor="middle" x="903" y="192">I = 12 V / 120 Ω</text><text class="f" text-anchor="middle" x="903" y="231">= 0,100 A</text><text class="n" text-anchor="middle" x="903" y="289">P = U² / R</text><text class="f" text-anchor="middle" x="903" y="329">= 1,20 W</text><text class="s" text-anchor="middle" x="905" y="395">Bauteilleistung prüfen!</text><text class="s" text-anchor="middle" x="905" y="433">Kein Netzanschluss.</text><text class="s" text-anchor="start" x="29" y="531">Nur Kleinspannungs- und Planungssimulation; für reale Anlagen gelten zusätzliche Nachweise und Fachzuständigkeiten.</text></svg>