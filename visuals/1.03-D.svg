<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-label="1.03-D · Messen am Modell"><title>1.03-D · Messen am Modell</title><desc>Amperemeter in Reihe, Voltmeter parallel zu einem 120-Ohm-Widerstand, idealisierte 12-Volt-Quelle. Keine Netzspannungsmessung.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#173042} .title{font-size:22px;font-weight:700} .sub{font-size:13px;fill:#486478} .lab{font-size:14px;font-weight:600} .tiny{font-size:12px;fill:#456278} .wire{stroke:#176d85;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none} .component{stroke:#176d85;stroke-width:3;fill:#fff;stroke-linejoin:round} .accent{stroke:#e28a32;stroke-width:2.5;fill:none} .node{fill:#176d85} .panel{fill:white;stroke:#d5e4eb;stroke-width:1.5} .formula{font-size:17px;font-weight:bold;fill:#c1681a}</style><rect x="0" y="0" width="960" height="440" rx="16" fill="#f3f8fb"/><text x="28" y="38" class="title">1.03-D · Messen am Modell</text><text x="28" y="60" class="sub">Didaktisches Ersatzschaltbild · idealisierte Gleichstrommodelle · keine Installationsplanung</text><circle cx="92" cy="204" r="23" class="component"/><text x="92" y="199" class="lab" text-anchor="middle">+</text><text x="92" y="221" class="lab" text-anchor="middle">−</text><text x="54" y="244" class="tiny" text-anchor="middle">12 V</text><path class="wire" d="M92 85 L92 181"/><path class="wire" d="M92 227 L92 310"/><path class="wire" d="M92 85 L234 85"/><path class="wire" d="M234 85 L249 85"/><circle cx="274" cy="85" r="24" class="component"/><text x="274" y="92" class="lab" text-anchor="middle">A</text><path class="wire" d="M298 85 L455 85"/><path class="wire" d="M455 85 L455 154"/><path class="wire" d="M455 154 L455 160"/><rect class="component" x="443" y="160" width="24" height="77" rx="1"/><path class="wire" d="M455 237 L455 243"/><text x="490" y="202.5" class="tiny" text-anchor="start">R = 120 Ω</text><path class="wire" d="M455 243 L455 310"/><path class="wire" d="M455 310 L92 310"/><circle cx="455" cy="129" r="4" class="node"/><circle cx="455" cy="272" r="4" class="node"/><path class="wire" d="M455 129 L581 129"/><path class="wire" d="M581 129 L581 182"/><circle cx="581" cy="207" r="24" class="component"/><text x="581" y="213" class="lab" text-anchor="middle">V</text><path class="wire" d="M581 231 L581 272"/><path class="wire" d="M581 272 L455 272"/><text x="272" y="127" class="tiny" text-anchor="middle">Strommessung: in Reihe</text><text x="590" y="92" class="tiny" text-anchor="middle">Spannungsmessung: parallel</text><text x="680" y="205" class="formula" text-anchor="start">I ≈ 0,10 A</text><text x="680" y="235" class="formula" text-anchor="start">U = 12 V</text><text x="680" y="285" class="tiny" text-anchor="start">Ohmmessung nur am</text><text x="680" y="307" class="tiny" text-anchor="start">von Quellen getrennten Bauteil</text><text x="28" y="423" class="tiny">Nur für Rechen- und Verständnisübungen an sicheren, strombegrenzten Kleinspannungsmodellen.</text></svg>