<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650"><title>1.01-C – Didaktische Fachtafel</title><rect width="1100" height="650" fill="#f6fafc"/><g font-family="Arial,sans-serif" fill="#17334b"><text x="35" y="50" font-size="30" font-weight="bold">1.01-C · Sicherheitsorganisation und PV-Mehrquellensysteme</text><text x="35" y="82" font-size="17">Didaktisches Funktionsmodell · keine Installations- oder Freigabeanweisung</text></g><defs><marker id="tip" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3 z" fill="#2b788d"/></marker></defs><rect x="45" y="178" width="280" height="115" rx="16" fill="#fff1db" stroke="#52748a" stroke-width="2"/><text x="185.0" y="220" font-size="23" text-anchor="middle" fill="#17334b" font-family="Arial" font-weight="bold">PV-Generator</text><text x="185.0" y="258" font-size="16" text-anchor="middle" fill="#17334b" font-family="Arial">Lichtabhängige Quelle</text><rect x="45" y="345" width="280" height="115" rx="16" fill="#fff1db" stroke="#52748a" stroke-width="2"/><text x="185.0" y="387" font-size="23" text-anchor="middle" fill="#17334b" font-family="Arial" font-weight="bold">Batteriespeicher</text><text x="185.0" y="425" font-size="16" text-anchor="middle" fill="#17334b" font-family="Arial">Zusätzliche Energie</text><rect x="420" y="250" width="280" height="145" rx="16" fill="#e4f0f5" stroke="#52748a" stroke-width="2"/><text x="560.0" y="292" font-size="23" text-anchor="middle" fill="#17334b" font-family="Arial" font-weight="bold">Wechselrichter</text><text x="560.0" y="330" font-size="16" text-anchor="middle" fill="#17334b" font-family="Arial">Nicht nur Display prüfen</text><rect x="790" y="250" width="265" height="145" rx="16" fill="#e4f0f5" stroke="#52748a" stroke-width="2"/><text x="922.5" y="292" font-size="23" text-anchor="middle" fill="#17334b" font-family="Arial" font-weight="bold">Netzseite</text><text x="922.5" y="330" font-size="16" text-anchor="middle" fill="#17334b" font-family="Arial">Weitere Energiepfade</text><path d="M330 236 L417 299" stroke="#2b788d" stroke-width="5" fill="none" marker-end="url(#tip)"/><path d="M330 405 L417 350" stroke="#2b788d" stroke-width="5" fill="none" marker-end="url(#tip)"/><path d="M702 320 L785 320" stroke="#2b788d" stroke-width="5" fill="none" marker-end="url(#tip)"/><text x="40" y="605" font-family="Arial" font-size="17" fill="#496578">Theoretische Schulung: Arbeiten an realen elektrischen Installationen nur mit geeigneter Befähigung/Berechtigung.</text></svg>