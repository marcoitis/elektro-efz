<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-label="1.06-A · Planarten und ihre Perspektiven"><title>1.06-A · Planarten und ihre Perspektiven</title><desc>Links symbolischer Raumgrundriss mit Quelle Q, Schalter S und Leuchte L. Mitte abstrakter Kleinspannungsstromkreis. Rechts Funktionsübersicht. Die Pläne zeigen Ort, elektrische Verbindung und Struktur.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#18364b}.title{font-size:24px;font-weight:700}.sub{font-size:12px;fill:#527083}.lab{font-size:15px;font-weight:600}.tiny{font-size:12px;fill:#4d6677}.formula{font-size:19px;fill:#b86b19;font-weight:700}.small{font-size:14px}.wire{stroke:#11718e;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:#8da7b6;stroke-width:1.5;fill:none;stroke-linecap:round}.dash{stroke:#db8928;stroke-width:2;stroke-dasharray:6 5;fill:none}.box{fill:white;stroke:#d7e5eb;stroke-width:1.8}</style><rect x="0" y="0" width="1100" height="560" rx="20" fill="#f2f7fa"/><text x="30" y="40" text-anchor="start" class="title">1.06-A · Planarten und ihre Perspektiven</text><text x="30" y="62" text-anchor="start" class="sub">Didaktisches Fachmodell · keine Installationsplanung · keine Ausführungsplanung · Schweizer Normenprüfung offen</text><rect x="24" y="87" width="345" height="422" rx="10" fill="white" stroke="#b9d0dc" stroke-width="1.5"/><rect x="381" y="87" width="345" height="422" rx="10" fill="white" stroke="#b9d0dc" stroke-width="1.5"/><rect x="738" y="87" width="338" height="422" rx="10" fill="white" stroke="#b9d0dc" stroke-width="1.5"/><text x="197" y="122" text-anchor="middle" class="lab">1 · Raumansicht: Wo?</text><rect x="84" y="155" width="225" height="264" rx="2" fill="#f8fbfd" stroke="#3c718f" stroke-width="3"/><rect x="84" y="303" width="42" height="72" rx="0" fill="#f2f7fa" stroke="#f2f7fa" stroke-width="0"/><circle cx="208" cy="271" r="22" fill="#fae9ba" stroke="#ce9631" stroke-width="3"/><text x="208" y="278" text-anchor="middle" class="lab">L</text><rect x="110" y="331" width="27" height="25" rx="2" fill="#dfebf1" stroke="#356b85" stroke-width="1.5"/><text x="123" y="350" text-anchor="middle" class="tiny">S</text><rect x="260" y="180" width="30" height="36" rx="3" fill="#c6e6ec" stroke="#42788e" stroke-width="1.5"/><text x="275" y="204" text-anchor="middle" class="tiny">Q</text><text x="197" y="450" text-anchor="middle" class="tiny">4 × 5 m · Planlage (nicht skaliert)</text><text x="553" y="122" text-anchor="middle" class="lab">2 · Stromlauf: Wie?</text><path d="M420 213 L502 213" class="wire"/><path d="M570 213 L595 213" class="wire"/><path d="M645 213 L680 213" class="wire"/><path d="M680 213 L680 372" class="wire"/><path d="M680 372 L420 372" class="wire"/><path d="M420 372 L420 313" class="wire"/><path d="M420 271 L420 213" class="wire"/><circle cx="420" cy="292" r="20" fill="white" stroke="#11718e" stroke-width="2"/><text x="420" y="299" text-anchor="middle" class="small">Q</text><circle cx="502" cy="213" r="4" fill="#11718e" stroke="#11718e" stroke-width="2"/><circle cx="570" cy="213" r="4" fill="white" stroke="#11718e" stroke-width="2"/><path d="M502 213 L558 189" class="wire"/><text x="535" y="177" text-anchor="middle" class="tiny">S offen (Modell)</text><circle cx="620" cy="213" r="25" fill="#fff4cf" stroke="#a47c2f" stroke-width="2"/><text x="620" y="219" text-anchor="middle" class="small">L</text><text x="553" y="449" text-anchor="middle" class="tiny">Symbolische 12-V-Funktion, nicht normativ</text><text x="908" y="122" text-anchor="middle" class="lab">3 · Übersicht: Was?</text><rect x="802" y="185" width="211" height="54" rx="6" fill="#e6f2f6" stroke="#7aaabd" stroke-width="1.5"/><text x="907" y="219" text-anchor="middle" class="lab">Quelle Q</text><rect x="802" y="280" width="211" height="54" rx="6" fill="#e6f2f6" stroke="#7aaabd" stroke-width="1.5"/><text x="907" y="314" text-anchor="middle" class="lab">Schalter S</text><rect x="802" y="375" width="211" height="54" rx="6" fill="#e6f2f6" stroke="#7aaabd" stroke-width="1.5"/><text x="907" y="409" text-anchor="middle" class="lab">Leuchte L</text><path d="M907 239 L907 280" class="thin"/><path d="M907 334 L907 375" class="thin"/><text x="907" y="465" text-anchor="middle" class="tiny">gleiche Gerätekennung in allen Plänen</text><text x="30" y="540" text-anchor="start" class="sub">Bezeichnungen und Modellwerte nur für Unterricht; Produkte, Normen und Installation gesondert prüfen.</text></svg>