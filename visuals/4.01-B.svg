<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="4.01-B Leistungsdreieck und Blindleistung"><title>4.01-B: Leistungsdreieck und Blindleistung</title><desc>Didaktische individuelle Modellgrafik, keine fachlich oder normativ freigegebene Installationsanleitung.</desc><rect x="0" y="0" width="1200" height="700" rx="0" fill="#f3f7fa" stroke="none" stroke-width="0" /><rect x="0" y="0" width="1200" height="92" rx="0" fill="#17354b" stroke="none" stroke-width="0" /><text x="33" y="60" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="start">4.01-B · Leistungsdreieck und Blindleistung</text><text x="50" y="138" fill="#17354b" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">Leistungsdreieck für sinusförmige Last</text><line x1="120" y1="484" x2="345" y2="484" stroke="#187da4" stroke-width="5" stroke-dasharray="none" stroke-linecap="round" /><line x1="345" y1="484" x2="345" y2="184" stroke="#d28f37" stroke-width="5" stroke-dasharray="none" stroke-linecap="round" /><line x1="120" y1="484" x2="345" y2="184" stroke="#21866c" stroke-width="5" stroke-dasharray="none" stroke-linecap="round" /><text x="233" y="516" fill="#187da4" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle">P = 3 kW</text><text x="363" y="338" fill="#d28f37" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start">Q = 4 kvar</text><text x="173" y="301" fill="#21866c" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">S = 5 kVA</text><rect x="664" y="207" width="481" height="300" rx="10" fill="#ffffff" stroke="#c9d9e3" stroke-width="2" /><text x="691" y="256" fill="#17354b" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="start">S² = P² + Q²</text><text x="691" y="305" fill="#187da4" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start">cos φ = P / S = 0,60</text><text x="691" y="356" fill="#d28f37" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">Watt · var · VA</text><text x="691" y="416" fill="#25475a" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Blindanteil ≠ Nutzarbeit</text><rect x="33" y="627" width="1134" height="51" rx="8" fill="#e7f2f8" stroke="none" stroke-width="0" /><text x="48" y="659" fill="#25475a" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">Didaktisches Modell – konkrete Fach- und Normenfreigabe für reale Anlagen ausstehend</text></svg>