<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-label="1.09-A · Elektrisches Feld und Kondensator"><title>1.09-A · Elektrisches Feld und Kondensator</title><desc>Elektrische Feldlinien zwischen idealen Platten, E ungefähr U geteilt durch d, Beispiel 2000 Volt pro Meter; gespeicherte Kondensatorenergie bei 470 Mikrofarad und 12 Volt 0,03384 Joule.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#173042}.title{font-size:22px;font-weight:700}.sub{font-size:13px;fill:#486478}.lab{font-size:15px;font-weight:600}.tiny{font-size:12px;fill:#456278}.line{stroke:#176d85;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none}.thin{stroke:#789aa9;stroke-width:1.4;fill:none}.accent{stroke:#df8732;stroke-width:3;fill:none}.dashed{stroke:#df8732;stroke-width:2;stroke-dasharray:7 5;fill:none}.panel{fill:#fff;stroke:#d5e4eb;stroke-width:1.5}.formula{font-size:20px;font-weight:700;fill:#bd691e}</style><rect width="960" height="460" rx="16" fill="#f3f8fb"/><text x="28" y="38" class="title">1.09-A · Elektrisches Feld und Kondensator</text><text x="28" y="61" class="sub">Didaktisches Physikmodell – nur Simulation oder geeignete Kleinspannung, keine Installationsplanung</text><rect x="35" y="95" width="530" height="295" rx="9" class="panel"/><text x="280" y="127" class="lab" text-anchor="middle">Plattenkondensator – vereinfachtes Feld</text><rect x="130" y="155" width="18" height="166" fill="#df8732"/><rect x="410" y="155" width="18" height="166" fill="#176d85"/><path d="M151 170 L403 170" class="thin"/><path d="M390 164 l12 6 l-12 6" class="thin"/><path d="M151 200 L403 200" class="thin"/><path d="M390 194 l12 6 l-12 6" class="thin"/><path d="M151 230 L403 230" class="thin"/><path d="M390 224 l12 6 l-12 6" class="thin"/><path d="M151 260 L403 260" class="thin"/><path d="M390 254 l12 6 l-12 6" class="thin"/><path d="M151 290 L403 290" class="thin"/><path d="M390 284 l12 6 l-12 6" class="thin"/><text x="115" y="146" class="lab" text-anchor="middle">+ + +</text><text x="435" y="146" class="lab" text-anchor="middle">− − −</text><text x="280" y="218" class="formula" text-anchor="middle">E ≈ U / d</text><text x="280" y="349" class="tiny" text-anchor="middle">Plattenabstand d = 5 mm</text><rect x="595" y="95" width="325" height="295" rx="9" class="panel"/><text x="755" y="130" class="lab" text-anchor="middle">Modellbeispiel</text><text x="750" y="176" class="tiny" text-anchor="middle">U = 10 V, d = 0,005 m</text><text x="748" y="213" class="formula" text-anchor="middle">E ≈ 2000 V/m</text><text x="750" y="258" class="tiny" text-anchor="middle">C = 470 µF, U = 12 V</text><text x="750" y="292" class="formula" text-anchor="middle">W = ½ · C · U²</text><text x="750" y="322" class="formula" text-anchor="middle">W = 0,03384 J</text><text x="750" y="356" class="tiny" text-anchor="middle">Feldenergie bleibt nach Abschalten möglich</text><text x="28" y="443" class="tiny">Modellannahmen gelten nur unter den genannten idealisierten Bedingungen.</text></svg>