<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img"><title>N-S03: Besichtigen • Messen • Erproben</title><desc>Individuelles didaktisches Fachschema zur Unterrichtslektion; keine freigegebene Installationszeichnung.</desc><rect width="1280" height="720" fill="#f3f7fa"/><rect width="1280" height="95" fill="#183b52"/><text x="36" y="37" font-family="Arial,sans-serif" font-size="19" fill="#cceaf5">Elektro EFZ · Fachtafel N-S03</text><text x="36" y="77" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="white">Besichtigen • Messen • Erproben</text><rect x="28" y="117" width="792" height="504" rx="18" fill="white" stroke="#c9dce8" stroke-width="2"/><rect x="843" y="117" width="409" height="504" rx="18" fill="white" stroke="#c9dce8" stroke-width="2"/><text x="867" y="159" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#183b52">Lernpunkte</text><rect x="28" y="647" width="1224" height="50" rx="12" fill="#e3eef5"/><text x="47" y="678" font-family="Arial,sans-serif" font-size="20" fill="#183b52">Didaktisches Modell – keine normative oder praktische Freigabe elektrischer Installationsarbeiten.</text><circle cx="880" cy="207" r="7" fill="#167e9d"/><text x="899" y="214" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#183b52">Beobachtung ≠ Messwert</text><circle cx="880" cy="293" r="7" fill="#167e9d"/><text x="899" y="300" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#183b52">Messgerät beeinflusst Schaltung</text><circle cx="880" cy="379" r="7" fill="#167e9d"/><text x="899" y="386" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#183b52">Erprobung kann Bewegung auslösen</text><circle cx="880" cy="465" r="7" fill="#167e9d"/><text x="899" y="472" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#183b52">Prüfung eindeutig protokollieren</text><rect x="69" y="236" width="221" height="130" rx="12" fill="#edf4f8" stroke="#167e9d" stroke-width="3"/><text x="179.5" y="308.6666666666667" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#183b52" text-anchor="middle">BESICHTIGEN</text><text x="180" y="405" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#5f7687" text-anchor="middle">Sichtzustand</text><rect x="317" y="236" width="221" height="130" rx="12" fill="#edf4f8" stroke="#398773" stroke-width="3"/><text x="427.5" y="308.6666666666667" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#183b52" text-anchor="middle">MESSEN</text><text x="428" y="405" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#5f7687" text-anchor="middle">Quantität</text><rect x="565" y="236" width="221" height="130" rx="12" fill="#edf4f8" stroke="#edb44d" stroke-width="3"/><text x="675.5" y="308.6666666666667" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#183b52" text-anchor="middle">ERPROBEN</text><text x="676" y="405" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#5f7687" text-anchor="middle">Funktionsänderung</text><line x1="117" y1="452" x2="726" y2="452" stroke="#167e9d" stroke-width="3"/><text x="124" y="493" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#183b52">Beobachtung ≠ Zahlenwert ≠ Funktionsnachweis</text><text x="137" y="542" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#5f7687">Messbereich, Zustand und Risiko festhalten</text></svg>